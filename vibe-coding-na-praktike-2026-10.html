      head += x.v;
      if (/^<\//.test(x.v)) stack.pop();
      else if (!/\/>$/.test(x.v) && !/^<(br|img|input|hr)\b/i.test(x.v)) stack.push(x.v);
    }
  }
  const close = stack.slice().reverse().map((o) => "</" + o.match(/^<(\w+)/)[1] + ">").join("");
  const tail = stack.join("") + tokens.slice(i).map((x) => x.v).join("");
  return [head.replace(/\s+$/, "") + close, tail.replace(/^\s+/, "")];
}

/* ---------- Вёрстка по страницам ---------- */
function paginate() {
  meas.innerHTML = '<div class="page side-r"><div class="pg-head"><span>Глава</span></div><div class="pg-body"></div><div class="pg-foot"><span>000</span></div></div>';
  const body = meas.querySelector(".pg-body");
  const out = [], tgt = {};
  const lineH = parseFloat(getComputedStyle(body).lineHeight) || L.fs * 1.56;
  let meta = null, curB = -1, deferred = [];

  const bottom = () => body.getBoundingClientRect().bottom;
  const fits = (el) => el.getBoundingClientRect().bottom <= bottom() + 0.5;
  const isEmpty = () => body.childElementCount === 0;
  const room = () => bottom() - (body.lastElementChild ? body.lastElementChild.getBoundingClientRect().bottom : body.getBoundingClientRect().top);
  const add = (h) => { body.insertAdjacentHTML("beforeend", h); return body.lastElementChild; };
  const tryAdd = (h) => { const el = add(h); if (fits(el)) return el; el.remove(); return null; };

  function start(kind, head, ch, b0) { body.innerHTML = ""; meta = { kind, head, ch, b0, open: false }; }
  function flush() { if (meta && !isEmpty()) out.push({ ...meta, html: body.innerHTML }); body.innerHTML = ""; }
  function brk() {
    const m = meta; flush(); start(m.kind === "toc" ? "toc" : "text", m.head, m.ch, curB);
    if (deferred.length) { const d = deferred; deferred = []; d.forEach((b) => placeFig(b, true)); }
  }

  function placeP(html, cls) {
    const mk = (inner, c) => `<p class="${c}">${inner}</p>`;
    if (tryAdd(mk(html, cls))) return;
    const toks = tokenize(html), nW = toks.filter((t) => t.t === "w").length;
    const split = (needOrphan) => {
      const probe = add(mk("", cls + " sp"));
      let lo = 1, hi = nW - 1, best = 0;
      while (lo <= hi) { const mid = (lo + hi) >> 1; probe.innerHTML = cut(toks, mid)[0]; if (fits(probe)) { best = mid; lo = mid + 1; } else hi = mid - 1; }
      if (best > 0) {
        probe.innerHTML = cut(toks, best)[0];
        const ok = !needOrphan || (probe.getBoundingClientRect().height >= lineH * 1.9 && nW - best >= 3);
        if (ok) { const rest = cut(toks, best)[1]; brk(); placeP(rest, "cont"); return true; }
      }
      probe.remove(); return false;
    };
    if (!isEmpty()) { if (split(true)) return; brk(); if (tryAdd(mk(html, cls))) return; }
    if (!split(false)) add(mk(html, cls));
  }

  function placeHeading(h, minLines) {
    let el = tryAdd(h);
    if (!el) { brk(); add(h); return; }
    if (body.childElementCount > 1 && room() < lineH * minLines) { el.remove(); brk(); add(h); }
  }

  function placeUnsplit(h) {
    if (tryAdd(h)) return;
    if (!isEmpty()) { brk(); if (tryAdd(h)) return; }
    add(h);
  }

  function placeList(tag, cls, items) {
    let i = 0;
    while (i < items.length) {
      const list = add(`<${tag} class="${cls}"></${tag}>`);
      let placed = 0;
      while (i < items.length) {
        list.insertAdjacentHTML("beforeend", items[i]);
        if (fits(list.lastElementChild)) { i++; placed++; } else { list.lastElementChild.remove(); break; }
      }
      if (i >= items.length) break;
      if (placed === 0) {
        list.remove();
        if (isEmpty()) { const l2 = add(`<${tag} class="${cls}"></${tag}>`); l2.insertAdjacentHTML("beforeend", items[i]); i++; }
      }
      brk();
    }
  }

  function placeTable(b) {
    let i = 0;
    while (i < b.rows.length) {
      const t = add(`<table class="tbl"><thead>${b.head}</thead><tbody></tbody></table>`);
      const tb = t.tBodies[0];
      let placed = 0;
      while (i < b.rows.length) {
        tb.insertAdjacentHTML("beforeend", b.rows[i]);
        if (fits(t)) { i++; placed++; } else { tb.lastElementChild.remove(); break; }
      }
      if (i >= b.rows.length) break;
      if (placed === 0) {
        t.remove();
        if (isEmpty()) { const t2 = add(`<table class="tbl"><thead>${b.head}</thead><tbody>${b.rows[i]}</tbody></table>`); i++; }
      } else if (placed === 1 && body.childElementCount > 1 && b.rows.length - i > 1) {
        // одна строка таблицы внизу страницы — переносим всю таблицу
        t.remove(); i -= 1; brk(); continue;
      }
      brk();
    }
  }

  function placeCode(b) {
    let i = 0, first = true;
    const esc = (s) => s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    while (i < b.lines.length) {
      const label = first && b.label ? `<span class="plabel">${b.label}</span>` : "";
      const el = add(`<pre class="code ${b.c}">${label}<code></code></pre>`);
      const code = el.querySelector("code");
      const left = b.lines.length - i;
      let lo = 1, hi = left, best = 0;
      while (lo <= hi) { const mid = (lo + hi) >> 1; code.innerHTML = esc(b.lines.slice(i, i + mid).join("\n")); if (fits(el)) { best = mid; lo = mid + 1; } else hi = mid - 1; }
      if (best === left) { code.innerHTML = esc(b.lines.slice(i).join("\n")); break; }
      if (left - best === 1 && best > 3) best -= 1;
      if (best < 3 && body.childElementCount > 1) { el.remove(); brk(); continue; }
      if (best === 0) best = 1;
      code.innerHTML = esc(b.lines.slice(i, i + best).join("\n"));
      i += best; first = false; brk();
    }
  }

  function figHTML(b) {
    return `<figure class="fig" data-fig="${b.n}" tabindex="0" role="button" aria-label="${b.cap}. Открыть крупно">${BOOK.figs[b.n]}<figcaption><span>${b.cap}</span><span class="zh">Крупнее</span></figcaption></figure>`;
  }
  function fitFig(el, maxH) {
    const svg = el.querySelector("svg");
    svg.style.maxHeight = Math.max(90, Math.floor(maxH)) + "px";
  }
  function placeFig(b, forced) {
    const h = figHTML(b);
    let el = add(h);
    if (fits(el)) return;
    const natural = el.getBoundingClientRect().height;
    const capH = el.querySelector("figcaption").getBoundingClientRect().height + 8;
    const avail = bottom() - el.getBoundingClientRect().top;
    if (avail >= natural * 0.72) { fitFig(el, avail - capH); return; }
    el.remove();
    if (!forced && !isEmpty() && room() > body.clientHeight * 0.34) { deferred.push(b); return; }
    if (!isEmpty()) brk();
    el = add(h);
    if (!fits(el)) fitFig(el, body.clientHeight - capH - (el.getBoundingClientRect().top - body.getBoundingClientRect().top));
  }

  /* обложка */
  out.push({ kind: "cover", html: COVER, b0: -2, ch: "cover" });
  /* оглавление */
  start("toc", "Оглавление", "toc", -1);
  tgt.toc = out.length;
  add('<header class="ch-open"><h2>Оглавление</h2></header>');
  meta.open = true;
  placeList("ul", "toclist", BOOK.toc);
  flush();

  /* основной текст */
  const blocks = BOOK.blocks;
  for (let bi = 0; bi < blocks.length; bi++) {
    const b = blocks[bi];
    curB = bi;
    if (b.t === "part" || b.t === "ch") {
      if (deferred.length) brk();
      flush();
      if (b.t === "part") { tgt[b.id] = out.length; out.push({ kind: "part", html: b.h, b0: bi, ch: b.id, head: "" }); start("text", "", b.id, bi); continue; }
      start("text", b.head, b.id, bi);
      tgt[b.id] = out.length; meta.open = true;
      add(b.h);
      continue;
    }
    if (b.t === "h3") { placeHeading(b.h, 2.8); tgt[b.id] = out.length; continue; }
    if (b.t === "lbl") { placeHeading(b.h, 2.2); continue; }
    if (b.t === "p") { placeP(b.h, b.c || ""); continue; }
    if (b.t === "list") { placeList(b.tag, b.c, b.items); continue; }
    if (b.t === "table") { placeTable(b); continue; }
    if (b.t === "code") { placeCode(b); continue; }
    if (b.t === "note") { placeUnsplit(b.h); continue; }
    if (b.t === "fig") { placeFig(b, false); continue; }
  }
  if (deferred.length) brk();
  flush();
  meas.innerHTML = "";
  return { out, tgt };
}

/* ---------- Отрисовка страниц ---------- */
function pageHTML(i, side) {
  const p = pages[i];
  if (!p) return "";
  if (p.kind === "cover") return `<div class="page cover side-${side}">${p.html}</div>`;
  if (p.kind === "part") return `<div class="page part side-${side}">${p.html}</div>`;
  const head = p.open ? "" : side === "l" ? BOOK.title : p.head || "";
  return `<div class="page side-${side}"><div class="pg-head"><span>${head}</span></div><div class="pg-body">${p.html}</div><div class="pg-foot"><span>${i + 1}</span></div></div>`;
}
function hydrate(el) {
  el.querySelectorAll("[data-pn]").forEach((s) => { const t = target[s.dataset.pn]; s.textContent = t != null ? t + 1 : ""; });
  el.querySelectorAll("input[data-task]").forEach((c) => { c.checked = ticks.has(c.dataset.task); c.closest("li").classList.toggle("done", c.checked); });
}
function renderInto(el, i, side) {
  el.innerHTML = pageHTML(i, side);
  el.classList.toggle("empty", !pages[i]);
  hydrate(el);
}
const spread = () => L.mode === "spread";
const maxPos = () => (spread() ? Math.floor(pages.length / 2) : pages.length - 1);
const pageToPos = (i) => (spread() ? Math.floor((i + 1) / 2) : i);
const visible = () => (spread() ? [2 * pos - 1, 2 * pos].filter((i) => i >= 0 && i < pages.length) : [pos]);

function show() {
  if (spread()) { renderInto(slotL, 2 * pos - 1, "l"); renderInto(slotR, 2 * pos, "r"); }
  else { slotL.innerHTML = ""; slotL.classList.add("empty"); renderInto(slotR, pos, "s"); }
  updateUI();
}

function updateUI() {
  const vis = visible();
  const first = pages[vis[0]];
  anchor = first ? first.b0 : -2;
  store.set("anchor", anchor);
  const n = pages.length;
  const folios = vis.map((i) => i + 1);
  $("#where").textContent = folios.length > 1 ? `${folios[0]}–${folios[1]} из ${n}` : `${folios[0]} из ${n}`;
  const sl = $("#slider"); sl.max = String(maxPos()); sl.value = String(pos);
  $("#prevBtn").disabled = pos <= 0; $("#nextBtn").disabled = pos >= maxPos();
  const chId = pages[vis[vis.length - 1]] ? pages[vis[vis.length - 1]].ch : "";
  const entry = BOOK.drawer.find((d) => d.id === chId);
  $("#brandCh").innerHTML = entry ? entry.h : chId === "toc" ? "Оглавление" : "Обложка";
  if (spread()) {
    const frac = n > 1 ? (2 * pos) / (n - 1) : 0;
    book.style.setProperty("--sl", 2 * pos - 1 >= 0 ? Math.round(2 + 6 * Math.min(1, frac)) + "px" : "0px");
    book.style.setProperty("--sr", 2 * pos < n - 1 ? Math.round(2 + 6 * Math.max(0, 1 - frac)) + "px" : "0px");
  } else { book.style.setProperty("--sl", "0px"); book.style.setProperty("--sr", "0px"); }
}

/* ---------- Перелистывание ---------- */
function finishAnim() { if (anim) { const x = anim; anim = null; x.a.cancel(); x.commit(); } }
function flip(d) {
  finishAnim();
  const np = pos + d;
  if (!pages.length || np < 0 || np > maxPos()) return;
  if (reduced.matches) { pos = np; show(); return; }
  const leaf = document.createElement("div");
  leaf.className = "leaf";
  leaf.innerHTML = '<div class="face front"></div><div class="face back"></div>';
  const fr = leaf.children[0], bk = leaf.children[1];
  let kf, from;
  if (spread()) {
    if (d > 0) { leaf.classList.add("fwd"); renderInto(fr, 2 * pos, "r"); renderInto(bk, 2 * np - 1, "l"); renderInto(slotR, 2 * np, "r"); kf = ["rotateY(0deg)", "rotateY(-180deg)"]; from = ["from-l", "from-r"]; }
    else { leaf.classList.add("bwd"); renderInto(fr, 2 * pos - 1, "l"); renderInto(bk, 2 * np, "r"); renderInto(slotL, 2 * np - 1, "l"); kf = ["rotateY(0deg)", "rotateY(180deg)"]; from = ["from-r", "from-l"]; }
  } else {
    leaf.classList.add("one");
    bk.innerHTML = '<div class="page blankback"></div>';
    if (d > 0) { renderInto(fr, pos, "s"); renderInto(slotR, np, "s"); kf = ["rotateY(0deg)", "rotateY(-180deg)"]; }
    else { renderInto(fr, np, "s"); kf = ["rotateY(-180deg)", "rotateY(0deg)"]; }
    from = ["from-l", "from-r"];
  }
  [fr, bk].forEach((f, k) => { const s = document.createElement("div"); s.className = "shade " + from[k]; f.appendChild(s); });
  book.appendChild(leaf);
  const dur = spread() ? 760 : 560, ease = "cubic-bezier(.42,.08,.22,1)";
  const a = leaf.animate([{ transform: kf[0] }, { transform: kf[1] }], { duration: dur, easing: ease });
  const shF = fr.querySelector(".shade"), shB = bk.querySelector(".shade");
  const fwdOrder = d > 0 || spread();
  shF.animate([{ opacity: 0 }, { opacity: 0.55 }], { duration: dur / 2, easing: "ease-in", fill: "forwards", direction: fwdOrder ? "normal" : "reverse" });
  shB.animate([{ opacity: 0.55 }, { opacity: 0 }], { duration: dur / 2, delay: dur / 2, easing: "ease-out", fill: "both" });
  const x = { a, commit() { leaf.remove(); pos = np; show(); } };
  anim = x;
  a.onfinish = () => { if (anim === x) { anim = null; x.commit(); } };
}
function goPage(i) {
  finishAnim();
  if (i == null || i < 0) return;
  pos = Math.min(maxPos(), pageToPos(Math.min(i, pages.length - 1)));
  show();
}
function goId(id) { if (target[id] != null) goPage(target[id]); }

/* ---------- Перевёрстка ---------- */
function pageForAnchor(a) {
  if (a === -2) return 0;
  if (a === -1) return target.toc || 0;
  const exact = pages.findIndex((p) => p.b0 === a);
  if (exact >= 0) return exact;
  for (let i = pages.length - 1; i >= 0; i--) if (pages[i].b0 >= 0 && pages[i].b0 < a) return i;
  return 0;
}
let firstDone = false;
function relayout(force) {
  const l = computeLayout();
  if (!force && L && l.key === L.key) return;
  finishAnim();
  const keep = anchor;
  L = l; applyLayout(l);
  const r = paginate();
  pages = r.out; target = r.tgt;
  pos = pageToPos(pageForAnchor(keep));
  if (!firstDone) {
    firstDone = true;
    const h = (location.hash || "").slice(1);
    if (h && target[h] != null) pos = pageToPos(target[h]);
    $("#loading").hidden = true;
  }
  buildDrawer();
  show();
}
let rt = null;
function scheduleRelayout(force) { clearTimeout(rt); rt = setTimeout(() => relayout(force), force ? 250 : 160); }

/* ---------- Содержание сбоку ---------- */
function buildDrawer() {
  const ul = $("#drawerList");
  ul.innerHTML = BOOK.drawer.map((d) => `<li class="lv${d.lv}" data-id="${d.id}"><button type="button" data-go="${d.id}"><span>${d.h}</span><span class="n">${target[d.id] != null ? target[d.id] + 1 : ""}</span></button></li>`).join("");
}
let lastFocus = null;
function openDrawer() {
  lastFocus = document.activeElement;
  const vis = visible(), ch = pages[vis[vis.length - 1]] ? pages[vis[vis.length - 1]].ch : "";
  $("#drawerList").querySelectorAll("li").forEach((li) => li.classList.toggle("cur", li.dataset.id === ch));
  $("#drawer").hidden = false;
  const cur = $("#drawerList .cur button") || $("#drawerList button");
  if (cur) { cur.scrollIntoView({ block: "center" }); cur.focus(); }
}
function closeDrawer() { $("#drawer").hidden = true; if (lastFocus) lastFocus.focus(); }

/* ---------- Схема крупно ---------- */
function openZoom(n) {
  lastFocus = document.activeElement;
  const b = BOOK.blocks.find((x) => x.t === "fig" && x.n === n);
  $("#zoomCap").textContent = b ? b.cap : "";
  const z = $("#zoomBody");
  z.innerHTML = BOOK.figs[n];
  const w = Math.max(760, Math.min(1180, window.innerWidth - 48));
  z.querySelector("svg").style.width = w + "px";
  $("#zoom").hidden = false;
  z.scrollLeft = 0; z.focus();
}
function closeZoom() { $("#zoom").hidden = true; if (lastFocus) lastFocus.focus(); }

/* ---------- События ---------- */
$("#prevBtn").addEventListener("click", () => flip(-1));
$("#nextBtn").addEventListener("click", () => flip(1));
$("#slider").addEventListener("input", (e) => { finishAnim(); pos = Number(e.target.value); show(); });
$("#tocBtn").addEventListener("click", openDrawer);
$("#drawerClose").addEventListener("click", closeDrawer);
$("#drawerBg").addEventListener("click", closeDrawer);
$("#zoomClose").addEventListener("click", closeZoom);
function setScale(d) {
  const n = Math.min(SCALES.length - 1, Math.max(0, scaleIdx + d));
  if (n === scaleIdx) return;
  scaleIdx = n; store.set("scale", n); syncScaleBtns(); relayout(true);
}
function syncScaleBtns() { $("#fontDown").disabled = scaleIdx === 0; $("#fontUp").disabled = scaleIdx === SCALES.length - 1; }
$("#fontDown").addEventListener("click", () => setScale(-1));
$("#fontUp").addEventListener("click", () => setScale(1));
syncScaleBtns();

document.addEventListener("click", (e) => {
  const go = e.target.closest("[data-go]");
  if (go) { e.preventDefault(); const id = go.dataset.go; if (!$("#drawer").hidden) closeDrawer(); goId(id); return; }
  const fig = e.target.closest(".fig");
  if (fig && book.contains(fig)) { openZoom(fig.dataset.fig); }
});
document.addEventListener("change", (e) => {
  const c = e.target.closest("input[data-task]");
  if (!c) return;
  if (c.checked) ticks.add(c.dataset.task); else ticks.delete(c.dataset.task);
  store.set("ticks", [...ticks]);
  document.querySelectorAll(`input[data-task="${c.dataset.task}"]`).forEach((o) => { o.checked = c.checked; o.closest("li").classList.toggle("done", c.checked); });
});

let down = null, swiped = false;
book.addEventListener("pointerdown", (e) => { down = { x: e.clientX, y: e.clientY, t: Date.now() }; swiped = false; });
book.addEventListener("pointerup", (e) => {
  if (!down) return;
  const dx = e.clientX - down.x, dy = e.clientY - down.y;
  if (Math.abs(dx) > 48 && Math.abs(dx) > Math.abs(dy) * 1.4 && Date.now() - down.t < 900 && !String(window.getSelection() || "")) { swiped = true; flip(dx < 0 ? 1 : -1); }
  down = null;
});
book.addEventListener("click", (e) => {
  if (swiped) { swiped = false; return; }
  if (e.target.closest("a,button,input,label,.fig,[data-go]")) return;
  if (String(window.getSelection() || "")) return;
  const r = book.getBoundingClientRect(), x = e.clientX - r.left;
  if (spread()) flip(x < r.width / 2 ? -1 : 1);
  else if (x < r.width * 0.35) flip(-1); else flip(1);
});
document.addEventListener("keydown", (e) => {
  if (!$("#zoom").hidden) { if (e.key === "Escape") closeZoom(); return; }
  if (!$("#drawer").hidden) { if (e.key === "Escape") closeDrawer(); return; }
  if (e.target.closest("input[type=range],input[type=checkbox]") && (e.key === "ArrowLeft" || e.key === "ArrowRight")) return;
  if (e.altKey || e.ctrlKey || e.metaKey) return;
  const k = e.key;
  if (k === "ArrowRight" || k === "PageDown" || (k === " " && !e.shiftKey && !e.target.closest("button"))) { e.preventDefault(); flip(1); }
  else if (k === "ArrowLeft" || k === "PageUp" || (k === " " && e.shiftKey)) { e.preventDefault(); flip(-1); }
  else if (k === "Home") { e.preventDefault(); goPage(0); }
  else if (k === "End") { e.preventDefault(); goPage(pages.length - 1); }
});
book.addEventListener("keydown", (e) => {
  const fig = e.target.closest && e.target.closest(".fig");
  if (fig && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); e.stopPropagation(); openZoom(fig.dataset.fig); }
}, true);

if (window.ResizeObserver) new ResizeObserver(() => scheduleRelayout(false)).observe(stage);
else window.addEventListener("resize", () => scheduleRelayout(false));

/* ---------- Старт: ждём шрифты, но не дольше 2,5 секунды ---------- */
const fontJobs = document.fonts && document.fonts.load ? [
  document.fonts.load('400 16px "Literata"', "Книга"), document.fonts.load('italic 400 16px "Literata"', "Книга"),
  document.fonts.load('600 16px "Onest"', "Книга"), document.fonts.load('800 16px "Onest"', "Книга"),
  document.fonts.load('400 16px "JetBrains Mono"', "Код")
] : [];
Promise.race([Promise.allSettled(fontJobs), new Promise((r) => setTimeout(r, 2500))]).then(() => {
  relayout(true);
  if (document.fonts && document.fonts.addEventListener) document.fonts.addEventListener("loadingdone", () => scheduleRelayout(true));
});
})();
</script>
