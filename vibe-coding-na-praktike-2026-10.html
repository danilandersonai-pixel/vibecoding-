"<li><strong class=\"tt\">Асинхронность</strong> — Режим работы, когда вы не ждёте ответа и не следите за каждым шагом: вы ставите задачу и проверяете итог позже. <span class=\"refs\"><button class=\"go\" data-go=\"ch10\">гл.&nbsp;10</button></span></li>","<li><strong class=\"tt\">Аудит безопасности</strong> — Систематическая проверка на наличие слабых мест. <span class=\"refs\"><button class=\"go\" data-go=\"ch8\">гл.&nbsp;8</button></span></li>","<li><strong class=\"tt\">Аутентификация</strong> — Проверка, что человек тот, за кого себя выдаёт, обычно вход по логину и паролю. <span class=\"refs\"><button class=\"go\" data-go=\"ch1\">гл.&nbsp;1</button></span></li>","<li><strong class=\"tt\">Баг</strong> — Ошибка в программе. <span class=\"refs\"><button class=\"go\" data-go=\"abc\">Азбука</button></span></li>","<li><strong class=\"tt\">База данных</strong> — Организованное хранилище информации: пользователи, заказы, товары. <span class=\"refs\"><button class=\"go\" data-go=\"abc\">Азбука</button></span></li>","<li><strong class=\"tt\">Бенчмарк</strong> — Стандартный набор задач, по которому сравнивают модели. <span class=\"refs\"><button class=\"go\" data-go=\"ch1\">гл.&nbsp;1</button></span></li>","<li><strong class=\"tt\">Библиотека (пакет)</strong> — Готовый кусок кода, который решает одну задачу, например показывает календарь. <span class=\"refs\"><button class=\"go\" data-go=\"abc\">Азбука</button></span></li>","<li><strong class=\"tt\">Большая языковая модель (LLM)</strong> — Нейросеть, обученная предсказывать, какой фрагмент текста идёт следующим. <span class=\"refs\"><button class=\"go\" data-go=\"ch1\">гл.&nbsp;1</button></span></li>","<li><strong class=\"tt\">Бэкенд</strong> — Часть приложения, которая работает на сервере: проверяет пароли, считает цены, отправляет письма. <span class=\"refs\"><button class=\"go\" data-go=\"abc\">Азбука</button></span></li>","<li><strong class=\"tt\">Вайб-кодинг</strong> — Способ создавать программы, описывая желаемый результат обычным языком и почти не читая код, который пишет ИИ. <span class=\"refs\"><button class=\"go\" data-go=\"ch1\">гл.&nbsp;1</button></span></li>","<li><strong class=\"tt\">Веб-приложение</strong> — Программа, которая работает в браузере: интернет-магазин, личный кабинет, трекер привычек. <span class=\"refs\"><button class=\"go\" data-go=\"ch7\">гл.&nbsp;7</button></span></li>","<li><strong class=\"tt\">Вебхук (webhook)</strong> — Способ получать события, при котором сервис сам присылает их на адрес вашего сервера. <span class=\"refs\"><button class=\"go\" data-go=\"ch6\">гл.&nbsp;6</button></span></li>","<li><strong class=\"tt\">Версия</strong> — Номер выпуска программы или библиотеки; у разных версий разные правила, и ИИ легко их путает. <span class=\"refs\"><button class=\"go\" data-go=\"ch5\">гл.&nbsp;5</button></span></li>","<li><strong class=\"tt\">Вертикальный срез</strong> — Метод работы: функция делается целиком, от таблицы в базе до кнопки на экране. <span class=\"refs\"><button class=\"go\" data-go=\"ch7\">гл.&nbsp;7</button></span></li>","<li><strong class=\"tt\">Ветка</strong> — Параллельная копия проекта, в которой безопасно экспериментировать. <span class=\"refs\"><button class=\"go\" data-go=\"abc\">Азбука</button></span></li>","<li><strong class=\"tt\">Виртуальная машина</strong> — «Компьютер внутри компьютера», в котором можно работать, не рискуя настоящим. <span class=\"refs\"><button class=\"go\" data-go=\"ch10\">гл.&nbsp;10</button></span></li>","<li><strong class=\"tt\">Вопросы перед стартом</strong> — Приём: просим ИИ сначала задать уточняющие вопросы, а потом приступать к работе. <span class=\"refs\"><button class=\"go\" data-go=\"ch2\">гл.&nbsp;2</button></span></li>","<li><strong class=\"tt\">Вызов инструментов (tool use)</strong> — Способность модели просить выполнить команду, прочитать файл или сделать запрос; основа любого агента. <span class=\"refs\"><button class=\"go\" data-go=\"ch1\">гл.&nbsp;1</button></span></li>","<li><strong class=\"tt\">Галлюцинация</strong> — Уверенный, но выдуманный ИИ ответ: несуществующая библиотека, неверная команда. <span class=\"refs\"><button class=\"go\" data-go=\"abc\">Азбука</button></span></li>","<li><strong class=\"tt\">Генеративный интерфейс</strong> — Интерфейс, часть которого собирается под конкретный запрос пользователя, а не рисуется заранее. <span class=\"refs\"><button class=\"go\" data-go=\"ch11\">гл.&nbsp;11</button></span></li>","<li><strong class=\"tt\">Горизонт задач (METR)</strong> — Метрика: длина задачи, измеренная временем, которое на неё потратил бы человек-специалист, а агент решает с заданной надёжностью. <span class=\"refs\"><button class=\"go\" data-go=\"ch10\">гл.&nbsp;10</button></span></li>","<li><strong class=\"tt\">Дата среза знаний (knowledge cutoff)</strong> — Момент, до которого модель знает мир. О том, что вышло позже, она не знает, если не дать ей свежие материалы. <span class=\"refs\"><button class=\"go\" data-go=\"ch1\">гл.&nbsp;1</button></span></li>","<li><strong class=\"tt\">Декомпиляция</strong> — Перевод готовой программы обратно в исходный код. Закон разрешает её только в узких случаях, например для совместимости. <span class=\"refs\"><button class=\"go\" data-go=\"ch12\">гл.&nbsp;12</button></span></li>","<li><strong class=\"tt\">Декомпозиция</strong> — Разбиение большой задачи на небольшие части, с которыми ИИ справится надёжно. <span class=\"refs\"><button class=\"go\" data-go=\"ch1\">гл.&nbsp;1</button></span></li>","<li><strong class=\"tt\">Делегирование</strong> — Передача работы ИИ или агенту с последующей проверкой результата. <span class=\"refs\"><button class=\"go\" data-go=\"ch4\">гл.&nbsp;4</button></span></li>","<li><strong class=\"tt\">Делегирование агентам</strong> — Режим, когда агент выполняет задачу самостоятельно, а человек проверяет итог. <span class=\"refs\"><button class=\"go\" data-go=\"ch1\">гл.&nbsp;1</button></span></li>","<li><strong class=\"tt\">Деплой</strong> — Выкладывание приложения в интернет, чтобы оно стало доступно всем. <span class=\"refs\"><button class=\"go\" data-go=\"abc\">Азбука</button></span></li>","<li><strong class=\"tt\">Десктопное приложение (Claude Code)</strong> — Программа для компьютера, в которой агент Claude Code работает в обычном окне с кнопками, а не в терминале. <span class=\"refs\"><button class=\"go\" data-go=\"ch1\">гл.&nbsp;1</button></span></li>","<li><strong class=\"tt\">Дизайн-система</strong> — Набор правил оформления: цвета, шрифты, готовые блоки интерфейса. <span class=\"refs\"><button class=\"go\" data-go=\"ch11\">гл.&nbsp;11</button></span></li>","<li><strong class=\"tt\">Дизайн-холст</strong> — Рабочее поле для рисования макетов будущих экранов без настоящего кода. <span class=\"refs\"><button class=\"go\" data-go=\"ch6\">гл.&nbsp;6</button></span></li>","<li><strong class=\"tt\">Дифф</strong> — Наглядный список отличий между двумя версиями: что было и что стало. <span class=\"refs\"><button class=\"go\" data-go=\"abc\">Азбука</button></span></li>","<li><strong class=\"tt\">Домен</strong> — Адрес сайта вроде myapp.ru. <span class=\"refs\"><button class=\"go\" data-go=\"abc\">Азбука</button></span></li>","<li><strong class=\"tt\">Естественный язык</strong> — Обычный человеческий язык в отличие от языков программирования. <span class=\"refs\"><button class=\"go\" data-go=\"ch11\">гл.&nbsp;11</button></span></li>","<li><strong class=\"tt\">Журнал (лог)</strong> — Запись того, что делала программа и что пошло не так; по журналу ищут причину сбоя. <span class=\"refs\"><button class=\"go\" data-go=\"ch3\">гл.&nbsp;3</button></span></li>","<li><strong class=\"tt\">Журнал решений</strong> — Короткий файл: что решили, почему и что отвергли. <span class=\"refs\"><button class=\"go\" data-go=\"ch6\">гл.&nbsp;6</button></span></li>","<li><strong class=\"tt\">Зависимость</strong> — Библиотека, без которой проект не заработает. <span class=\"refs\"><button class=\"go\" data-go=\"abc\">Азбука</button></span></li>","<li><strong class=\"tt\">Загрязнение бенчмарка</strong> — Ситуация, когда задачи теста попали в обучающие данные модели и она «видела ответы». <span class=\"refs\"><button class=\"go\" data-go=\"ch1\">гл.&nbsp;1</button></span></li>","<li><strong class=\"tt\">Задача по расписанию</strong> — Сессия агента, которая запускается сама в заданное время, например раз в неделю. <span class=\"refs\"><button class=\"go\" data-go=\"ch10\">гл.&nbsp;10</button></span></li>","<li><strong class=\"tt\">Запахи кода</strong> — Узнаваемые признаки того, что в коде что-то не так: дублирование, огромные функции, лишние заглушки. <span class=\"refs\"><button class=\"go\" data-go=\"ch5\">гл.&nbsp;5</button></span></li>","<li><strong class=\"tt\">Запрос (промпт)</strong> — Текст, который вы отправляете ИИ. <span class=\"refs\"><button class=\"go\" data-go=\"abc\">Азбука</button></span></li>","<li><strong class=\"tt\">Запуск с нуля (bootstrap)</strong> — Способ работы, когда из идеи или наброска за часы получают рабочий прототип. <span class=\"refs\"><button class=\"go\" data-go=\"ch3\">гл.&nbsp;3</button></span></li>","<li><strong class=\"tt\">Зацикливание</strong> — Ситуация, когда агент повторяет одни и те же неудачные действия, пока не исчерпает бюджет. <span class=\"refs\"><button class=\"go\" data-go=\"ch10\">гл.&nbsp;10</button></span></li>","<li><strong class=\"tt\">Идемпотентность (защита от дублей)</strong> — Свойство действия: повторная отправка того же запроса, например оплаты, не приводит к повторному результату. <span class=\"refs\"><button class=\"go\" data-go=\"ch4\">гл.&nbsp;4</button></span></li>","<li><strong class=\"tt\">Иллюзия готовности</strong> — Ситуация, когда демонстрация работает, а ошибки, безопасность и необычные случаи не продуманы. <span class=\"refs\"><button class=\"go\" data-go=\"ch1\">гл.&nbsp;1</button></span></li>","<li><strong class=\"tt\">Индекс (в базе данных)</strong> — Служебная структура, как оглавление книги, ускоряющая поиск. <span class=\"refs\"><button class=\"go\" data-go=\"ch2\">гл.&nbsp;2</button></span></li>","<li><strong class=\"tt\">Инструменты разработчика (в браузере)</strong> — Встроенная панель браузера, которая показывает внутренности любой страницы, включая отправленные данные. <span class=\"refs\"><button class=\"go\" data-go=\"ch6\">гл.&nbsp;6</button></span></li>","<li><strong class=\"tt\">Интеграционный тест</strong> — Проверка того, как несколько частей программы работают вместе, например приложение с тестовой базой данных. <span class=\"refs\"><button class=\"go\" data-go=\"ch5\">гл.&nbsp;5</button></span></li>","<li><strong class=\"tt\">Интеллектуальная собственность</strong> — Права на результаты творческой работы: тексты, изображения, программы. <span class=\"refs\"><button class=\"go\" data-go=\"ch9\">гл.&nbsp;9</button></span></li>","<li><strong class=\"tt\">Интерфейс</strong> — Всё, что пользователь видит и нажимает в приложении: кнопки, формы, тексты. <span class=\"refs\"><button class=\"go\" data-go=\"abc\">Азбука</button></span></li>","<li><strong class=\"tt\">Инфраструктура</strong> — Основа, на которой всё держится: серверы, документация, правила, автоматические проверки. <span class=\"refs\"><button class=\"go\" data-go=\"ch4\">гл.&nbsp;4</button></span></li>","<li><strong class=\"tt\">Инцидент</strong> — Сбой, из-за которого приложение работает неправильно или не работает совсем. <span class=\"refs\"><button class=\"go\" data-go=\"ch11\">гл.&nbsp;11</button></span></li>","<li><strong class=\"tt\">Инъекция</strong> — Атака, при которой злоумышленник вводит в обычное поле не данные, а команду для базы или системы, и программа её выполняет. <span class=\"refs\"><button class=\"go\" data-go=\"ch8\">гл.&nbsp;8</button></span></li>","<li><strong class=\"tt\">Итеративное уточнение</strong> — Работа циклами: запросили, получили результат, проверили, уточнили. <span class=\"refs\"><button class=\"go\" data-go=\"ch2\">гл.&nbsp;2</button></span></li>","<li><strong class=\"tt\">Итерация</strong> — Один повторяемый шаг работы: попросили, получили результат, проверили. <span class=\"refs\"><button class=\"go\" data-go=\"ch3\">гл.&nbsp;3</button></span></li>","<li><strong class=\"tt\">Канареечный релиз</strong> — Выкладывание новой версии сначала небольшой доле пользователей, а потом всем. <span class=\"refs\"><button class=\"go\" data-go=\"ch8\">гл.&nbsp;8</button></span></li>","<li><strong class=\"tt\">Каркас проекта</strong> — Пустой проект с правильной структурой и настройками, на который затем наращивают функции. <span class=\"refs\"><button class=\"go\" data-go=\"ch7\">гл.&nbsp;7</button></span></li>","<li><strong class=\"tt\">Карточка модели (model card, system card)</strong> — Документ, который компания публикует вместе с моделью: результаты тестов, оценки безопасности, известные ограничения. <span class=\"refs\"><button class=\"go\" data-go=\"ch1\">гл.&nbsp;1</button></span></li>","<li><strong class=\"tt\">Каскадное удаление</strong> — Правило, по которому при удалении записи вместе с ней удаляются все связанные с ней. <span class=\"refs\"><button class=\"go\" data-go=\"ch7\">гл.&nbsp;7</button></span></li>","<li><strong class=\"tt\">Ключ API</strong> — Пароль для программы, который открывает доступ к чужому сервису: оплате, ИИ, почте. <span class=\"refs\"><button class=\"go\" data-go=\"abc\">Азбука</button></span></li>","<li><strong class=\"tt\">Код</strong> — Набор инструкций для компьютера, записанный текстом. <span class=\"refs\"><button class=\"go\" data-go=\"abc\">Азбука</button></span></li>","<li><strong class=\"tt\">Код ответа (401, 400, 404, 201)</strong> — Число, которым сервер сообщает результат: 201 — создано, 400 — неверные данные, 401 — не авторизован, 404 — не найдено. <span class=\"refs\"><button class=\"go\" data-go=\"ch7\">гл.&nbsp;7</button></span></li>","<li><strong class=\"tt\">Код-ревью</strong> — Проверка чужих изменений в проекте вторым взглядом, человеком или ИИ, до того как они попадут в основную версию. <span class=\"refs\"><button class=\"go\" data-go=\"ch5\">гл.&nbsp;5</button></span></li>","<li><strong class=\"tt\">Кодовая база</strong> — Весь код проекта. <span class=\"refs\"><button class=\"go\" data-go=\"ch8\">гл.&nbsp;8</button></span></li>","<li><strong class=\"tt\">Коммит</strong> — Одно сохранение в истории проекта с подписью, к которому можно вернуться. <span class=\"refs\"><button class=\"go\" data-go=\"abc\">Азбука</button></span></li>","<li><strong class=\"tt\">Компонент</strong> — Готовый блок интерфейса, например кнопка или форма. <span class=\"refs\"><button class=\"go\" data-go=\"ch7\">гл.&nbsp;7</button></span></li>","<li><strong class=\"tt\">Компрометация ключа</strong> — Ситуация, когда секретный ключ или пароль стал известен посторонним; такой ключ нужно немедленно заменить. <span class=\"refs\"><button class=\"go\" data-go=\"ch3\">гл.&nbsp;3</button></span></li>","<li><strong class=\"tt\">Конкатенация</strong> — «Склеивание» кусков текста в одну строку. <span class=\"refs\"><button class=\"go\" data-go=\"ch8\">гл.&nbsp;8</button></span></li>","<li><strong class=\"tt\">Конструктор приложений</strong> — Сервис, где вы описываете идею в чате и сразу получаете приложение с хостингом. <span class=\"refs\"><button class=\"go\" data-go=\"ch1\">гл.&nbsp;1</button>, <button class=\"go\" data-go=\"ch6\">гл.&nbsp;6</button></span></li>","<li><strong class=\"tt\">Контекст</strong> — Всё, что ИИ видит в данный момент: ваш запрос, предыдущие сообщения, прочитанные файлы. <span class=\"refs\"><button class=\"go\" data-go=\"abc\">Азбука</button></span></li>","<li><strong class=\"tt\">Контекстное окно</strong> — Сколько токенов модель видит одновременно: её «рабочий стол». <span class=\"refs\"><button class=\"go\" data-go=\"ch1\">гл.&nbsp;1</button></span></li>","<li><strong class=\"tt\">Контракт (между фронтендом и бэкендом)</strong> — Договорённость о том, в каком виде передаются данные между частями приложения. <span class=\"refs\"><button class=\"go\" data-go=\"ch7\">гл.&nbsp;7</button></span></li>","<li><strong class=\"tt\">Контрактный тест</strong> — Тест, проверяющий, что ответы сервера соответствуют договорённости, которую ждут другие части системы. <span class=\"refs\"><button class=\"go\" data-go=\"ch8\">гл.&nbsp;8</button></span></li>","<li><strong class=\"tt\">Контроль доступа</strong> — Проверка того, что человек имеет право на конкретные данные или действие. <span class=\"refs\"><button class=\"go\" data-go=\"ch8\">гл.&nbsp;8</button></span></li>","<li><strong class=\"tt\">Контрольная точка (checkpoint)</strong> — Сохранённое состояние файлов перед каждым запросом в Claude Code; к нему можно вернуться командой /rewind. Не заменяет коммит. <span class=\"refs\"><button class=\"go\" data-go=\"ch3\">гл.&nbsp;3</button></span></li>","<li><strong class=\"tt\">Копилефт (например, GPL)</strong> — Тип лицензии, который требует, чтобы код, в который попал такой фрагмент, тоже был открыт. <span class=\"refs\"><button class=\"go\" data-go=\"ch9\">гл.&nbsp;9</button></span></li>","<li><strong class=\"tt\">Критерий завершения</strong> — Условие, по которому агент понимает, что задача выполнена: например, проходят все тесты. <span class=\"refs\"><button class=\"go\" data-go=\"ch10\">гл.&nbsp;10</button></span></li>","<li><strong class=\"tt\">Курсорная пагинация</strong> — Способ листать список, при котором приложение запоминает «закладку» на последнем показанном элементе. <span class=\"refs\"><button class=\"go\" data-go=\"ch2\">гл.&nbsp;2</button></span></li>","<li><strong class=\"tt\">Кэш</strong> — Временное хранилище готовых ответов, чтобы не вычислять одно и то же заново. <span class=\"refs\"><button class=\"go\" data-go=\"ch8\">гл.&nbsp;8</button></span></li>","<li><strong class=\"tt\">Легаси</strong> — Старые системы, которые давно работают и которые трудно менять. <span class=\"refs\"><button class=\"go\" data-go=\"ch4\">гл.&nbsp;4</button></span></li>","<li><strong class=\"tt\">Лимит использования</strong> — Сколько работы с ИИ входит в подписку. У Claude он обновляется окнами по пять часов и по неделе. <span class=\"refs\"><button class=\"go\" data-go=\"ch1\">гл.&nbsp;1</button></span></li>","<li><strong class=\"tt\">Линтер</strong> — Программа, которая проверяет код на типичные ошибки и неряшливость. <span class=\"refs\"><button class=\"go\" data-go=\"ch5\">гл.&nbsp;5</button></span></li>","<li><strong class=\"tt\">Лицензия</strong> — Правила, на каких условиях разрешено использовать чужой код, текст или изображение. <span class=\"refs\"><button class=\"go\" data-go=\"ch9\">гл.&nbsp;9</button></span></li>","<li><strong class=\"tt\">Лог (журнал)</strong> — Запись о том, что делала программа и что пошло не так. <span class=\"refs\"><button class=\"go\" data-go=\"abc\">Азбука</button></span></li>","<li><strong class=\"tt\">Локализация</strong> — Адаптация продукта под язык и обычаи пользователей. <span class=\"refs\"><button class=\"go\" data-go=\"ch9\">гл.&nbsp;9</button></span></li>","<li><strong class=\"tt\">Локальный запуск (localhost)</strong> — Запуск приложения на своём компьютере, чтобы посмотреть, как оно работает. <span class=\"refs\"><button class=\"go\" data-go=\"abc\">Азбука</button></span></li>","<li><strong class=\"tt\">Макет</strong> — Картинка будущего экрана или всего приложения до того, как написан код. <span class=\"refs\"><button class=\"go\" data-go=\"ch6\">гл.&nbsp;6</button></span></li>","<li><strong class=\"tt\">Маршрутизация по сложности</strong> — Автоматическое направление простых задач быстрой модели, а сложных — самой сильной. <span class=\"refs\"><button class=\"go\" data-go=\"ch10\">гл.&nbsp;10</button></span></li>","<li><strong class=\"tt\">Матрица делегирования</strong> — Способ решить, что отдавать ИИ: чем дешевле ошибка и проще проверка, тем смелее можно делегировать. <span class=\"refs\"><button class=\"go\" data-go=\"ch4\">гл.&nbsp;4</button></span></li>","<li><strong class=\"tt\">Миграция</strong> — Аккуратное изменение устройства базы данных, например добавление новой колонки. <span class=\"refs\"><button class=\"go\" data-go=\"abc\">Азбука</button></span></li>","<li><strong class=\"tt\">Мини-набор</strong> — Ваши 5–10 типичных задач с критериями «готово», на которых вы сами сравниваете модели. <span class=\"refs\"><button class=\"go\" data-go=\"ch1\">гл.&nbsp;1</button></span></li>","<li><strong class=\"tt\">Минимальные права</strong> — Принцип: программа или агент получает ровно те права, которые нужны для работы, и не больше. <span class=\"refs\"><button class=\"go\" data-go=\"ch8\">гл.&nbsp;8</button></span></li>","<li><strong class=\"tt\">Модель (ИИ)</strong> — Сам ИИ, «мозг», который отвечает на ваши запросы: Claude, GPT, Gemini. <span class=\"refs\"><button class=\"go\" data-go=\"abc\">Азбука</button></span></li>","<li><strong class=\"tt\">Модель данных</strong> — Решение о том, какую информацию хранить и как она связана: пользователи, привычки, отметки. <span class=\"refs\"><button class=\"go\" data-go=\"ch7\">гл.&nbsp;7</button></span></li>","<li><strong class=\"tt\">Модерация</strong> — Проверка и удаление недопустимого содержимого. <span class=\"refs\"><button class=\"go\" data-go=\"ch9\">гл.&nbsp;9</button></span></li>","<li><strong class=\"tt\">Модуль</strong> — Самостоятельная часть программы, которая отвечает за одну область и общается с остальными по понятным правилам. <span class=\"refs\"><button class=\"go\" data-go=\"ch4\">гл.&nbsp;4</button></span></li>","<li><strong class=\"tt\">Модульный тест</strong> — Проверка одной небольшой части программы отдельно от остальных. <span class=\"refs\"><button class=\"go\" data-go=\"ch5\">гл.&nbsp;5</button></span></li>","<li><strong class=\"tt\">Мок</strong> — Подделка вместо настоящей части системы, которую подставляют в тесте. <span class=\"refs\"><button class=\"go\" data-go=\"ch5\">гл.&nbsp;5</button></span></li>","<li><strong class=\"tt\">Мониторинг</strong> — Постоянное наблюдение за здоровьем работающего приложения. <span class=\"refs\"><button class=\"go\" data-go=\"ch8\">гл.&nbsp;8</button></span></li>","<li><strong class=\"tt\">Мутационное тестирование</strong> — Проверка самих тестов: в код автоматически вносят мелкие ошибки и смотрят, заметят ли их тесты. <span class=\"refs\"><button class=\"go\" data-go=\"ch5\">гл.&nbsp;5</button></span></li>","<li><strong class=\"tt\">Наблюдаемость</strong> — Набор способов видеть, как себя чувствует работающее приложение: журналы, графики, оповещения. <span class=\"refs\"><button class=\"go\" data-go=\"ch4\">гл.&nbsp;4</button></span></li>","<li><strong class=\"tt\">Навык (skill)</strong> — Папка с инструкцией SKILL.md, которую Claude Code подгружает, когда задача подходит, или по команде. <span class=\"refs\"><button class=\"go\" data-go=\"ch10\">гл.&nbsp;10</button></span></li>","<li><strong class=\"tt\">Намерение</strong> — То, что вам нужно, зачем и в каких рамках: именно его, а не только команды, нужно передавать ИИ. <span class=\"refs\"><button class=\"go\" data-go=\"ch1\">гл.&nbsp;1</button></span></li>","<li><strong class=\"tt\">Насыщение бенчмарка</strong> — Состояние, когда лидеры набирают 90% и больше и тест перестаёт различать модели. <span class=\"refs\"><button class=\"go\" data-go=\"ch1\">гл.&nbsp;1</button></span></li>","<li><strong class=\"tt\">Негативный тест</strong> — Тест, проверяющий, что запрещённое действие действительно не работает. <span class=\"refs\"><button class=\"go\" data-go=\"ch8\">гл.&nbsp;8</button></span></li>","<li><strong class=\"tt\">Ноутбук (Jupyter)</strong> — Документ, где вперемешку лежат текст, код и результаты вычислений; его любят для работы с данными. <span class=\"refs\"><button class=\"go\" data-go=\"ch6\">гл.&nbsp;6</button></span></li>","<li><strong class=\"tt\">Обвязка (harness)</strong> — Программа-агент вокруг модели: какие инструменты ей доступны и как устроены попытки. Сильно влияет на результаты бенчмарков. <span class=\"refs\"><button class=\"go\" data-go=\"ch1\">гл.&nbsp;1</button></span></li>","<li><strong class=\"tt\">Обратная инженерия (reverse engineering)</strong> — Разбор готового продукта, чтобы понять, как он устроен: что умеет, из каких частей состоит, по каким правилам работает. <span class=\"refs\"><button class=\"go\" data-go=\"ch12\">гл.&nbsp;12</button></span></li>","<li><strong class=\"tt\">Обратно совместимая миграция</strong> — Изменение базы, которое не ломает старую версию программы; делается в несколько шагов. <span class=\"refs\"><button class=\"go\" data-go=\"ch8\">гл.&nbsp;8</button></span></li>","<li><strong class=\"tt\">Ограничения целостности</strong> — Правила, которые база данных сама не даёт нарушить. <span class=\"refs\"><button class=\"go\" data-go=\"ch7\">гл.&nbsp;7</button></span></li>","<li><strong class=\"tt\">Окружение</strong> — Место, где работает проект: разработка, тестовое или боевое. <span class=\"refs\"><button class=\"go\" data-go=\"abc\">Азбука</button></span></li>","<li><strong class=\"tt\">Оплата через API</strong> — Плата за каждый миллион токенов, отдельно за вход и выход, без потолка расходов. <span class=\"refs\"><button class=\"go\" data-go=\"ch1\">гл.&nbsp;1</button></span></li>","<li><strong class=\"tt\">Оркестратор</strong> — Главный агент, который делит задачу на части и раздаёт их подагентам. <span class=\"refs\"><button class=\"go\" data-go=\"ch10\">гл.&nbsp;10</button></span></li>","<li><strong class=\"tt\">Откат</strong> — Возврат к предыдущей рабочей версии, если новая сломалась. <span class=\"refs\"><button class=\"go\" data-go=\"ch3\">гл.&nbsp;3</button></span></li>","<li><strong class=\"tt\">Открытые модели</strong> — Модели, которые можно скачать и запускать на своём оборудовании. <span class=\"refs\"><button class=\"go\" data-go=\"ch1\">гл.&nbsp;1</button></span></li>","<li><strong class=\"tt\">Открытый код (open source)</strong> — Код, который опубликован для всех и может использоваться на условиях лицензии. <span class=\"refs\"><button class=\"go\" data-go=\"ch9\">гл.&nbsp;9</button></span></li>","<li><strong class=\"tt\">Отладка</strong> — Поиск причины ошибки. <span class=\"refs\"><button class=\"go\" data-go=\"abc\">Азбука</button></span></li>","<li><strong class=\"tt\">Отладчик</strong> — Инструмент, который позволяет пройти по программе шаг за шагом и увидеть, что в ней происходит. <span class=\"refs\"><button class=\"go\" data-go=\"ch4\">гл.&nbsp;4</button></span></li>","<li><strong class=\"tt\">Очередь</strong> — Способ передавать работу между частями системы по порядку. <span class=\"refs\"><button class=\"go\" data-go=\"ch4\">гл.&nbsp;4</button></span></li>","<li><strong class=\"tt\">Пагинация</strong> — Разбиение длинного списка на страницы или порции. <span class=\"refs\"><button class=\"go\" data-go=\"ch2\">гл.&nbsp;2</button></span></li>","<li><strong class=\"tt\">Парадокс знаний</strong> — Наблюдение, что ИИ больше помогает опытным людям: они знают, что проверять, и быстро замечают неверное решение. <span class=\"refs\"><button class=\"go\" data-go=\"ch3\">гл.&nbsp;3</button></span></li>","<li><strong class=\"tt\">Паритет функций</strong> — Сравнение возможностей вашего приложения и эталона: что уже есть, что отличается, что отложено. <span class=\"refs\"><button class=\"go\" data-go=\"ch12\">гл.&nbsp;12</button></span></li>","<li><strong class=\"tt\">Паттерн</strong> — Устойчивая схема, которая хорошо работает. <span class=\"refs\"><button class=\"go\" data-go=\"ch10\">гл.&nbsp;10</button></span></li>","<li><strong class=\"tt\">Пентестер</strong> — Специалист, который по заказу пытается взломать систему, чтобы найти слабые места раньше злоумышленников. <span class=\"refs\"><button class=\"go\" data-go=\"ch8\">гл.&nbsp;8</button></span></li>","<li><strong class=\"tt\">Перекрёстное ревью</strong> — Проверка кода, написанного одной моделью, моделью другого семейства. <span class=\"refs\"><button class=\"go\" data-go=\"ch10\">гл.&nbsp;10</button></span></li>","<li><strong class=\"tt\">Переменные окружения</strong> — Особые настройки вне кода, где хранят пароли и ключи, чтобы они не попали в проект. <span class=\"refs\"><button class=\"go\" data-go=\"ch3\">гл.&nbsp;3</button></span></li>","<li><strong class=\"tt\">Персональные данные</strong> — Всё, что позволяет определить человека: имя, адрес, телефон, почта. <span class=\"refs\"><button class=\"go\" data-go=\"ch9\">гл.&nbsp;9</button></span></li>","<li><strong class=\"tt\">Песочница</strong> — Изолированная среда, где агент может безопасно работать, не затрагивая остальные системы. <span class=\"refs\"><button class=\"go\" data-go=\"ch10\">гл.&nbsp;10</button></span></li>","<li><strong class=\"tt\">Плагин</strong> — Готовый набор навыков, хуков, подагентов и подключений для Claude Code, который ставится одной командой. <span class=\"refs\"><button class=\"go\" data-go=\"ch6\">гл.&nbsp;6</button>, <button class=\"go\" data-go=\"ch10\">гл.&nbsp;10</button></span></li>","<li><strong class=\"tt\">Побочный чат (side chat)</strong> — Маленький отдельный чат для вопроса по ходу работы. Вопрос и ответ не попадают в основной диалог. <span class=\"refs\"><button class=\"go\" data-go=\"ch4\">гл.&nbsp;4</button></span></li>","<li><strong class=\"tt\">Побочный эффект</strong> — Всё, что функция делает помимо возврата результата: например, записывает данные в файл или меняет базу. <span class=\"refs\"><button class=\"go\" data-go=\"ch5\">гл.&nbsp;5</button></span></li>","<li><strong class=\"tt\">Подагент</strong> — Помощник главного агента, которому поручена часть задачи и у которого свой чистый контекст. <span class=\"refs\"><button class=\"go\" data-go=\"ch10\">гл.&nbsp;10</button></span></li>","<li><strong class=\"tt\">Подбор пароля (перебор)</strong> — Автоматическая попытка войти, перебирая множество паролей; защита: ограничение числа попыток. <span class=\"refs\"><button class=\"go\" data-go=\"ch8\">гл.&nbsp;8</button></span></li>","<li><strong class=\"tt\">Подгонка под проверку</strong> — Ситуация, когда агент ослабляет или удаляет тест, чтобы получить «зелёный» результат. <span class=\"refs\"><button class=\"go\" data-go=\"ch10\">гл.&nbsp;10</button></span></li>","<li><strong class=\"tt\">Поддерживаемость</strong> — Насколько легко проект чинить и развивать через месяцы, когда детали уже забыты. <span class=\"refs\"><button class=\"go\" data-go=\"ch3\">гл.&nbsp;3</button></span></li>","<li><strong class=\"tt\">Подписка</strong> — Фиксированная плата в месяц за лимит использования, который регулярно обновляется. <span class=\"refs\"><button class=\"go\" data-go=\"ch1\">гл.&nbsp;1</button></span></li>","<li><strong class=\"tt\">Политики доступа к строкам (RLS)</strong> — Правила, определяющие, какие записи в базе данных может видеть и менять каждый пользователь. <span class=\"refs\"><button class=\"go\" data-go=\"ch6\">гл.&nbsp;6</button>, <button class=\"go\" data-go=\"ch7\">гл.&nbsp;7</button>, <button class=\"go\" data-go=\"ch8\">гл.&nbsp;8</button></span></li>","<li><strong class=\"tt\">Полный стек (full stack)</strong> — Работа со всеми слоями приложения сразу: интерфейсом, сервером и базой. <span class=\"refs\"><button class=\"go\" data-go=\"ch7\">гл.&nbsp;7</button></span></li>","<li><strong class=\"tt\">Правило двух попыток</strong> — Если после двух уточнений результат не приблизился к цели, нужно менять подход. <span class=\"refs\"><button class=\"go\" data-go=\"ch2\">гл.&nbsp;2</button></span></li>","<li><strong class=\"tt\">Превью-ссылка (preview)</strong> — Временная версия сайта для пул-реквеста: изменения можно посмотреть до слияния. <span class=\"refs\"><button class=\"go\" data-go=\"ch7\">гл.&nbsp;7</button></span></li>","<li><strong class=\"tt\">Предвзятость (bias)</strong> — Ситуация, когда система систематически хуже работает для одних людей и лучше для других. <span class=\"refs\"><button class=\"go\" data-go=\"ch9\">гл.&nbsp;9</button></span></li>","<li><strong class=\"tt\">Предметная область (домен)</strong> — Сфера, для которой делают программу: бухгалтерия, медицина, доставка. <span class=\"refs\"><button class=\"go\" data-go=\"ch4\">гл.&nbsp;4</button></span></li>","<li><strong class=\"tt\">Проблема 70%</strong> — Явление, когда ИИ быстро доводит проект до «почти готового» состояния, а оставшиеся 30% (ошибки, безопасность, скорость, эксплуатация) требуют непропорционально много времени. <span class=\"refs\"><button class=\"go\" data-go=\"ch3\">гл.&nbsp;3</button></span></li>","<li><strong class=\"tt\">Проблема N+1</strong> — Когда программа делает отдельный запрос к базе для каждой записи вместо одного общего. <span class=\"refs\"><button class=\"go\" data-go=\"ch8\">гл.&nbsp;8</button></span></li>","<li><strong class=\"tt\">Проверка типов</strong> — Автоматическая проверка, что в нужных местах используются данные нужного вида: число, текст, дата. <span class=\"refs\"><button class=\"go\" data-go=\"ch5\">гл.&nbsp;5</button></span></li>","<li><strong class=\"tt\">Продакшен</strong> — Боевая версия приложения, которой пользуются настоящие люди. <span class=\"refs\"><button class=\"go\" data-go=\"abc\">Азбука</button></span></li>","<li><strong class=\"tt\">Продакшен-версия</strong> — Боевая версия приложения, которой пользуются настоящие люди. <span class=\"refs\"><button class=\"go\" data-go=\"ch6\">гл.&nbsp;6</button></span></li>","<li><strong class=\"tt\">Проджект-менеджмент</strong> — Управление проектами: планирование, распределение задач, контроль сроков. <span class=\"refs\"><button class=\"go\" data-go=\"ch11\">гл.&nbsp;11</button></span></li>","<li><strong class=\"tt\">Проект</strong> — Все файлы и папки одного приложения. <span class=\"refs\"><button class=\"go\" data-go=\"abc\">Азбука</button></span></li>","<li><strong class=\"tt\">Промпт-инжиниринг</strong> — Умение хорошо формулировать запросы к ИИ. <span class=\"refs\"><button class=\"go\" data-go=\"ch2\">гл.&nbsp;2</button></span></li>","<li><strong class=\"tt\">Проприетарный код</strong> — Закрытый, обычно коммерческий код, права на который принадлежат владельцу. <span class=\"refs\"><button class=\"go\" data-go=\"ch9\">гл.&nbsp;9</button></span></li>","<li><strong class=\"tt\">Прототип</strong> — Пробная версия приложения, которая отвечает на конкретный вопрос; это не первая версия продукта. <span class=\"refs\"><button class=\"go\" data-go=\"ch1\">гл.&nbsp;1</button>, <button class=\"go\" data-go=\"ch6\">гл.&nbsp;6</button></span></li>","<li><strong class=\"tt\">Профилирование</strong> — Измерение того, какие части программы работают медленнее всего. <span class=\"refs\"><button class=\"go\" data-go=\"ch4\">гл.&nbsp;4</button></span></li>","<li><strong class=\"tt\">Профилировщик</strong> — Программа, которая показывает, на что тратится время работы приложения. <span class=\"refs\"><button class=\"go\" data-go=\"ch8\">гл.&nbsp;8</button></span></li>","<li><strong class=\"tt\">Пул-реквест</strong> — Предложение присоединить изменения из ветки к основной версии, которое кто-то проверяет. <span class=\"refs\"><button class=\"go\" data-go=\"abc\">Азбука</button></span></li>","<li><strong class=\"tt\">Разработка от спецификации</strong> — Подход: идея, затем спецификация, затем план, затем задачи, затем исполнение по одной. <span class=\"refs\"><button class=\"go\" data-go=\"ch2\">гл.&nbsp;2</button></span></li>","<li><strong class=\"tt\">Разработка с помощью ИИ</strong> — Режим, когда человек ведёт общий план проекта, ставит задачи порциями и проверяет каждое изменение. <span class=\"refs\"><button class=\"go\" data-go=\"ch1\">гл.&nbsp;1</button></span></li>","<li><strong class=\"tt\">Рандомизированное исследование</strong> — Исследование, где участникам случайным образом разрешают или запрещают что-то, чтобы честно сравнить результаты. <span class=\"refs\"><button class=\"go\" data-go=\"ch1\">гл.&nbsp;1</button></span></li>","<li><strong class=\"tt\">Рассуждение (reasoning)</strong> — Режим, когда модель сначала «думает» скрытыми токенами, а потом отвечает. <span class=\"refs\"><button class=\"go\" data-go=\"ch1\">гл.&nbsp;1</button></span></li>","<li><strong class=\"tt\">Регрессионный тест</strong> — Тест, который не даёт найденной ошибке вернуться. <span class=\"refs\"><button class=\"go\" data-go=\"ch8\">гл.&nbsp;8</button></span></li>","<li><strong class=\"tt\">Регулярное выражение</strong> — Короткая запись правила «что считать допустимым» для проверки текста. <span class=\"refs\"><button class=\"go\" data-go=\"ch9\">гл.&nbsp;9</button></span></li>","<li><strong class=\"tt\">Редактор кода (IDE)</strong> — Программа, в которой открывают проект и видят все его файлы: с подсветкой, подсказками и поиском. <span class=\"refs\"><button class=\"go\" data-go=\"abc\">Азбука</button></span></li>","<li><strong class=\"tt\">Режим разрешений</strong> — Настройка, которая определяет, когда агент спрашивает вас, а когда действует сам: Manual, Accept edits, Plan, Auto, Bypass permissions. <span class=\"refs\"><button class=\"go\" data-go=\"ch3\">гл.&nbsp;3</button></span></li>","<li><strong class=\"tt\">Резервная копия</strong> — Копия данных на случай потери; хороша только та, из которой проверяли восстановление. <span class=\"refs\"><button class=\"go\" data-go=\"ch8\">гл.&nbsp;8</button></span></li>","<li><strong class=\"tt\">Релиз</strong> — Выпуск версии приложения для настоящих пользователей. <span class=\"refs\"><button class=\"go\" data-go=\"ch7\">гл.&nbsp;7</button></span></li>","<li><strong class=\"tt\">Репозиторий</strong> — Проект вместе со всей историей его изменений. <span class=\"refs\"><button class=\"go\" data-go=\"abc\">Азбука</button></span></li>","<li><strong class=\"tt\">Ретроспектива</strong> — Регулярный разбор: что получилось, что нет и что изменить. <span class=\"refs\"><button class=\"go\" data-go=\"ch4\">гл.&nbsp;4</button></span></li>","<li><strong class=\"tt\">Рефакторинг</strong> — Наведение порядка в коде без изменения того, что программа делает снаружи. <span class=\"refs\"><button class=\"go\" data-go=\"abc\">Азбука</button></span></li>","<li><strong class=\"tt\">Сборка</strong> — Подготовка кода к выходу в свет: превращение в компактную версию для браузера. <span class=\"refs\"><button class=\"go\" data-go=\"abc\">Азбука</button></span></li>","<li><strong class=\"tt\">Секрет</strong> — Любой пароль или ключ, которые нельзя показывать посторонним. <span class=\"refs\"><button class=\"go\" data-go=\"abc\">Азбука</button></span></li>","<li><strong class=\"tt\">Сервер</strong> — Компьютер, который всегда включён и отвечает на запросы из интернета. <span class=\"refs\"><button class=\"go\" data-go=\"abc\">Азбука</button></span></li>","<li><strong class=\"tt\">Сканер лицензий</strong> — Автоматическая проверка, которая ловит в проекте фрагменты известного открытого кода и их условия. <span class=\"refs\"><button class=\"go\" data-go=\"ch9\">гл.&nbsp;9</button></span></li>","<li><strong class=\"tt\">Сканер секретов</strong> — Программа, которая не даёт сохранить в проект ключи и пароли. <span class=\"refs\"><button class=\"go\" data-go=\"ch8\">гл.&nbsp;8</button></span></li>","<li><strong class=\"tt\">Сквозной тест</strong> — Проверка, имитирующая действия реального человека в приложении от начала до конца. <span class=\"refs\"><button class=\"go\" data-go=\"ch5\">гл.&nbsp;5</button></span></li>","<li><strong class=\"tt\">Скоринг</strong> — Оценка человека по баллам, например кредитная. <span class=\"refs\"><button class=\"go\" data-go=\"ch9\">гл.&nbsp;9</button></span></li>","<li><strong class=\"tt\">Скринридер</strong> — Программа, которая зачитывает экран слепым и слабовидящим людям. <span class=\"refs\"><button class=\"go\" data-go=\"ch7\">гл.&nbsp;7</button></span></li>","<li><strong class=\"tt\">Скрипт</strong> — Небольшая программа для одной задачи. <span class=\"refs\"><button class=\"go\" data-go=\"ch2\">гл.&nbsp;2</button></span></li>","<li><strong class=\"tt\">Сопровождение</strong> — Всё, что происходит с программой после выпуска: исправление ошибок, обновления, адаптация к новым условиям. <span class=\"refs\"><button class=\"go\" data-go=\"ch11\">гл.&nbsp;11</button></span></li>","<li><strong class=\"tt\">Спагетти-код</strong> — Запутанный код, где всё связано со всем из-за множества заплаток. <span class=\"refs\"><button class=\"go\" data-go=\"ch6\">гл.&nbsp;6</button></span></li>","<li><strong class=\"tt\">Спектр режимов работы с ИИ</strong> — Шкала от автодополнения до делегирования агентам: чем правее, тем больше кода пишет ИИ. <span class=\"refs\"><button class=\"go\" data-go=\"ch1\">гл.&nbsp;1</button></span></li>","<li><strong class=\"tt\">Спецификация</strong> — Документ, в котором описано, что должна делать программа, но не как. <span class=\"refs\"><button class=\"go\" data-go=\"ch2\">гл.&nbsp;2</button></span></li>","<li><strong class=\"tt\">Стек</strong> — Набор технологий, на которых построено приложение. <span class=\"refs\"><button class=\"go\" data-go=\"ch6\">гл.&nbsp;6</button></span></li>","<li><strong class=\"tt\">Стектрейс</strong> — «След» ошибки: список мест в программе, через которые она прошла перед сбоем. <span class=\"refs\"><button class=\"go\" data-go=\"ch5\">гл.&nbsp;5</button></span></li>","<li><strong class=\"tt\">Строгая типизация</strong> — Свойство языка программирования, при котором у каждого значения есть чётко заданный вид, а ошибки несоответствия ловятся сразу. <span class=\"refs\"><button class=\"go\" data-go=\"ch11\">гл.&nbsp;11</button></span></li>","<li><strong class=\"tt\">Строгий режим TypeScript</strong> — Режим, в котором TypeScript особенно придирчиво ищет ошибки до запуска. <span class=\"refs\"><button class=\"go\" data-go=\"ch7\">гл.&nbsp;7</button></span></li>","<li><strong class=\"tt\">Сценарий воспроизведения</strong> — Минимальные шаги, которые приводят к ошибке. <span class=\"refs\"><button class=\"go\" data-go=\"ch5\">гл.&nbsp;5</button></span></li>","<li><strong class=\"tt\">Таймбокс</strong> — Заранее заданное время на работу: когда оно вышло, вы останавливаетесь и оцениваете результат. <span class=\"refs\"><button class=\"go\" data-go=\"ch6\">гл.&nbsp;6</button></span></li>","<li><strong class=\"tt\">Терминал</strong> — Окно, в котором компьютеру говорят, что делать, печатая команды текстом. <span class=\"refs\"><button class=\"go\" data-go=\"abc\">Азбука</button></span></li>","<li><strong class=\"tt\">Терминальный агент</strong> — Агент, который работает в командной строке: читает проект, запускает команды и правит файлы. <span class=\"refs\"><button class=\"go\" data-go=\"ch1\">гл.&nbsp;1</button></span></li>","<li><strong class=\"tt\">Тест</strong> — Автоматическая проверка, что программа даёт правильный результат. <span class=\"refs\"><button class=\"go\" data-go=\"abc\">Азбука</button></span></li>","<li><strong class=\"tt\">Товарный знак</strong> — Название, логотип или другой знак, который отличает продукт одной компании от других и охраняется законом. <span class=\"refs\"><button class=\"go\" data-go=\"ch12\">гл.&nbsp;12</button></span></li>","<li><strong class=\"tt\">Токен</strong> — Кусочек текста, из которых модель складывает слова; от токенов зависят цена и лимиты. <span class=\"refs\"><button class=\"go\" data-go=\"abc\">Азбука</button></span></li>","<li><strong class=\"tt\">Токен бота</strong> — Секретный ключ, который выдаёт @BotFather; кто его знает, тот управляет ботом. <span class=\"refs\"><button class=\"go\" data-go=\"ch6\">гл.&nbsp;6</button></span></li>","<li><strong class=\"tt\">Тонкий срез</strong> — Один сквозной сценарий целиком вместо множества недоделанных экранов. <span class=\"refs\"><button class=\"go\" data-go=\"ch6\">гл.&nbsp;6</button></span></li>","<li><strong class=\"tt\">Трассировка</strong> — Ручное прохождение одного реального сценария от входа до выхода с конкретными данными, чтобы понять, что делает код. <span class=\"refs\"><button class=\"go\" data-go=\"ch5\">гл.&nbsp;5</button></span></li>","<li><strong class=\"tt\">Требования</strong> — Описание того, что программа должна делать; тесты нужно писать от них, а не от готового кода. <span class=\"refs\"><button class=\"go\" data-go=\"ch5\">гл.&nbsp;5</button></span></li>","<li><strong class=\"tt\">Уникальный индекс</strong> — Правило базы данных, которое не позволяет записать два одинаковых значения. <span class=\"refs\"><button class=\"go\" data-go=\"ch7\">гл.&nbsp;7</button></span></li>","<li><strong class=\"tt\">Уязвимость</strong> — Слабое место программы, которым можно воспользоваться во вред. <span class=\"refs\"><button class=\"go\" data-go=\"ch8\">гл.&nbsp;8</button></span></li>","<li><strong class=\"tt\">Фаззинг</strong> — Проверка программы случайными и намеренно «вредными» входными данными. <span class=\"refs\"><button class=\"go\" data-go=\"ch8\">гл.&nbsp;8</button></span></li>","<li><strong class=\"tt\">Файл .env</strong> — Отдельный файл настроек, где хранят секреты вне основного кода. <span class=\"refs\"><button class=\"go\" data-go=\"abc\">Азбука</button></span></li>","<li><strong class=\"tt\">Файл правил проекта</strong> — Текстовый файл (например, CLAUDE.md или AGENTS.md), который агент читает в начале каждой сессии. <span class=\"refs\"><button class=\"go\" data-go=\"ch2\">гл.&nbsp;2</button></span></li>","<li><strong class=\"tt\">Фейковые данные</strong> — Придуманные примеры данных вместо настоящих, которых для прототипа достаточно. <span class=\"refs\"><button class=\"go\" data-go=\"ch6\">гл.&nbsp;6</button></span></li>","<li><strong class=\"tt\">Фича-флаг</strong> — Выключатель, позволяющий включать новую функцию постепенно и выключать её без новой версии. <span class=\"refs\"><button class=\"go\" data-go=\"ch8\">гл.&nbsp;8</button></span></li>","<li><strong class=\"tt\">Формальная верификация</strong> — Математическое доказательство того, что программа делает именно то, что заявлено. <span class=\"refs\"><button class=\"go\" data-go=\"ch11\">гл.&nbsp;11</button></span></li>","<li><strong class=\"tt\">Форматтер</strong> — Программа, которая приводит код к единому оформлению. <span class=\"refs\"><button class=\"go\" data-go=\"ch5\">гл.&nbsp;5</button></span></li>","<li><strong class=\"tt\">Фреймворк</strong> — Готовая заготовка приложения со своими правилами, куда встраивается ваше. <span class=\"refs\"><button class=\"go\" data-go=\"abc\">Азбука</button></span></li>","<li><strong class=\"tt\">Фронтенд</strong> — Часть приложения, отвечающая за интерфейс; работает на устройстве пользователя. <span class=\"refs\"><button class=\"go\" data-go=\"abc\">Азбука</button></span></li>","<li><strong class=\"tt\">Функциональный аналог</strong> — Приложение с теми же возможностями, что у эталона, но со своим кодом, названием и оформлением. <span class=\"refs\"><button class=\"go\" data-go=\"ch12\">гл.&nbsp;12</button></span></li>","<li><strong class=\"tt\">Функция</strong> — Небольшой именованный кусок программы, который выполняет одно действие. <span class=\"refs\"><button class=\"go\" data-go=\"ch4\">гл.&nbsp;4</button></span></li>","<li><strong class=\"tt\">Хостинг</strong> — Компьютеры в интернете, на которых живёт ваш сайт. <span class=\"refs\"><button class=\"go\" data-go=\"abc\">Азбука</button></span></li>","<li><strong class=\"tt\">Хук (hook)</strong> — Команда, которую Claude Code запускает автоматически до или после действия агента. <span class=\"refs\"><button class=\"go\" data-go=\"ch10\">гл.&nbsp;10</button></span></li>","<li><strong class=\"tt\">ЦКОКФ</strong> — Схема хорошего запроса: цель, контекст, ограничения, критерий готовности, формат ответа. <span class=\"refs\"><button class=\"go\" data-go=\"ch2\">гл.&nbsp;2</button></span></li>","<li><strong class=\"tt\">Чистая комната (clean room)</strong> — Метод, при котором эталон сначала описывают своими словами, а потом собирают своё приложение только по этому описанию, не глядя на чужой код и оформление. <span class=\"refs\"><button class=\"go\" data-go=\"ch12\">гл.&nbsp;12</button></span></li>","<li><strong class=\"tt\">Эвристика</strong> — Практическое правило, которое помогает быстро принять решение. <span class=\"refs\"><button class=\"go\" data-go=\"ch10\">гл.&nbsp;10</button></span></li>","<li><strong class=\"tt\">Эксплуатация</strong> — Всё, что нужно, чтобы приложение жило после запуска: наблюдать за ним, чинить, обновлять, откатывать. <span class=\"refs\"><button class=\"go\" data-go=\"ch3\">гл.&nbsp;3</button></span></li>","<li><strong class=\"tt\">Экстраполяция</strong> — Продолжение линии наблюдаемого тренда в будущее; это не гарантия. <span class=\"refs\"><button class=\"go\" data-go=\"ch11\">гл.&nbsp;11</button></span></li>","<li><strong class=\"tt\">Эндпоинт</strong> — Адрес, по которому приложение запрашивает или отправляет данные. <span class=\"refs\"><button class=\"go\" data-go=\"ch2\">гл.&nbsp;2</button></span></li>","<li><strong class=\"tt\">Эталон</strong> — Готовое приложение, на которое вы ориентируетесь, когда делаете своё. <span class=\"refs\"><button class=\"go\" data-go=\"ch12\">гл.&nbsp;12</button></span></li>","<li><strong class=\"tt\">Язык программирования</strong> — Язык, на котором пишут инструкции для компьютера: JavaScript, TypeScript, Python. <span class=\"refs\"><button class=\"go\" data-go=\"abc\">Азбука</button></span></li>","<li><strong class=\"tt\">«Решение большинства»</strong> — Склонность ИИ выбирать самый распространённый вариант из обучающих данных, который не всегда подходит именно вам. <span class=\"refs\"><button class=\"go\" data-go=\"ch5\">гл.&nbsp;5</button></span></li>","<li><strong class=\"tt\">ADR (запись архитектурного решения)</strong> — Короткий документ «что решили и почему». <span class=\"refs\"><button class=\"go\" data-go=\"ch8\">гл.&nbsp;8</button></span></li>","<li><strong class=\"tt\">AI Act</strong> — Европейский закон об ИИ. Вступил в силу в 2024 году и вводится поэтапно: требования прозрачности — с августа 2026 года, к системам высокого риска — с декабря 2027 года. <span class=\"refs\"><button class=\"go\" data-go=\"ch9\">гл.&nbsp;9</button></span></li>","<li><strong class=\"tt\">API</strong> — Правила, по которым одна часть программы просит что-то у другой или по которым приложение общается с чужими сервисами. <span class=\"refs\"><button class=\"go\" data-go=\"abc\">Азбука</button></span></li>","<li><strong class=\"tt\">CI</strong> — Робот, который автоматически запускает тесты и проверки при каждом новом изменении в проекте. <span class=\"refs\"><button class=\"go\" data-go=\"abc\">Азбука</button></span></li>","<li><strong class=\"tt\">CI/CD</strong> — Автоматическая цепочка: изменения проверяются (CI) и затем автоматически выкладываются (CD). <span class=\"refs\"><button class=\"go\" data-go=\"ch4\">гл.&nbsp;4</button></span></li>","<li><strong class=\"tt\">CLI</strong> — Программа, которой управляют из терминала командами. <span class=\"refs\"><button class=\"go\" data-go=\"ch10\">гл.&nbsp;10</button></span></li>","<li><strong class=\"tt\">Co-Authored-By</strong> — Строка в сообщении о сохранении (коммите), которая указывает соавтора, например ИИ-инструмент. <span class=\"refs\"><button class=\"go\" data-go=\"ch9\">гл.&nbsp;9</button></span></li>","<li><strong class=\"tt\">CORS</strong> — Настройки, которые определяют, каким сайтам разрешено обращаться к вашему серверу. <span class=\"refs\"><button class=\"go\" data-go=\"ch8\">гл.&nbsp;8</button></span></li>","<li><strong class=\"tt\">CRM</strong> — Программа для работы с клиентами: хранит контакты и сделки. <span class=\"refs\"><button class=\"go\" data-go=\"ch2\">гл.&nbsp;2</button></span></li>","<li><strong class=\"tt\">CRUD</strong> — Четыре стандартных действия с данными: создать, прочитать, изменить, удалить. <span class=\"refs\"><button class=\"go\" data-go=\"ch3\">гл.&nbsp;3</button></span></li>","<li><strong class=\"tt\">CSV</strong> — Простой текстовый формат таблицы, который открывается в Excel. <span class=\"refs\"><button class=\"go\" data-go=\"ch10\">гл.&nbsp;10</button></span></li>","<li><strong class=\"tt\">DAST</strong> — Динамический анализ: искусственная атака на запущенное приложение в тестовом окружении. <span class=\"refs\"><button class=\"go\" data-go=\"ch8\">гл.&nbsp;8</button></span></li>","<li><strong class=\"tt\">DNS-записи</strong> — Настройки у регистратора домена, которые говорят интернету, на каком сервере живёт ваш сайт. <span class=\"refs\"><button class=\"go\" data-go=\"ch7\">гл.&nbsp;7</button></span></li>","<li><strong class=\"tt\">Docker</strong> — Технология, которая упаковывает программу вместе с окружением, чтобы она запускалась одинаково везде. <span class=\"refs\"><button class=\"go\" data-go=\"ch10\">гл.&nbsp;10</button></span></li>","<li><strong class=\"tt\">Drizzle ORM</strong> — «Переводчик» между кодом и базой данных: таблицы описываются на привычном для кода языке. <span class=\"refs\"><button class=\"go\" data-go=\"ch7\">гл.&nbsp;7</button></span></li>","<li><strong class=\"tt\">Evals</strong> — Наборы примеров с ожидаемым поведением, по которым проверяют, правильно ли отвечает ИИ. <span class=\"refs\"><button class=\"go\" data-go=\"ch4\">гл.&nbsp;4</button></span></li>","<li><strong class=\"tt\">Few-shot</strong> — Приём, при котором вы показываете модели пару образцов того, что хотите получить. <span class=\"refs\"><button class=\"go\" data-go=\"ch2\">гл.&nbsp;2</button></span></li>","<li><strong class=\"tt\">Firebase</strong> — Сервис Google с готовой базой данных, входом пользователей и хранилищем файлов. Доступ к данным задают правила безопасности (Security Rules). <span class=\"refs\"><button class=\"go\" data-go=\"ch7\">гл.&nbsp;7</button>, <button class=\"go\" data-go=\"ch8\">гл.&nbsp;8</button></span></li>","<li><strong class=\"tt\">Git</strong> — Система, которая запоминает всю историю изменений проекта, как сохранения в игре. <span class=\"refs\"><button class=\"go\" data-go=\"abc\">Азбука</button></span></li>","<li><strong class=\"tt\">git bisect</strong> — Приём Git, который половинным делением истории находит сохранение, после которого что-то сломалось. <span class=\"refs\"><button class=\"go\" data-go=\"ch5\">гл.&nbsp;5</button></span></li>","<li><strong class=\"tt\">GitHub</strong> — Сайт, где хранят репозитории в интернете. <span class=\"refs\"><button class=\"go\" data-go=\"abc\">Азбука</button></span></li>","<li><strong class=\"tt\">HTML и CSS</strong> — Языки описания страницы: HTML задаёт, что на ней есть, а CSS — как это выглядит. <span class=\"refs\"><button class=\"go\" data-go=\"abc\">Азбука</button></span></li>","<li><strong class=\"tt\">HTTP</strong> — Правила, по которым браузер и сервер обмениваются информацией. <span class=\"refs\"><button class=\"go\" data-go=\"ch7\">гл.&nbsp;7</button></span></li>","<li><strong class=\"tt\">IDOR</strong> — Уязвимость, когда пользователь может получить или изменить чужие данные, просто подставив чужой номер. <span class=\"refs\"><button class=\"go\" data-go=\"ch7\">гл.&nbsp;7</button></span></li>","<li><strong class=\"tt\">Issue</strong> — Запись о задаче или проблеме на GitHub. <span class=\"refs\"><button class=\"go\" data-go=\"ch10\">гл.&nbsp;10</button></span></li>","<li><strong class=\"tt\">JavaScript</strong> — Язык программирования, который «оживляет» страницы: кнопки нажимаются, данные подгружаются. <span class=\"refs\"><button class=\"go\" data-go=\"abc\">Азбука</button></span></li>","<li><strong class=\"tt\">JSON</strong> — Формат записи данных: текст с чёткой структурой, понятный и людям, и программам. <span class=\"refs\"><button class=\"go\" data-go=\"ch7\">гл.&nbsp;7</button></span></li>","<li><strong class=\"tt\">Junior, middle, senior</strong> — Условные уровни специалиста: младший (начинающий), средний (самостоятельный) и старший (с большим опытом). <span class=\"refs\"><button class=\"go\" data-go=\"ch4\">гл.&nbsp;4</button></span></li>","<li><strong class=\"tt\">Long polling (долгий опрос)</strong> — Способ получать сообщения, при котором программа сама постоянно спрашивает сервис, нет ли нового. <span class=\"refs\"><button class=\"go\" data-go=\"ch6\">гл.&nbsp;6</button></span></li>","<li><strong class=\"tt\">MCP</strong> — Стандартный «разъём», через который к агенту подключают внешние инструменты. <span class=\"refs\"><button class=\"go\" data-go=\"abc\">Азбука</button></span></li>","<li><strong class=\"tt\">Model Context Protocol (MCP)</strong> — Открытый стандарт для подключения к агенту баз данных, трекеров задач, документации, браузера. <span class=\"refs\"><button class=\"go\" data-go=\"ch1\">гл.&nbsp;1</button></span></li>","<li><strong class=\"tt\">MVP</strong> — Минимально жизнеспособный продукт: самая простая версия, которой достаточно, чтобы проверить спрос. <span class=\"refs\"><button class=\"go\" data-go=\"ch7\">гл.&nbsp;7</button></span></li>","<li><strong class=\"tt\">Next.js</strong> — Популярный фреймворк для сайтов: готовый каркас, в который встраивают свои страницы и логику. <span class=\"refs\"><button class=\"go\" data-go=\"ch7\">гл.&nbsp;7</button></span></li>","<li><strong class=\"tt\">OWASP Top 10</strong> — Известный список десяти самых распространённых видов уязвимостей в приложениях. <span class=\"refs\"><button class=\"go\" data-go=\"ch4\">гл.&nbsp;4</button></span></li>","<li><strong class=\"tt\">pass@1, pass@k</strong> — Доля задач, решённых с первой попытки (pass@1) или хотя бы в одной из k попыток (pass@k). <span class=\"refs\"><button class=\"go\" data-go=\"ch1\">гл.&nbsp;1</button></span></li>","<li><strong class=\"tt\">Playwright</strong> — Инструмент, который управляет настоящим браузером и проверяет приложение так, как это делает человек. <span class=\"refs\"><button class=\"go\" data-go=\"ch7\">гл.&nbsp;7</button></span></li>","<li><strong class=\"tt\">PostgreSQL</strong> — Популярная база данных: хранит информацию в таблицах. <span class=\"refs\"><button class=\"go\" data-go=\"ch7\">гл.&nbsp;7</button></span></li>","<li><strong class=\"tt\">Prompt injection</strong> — Атака на агента: в тексте, который он читает, спрятана инструкция, и агент выполняет её как приказ. <span class=\"refs\"><button class=\"go\" data-go=\"ch8\">гл.&nbsp;8</button></span></li>","<li><strong class=\"tt\">Property-based тесты</strong> — Тесты, которые проверяют общие правила на сотнях случайных входных данных. <span class=\"refs\"><button class=\"go\" data-go=\"ch5\">гл.&nbsp;5</button></span></li>","<li><strong class=\"tt\">Python</strong> — Универсальный язык программирования, популярный для обработки данных, скриптов и работы с ИИ. <span class=\"refs\"><button class=\"go\" data-go=\"abc\">Азбука</button></span></li>","<li><strong class=\"tt\">RAG</strong> — Приём, при котором ИИ сначала находит нужные документы в отдельной базе, а затем отвечает на их основе. <span class=\"refs\"><button class=\"go\" data-go=\"ch4\">гл.&nbsp;4</button></span></li>","<li><strong class=\"tt\">SAST</strong> — Статический анализ: программа читает код, не запуская его, и ищет опасные шаблоны. <span class=\"refs\"><button class=\"go\" data-go=\"ch8\">гл.&nbsp;8</button></span></li>","<li><strong class=\"tt\">SCA</strong> — Анализ зависимостей: проверка подключённых библиотек на известные уязвимости. <span class=\"refs\"><button class=\"go\" data-go=\"ch8\">гл.&nbsp;8</button></span></li>","<li><strong class=\"tt\">Slopsquatting</strong> — Атака через выдуманные ИИ названия пакетов: злоумышленник регистрирует такое имя и кладёт внутрь вредоносный код. <span class=\"refs\"><button class=\"go\" data-go=\"ch8\">гл.&nbsp;8</button></span></li>","<li><strong class=\"tt\">SQL</strong> — Специальный язык запросов к базам данных. <span class=\"refs\"><button class=\"go\" data-go=\"ch7\">гл.&nbsp;7</button></span></li>","<li><strong class=\"tt\">SQL-инъекция</strong> — Инъекция, нацеленная на базу данных: в запрос подмешивается чужая команда. <span class=\"refs\"><button class=\"go\" data-go=\"ch8\">гл.&nbsp;8</button></span></li>","<li><strong class=\"tt\">Staging (тестовое окружение)</strong> — Копия боевой версии, где всё проверяют перед выпуском. <span class=\"refs\"><button class=\"go\" data-go=\"abc\">Азбука</button></span></li>","<li><strong class=\"tt\">Supabase</strong> — Сервис с готовой базой PostgreSQL, входом пользователей и хранилищем файлов. Данные защищают политики доступа к строкам (RLS). <span class=\"refs\"><button class=\"go\" data-go=\"ch7\">гл.&nbsp;7</button>, <button class=\"go\" data-go=\"ch8\">гл.&nbsp;8</button></span></li>","<li><strong class=\"tt\">T-образный профиль</strong> — Широкая база знаний по многим темам плюс глубокая экспертиза в одной-двух областях. <span class=\"refs\"><button class=\"go\" data-go=\"ch4\">гл.&nbsp;4</button></span></li>","<li><strong class=\"tt\">Telegram-бот</strong> — Программа, которая общается с людьми в Telegram; создаётся через @BotFather. <span class=\"refs\"><button class=\"go\" data-go=\"ch6\">гл.&nbsp;6</button></span></li>","<li><strong class=\"tt\">TypeScript</strong> — JavaScript со строгой проверкой, которая сразу подсвечивает ошибки вроде «вместо числа дали текст». <span class=\"refs\"><button class=\"go\" data-go=\"abc\">Азбука</button></span></li>","<li><strong class=\"tt\">Vitest</strong> — Инструмент для автоматических проверок отдельных частей программы. <span class=\"refs\"><button class=\"go\" data-go=\"ch7\">гл.&nbsp;7</button></span></li>","<li><strong class=\"tt\">Worktree</strong> — Отдельная рабочая копия проекта в своей ветке. Нужна, чтобы несколько сессий агента не правили одни и те же файлы. <span class=\"refs\"><button class=\"go\" data-go=\"ch10\">гл.&nbsp;10</button></span></li>","<li><strong class=\"tt\">XSS (межсайтовый скриптинг)</strong> — Атака, при которой на странице выполняется чужая программа, подмешанная через текст пользователя. <span class=\"refs\"><button class=\"go\" data-go=\"ch8\">гл.&nbsp;8</button></span></li>","<li><strong class=\"tt\">Zod</strong> — Библиотека для проверки того, что пришедшие данные имеют нужный вид. <span class=\"refs\"><button class=\"go\" data-go=\"ch7\">гл.&nbsp;7</button></span></li>"]},{"t":"ch","id":"about","head":"Об авторе","h":"<header class=\"ch-open\"><h2>Об авторе</h2></header>"},{"t":"p","h":"<strong>[Имя автора]</strong> — [должность или роль], [число] лет в разработке программного обеспечения. Последние годы работает на стыке инженерии и ИИ: [чем занимается — например, внедряет ИИ-агентов в процессы команды, строит продукты на основе LLM, обучает разработчиков]."},{"t":"p","h":"[Два-три предложения о проектах и опыте, которые дают право писать эту книгу: компании, продукты, выступления, курсы.]"},{"t":"p","h":"[Чем автор занимается вне работы — одно предложение.]"},{"t":"p","h":"Связаться с автором: [сайт, Telegram или почта]."},{"t":"p","h":"Текст книги подготовлен в соавторстве с ИИ-ассистентом Claude и отредактирован автором."},{"t":"ch","id":"design","head":"Оформление книги","h":"<header class=\"ch-open\"><h2>Оформление книги</h2></header>"},{"t":"p","h":"Это издание для читателей без опыта в программировании. Оглавление глав 1–11 осталось прежним, а текст переработан, схемы дополнены (в том числе схемами десктопного приложения Claude Code): добавлены вводная глава «Азбука», практикум об обратной инженерии (глава 12), рамки «Простыми словами» с бытовыми сравнениями, пояснения к примерам кода, упражнения для новичков и «Словарь терминов» в конце. Вёрстка рассчитана на чтение разворотами."},{"t":"list","tag":"ul","c":"ul","items":["<li>Основной текст набран шрифтом Literata, заголовки и подписи — Onest, код — JetBrains Mono. Все три шрифта поддерживают кириллицу.</li>","<li>Страницы верстаются под ваш экран: на компьютере книга открывается разворотом, на телефоне — по одной странице. Если изменить размер шрифта, книга пересоберётся и номера страниц сдвинутся.</li>","<li>Схемы нарисованы вектором и читаются в светлой и тёмной теме. Нажмите на схему, чтобы рассмотреть её крупно.</li>","<li>Упражнения можно отмечать прямо на страницах. Отметки хранятся только в вашем браузере.</li>","<li>Номера в оглавлении и в указателе — ссылки: нажмите, чтобы перейти.</li>"]},{"t":"p","h":"Снимок технологий и данных в книге — октябрь 2026 года. Названия инструментов и моделей устаревают быстрее принципов, поэтому при переиздании в первую очередь обновляются таблицы обзоров в главах 1, 6 и 10."},{"t":"ch","id":"index","head":"Алфавитный указатель","h":"<header class=\"ch-open\"><h2>Алфавитный указатель</h2></header>"},{"t":"p","h":"В указателе вместо страниц — номера глав, где термин объясняется или используется в работе. Короткие объяснения всех терминов собраны в «Словаре терминов», а самые основные понятия разобраны в «Азбуке»."},{"t":"list","tag":"ul","c":"idx","items":["<li><span class=\"tt\">Автодополнение</span><i></i><span class=\"refs\">гл.&nbsp;<button class=\"go\" data-go=\"ch1\">1</button>, <button class=\"go\" data-go=\"ch10\">10</button></span></li>","<li><span class=\"tt\">Агент фонового программирования</span><i></i><span class=\"refs\">гл.&nbsp;<button class=\"go\" data-go=\"ch10\">10</button></span></li>","<li><span class=\"tt\">Агентная инженерия</span><i></i><span class=\"refs\">гл.&nbsp;<button class=\"go\" data-go=\"ch1\">1</button></span></li>","<li><span class=\"tt\">Агентный цикл</span><i></i><span class=\"refs\">гл.&nbsp;<button class=\"go\" data-go=\"ch10\">10</button></span></li>","<li><span class=\"tt\">Архитектурные решения, записи (ADR)</span><i></i><span class=\"refs\">гл.&nbsp;<button class=\"go\" data-go=\"ch8\">8</button></span></li>","<li><span class=\"tt\">Безопасность сгенерированного кода</span><i></i><span class=\"refs\">гл.&nbsp;<button class=\"go\" data-go=\"ch8\">8</button></span></li>","<li><span class=\"tt\">Бенчмарки</span><i></i><span class=\"refs\">гл.&nbsp;<button class=\"go\" data-go=\"ch1\">1</button></span></li>","<li><span class=\"tt\">Вайб-кодинг</span><i></i><span class=\"refs\">гл.&nbsp;<button class=\"go\" data-go=\"ch1\">1</button>, <button class=\"go\" data-go=\"ch3\">3</button>, <button class=\"go\" data-go=\"ch11\">11</button></span></li>","<li><span class=\"tt\">Вертикальный срез</span><i></i><span class=\"refs\">гл.&nbsp;<button class=\"go\" data-go=\"ch7\">7</button></span></li>","<li><span class=\"tt\">Галлюцинация</span><i></i><span class=\"refs\">гл.&nbsp;<button class=\"go\" data-go=\"ch1\">1</button>, <button class=\"go\" data-go=\"ch8\">8</button></span></li>","<li><span class=\"tt\">Горизонт задач (METR)</span><i></i><span class=\"refs\">гл.&nbsp;<button class=\"go\" data-go=\"ch10\">10</button>, <button class=\"go\" data-go=\"ch11\">11</button></span></li>","<li><span class=\"tt\">Декомпиляция</span><i></i><span class=\"refs\">гл.&nbsp;<button class=\"go\" data-go=\"ch12\">12</button></span></li>","<li><span class=\"tt\">Декомпозиция</span><i></i><span class=\"refs\">гл.&nbsp;<button class=\"go\" data-go=\"ch1\">1</button>, <button class=\"go\" data-go=\"ch2\">2</button></span></li>","<li><span class=\"tt\">Делегирование агентам</span><i></i><span class=\"refs\">гл.&nbsp;<button class=\"go\" data-go=\"ch1\">1</button>, <button class=\"go\" data-go=\"ch4\">4</button>, <button class=\"go\" data-go=\"ch10\">10</button></span></li>","<li><span class=\"tt\">Доступность интерфейса</span><i></i><span class=\"refs\">гл.&nbsp;<button class=\"go\" data-go=\"ch7\">7</button>, <button class=\"go\" data-go=\"ch9\">9</button>, <button class=\"go\" data-go=\"ch11\">11</button></span></li>","<li><span class=\"tt\">Запахи ИИ-кода</span><i></i><span class=\"refs\">гл.&nbsp;<button class=\"go\" data-go=\"ch5\">5</button></span></li>","<li><span class=\"tt\">Золотые правила вайб-кодинга</span><i></i><span class=\"refs\">гл.&nbsp;<button class=\"go\" data-go=\"ch3\">3</button></span></li>","<li><span class=\"tt\">Золотые правила ответственного использования ИИ</span><i></i><span class=\"refs\">гл.&nbsp;<button class=\"go\" data-go=\"ch9\">9</button></span></li>","<li><span class=\"tt\">Интеллектуальная собственность</span><i></i><span class=\"refs\">гл.&nbsp;<button class=\"go\" data-go=\"ch9\">9</button>, <button class=\"go\" data-go=\"ch12\">12</button></span></li>","<li><span class=\"tt\">Итеративное уточнение</span><i></i><span class=\"refs\">гл.&nbsp;<button class=\" /* ---------- Размер страниц ---------- */
function computeLayout() {
  const W = stage.clientWidth - 32, H = stage.clientHeight - 12;
  const scale = SCALES[scaleIdx];
  let mode = "single", pw, ph;
  let sh = Math.min(H, 1120), sw = Math.min(W / 2, sh * 0.78);
  if (sw < sh * 0.6) sh = Math.floor(sw / 0.6);
  if (sw >= 400 && W >= 860) { mode = "spread"; pw = sw; ph = sh; }
  else { pw = Math.min(W + (W < 500 ? 16 : 0), 700, Math.max(H * 0.8, 320)); ph = H; }
  pw = Math.floor(pw); ph = Math.floor(ph);
  const fs = Math.round(Math.min(19, Math.max(15, pw / 34)) * scale * 10) / 10;
  const px = Math.round(pw < 480 ? Math.max(16, pw * 0.06) : Math.min(60, pw * 0.085));
  const pt = Math.round(Math.min(46, Math.max(14, ph * 0.045)));
  const pb = Math.round(Math.min(40, Math.max(12, ph * 0.04)));
  return { mode, pw, ph, fs, px, pt, pb, key: [mode, pw, ph, fs].join("|") };
}
function applyLayout(l) {

  s.setProperty("--pt", l.pt + "px"); s.setProperty("--pb", l.pb + "px");

}
