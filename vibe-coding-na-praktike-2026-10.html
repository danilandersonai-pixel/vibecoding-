с первой попытки, сколько понадобилось правок, сколько ушло времени и лимита.</li>","<li data-n=\"5\">Запишите итоги в таблицу и повторяйте проверку, когда выходит новая модель или вы меняете инструмент.</li>"]},{"t":"p","h":"Два запроса, которые помогут. Первый разбирает карточку модели:"},{"t":"code","c":"prompt","label":"Запрос","lines":["Разбери карточку модели [название] простыми словами.","Ссылки: [страница модели в документации], [system card].","Если у тебя нет доступа к ссылкам, скажи об этом — я вставлю текст.","1. Выпиши: контекстное окно, максимальный ответ, дату среза знаний, цену за 1 млн токенов на входе и выходе, уровни усилия, что модель понимает кроме текста.","2. Перечисли бенчмарки из карточки: что проверяет каждый, насыщен ли он, кто мерил — сама компания или независимая площадка.","3. Перескажи раздел об ограничениях.","4. Скажи, подходит ли модель для [моя задача], и чего ты не знаешь наверняка."]},{"t":"p","h":"Второй помогает собрать мини-набор:"},{"t":"code","c":"prompt","label":"Запрос","lines":["Помоги собрать мини-набор для сравнения моделей.","Мои типичные задачи: [список из 5–10 задач].","Для каждой задачи:","1. Сформулируй одинаковый запрос, который я дам разным моделям.","2. Запиши проверяемый критерий «готово».","Затем сделай таблицу для результатов: модель, решено с первой попытки (да/нет), число правок, время, замечания."]},{"t":"note","h":"<div class=\"note tip\"><span class=\"nl\">Совет</span> Вышла новая модель — не переключайтесь в тот же день. Прочитайте её карточку, дождитесь независимых замеров (обычно они появляются за несколько дней или недель) и прогоните свой мини-набор. Модель, которая лучше «в среднем», не обязательно лучше на ваших задачах.</div>"},{"t":"h3","id":"s11","h":"<h3>Выбор модели в зависимости от задачи</h3>"},{"t":"p","h":"Нет «лучшей модели вообще». Есть лучшая модель для конкретной задачи и бюджета. Практическое правило: дорогую модель с максимальным рассуждением используйте для планирования и сложных решений, быструю и дешёвую — для массовых однотипных правок."},{"t":"table","head":"<tr><th>Задача</th><th>Что выбрать</th><th>Почему</th></tr>","rows":["<tr><td>Общий план проекта, сложная ошибка, большая переделка кода</td><td>Флагман (самая сильная модель) с высоким усилием рассуждения</td><td>Ошибка в плане обходится дороже, чем лишние токены</td></tr>","<tr><td>Повседневная работа с агентом</td><td>Модель среднего класса</td><td>Баланс качества, скорости и лимитов</td></tr>","<tr><td>Подсказки, переименования, простые тесты</td><td>Быстрая лёгкая модель</td><td>Важна скорость отклика, а не глубина</td></tr>","<tr><td>Код под соглашением о неразглашении, работа без интернета</td><td>Открытая модель на своём оборудовании</td><td>Данные не покидают вашу компанию</td></tr>","<tr><td>Разбор скриншотов, макетов, схем</td><td>Модель, которая хорошо работает с картинками</td><td>Нужна способность понимать не только текст</td></tr>"],"cols":3},{"t":"fig","n":"ch1_models","cap":"Рис. 1.10 · три ступени моделей"},{"t":"p","h":"Как читать схему: три ступени отличаются по скорости, цене и силе. Чем выше ступень, тем она мощнее и дороже, поэтому для простых задач берут нижнюю, а для сложных поднимаются выше."},{"t":"p","h":"Проверяйте выбор на собственном мини-наборе из 5–10 типичных задач (как его собрать, мы разобрали выше). Таблицы лидеров показывают средний случай, а вам важен ваш."},{"t":"note","h":"<div class=\"note tip\"><span class=\"nl\">Совет</span> Для начала не усложняйте. Используйте модель, которую ваш инструмент предлагает по умолчанию, и переходите на более сильную, когда упёрлись в задачу, которую она не может решить.</div>"},{"t":"h3","id":"s79","h":"<h3>Сколько это стоит: подписки, токены и лимиты</h3>"},{"t":"p","h":"Платить за ИИ можно двумя способами. <strong>Подписка</strong> похожа на абонемент в спортзал: платите раз в месяц и пользуетесь в пределах лимита, который регулярно обновляется. <strong>Оплата через API</strong> похожа на такси со счётчиком: платите за каждый миллион токенов, и потолка нет. Новичку почти всегда удобнее подписка: расходы предсказуемы."},{"t":"table","head":"<tr><th>Сервис</th><th>Бесплатно</th><th>Платные тарифы, в месяц</th></tr>","rows":["<tr><td>Claude (чат и Claude Code)</td><td>Чат есть, Claude Code нет</td><td>Pro — $20; Max — $100 и $200</td></tr>","<tr><td>ChatGPT (чат и Codex)</td><td>Есть, Codex с небольшими лимитами</td><td>Go — $8; Plus — $20; Pro — $100, $200 и $500</td></tr>","<tr><td>GitHub Copilot</td><td>До 2000 подсказок в месяц и ограниченный чат</td><td>Pro — $10; Pro+ — $39; Max — $100</td></tr>","<tr><td>Конструкторы приложений (Lovable, Bolt, v0, Replit)</td><td>Небольшой дневной или месячный лимит</td><td>Около $20–30, есть командные тарифы</td></tr>"],"cols":3},{"t":"p","h":"Как устроены лимиты Claude. Есть «сессионный» лимит, который обновляется скользящим окном в пять часов, а на платных тарифах поверх него действует недельный. Чат и Claude Code тратят общий лимит. Сколько осталось, видно в Settings → Usage, а в Claude Code — по команде <code>/usage</code>. Лимиты Codex тоже считаются окнами по пять часов и по неделе."},{"t":"p","h":"При оплате через API цена зависит от модели и считается отдельно за вход и выход. Вернитесь к таблице характеристик Claude выше: Haiku 5.5 и Opus 5.5 различаются в цене в 40 раз. Агент в длинной сессии легко расходует миллионы токенов, поэтому при работе через API задайте в настройках аккаунта лимит расходов."},{"t":"note","h":"<div class=\"note tip\"><span class=\"nl\">Совет</span> Начните с базового тарифа за $20 и неделю-две следите за расходом лимита. Переходите на старший тариф, только если регулярно в него упираетесь. Цены — снимок на октябрь 2026 года: перед оплатой проверьте их на сайте сервиса.</div>"},{"t":"h3","id":"s12","h":"<h3>Преимущества и ограничения вайб-кодинга: нюансы</h3>"},{"t":"p","h":"У вайб-кодинга есть реальные преимущества:"},{"t":"list","tag":"ul","c":"ul","items":["<li><strong>Прототип за часы вместо недель.</strong> Прототип — пробная версия, которая показывает идею. Можно проверить, нужна ли она людям, до серьёзных вложений.</li>","<li><strong>Низкий порог входа</strong> для людей без инженерного образования.</li>","<li><strong>Быстрое освоение незнакомого.</strong> Языки, фреймворки и сервисы, на разбор которых раньше уходили недели.</li>","<li><strong>Освобождение от рутины:</strong> шаблоны, настройки, преобразование данных.</li>"]},{"t":"p","h":"Но у него есть системные ограничения:"},{"t":"list","tag":"ul","c":"ul","items":["<li><strong>Иллюзия готовности.</strong> Демонстрация работает, но ошибки, безопасность и необычные ситуации не продуманы.</li>","<li><strong>Непонятный код.</strong> Когда что-то ломается, автор не может починить то, чего не понимает.</li>","<li><strong>Уверенные ошибки.</strong> Модель не сомневается вслух там, где должна бы, и придумывает несуществующие функции (галлюцинации).</li>","<li><strong>Расползание структуры.</strong> Каждая новая просьба добавляет заплатку, и через месяц проект превращается в лоскутное одеяло, в котором никто не разберётся.</li>","<li><strong>Уязвимости.</strong> Уязвимость — слабое место, которым можно воспользоваться во вред. Сгенерированный код часто повторяет небезопасные шаблоны из обучающих данных.</li>","<li><strong>Потеря навыков.</strong> Кто никогда не разбирается в ошибках сам, постепенно теряет способность в них разбираться.</li>"]},{"t":"p","h":"Эти ограничения не приговор. Почти все они снимаются, когда проект перестаёт быть экспериментом и вы переходите от вайб-кодинга к разработке с помощью ИИ: вы начинаете понимать, проверять и контролировать. Остальная книга — о том, как сделать этот переход без профессионального образования."},{"t":"h3","id":"s13","h":"<h3>Итоги и дальнейшие шаги</h3>"},{"t":"p","h":"Вайб-кодинг — полезный режим для прототипов и экспериментов, но не единственный. Зрелая работа с ИИ — это три привычки:"},{"t":"list","tag":"ul","c":"ul","items":["<li>выбирать режим под цену ошибки;</li>","<li>передавать ИИ намерение (что, зачем, в каких рамках), а не только команды;</li>","<li>помнить, что за результат отвечаете вы.</li>"]},{"t":"lbl","h":"<div class=\"lbl\">Упражнения</div>"},{"t":"list","tag":"ul","c":"tasks","items":["<li><label><input type=\"checkbox\" data-task=\"t4\"><span>Вспомните свою работу с ИИ за последнюю неделю и определите, в каких режимах спектра вы были (автодополнение, чат, вайб-кодинг, разработка с помощью ИИ, делегирование). Для каждого случая запишите, какая была цена ошибки.</span></label></li>","<li><label><input type=\"checkbox\" data-task=\"t5\"><span>Возьмите один свой короткий запрос к ИИ и перепишите его: добавьте цель, контекст, ограничения и критерий успеха. Отправьте оба варианта и сравните результаты.</span></label></li>","<li><label><input type=\"checkbox\" data-task=\"t6\"><span>Запишите пять задач, которые вы чаще всего даёте ИИ. Позже вы используете этот список, чтобы сравнить модели и инструменты на своих реальных делах.</span></label></li>","<li><label><input type=\"checkbox\" data-task=\"t51\"><span>Откройте карточку и страницу модели, с которой работаете чаще всего. Выпишите шесть характеристик: окно, максимальный ответ, срез знаний, цену, уровни усилия, что модель понимает кроме текста. Найдите раздел об ограничениях.</span></label></li>","<li><label><input type=\"checkbox\" data-task=\"t52\"><span>Найдите свою модель на Artificial Analysis и на Arena. Совпадают ли её места в двух рейтингах? Объясните себе, почему они могут различаться.</span></label></li>","<li><label><input type=\"checkbox\" data-task=\"t53\"><span>Возьмите пять задач, которые вы выписали выше, превратите их в мини-набор и прогоните его на двух моделях. Запишите результаты в таблицу и решите, какую модель брать для каких задач.</span></label></li>"]},{"t":"ch","id":"ch2","head":"Глава 2 · Искусство составления запросов","h":"<header class=\"ch-open\"><div class=\"ch-kicker\">Глава</div><div class=\"ch-big\">2</div><h2>Искусство составления запросов: эффективный способ общения с ИИ</h2></header>"},{"t":"p","h":"Качество того, что вам вернёт ИИ, почти полностью определяется качеством контекста, который вы ему дали. <strong>Запрос</strong> (по-английски <em>промпт</em>) — это не магическое заклинание, а техническое задание для очень быстрого исполнителя, который ничего не знает о вашем проекте. Эта глава учит писать такие задания: понятно, конкретно и так, чтобы с первого раза получалось то, что вы хотели."},{"t":"p","h":"Хорошая новость для новичка: здесь вы на равных с программистом. Умение чётко объяснить, что нужно, не зависит от того, знаете ли вы языки программирования."},{"t":"h3","id":"s14","h":"<h3>Основы промпт-инжиниринга</h3>"},{"t":"p","h":"<strong>Промпт-инжиниринг</strong> — это просто умение хорошо формулировать запросы к ИИ. Полезная ментальная модель: представьте, что ИИ — очень сильный стажёр с полной потерей памяти. Он знает правила всех языков программирования и тысячи библиотек, но каждый новый диалог начинает с чистого листа. Всё, что нужно знать о вашем проекте, вы должны либо сказать, либо дать ему прочитать."},{"t":"p","h":"Контекст для модели складывается из нескольких слоёв, как слои одежды:"},{"t":"list","tag":"ol","c":"ol","items":["<li data-n=\"1\"><strong>Системные инструкции</strong> самого инструмента. Их задаёт разработчик агента, вы их обычно не видите.</li>","<li data-n=\"2\"><strong>Правила проекта</strong> — текстовый файл, который агент читает в начале каждой сессии. Он называется, например, <code>CLAUDE.md</code> или <code>AGENTS.md</code> и лежит в корне проекта (так называют его главную папку).</li>","<li data-n=\"3\"><strong>Файлы и результаты команд</strong>, которые агент прочитал сам или которые вы ему приложили.</li>","<li data-n=\"4\"><strong>История диалога</strong> — всё, что было сказано раньше.</li>","<li data-n=\"5\"><strong>Ваш текущий запрос.</strong></li>"]},{"t":"fig","n":"ch2_layers","cap":"Рис. 2.1 · что модель видит в момент ответа"},{"t":"p","h":"Как читать схему: слои лежат друг на друге, как страницы в папке. Ваш запрос — только верхний из них, а ответ строится по всей стопке. Всё, чего нет ни в одном слое, модель достраивает сама, и не всегда так, как вам нужно."},{"t":"p","h":"Хороший запрос содержит пять элементов. Их легко запомнить как «ЦКОКФ» (по первым буквам):"},{"t":"table","head":"<tr><th>Элемент</th><th>Вопрос, на который отвечает</th><th>Пример</th></tr>","rows":["<tr><td>Цель</td><td>Что и зачем нужно?</td><td>Добавить выгрузку отчёта в таблицу, чтобы бухгалтерия могла открыть её в Excel</td></tr>","<tr><td>Контекст</td><td>Где это живёт и что уже есть?</td><td>Отчёты в папке <code>src/reports/</code>, данные приходят из модуля <code>ReportService</code></td></tr>","<tr><td>Ограничения</td><td>Чего нельзя или что обязательно?</td><td>Без новых библиотек, файл должен нормально открываться в Excel с русским текстом</td></tr>","<tr><td>Критерий готовности</td><td>Как понять, что всё сделано?</td><td>Автоматическая проверка <code>export.test.ts</code> проходит, файл открывается без «кракозябр»</td></tr>","<tr><td>Формат ответа</td><td>В каком виде вернуть результат?</td><td>Показать список изменений и короткое объяснение простыми словами</td></tr>"],"cols":3},{"t":"fig","n":"ch2_ckokf","cap":"Рис. 2.2 · пять вопросов к хорошему запросу"},{"t":"p","h":"Как читать схему: перед отправкой запроса пройдите по пяти карточкам и ответьте на каждый вопрос. Если на какой-то ответа нет, добавьте его в запрос."},{"t":"p","h":"Не каждому запросу нужны все пять элементов. Чем дороже ошибка и чем больше задача, тем больше элементов стоит проговорить явно. Если вы просто спрашиваете, как называется функция, хватит одного предложения. Если вы просите изменить то, что уже работает у реальных людей, расписывайте подробнее."},{"t":"note","h":"<div class=\"note simple\"><span class=\"nl\">Простыми словами</span> Представьте, что вы нанимаете мастера сделать ремонт. Фраза «Сделай красиво» даст непредсказуемый результат. А «Покрась стены в спальне в светло-серый, не трогай мебель, закончи до пятницы, покажи мне образец цвета до начала работ» даст то, что вы хотели. ЦКОКФ — это те же вопросы к себе, прежде чем отправить запрос.</div>"},{"t":"note","h":"<div class=\"note tip\"><span class=\"nl\">Совет</span> Всё, что вы повторяете в каждом диалоге, вынесите в файл правил проекта: на чём написан проект, как его запускать и проверять, какой стиль кода, чего делать нельзя. Это самый дешёвый способ улучшить все будущие запросы. Если не знаете, как его написать, попросите ИИ составить файл правил по тому, что он видит в проекте, и затем сами отредактируйте.</div>"},{"t":"fig","n":"ch2_context_file","cap":"Рис. 2.3 · файл правил проекта"},{"t":"p","h":"Как читать схему: слева файл с правилами, посередине агент в новой сессии, справа результат. Один раз записанные правила агент читает сам при каждом запуске."},{"t":"p","h":"Создать такой файл проще всего командой <code>/init</code>: Claude Code сам изучит проект и напишет черновик <code>CLAUDE.md</code>, а вам останется прочитать его и поправить. Свежие версии Claude Code читают и <code>AGENTS.md</code>, если в проекте нет <code>CLAUDE.md</code>. Если вы работаете с несколькими агентами и нужны оба файла, добавьте первой строкой в <code>CLAUDE.md</code> строку <code>@AGENTS.md</code>: так Claude подтянет общие правила, а ниже можно добавить то, что нужно только ему."},{"t":"h3","id":"s15","h":"<h3>Конкретность и ясность: как формулировать запросы, которые работают</h3>"},{"t":"p","h":"Модель не может переспросить «а что вы имели в виду?», если вы сами не попросили её об этом. Расплывчатый запрос она дополнит самым средним решением из интернета, и чаще всего оно не подойдёт именно вам."},{"t":"p","h":"Пять правил конкретности:"},{"t":"list","tag":"ul","c":"ul","items":["<li><strong>Заменяйте оценки на проверяемые критерии.</strong> Не «сделай быстрее», а «страница должна открываться меньше чем за секунду, даже если в списке 10 000 записей».</li>","<li><strong>Называйте точные места.</strong> Имена файлов, функций, версии программ. Не «в форме входа», а «в файле <code>src/login.tsx</code>».</li>","<li><strong>Показывайте примеры входа и выхода.</strong> Один пример данных стоит абзаца описания: «Если на входе 100 рублей и 3 человека, на выходе должно быть 33,34, 33,33 и 33,33».</li>","<li><strong>Говорите, чего не делать.</strong> «Не меняй то, как программа общается с другими сервисами», «не трогай настройки базы данных».</li>","<li><strong>Одна задача — один запрос.</strong> Три несвязанные просьбы в одном сообщении дают три половинчатых решения.</li>"]},{"t":"p","h":"Хорошая проверка: представьте, что отдаёте запрос коллеге, который не знает вашего проекта. Если ему придётся задать уточняющие вопросы, то же самое придётся «спросить» модели, но она не спросит, а ответит наугад."},{"t":"h3","id":"s16","h":"<h3>Итеративное уточнение: цикл обратной связи с ИИ</h3>"},{"t":"p","h":"<strong>Итеративное</strong> значит «повторяющимися шагами». Первый ответ редко бывает финальным, и это нормально. Работа с ИИ — это цикл: вы просите, получаете результат, проверяете и уточняете. Важно, чтобы каждый виток добавлял новую информацию, а не повторял просьбу громче."},{"t":"p","h":"Хорошая обратная связь конкретна. Не «не работает», а «нажимаю «Сохранить», появляется белый экран, а в консоли такая ошибка: …» и текст ошибки целиком. Описание, что вы делали, что ожидали и что случилось, — лучшее, что можно дать модели. Если есть сообщение об ошибке, копируйте его целиком, не пересказывайте."},{"t":"p","h":"Три правила цикла:"},{"t":"list","tag":"ol","c":"ol","items":["<li data-n=\"1\"><strong>Правило двух попыток.</strong> Если после двух уточнений результат не приблизился к цели, меняйте подход: разбейте задачу на части, дайте пример, смените модель или попросите сначала объяснить, как ИИ понимает задачу.</li>","<li data-n=\"2\"><strong>Чистый контекст.</strong> Длинный диалог с десятком неудачных попыток засоряет контекст, и модель начинает повторять старые ошибки. Начните новую сессию (новый чат) и кратко напишите, что уже известно и что уже пробовали. В Claude Code для этого есть команды: <code>/clear</code> очищает контекст и начинает разговор заново, <code>/compact</code> сжимает длинную историю в краткую выжимку, а <code>/context</code> показывает, чем занят «рабочий стол» модели.</li>","<li data-n=\"3\"><strong>Закрепление.</strong> Удачное решение или найденную ловушку запишите в файл правил проекта, чтобы не открывать их заново.</li>"]},{"t":"fig","n":"2.1","cap":"Рис. 2.4 · цикл итеративного уточнения запроса"},{"t":"p","h":"Как читать схему: вы отправляете запрос, получаете результат и проверяете. Если всё хорошо, принимаете его. Если нет, уточняете запрос (даёте больше информации) или меняете подход, когда две попытки подряд не помогли."},{"t":"h3","id":"s17","h":"<h3>Сравнение двух запросов</h3>"},{"t":"p","h":"Разберём реальную задачу. В приложении есть страница со списком заказов. Заказов много, и страница открывается медленно. Нужно, чтобы заказы показывались порциями, как результаты поиска на нескольких страницах. Такое разбиение списка на страницы называют <strong>пагинацией</strong>."},{"t":"code","c":"prompt","label":"Запрос A","lines":["Добавь пагинацию в список заказов."]},{"t":"p","h":"На такой запрос модель, скорее всего, сделает пагинацию с номерами страниц. Она может заодно поменять формат ответа и сломать мобильное приложение. Она не узнает, что таблица заказов растёт на миллион строк в месяц, и что страницы с большими номерами будут открываться всё медленнее."},{"t":"code","c":"prompt","label":"Запрос B","lines":["В GET /api/orders (src/routes/orders.ts) добавь курсорную пагинацию.","Почему курсорная: таблица orders большая и растёт, OFFSET на поздних страницах медленный.","Курсор — непрозрачная строка на основе (created_at, id), сортировка по убыванию created_at.","Формат ответа: { items: Order[], nextCursor: string | null }.","Совместимость: без параметра cursor эндпоинт возвращает первые 50 записей, как сейчас, — мобильное приложение не сломается.","Добавь индекс в новой миграции, если его нет.","Напиши тесты: первая страница, последняя страница, пустой список, невалидный курсор → 400."]},{"t":"p","h":"Не пугайтесь терминов. Вот что на человеческом языке говорит запрос B:"},{"t":"list","tag":"ul","c":"ul","items":["<li><strong>Курсорная пагинация</strong> — вместо номера страницы приложение запоминает «закладку»: на каком заказе вы остановились. Так список остаётся быстрым, сколько бы заказов ни накопилось.</li>","<li><strong>Эндпоинт</strong> (<code>GET /api/orders</code>) — адрес, по которому приложение запрашивает заказы. Запрос просит поменять именно его.</li>","<li><strong>Совместимость</strong> — требование, что без новых параметров всё продолжает работать как раньше, чтобы не сломать мобильное приложение.</li>","<li><strong>Индекс</strong> и <strong>миграция</strong> — подготовка базы данных, чтобы поиск по ней был быстрым. Индекс похож на оглавление в книге, а миграция — аккуратный способ его добавить.</li>","<li><strong>Тесты</strong> — автоматические проверки, что всё работает: на первой странице, на последней, на пустом списке и при неверной «закладке».</li>"]},{"t":"p","h":"Запрос B длиннее, но он передаёт решения, которые иначе пришлось бы принимать модели: тип пагинации, формат ответа, обратную совместимость и критерии проверки. Результат почти не потребует переделок."},{"t":"fig","n":"ch2_ab","cap":"Рис. 2.5 · запрос A и запрос B"},{"t":"p","h":"Как читать схему: слева решения принимает модель, справа — вы. Короткий запрос A оставляет модели много развилок, и она выбирает наугад. В запросе B вы закрыли эти развилки заранее."},{"t":"p","h":"Если вы пока не знаете таких терминов, это не мешает написать хороший запрос. Вот тот же запрос языком новичка:"},{"t":"code","c":"prompt","label":"Запрос B без терминов","lines":["На странице «Заказы» все заказы загружаются сразу, и страница тормозит. Заказов много, и их становится всё больше.","Сделай так, чтобы заказы показывались порциями по 50 штук и следующие порции подгружались по кнопке «Показать ещё».","Не ломай мобильное приложение: оно получает заказы тем же способом, что и сайт, и должно продолжать работать как раньше.","Выбери самый быстрый способ для очень большого списка и объясни простыми словами, почему.","Проверь результат автоматическими тестами, потом расскажи, как мне самому убедиться, что всё работает."]},{"t":"p","h":"Обратите внимание, что в обоих хороших запросах нет ни строчки кода. Конкретность — это ясность решений и условий, а не диктовка реализации."},{"t":"h3","id":"s18","h":"<h3>Техники запросов: набор инструментов эффективного взаимодействия</h3>"},{"t":"p","h":"Ниже — техники, которые стабильно работают на всех современных моделях. Их полезно знать по названию, чтобы осознанно выбирать. Перед таблицей несколько слов, которые в ней встретятся: <strong>декомпозиция</strong> — разбиение большой задачи на мелкие, <strong>few-shot</strong> (от англ. «несколько попыток») — приём, когда вы показываете модели пару образцов того, что хотите получить."},{"t":"table","head":"<tr><th>Техника</th><th>Суть</th><th>Когда применять</th></tr>","rows":["<tr><td>Сначала план</td><td>Попросить план шагов до написания кода и согласовать его</td><td>Любая задача больше одного файла</td></tr>","<tr><td>Вопросы перед стартом</td><td>«Если чего-то не хватает, задай до 5 вопросов»</td><td>Расплывчатые требования</td></tr>","<tr><td>Примеры (few-shot)</td><td>Показать 1–3 образца желаемого результата</td><td>Нужен определённый стиль или формат</td></tr>","<tr><td>Тесты сначала</td><td>Сначала описать или написать проверки, потом код</td><td>Логика, где понятно, что на входе и что должно получиться</td></tr>","<tr><td>Декомпозиция</td><td>Разбить задачу на шаги и делать по одному</td><td>Большие функции, переносы данных</td></tr>","<tr><td>Ограничение формата</td><td>Задать точный вид ответа: список, таблица, короткое резюме</td><td>Ответ нужен в определённом виде или вы торопитесь</td></tr>","<tr><td>Самопроверка</td><td>«Перечисли необычные случаи и проверь, учтены ли они»</td><td>Перед финальной версией</td></tr>","<tr><td>Перспектива</td><td>«Посмотри на это как специалист по безопасности»</td><td>Проверка, поиск рисков</td></tr>","<tr><td>Объяснение перед изменением</td><td>«Сначала объясни причину ошибки, потом исправляй»</td><td>Поиск ошибок, когда важна причина, а не «заплатка»</td></tr>"],"cols":3},{"t":"p","h":"Пример техники «вопросы перед стартом»:"},{"t":"code","c":"prompt","label":"Запрос","lines":["Мне нужен скрипт, который раз в сутки выгружает новые заявки из CRM в Google Таблицу. Прежде чем писать код, задай мне до пяти вопросов, ответы на которые сильнее всего повлияют на решение."]},{"t":"p","h":"CRM — это программа для работы с клиентами (хранит контакты и сделки), а <strong>скрипт</strong> — небольшая программа для одной задачи. Модель спросит про доступ к CRM, формат таблицы, обработку повторяющихся заявок и место запуска. Вы ответите за две минуты и сэкономите несколько итераций."},{"t":"note","h":"<div class=\"note simple\"><span class=\"nl\">Простыми словами</span> Лучший приём для новичка — «вопросы перед стартом». Он превращает ИИ из исполнителя, который додумывает за вас, в собеседника, который выясняет, чего вы хотите. Когда не знаете, с чего начать, просто напишите: «Задай мне вопросы, чтобы понять, что мне нужно».</div>"},{"t":"fig","n":"ch2_questions_first","cap":"Рис. 2.6 · диалог с вопросами перед стартом"},{"t":"p","h":"Как читать схему: читайте диалог сверху вниз. Синие сообщения — ваши, белые — ответы ИИ. Прежде чем написать код, ИИ задаёт вопросы, и вы отвечаете на них, а не исправляете готовое."},{"t":"p","h":"В десктопном приложении Claude для этого есть отдельный режим — <strong>Plan</strong> («план»). В нём Claude только изучает проект и предлагает план, а файлы не трогает."},{"t":"fig","n":"dk_plan","cap":"Рис. 2.7 · режим Plan: сначала план, потом код"},{"t":"p","h":"Как читать схему: три шага идут слева направо. Сначала вы выбираете Plan, потом читаете план и поправляете его словами, и только затем переключаетесь на другой режим, чтобы Claude начал менять файлы. Так недоразумение находится ещё до того, как появился код."},{"t":"h3","id":"s19","h":"<h3>Продвинутый промпт-инжиниринг: сочетание техник и сложные случаи</h3>"},{"t":"p","h":"В реальной работе техники сочетаются. Самая надёжная связка для большого проекта — <strong>разработка от спецификации</strong>. Спецификация — это документ, в котором описано, что должна делать программа, но не как. Работа идёт в четыре шага:"},{"t":"list","tag":"ol","c":"ol","items":["<li data-n=\"1\"><strong>Спецификация.</strong> Попросите ИИ превратить вашу идею в короткий документ требований: цели, кто будет пользоваться, основные сценарии, требования к скорости, безопасности и удобству. Отредактируйте его сами: это ваша зона ответственности, и здесь вы разбираетесь лучше ИИ.</li>","<li data-n=\"2\"><strong>План.</strong> По спецификации попросите технический план: из каких частей состоит программа, где хранятся данные, в каком порядке делать, что может пойти не так.</li>","<li data-n=\"3\"><strong>Задачи.</strong> Разбейте план на небольшие задачи размером в один коммит, то есть одно сохранение, и для каждой запишите, как понять, что она готова.</li>","<li data-n=\"4\"><strong>Исполнение.</strong> Отдавайте задачи по одной и проверяйте каждую до перехода к следующей.</li>"]},{"t":"fig","n":"ch2_spec","cap":"Рис. 2.8 · разработка от спецификации"},{"t":"p","h":"Как читать схему: четыре шага идут по порядку: сначала описание того, что нужно, затем план, потом реализация и проверка. Главное в схеме: человек подтверждает спецификацию до того, как будет написана хоть одна строка кода."},{"t":"p","h":"Сложные случаи и что с ними делать:"},{"t":"list","tag":"ul","c":"ul","items":["<li><strong>Большой проект.</strong> Не пытайтесь «скормить» ИИ весь проект целиком. Укажите, с какого места начать, и попросите агента сначала изучить связанные файлы и пересказать, как устроена эта часть. Ошибку в понимании дешевле поймать до написания кода.</li>","<li><strong>Модель упорно делает не то.</strong> Обычно это признак противоречия в запросе или в правилах проекта. Перечитайте контекст свежим взглядом: часто там два несовместимых требования.</li>","<li><strong>Задача на грани возможностей модели.</strong> Уменьшайте шаг. Если модель не справляется с функцией целиком, попросите сначала описать, что она принимает и что возвращает, и написать проверки, а потом реализовать по частям.</li>","<li><strong>Запрос для агента, а не для чата.</strong> Агенту важнее критерии проверки и запреты, чем подробные инструкции. Скажите, какие команды запускать для проверки и что трогать нельзя.</li>"]},{"t":"note","h":"<div class=\"note warn\"><span class=\"nl\">Внимание</span> Никогда не вставляйте в запрос реальные пароли, ключи доступа и персональные данные клиентов. Всё, что попало в контекст, может оказаться в журналах инструмента.</div>"},{"t":"h3","id":"s20","h":"<h3>Итоги и дальнейшие шаги</h3>"},{"t":"p","h":"Запрос — это техническое задание: цель, контекст, ограничения, критерий готовности и формат ответа. Работа идёт циклами, и каждый цикл должен добавлять информацию. То, что вы повторяете из раза в раз, живёт в файле правил проекта, а не у вас в голове."},{"t":"lbl","h":"<div class=\"lbl\">Упражнения</div>"},{"t":"list","tag":"ul","c":"tasks","items":["<li><label><input type=\"checkbox\" data-task=\"t7\"><span>Попросите ИИ создать в вашем проекте файл правил (<code>CLAUDE.md</code> или <code>AGENTS.md</code>): на чём написан проект, как его запускать, три главных запрета. Прочитайте результат и поправьте то, что неверно.</span></label></li>","<li><label><input type=\"checkbox\" data-task=\"t8\"><span>Вспомните задачу, на которую ИИ дал плохой результат, и перепишите запрос по схеме ЦКОКФ: цель, контекст, ограничения, критерий готовности, формат ответа. Отправьте новый вариант и сравните.</span></label></li>","<li><label><input type=\"checkbox\" data-task=\"t9\"><span>Попробуйте приём «вопросы перед стартом» на следующей новой идее и запишите, сколько уточнений и переделок он вам сэкономил.</span></label></li>"]},{"t":"part","id":"p2","num":"II","title":"Практика работы с ИИ","h":"<div class=\"part-in\"><div class=\"pt-kicker\">Часть</div><div class=\"pt-num\">II</div><h2 class=\"pt-title\">Практика работы с ИИ</h2><ol class=\"pt-list\"><li><span>3</span>Проблема 70%: как работать с ИИ по-настоящему</li><li><span>4</span>За пределами 70%: максимальное раскрытие человеческого потенциала</li><li><span>5</span>Анализ сгенерированного кода: код-ревью, доработка, ответственность</li><li><span>6</span>Прототипирование с использованием ИИ: инструменты и техники</li><li><span>7</span>Создание веб-приложений с помощью ИИ</li></ol></div>"},{"t":"ch","id":"ch3","head":"Глава 3 · Проблема 70%","h":"<header class=\"ch-open\"><div class=\"ch-kicker\">Глава</div><div class=\"ch-big\">3</div><h2>Проблема 70%: как работать с ИИ по-настоящему</h2></header>"},{"t":"p","h":"Работа с ИИ почти всегда идёт по одному сценарию. Первые часы вы в восторге: на экране появляется работающее приложение. А потом оно «почти готово» неделями. ИИ доводит проект примерно до 70% готовности поразительно быстро, а оставшиеся 30% даются тяжелее, чем без него. В сообществе это явление называют <strong>проблемой 70%</strong>. Понять её природу — значит понять, где ИИ даёт настоящий выигрыш, а где создаёт иллюзию прогресса."},{"t":"p","h":"Эта глава самая важная для новичка. Она объясняет, почему красивая демонстрация ещё не продукт, и даёт десять правил, которые помогают дойти до конца."},{"t":"p","h":"Что входит в первые 70%? Это то, чего в интернете и в обучающих данных ИИ очень много: типовые экраны, <strong>CRUD-операции</strong> (четыре стандартных действия с данными: создать, прочитать, изменить, удалить), стандартный вход по паролю, вёрстка по описанию. Последние 30% — то, что уникально для вашего проекта: странные необычные ситуации, связь с конкретными сервисами, требования безопасности, скорость работы при настоящей нагрузке, когда пользователей много."},{"t":"note","h":"<div class=\"note simple\"><span class=\"nl\">Простыми словами</span> Представьте строительство дома. Коробка с крышей вырастает за несколько недель, и со стороны дом выглядит готовым. Но в нём ещё нет проводки, отопления, вентиляции и отделки, а именно они делают дом пригодным для жизни. С программами то же самое: ИИ быстро строит «коробку», а проводку и отопление приходится доделывать вам.</div>"},{"t":"fig","n":"3.1","cap":"Рис. 3.1 · концептуальная схема, не измерение"},{"t":"p","h":"Как читать схему: она показывает форму явления, а не реальные данные. Демонстрация, которую можно показать другим, появляется рано, а основная часть усилий уходит на невидимые последние 30%."},{"t":"p","h":"У проблемы 70% есть три узнаваемых симптома."},{"t":"list","tag":"ul","c":"ul","items":["<li><strong>Эффект «шаг вперёд — два назад».</strong> Вы просите исправить ошибку, ИИ исправляет её и ломает две другие. Вы просите исправить их, и ломается третья. Если вы не понимаете, что происходит в коде, этот цикл может не закончиться. Признак: вы уже не помните, что работало час назад.</li>","<li><strong>Парадокс знаний.</strong> ИИ больше помогает опытным разработчикам, чем новичкам. Опытный знает, что проверить, и замечает неверное решение за секунды. Новичок принимает его как есть. Хорошая новость: проверять можно учиться, и эта книга как раз об этом.</li>","<li><strong>Скрытые 30%.</strong> Демонстрация выглядит готовой, но в ней нет обработки ошибок, журналов работы, защиты от перегрузки, аккуратных изменений в базе данных и резервных копий. Эти работы невидимы, пока не понадобятся, а потом срочно нужны все сразу.</li>"]},{"t":"p","h":"Что обычно входит в последние 30%. В таблице несколько новых слов, мы разберём их ниже, а сейчас главное: это список вопросов, которые стоит задать своему проекту."},{"t":"table","head":"<tr><th>Область</th><th>Что ИИ часто упускает</th><th>Чем это грозит</th></tr>","rows":["<tr><td>Обработка ошибок</td><td>Что делать, если пропал интернет, сторонний сервис вернул ошибку 500 («внутренняя ошибка сервера») или файл оказался пустым</td><td>Приложение падает у пользователя</td></tr>","<tr><td>Необычные случаи</td><td>Пустые списки, русские и иностранные буквы, часовые пояса, два человека, одновременно нажавшие «Купить»</td><td>Данные тихо портятся</td></tr>","<tr><td>Безопасность</td><td>Проверка прав доступа, проверка того, что вводит пользователь, пароли и ключи, оставленные прямо в коде</td><td>Утечки данных и взломы</td></tr>","<tr><td>Скорость</td><td>Приложение делает сотни одинаковых запросов к базе вместо одного, ищет без индексов, грузит всё в память</td><td>Страницы тормозят, когда пользователей становится много</td></tr>","<tr><td>Связь с другими сервисами</td><td>Реальные правила чужого сервиса вместо придуманных ИИ</td><td>Всё ломается на стыке систем</td></tr>","<tr><td>Эксплуатация</td><td>Журналы работы, показатели здоровья приложения, оповещения о сбоях, возможность откатиться</td><td>Невозможно понять, что сломалось и как вернуть, как было</td></tr>","<tr><td>Поддерживаемость</td><td>Единые правила в проекте, отсутствие дублирования</td><td>Каждая следующая правка дороже предыдущей</td></tr>"],"cols":3},{"t":"p","h":"Расшифруем самое незнакомое. <strong>Эксплуатация</strong> — всё, что нужно, чтобы приложение жило после запуска: наблюдать за ним, чинить, обновлять. <strong>Журнал</strong> (лог) — запись того, что делала программа, по ней ищут причину сбоя. <strong>Откат</strong> — возврат к предыдущей рабочей версии, если новая сломалась. <strong>Поддерживаемость</strong> — насколько легко проект чинить и развивать через полгода, когда вы уже забыли, как он устроен."},{"t":"fig","n":"ch3_iceberg","cap":"Рис. 3.2 · айсберг готовности"},{"t":"p","h":"Как читать схему: над линией воды — то, что видно в демонстрации и создаёт ощущение «почти готово». Под водой — то, что зависит от вашего проекта и не бросается в глаза: ошибки, необычные случаи, безопасность, нагрузка. Именно эта подводная часть и есть последние 30%."},{"t":"h3","id":"s21","h":"<h3>Как разработчики используют ИИ на самом деле</h3>"},{"t":"p","h":"Массовое использование ИИ сочетается с осторожным отношением к нему. По <a href=\"https://stackoverflow.blog/2026/10/06/the-results-of-the-2026-developer-survey-are-here/\" rel=\"noopener\" target=\"_blank\">опросу Stack Overflow 2026 года</a> (около 30 000 разработчиков из 169 стран) ИИ-ассистентами и агентами пользуются 66% разработчиков, и большинство из них (73%) — каждый день. Среди агентов чаще всего называют Claude Code (66%) и GitHub Copilot (59%). Но доверяют ему с оговорками: 48% верят ответам ИИ, только когда могут легко их проверить, и лишь около 7% готовы доверить ему важные решения. (Stack Overflow — крупнейший сайт вопросов и ответов для программистов.)"},{"t":"p","h":"Эти цифры не противоречат друг другу. Разработчики пользуются ИИ потому, что он ускоряет, и не доверяют ему потому, что он ошибается уверенно. Выигрывают те, кто встроил проверку в сам процесс. Для вас это означает: сомневаться в результате ИИ — не признак неопытности, а нормальная профессиональная привычка."},{"t":"p","h":"На практике использование ИИ укладывается в два больших паттерна (то есть устойчивых способа работы)."},{"t":"p","h":"<strong>Запуск с нуля</strong> (по-английски <em>bootstrap</em>). Человек берёт идею, макет или набросок и получает от ИИ рабочий прототип за часы. Так работают конструкторы приложений и вайб-кодинг. Сильная сторона — скорость проверки идей. Слабая — прототип часто приходится переписывать, чтобы превратить его в продукт."},{"t":"p","h":"<strong>Итерации в существующем проекте.</strong> Итерация — это один повторяемый шаг работы. Разработчик использует ИИ каждый день в знакомом проекте: подсказки при наборе, тесты, наведение порядка в коде, объяснение чужого кода, изменение базы данных. Выигрыш в процентах меньше, но накапливается и почти не создаёт долга, потому что каждое изменение проходит проверку человеком."},{"t":"p","h":"Типичный день опытного разработчика с ИИ выглядит так:"},{"t":"list","tag":"ol","c":"ol","items":["<li data-n=\"1\">Утром он просит агента пересказать изменения коллег за вчера и найти те, которые касаются его задачи.</li>","<li data-n=\"2\">Перед задачей обсуждает с ИИ план и риски, но решение о подходе принимает сам.</li>","<li data-n=\"3\">Во время работы отдаёт ИИ рутинные куски: тесты, описание типов данных, обработку ошибок по образцу.</li>","<li data-n=\"4\">Перед тем как отдать работу коллегам на проверку, просит ИИ найти в своих изменениях необычные случаи и уязвимости.</li>","<li data-n=\"5\">В фоне поручает агенту механическую задачу: обновить сторонние библиотеки или перевести модуль на новую версию чужого сервиса.</li>"]},{"t":"fig","n":"ch3_diff_read","cap":"Рис. 3.3 · как читать дифф"},{"t":"p","h":"Как читать схему: дифф — это показ того, что изменилось. Красная строка со знаком минус удалена, зелёная со знаком плюс добавлена, серые не менялись."},{"t":"p","h":"В десктопном приложении дифф не нужно искать: он открывается по нажатию на значок со строками «+» и «−» под ответом Claude."},{"t":"fig","n":"dk_changes","cap":"Рис. 3.4 · окно изменений: файлы, дифф и комментарии"},{"t":"p","h":"Как читать схему: слева файлы, которые тронул Claude, справа красные и зелёные строки выбранного файла. Комментарий к строке — лучший способ сказать, что вам не нравится: Claude видит, к какому именно месту относится замечание."},{"t":"p","h":"Вам не нужно повторять этот день, но стоит запомнить его принцип: <strong>ИИ делает рутину и подсказывает, а решения и проверка остаются у человека.</strong>"},{"t":"note","h":"<div class=\"note tip\"><span class=\"nl\">Совет</span> Начинающий может перенять из этого дня два приёма. Первый: в начале сессии попросите агента пересказать, что в проекте уже сделано. Второй: перед тем как считать работу законченной, попросите ИИ найти в ней слабые места: «Что в моём приложении может сломаться при необычных данных? Составь список».</div>"},{"t":"h3","id":"s22","h":"<h3>Золотые правила вайб-кодинга</h3>"},{"t":"p","h":"Эти правила выросли из множества проектов, которые застряли на 70%, и из тех, что успешно дошли до продакшена, то есть до работы у настоящих пользователей. Ниже каждое правило с объяснением и конкретным действием."},{"t":"list","tag":"ol","c":"ol","items":["<li data-n=\"1\"><strong>Понимай всё, что принимаешь.</strong> Если не можешь объяснить фрагмент коллеге, не добавляй его в основную версию проекта. Попросите ИИ объяснить или упростить. Действие: спросите «Объясни это простыми словами, как будто я не программист. Что здесь может пойти не так?»</li>","<li data-n=\"2\"><strong>Маленькие шаги.</strong> Одна задача — один проверяемый результат — один коммит (сохранение в истории проекта). Большие пакеты изменений невозможно нормально проверить. Действие: не пишите «сделай весь сайт», а делайте по одному экрану или одной функции.</li>","<li data-n=\"3\"><strong>Сохраняйся перед каждым экспериментом.</strong> Git — ваша страховка, как сохранение в игре. Если ИИ ушёл не туда, вернуться должно быть дешевле, чем чинить. Действие: перед крупной просьбой скажите «Сначала сделай коммит с текущей рабочей версией».</li>","<li data-n=\"4\"><strong>Сначала способ проверки.</strong> Без него вы не знаете, работает ли код, вы только надеетесь. Действие: до начала работы запишите словами, как поймёте, что всё получилось («Я нажимаю „Сохранить“, и запись появляется в списке»), а ещё лучше попросите ИИ написать на это тест.</li>","<li data-n=\"5\"><strong>Не принимайте заплатку вместо причины.</strong> Если ИИ «исправил» ошибку, спрятав её (например, обернул в конструкцию <code>try/catch</code>, которая просто молча проглатывает сбой, или отключил проверку), это не исправление. Действие: спросите «В чём была причина ошибки? Покажи, что именно ты изменил, чтобы устранить причину, а не симптом».</li>","<li data-n=\"6\"><strong>Две неудачные попытки — меняйте подход.</strong> Повторение одной и той же просьбы почти никогда не помогает. Действие: разбейте задачу, приведите пример или начните новый чат с кратким описанием ситуации.</li>","<li data-n=\"7\"><strong>Устройство проекта решает человек.</strong> ИИ может предложить варианты, но выбор структуры данных, разделения на части и подключаемых библиотек — ваша ответственность. Действие: просите «Предложи два-три варианта и объясни плюсы и минусы простыми словами», а выбирайте сами.</li>","<li data-n=\"8\"><strong>Секреты никогда не попадают в запрос и в код.</strong> Секреты (ключи, пароли) хранятся в <strong>переменных окружения</strong> (особых настройках, которые лежат вне кода) и в специальных хранилищах секретов. Действие: если ключ случайно попал в чат или в репозиторий, считайте его скомпрометированным и замените на новый.</li>","<li data-n=\"9\"><strong>Смотри на изменения, а не только на результат.</strong> Агент мог по дороге удалить проверку, поменять настройки или добавить новую библиотеку. Действие: после каждой задачи просите «Перечисли простыми словами все файлы, которые ты изменил, и зачем».</li>","<li data-n=\"10\"><strong>Прототип — не продукт.</strong> Перед выходом к настоящим пользователям пройдите чек-лист последних 30% из таблицы выше: ошибки, безопасность, скорость, эксплуатация.</li>"]},{"t":"fig","n":"ch3_step","cap":"Рис. 3.5 · один безопасный шаг"},{"t":"p","h":"Как читать схему: читайте цепочку слева направо: сохранить рабочую версию, сделать один небольшой шаг, проверить. Если проверка не пройдена, вы возвращаетесь к последнему рабочему состоянию и ничего не теряете."},{"t":"p","h":"В десктопном приложении «маленькие шаги» поддерживает <strong>режим разрешений</strong>. Он определяет, когда Claude спрашивает вас, а когда действует сам. Вот как выглядит самый осторожный из них."},{"t":"fig","n":"dk_manual","cap":"Рис. 3.6 · режим Manual: принять или отклонить"},{"t":"p","h":"Как читать схему: Claude показывает, что хочет изменить или запустить, а вы решаете. Красная строка будет удалена, зелёная добавится. Пока вы не нажали «Принять», файл не меняется."},{"t":"fig","n":"dk_modes","cap":"Рис. 3.7 · пять режимов разрешений"},{"t":"p","h":"Как читать схему: режимы идут от самого осторожного к самому свободному. Новичку лучше начинать с Manual, а большие задачи начинать в Plan. Чем ниже режим, тем меньше вопросов и тем выше риск, что ошибку вы заметите поздно."},{"t":"note","h":"<div class=\"note warn\"><span class=\"nl\">Внимание</span> Режимы Auto и Bypass permissions оставляют вас почти без проверки. Не включайте их на проекте, в котором нет сохранённой версии (коммита): откатиться будет не к чему. Учтите: в терминальной версии Claude Code с августа 2026 года новая сессия по умолчанию стартует в режиме Auto. Если вы только начинаете, переключитесь на Manual: в терминале режимы перебираются клавишами Shift + Tab.</div>"},{"t":"fig","n":"ch3_rollback","cap":"Рис. 3.8 · откат к рабочей версии"},{"t":"p","h":"Как читать схему: в терминале сначала смотрим историю сохранений, затем отменяем неудачное изменение. Отмена записывается как новое сохранение, поэтому ничего не пропадает."},{"t":"p","h":"Внутри сессии Claude Code есть способ проще — <strong>контрольные точки</strong> (<em>checkpoints</em>). Перед каждым вашим запросом Claude запоминает состояние файлов. Команда <code>/rewind</code> или двойное нажатие Esc в пустом поле ввода открывает список этих точек: можно вернуть код, беседу или и то и другое."},{"t":"note","h":"<div class=\"note warn\"><span class=\"nl\">Внимание</span> Контрольные точки не заменяют коммиты. Они откатывают только правки, которые Claude сделал в файлах, и не отменяют того, что произошло снаружи: команд в терминале, изменений в базе данных, выкладки сайта. Перед рискованным шагом сохраняйтесь коммитом.</div>"},{"t":"note","h":"<div class=\"note warn\"><span class=\"nl\">Внимание</span> Самая опасная фраза в работе с ИИ — «вроде работает». Она означает, что вы проверили один счастливый сценарий из десятков возможных. Прежде чем так сказать, проверьте хотя бы три: обычный случай, пустой ввод и странный ввод (очень длинный текст, символы вроде <code><</code> и <code>&</code>, ошибка при отключённом интернете).</div>"},{"t":"fig","n":"ch3_three","cap":"Рис. 3.9 · три проверки перед «вроде работает»"},{"t":"p","h":"Как читать схему: три карточки — три разных вопроса. Работает ли главный сценарий, что будет при необычных данных и не сломалось ли то, что работало раньше. Пока вы не ответили хотя бы на эти три, фразу «вроде работает» лучше не произносить."},{"t":"fig","n":"ch3_test_run","cap":"Рис. 3.10 · тесты: зелёное или красное"},{"t":"p","h":"Как читать схему: слева все проверки прошли, справа одна не прошла. Красная строка называет, что именно сломалось. Скопируйте её и покажите ИИ."},{"t":"note","h":"<div class=\"note simple\"><span class=\"nl\">Простыми словами</span> Золотые правила — это ремни безопасности в машине. Пока едете ровно, кажется, что они лишние. Они нужны в одну секунду, когда что-то идёт не так, и тогда разница оказывается огромной.</div>"},{"t":"h3","id":"s23","h":"<h3>Итоги и дальнейшие шаги</h3>"},{"t":"p","h":"ИИ сокращает путь до первых 70%, но не отменяет последние 30%. Разница между застрявшим проектом и успешным — в дисциплине: маленькие шаги, проверка, понимание каждого изменения и явная работа над невидимыми частями системы."},{"t":"lbl","h":"<div class=\"lbl\">Упражнения</div>"},{"t":"list","tag":"ul","c":"tasks","items":["<li><label><input type=\"checkbox\" data-task=\"t10\"><span>Возьмите любой свой прототип (или попросите ИИ собрать небольшой) и пройдитесь по таблице последних 30%. Для каждой строки спросите ИИ: «Что из этого в моём проекте не сделано?» Выпишите три самых важных пробела.</span></label></li>","<li><label><input type=\"checkbox\" data-task=\"t11\"><span>Выберите два золотых правила, которые вы нарушаете чаще всего, и напишите их на стикере рядом с монитором.</span></label></li>","<li><label><input type=\"checkbox\" data-task=\"t12\"><span>В следующий раз, когда ИИ «исправит» ошибку, спросите: «В чём была первопричина?» — и проверьте, совпадает ли ответ с самим исправлением.</span></label></li>","<li><label><input type=\"checkbox\" data-task=\"t13\"><span>Проверьте свой проект на «вроде работает»: введите пустое значение, очень длинный текст и отключите интернет. Запишите, что произошло.</span></label></li>"]},{"t":"ch","id":"ch4","head":"Глава 4 · За пределами 70%","h":"<header class=\"ch-open\"><div class=\"ch-kicker\">Глава</div><div class=\"ch-big\">4</div><h2>За пределами 70%: максимальное раскрытие человеческого потенциала</h2></header>"},{"t":"p","h":"ИИ — усилитель: он умножает то, что у вас уже есть. Сильный специалист с ИИ становится ещё сильнее, а слабые места без ИИ малозаметны, но с ним становятся очевидными. Эта глава о том, во что стоит вкладываться, чтобы ИИ не заменял вас, а работал на вас: это суждение, понимание контекста, вкус и ответственность."},{"t":"p","h":"В разработке принято делить людей по уровням: <strong>junior</strong> (младший, начинающий), <strong>middle</strong> (средний, уже самостоятельный) и <strong>senior</strong> (старший, с большим опытом). Заголовки разделов ниже названы по этим уровням, потому что так их используют в отрасли. Если вы только начинаете и не программист, ваши главные разделы — «Младшие разработчики» и «Развивайте навыки работы с запросами». Но и остальное полезно прочитать: так вы поймёте, куда расти, и как думают люди, с которыми вам, возможно, придётся работать."},{"t":"p","h":"Универсальный инструмент для решения «делать самому или отдать ИИ» — две оси. Первая: насколько дорого обойдётся ошибка. Вторая: насколько легко проверить результат. Чем дешевле ошибка и проще проверка, тем смелее можно делегировать, то есть передавать работу ИИ."},{"t":"note","h":"<div class=\"note simple\"><span class=\"nl\">Простыми словами</span> Попросить ИИ придумать название для блога — безопасно: плохой вариант видно сразу, и ничего не потеряно. Попросить ИИ самому изменить способ хранения паролей — опасно: ошибку трудно заметить, а цена огромна. Первое можно делегировать с лёгким сердцем, второе — только под вашим пристальным надзором или вообще не доверять.</div>"},{"t":"fig","n":"4.1","cap":"Рис. 4.1 · матрица делегирования: цена ошибки × лёгкость проверки"},{"t":"p","h":"Как читать схему: по вертикали отложена цена ошибки, по горизонтали — лёгкость проверки результата. Задачи из правого нижнего угла (ошибка дёшева, проверить легко) можно смело отдавать агентам. Решения из левого верхнего угла (ошибка дорога, проверить трудно) отдавать нельзя: там ИИ помогает думать, но не решает."},{"t":"h3","id":"s24","h":"<h3>Senior-программисты и разработчики: расширяйте свой опыт работы с ИИ</h3>"},{"t":"p","h":"Для опытного разработчика ИИ меняет основную работу: меньше набора кода, больше проектирования, редактуры и управления исполнителями. Многие старшие инженеры уже работают как руководители небольшой команды агентов."},{"t":"p","h":"Что стоит развивать старшему разработчику:"},{"t":"list","tag":"ul","c":"ul","items":["<li><strong>Проектирование границ.</strong> Чёткое разделение проекта на модули (самостоятельные части) с понятными соглашениями о том, как они общаются, — то, что позволяет ИИ работать надёжно. В запутанной системе ИИ путается так же, как человек.</li>","<li><strong>Спецификации как продукт.</strong> Умение за 20 минут написать короткое и точное техническое задание (ТЗ) теперь окупается многократно: его исполняет не один человек за неделю, а агент за час.</li>","<li><strong>Системное ревью.</strong> Проверять не только отдельные строки, но и последствия: как изменение влияет на данные, нагрузку, безопасность и соседние сервисы.</li>","<li><strong>Курирование контекста.</strong> Документация, файлы правил, описания архитектурных решений теперь читаются не только людьми, но и агентами. Хорошая документация стала частью инфраструктуры, то есть основы, на которой всё держится.</li>","<li><strong>Параллельная работа.</strong> Поручить агентам две-три независимые задачи в фоне, пока сам решаешь сложную, — новый способ умножить производительность.</li>"]},{"t":"p","h":"Отдельная ответственность старшего специалиста — правила для команды. Какие задачи можно отдавать агентам, как помечать изменения, сделанные ИИ, что обязательно проходит ручную проверку. Без этих правил каждый в команде изобретает свой процесс, и качество становится лотереей."},{"t":"p","h":"Что из этого полезно вам, даже если вы работаете один. Вы тоже «команда»: вы сами и ваши агенты. Заведите такие же правила для себя: что я никогда не отдаю ИИ без проверки (деньги, пароли, личные данные пользователей), что отдаю свободно (тексты, оформление) и как я проверяю итог."},{"t":"note","h":"<div class=\"note tip\"><span class=\"nl\">Совет</span> Ведите в проекте список проверенных запросов для типовых задач: добавить страницу, изменить базу данных, сделать новый блок интерфейса. Это быстрее любого обучения и выравнивает качество, даже если вы единственный участник проекта.</div>"},{"t":"h3","id":"s25","h":"<h3>Middle-разработчики: адаптируйтесь и специализируйтесь</h3>"},{"t":"p","h":"ИИ сильнее всего давит на середину: типовые задачи среднего уровня — формы, адреса для запросов между частями программы (эндпоинты), подключения к чужим сервисам по документации — он делает быстро. Значит, ценность разработчика среднего уровня смещается к тому, что требует глубины или широкого контекста."},{"t":"p","h":"Для вас этот раздел полезен как карта: он показывает, какие направления будут востребованы и, значит, куда полезно углубляться. Вот они, с расшифровкой незнакомых слов под таблицей."},{"t":"table","head":"<tr><th>Направление</th><th>Почему растёт</th><th>С чего начать</th></tr>","rows":["<tr><td>Безопасность приложений</td><td>ИИ генерирует больше кода, а значит, и больше уязвимостей</td><td>Список OWASP Top 10, практика проверки кода от ИИ</td></tr>","<tr><td>Скорость и надёжность</td><td>Последние 30% всегда упираются в нагрузку и сбои</td><td>Поиск медленных мест (профилирование), базы данных, наблюдение за приложением</td></tr>","<tr><td>Связывание систем</td><td>Реальные API и старые системы плохо представлены в данных модели</td><td>Договорённости между системами, очереди, защита от дублей</td></tr>","<tr><td>Платформа и инструменты разработки</td><td>Кто-то должен настроить агентов, автоматические проверки и правила для всей команды</td><td>CI/CD, внутренние инструменты, MCP-серверы</td></tr>","<tr><td>ИИ-инженерия</td><td>Продуктам нужны функции на основе больших языковых моделей</td><td>Оценка качества ответов (evals), RAG, циклы агентов</td></tr>","<tr><td>Глубина в предметной области</td><td>Модель не знает специфику финансов, медицины, логистики</td><td>Изучать предметную область вместе с бизнесом</td></tr>"],"cols":3},{"t":"p","h":"Расшифровка слов из таблицы:"},{"t":"list","tag":"ul","c":"ul","items":["<li><strong>OWASP Top 10</strong> — известный список десяти самых распространённых видов уязвимостей в приложениях, который составляет открытое сообщество безопасности.</li>","<li><strong>Профилирование</strong> — измерение, какие части программы работают медленнее всего. <strong>Наблюдение</strong> (наблюдаемость) — набор способов видеть изнутри, как себя чувствует работающее приложение: журналы, графики, оповещения.</li>","<li><strong>Легаси</strong> — старые системы, которые давно работают и которые трудно менять.</li>","<li><strong>Очереди</strong> — способ передавать работу между частями системы по порядку, как очередь в кассу. <strong>Защита от дублей</strong> (идемпотентность) — гарантия, что повторная отправка одного и того же действия, например оплаты, не приведёт к двойному списанию.</li>","<li><strong>CI/CD</strong> — автоматическая цепочка: изменения проверяются (CI) и затем автоматически выкладываются (CD). <strong>MCP-серверы</strong> — подключаемые к агенту внешние возможности (подробнее в главе 1).</li>","<li><strong>Evals</strong> — наборы примеров, на которых проверяют, правильно ли ИИ отвечает. <strong>RAG</strong> — приём, при котором ИИ сначала находит нужные документы в отдельной базе, а потом отвечает на их основе, а не только по памяти.</li>","<li><strong>Предметная область</strong> (домен) — сфера, для которой вы делаете программу: бухгалтерия, медицина, доставка.</li>"]},{"t":"p","h":"Хорошая стратегия — <strong>T-образный профиль</strong>: широкая база по многим темам (горизонтальная перекладина буквы Т) и одна-две области глубокой экспертизы (вертикальная ножка). ИИ закрывает ширину, человек отвечает за глубину. Для новичка отличная вертикаль — предметная область, которую вы знаете лучше всех: именно вы можете сказать, что приложение делает не то."},{"t":"fig","n":"ch4_T","cap":"Рис. 4.2 · Т-образный профиль"},{"t":"p","h":"Как читать схему: горизонтальная перекладина буквы Т — ширина, то есть знание многих тем на базовом уровне, и здесь вам помогает ИИ. Вертикальная ножка — глубина в одной-двух областях, и её строите вы сами."},{"t":"h3","id":"s26","h":"<h3>Младшие разработчики: двигайтесь к успеху вместе с ИИ</h3>"},{"t":"p","h":"Для начинающего ИИ — одновременно лучший репетитор в истории и главный риск. Риск в том, чтобы научиться получать работающий код, не научившись понимать его. Такой человек беспомощен, как только ИИ ошибается, а ошибается он регулярно. Если вы только входите в вайб-кодинг, этот раздел написан именно для вас."},{"t":"p","h":"Правила для начинающих:"},{"t":"list","tag":"ol","c":"ol","items":["<li data-n=\"1\"><strong>Сначала попробуйте сами.</strong> Пятнадцать минут собственной попытки перед обращением к ИИ формируют понимание, которое не даст ни один ответ.</li>","<li data-n=\"2\"><strong>Просите объяснить, а не решить.</strong> Используйте ИИ как наставника, который задаёт наводящие вопросы.</li>","<li data-n=\"3\"><strong>Разбирайтесь в ошибках сами.</strong> Учитесь читать сообщения об ошибках, смотреть в журналы работы программы и пользоваться <strong>отладчиком</strong> (инструментом, который позволяет пройти по программе шаг за шагом и увидеть, что в ней происходит). Если пока это слишком сложно, начните с чтения сообщения об ошибке и попытки пересказать его своими словами. Эти навыки нельзя отдать ИИ целиком.</li>","<li data-n=\"4\"><strong>Пересказывайте сгенерированное.</strong> Если вы не можете объяснить логику своими словами без подсказки, вы её не поняли. Не обязательно переписывать код, достаточно рассказать, что он делает, шаг за шагом.</li>","<li data-n=\"5\"><strong>Учитесь проверять.</strong> Автоматические проверки (тесты) — способ контролировать ИИ, и этот навык ценится всё выше.</li>","<li data-n=\"6\"><strong>Собирайте портфолио с объяснениями.</strong> Работодатель или клиент ценит не количество проектов, а умение объяснить, почему решение именно такое.</li>"]},{"t":"p","h":"Пример запроса в режиме наставника:"},{"t":"code","c":"prompt","label":"Запрос","lines":["Я учусь. Не пиши за меня решение. Вот моя функция и ошибка, которую она выдаёт. Задавай мне по одному наводящему вопросу, пока я сам не найду причину. Если я застрял три раза подряд, дай подсказку, но не готовый код."]},{"t":"p","h":"Функция — это небольшой именованный кусок программы, который выполняет одно действие. Вы можете вставить в запрос любой фрагмент, который вам непонятен, и ИИ будет учить вас, а не работать вместо вас."},{"t":"p","h":"Такой режим медленнее в моменте, но через полгода отделяет человека, который понимает свой проект, от оператора чата, который надеется на удачу."},{"t":"fig","n":"ch4_mentor","cap":"Рис. 4.3 · режим наставника"},{"t":"p","h":"Как читать схему: цикл идёт по кругу: вы пробуете, спрашиваете, получаете наводящий вопрос и отвечаете своими словами. Пунктирная стрелка показывает возврат к следующему вопросу. Готового решения в этом цикле нет, зато есть понимание."},{"t":"fig","n":"ch4_mentor_chat","cap":"Рис. 4.4 · диалог в режиме наставника"},{"t":"p","h":"Как читать схему: в диалоге нет готового кода: ИИ задаёт короткие вопросы, а вы отвечаете сами. Читайте сверху вниз, цифры показывают порядок реплик."},{"t":"p","h":"В десктопном приложении для таких вопросов есть <strong>побочный чат</strong> (side chat). Вы спрашиваете «что это значит?», не прерывая основную работу."},{"t":"fig","n":"dk_side","cap":"Рис. 4.5 · побочный вопрос и основная работа"},{"t":"p","h":"Как читать схему: слева Claude продолжает основную задачу, справа открыт маленький чат. Ответ в нём учитывает ваш проект, но в основной диалог не попадает. Спрашивайте сколько угодно: история задачи останется чистой."},{"t":"h3","id":"s27","h":"<h3>Развивайте навыки работы с запросами и инструментами (осознанно)</h3>"},{"t":"p","h":"Навык работы с ИИ растёт не от количества запросов, а от осознанной практики: попытка, разбор, вывод. Тот, кто просто пользуется ИИ каждый день, улучшается медленно. Тот, кто разбирает свои неудачи, — быстро."},{"t":"p","h":"Практики осознанного роста:"},{"t":"list","tag":"ul","c":"ul","items":["<li><strong>Журнал запросов.</strong> Записывайте запросы, которые сработали особенно хорошо или плохо, и причину. Это может быть простой текстовый файл или заметки в телефоне.</li>","<li><strong>Еженедельный разбор</strong> (в профессиональной среде это называют ретроспективой). Где ИИ сэкономил время, где потратил? Какую задачу стоило сделать самому?</li>","<li><strong>Эксперименты.</strong> Одну и ту же задачу решите двумя способами: с подробным запросом и с разбивкой на шаги. Сравните результаты.</li>","<li><strong>Несколько инструментов.</strong> Не привязывайтесь к одному продукту: принципы переносятся, интерфейсы — нет.</li>"]},{"t":"fig","n":"ch4_growth","cap":"Рис. 4.6 · осознанная практика и просто использование"},{"t":"p","h":"Как читать схему: две линии показывают, как растёт навык. Та, где вы разбираете ошибки и записываете выводы, идёт круче, чем та, где вы просто пользуетесь ИИ каждый день. Схема иллюстрирует идею, а не измерение."},{"t":"fig","n":"ch4_prompt_journal","cap":"Рис. 4.7 · журнал запросов"},{"t":"p","h":"Как читать схему: каждая строка — один запрос: что просили, что получилось и какой вывод вы сделали. Раз в неделю перечитывайте журнал и превращайте выводы в шаблоны и правила."},{"t":"p","h":"Полезно различать навыки, которые устаревают вместе с инструментами, и навыки, которые остаются:"},{"t":"table","head":"<tr><th>Устаревают быстро</th><th>Остаются надолго</th></tr>","rows":["<tr><td>Горячие клавиши конкретного редактора</td><td>Умение разбивать задачу на части</td></tr>","<tr><td>«Волшебные» формулировки под одну модель</td><td>Ясное письмо и постановка задач</td></tr>","<tr><td>Тонкости тарифов и лимитов</td><td>Чтение и проверка чужого кода</td></tr>","<tr><td>Обходные пути вокруг слабостей старой модели</td><td>Тестирование и поиск причин ошибок</td></tr>","<tr><td>Знание, какой инструмент сейчас в моде</td><td>Понимание устройства приложений, данных и предметной области</td></tr>"],"cols":2},{"t":"p","h":"Не расстраивайтесь, если многие инструменты придётся пересматривать каждые полгода. Это нормально. Инвестируйте время в правую колонку: именно она делает вас уверенным независимо от моды."},{"t":"h3","id":"s28","h":"<h3>Итоги и дальнейшие шаги</h3>"},{"t":"p","h":"Чем лучше ИИ, тем ценнее то, что остаётся за человеком: решения о том, как устроен проект, понимание предметной области, проверка и ответственность. Старшим разработчикам стоит развивать проектирование и руководство агентами, средним — специализацию, начинающим — фундамент, который не даст утонуть в сгенерированном коде."},{"t":"lbl","h":"<div class=\"lbl\">Упражнения</div>"},{"t":"list","tag":"ul","c":"tasks","items":["<li><label><input type=\"checkbox\" data-task=\"t14\"><span>Выпишите пять задач своей текущей недели и поставьте каждую в матрицу «цена ошибки × лёгкость проверки». Решите, какие из них можно отдать ИИ без проверки, какие с проверкой, а какие нельзя.</span></label></li>","<li><label><input type=\"checkbox\" data-task=\"t15\"><span>Выберите одно направление из таблицы «Направление / Почему растёт» и попросите ИИ составить для вас план знакомства с ним на три месяца с учётом того, что вы не программист. Уточните: что вы будете делать каждую неделю и как поймёте, что освоили.</span></label></li>","<li><label><input type=\"checkbox\" data-task=\"t16\"><span>Заведите журнал запросов и ведите его две недели. В конце попросите ИИ найти в нём закономерности: какие запросы работали лучше всего и почему.</span></label></li>","<li><label><input type=\"checkbox\" data-task=\"t17\"><span>Попробуйте режим наставника из этой главы на любом непонятном фрагменте кода из вашего проекта и запишите, что вы поняли.</span></label></li>"]},{"t":"ch","id":"ch5","head":"Глава 5 · Анализ сгенерированного кода","h":"<header class=\"ch-open\"><div class=\"ch-kicker\">Глава</div><div class=\"ch-big\">5</div><h2>Анализ сгенерированного кода: код-ревью, доработка, ответственность</h2></header>"},{"t":"p","h":"Код, который вы приняли в свой проект, — ваш код, кто бы его ни напечатал. ИИ не несёт ответственности, если приложение сломается у пользователей, а вы несёте. Эта глава о том, как проверять, отлаживать и дорабатывать то, что сгенерировал ИИ, так, чтобы за результат не было стыдно."},{"t":"p","h":"Важная оговорка для новичка: вам <strong>не нужно</strong> уметь читать код строчка за строчкой. Нужно уметь задавать правильные вопросы, запускать приложение, пробовать сценарии и просить ИИ объяснять и проверять. Каждый приём ниже мы показываем в двух вариантах: как это делает опытный разработчик и как это сделать вам."},{"t":"h3","id":"s29","h":"<h3>От замысла к реализации: как понять написанный ИИ код</h3>"},{"t":"p","h":"Сгенерированный код выглядит аккуратно, и это усыпляет внимание. Чтение такого кода требует метода, а не беглого просмотра. Профессиональную проверку изменений называют <strong>код-ревью</strong> (<em>code review</em>): кто-то смотрит чужие изменения и ищет ошибки, слабые места и несоответствия задаче."},{"t":"p","h":"Четыре прохода по незнакомому изменению:"},{"t":"list","tag":"ol","c":"ol","items":["<li data-n=\"1\"><strong>Обзор.</strong> Какие файлы затронуты, что добавлено, что удалено? Нет ли изменений вне задачи: настроек, подключённых библиотек, отключённых проверок?</li>","<li data-n=\"2\"><strong>Интерфейс.</strong> Что каждая функция получает на входе и что отдаёт на выходе? Какие ошибки может вызвать и на что влияет помимо результата (это называют <strong>побочными эффектами</strong>: например, записывает что-то в файл)?</li>","<li data-n=\"3\"><strong>Трассировка.</strong> Пройдите вручную один реальный сценарий от начала до конца, держа в голове конкретные данные: «пользователь нажимает „Сохранить“ с такими-то значениями, что происходит?»</li>","<li data-n=\"4\"><strong>Края.</strong> Что будет с пустым вводом, огромным вводом, значением «ничего» (в коде его называют <code>null</code>), повторным нажатием, двумя одновременными нажатиями?</li>"]},{"t":"note","h":"<div class=\"note simple\"><span class=\"nl\">Простыми словами</span> Представьте, что вы принимаете ремонт у бригады. Вы не обязаны уметь класть плитку. Но вы можете осмотреть общую картину (обзор), спросить, что и как они сделали (интерфейс), проверить на деле, что кран включается и вода идёт, куда нужно (трассировка), и попробовать нестандартное: включить оба крана сразу (края). Те же четыре шага работают с кодом.</div>"},{"t":"fig","n":"ch5_passes","cap":"Рис. 5.1 · четыре прохода по незнакомому изменению"},{"t":"p","h":"Как читать схему: вы смотрите на изменение четыре раза с разной глубиной: сначала общий обзор, потом смысл, потом риски и в конце проверка руками. Каждый проход отвечает на свой вопрос и занимает совсем немного времени."},{"t":"p","h":"ИИ может помочь понять собственный код, но его объяснение тоже нужно проверять. Хороший приём — попросить объяснение и сверить его с тем, как программа ведёт себя на деле. Слово <strong>дифф</strong> (разница между старой и новой версиями проекта) вы уже знаете из «Азбуки»: в запросе он означает «список изменений»."},{"t":"code","c":"prompt","label":"Запрос","lines":["Объясни этот дифф как ревьюеру: что изменилось в поведении, какие допущения сделаны, какие сценарии могут сломаться.","Отдельным списком — всё, что изменено вне основной задачи."]},{"t":"p","h":"Проще для новичка:"},{"t":"code","c":"prompt","label":"Запрос простыми словами","lines":["Объясни простыми словами, как будто я не программист: что ты только что сделал в проекте? Что теперь программа делает иначе, чем раньше? Что ты изменил, о чём я не просил? Как мне руками проверить, что всё работает?"]},{"t":"note","h":"<div class=\"note warn\"><span class=\"nl\">Внимание</span> Если объяснение ИИ не совпадает с тем, что вы увидели, когда проверили вручную, верьте тому, что увидели. Модель объясняет то, что код должен делать, а не всегда то, что он делает.</div>"},{"t":"h3","id":"s30","h":"<h3>«Решение большинства»: «самое распространённое» не значит «самое подходящее»</h3>"},{"t":"p","h":"Модель выбирает то, что чаще всего встречалось в обучающих данных. Это делает её ответы предсказуемыми, но не оптимальными для вашего случая. Самое популярное решение в интернете часто устарело или рассчитано на другой масштаб."},{"t":"note","h":"<div class=\"note simple\"><span class=\"nl\">Простыми словами</span> Это как спросить дорогу у прохожего, который показывает самый известный маршрут. Он, скорее всего, приведёт вас куда нужно, но может быть длиннее, чем объездная дорога, а за последний год там могли поставить шлагбаум.</div>"},{"t":"p","h":"Типичные проявления «решения большинства»:"},{"t":"list","tag":"ul","c":"ul","items":["<li><strong>Устаревшие версии.</strong> ИИ предлагает старые способы работы с библиотеками, потому что старых примеров в интернете больше, чем новых.</li>","<li><strong>Слишком тяжёлая библиотека.</strong> Подключена целая популярная библиотека там, где хватило бы возможностей самого языка.</li>","<li><strong>Медленный способ листать длинные списки.</strong> Для таблицы в десятки миллионов строк используется способ, который быстро работает на сотне записей, но тормозит на миллионах (в главе 2 это пагинация).</li>","<li><strong>Лишняя работа в браузере.</strong> Данные загружаются «в последнюю секунду» на устройстве пользователя там, где фреймворк предлагает подготовить их заранее на сервере.</li>","<li><strong>Учебный пример входа в аккаунт</strong>, скопированный в рабочее приложение без ограничения числа попыток и без регулярной смены ключей доступа.</li>"]},{"t":"p","h":"Как с этим работать:"},{"t":"list","tag":"ul","c":"ul","items":["<li><strong>Фиксируйте выбор в правилах проекта.</strong> Например: «Даты обрабатываем только встроенными средствами языка», «Запросы к сети делаем только встроенным способом, без дополнительных библиотек». Файл правил проекта вы уже знаете из главы 2.</li>","<li><strong>Просите альтернативы.</strong> «Предложи три подхода с компромиссами по скорости, сложности и количеству подключаемых библиотек, объясни простыми словами» — и выбирайте сами.</li>","<li><strong>Указывайте версии.</strong> «Next.js 16, App Router» отсекает целый пласт устаревших примеров. <strong>Версия</strong> — номер выпуска программы или библиотеки; у разных версий разные правила, и ИИ легко их путает.</li>"]},{"t":"h3","id":"s31","h":"<h3>Читаемость кода и его структура: шаблоны и потенциальные проблемы</h3>"},{"t":"p","h":"У сгенерированного кода есть узнаваемые «запахи» — признаки, по которым опытные люди сразу чувствуют, что что-то не так. Научившись их видеть, вы будете находить проблемы в разы быстрее. Многие из них видны и без чтения кода: достаточно задать ИИ вопрос."},{"t":"table","head":"<tr><th>Запах</th><th>Как выглядит</th><th>Что делать</th></tr>","rows":["<tr><td>Комментарии-пересказ</td><td>Над строкой «увеличить счётчик на 1» пояснение «увеличиваем счётчик на 1»</td><td>Удалить; оставить комментарии, объясняющие «почему», а не «что»</td></tr>","<tr><td>Лишняя «страховка»</td><td>Всё обёрнуто в защиту от ошибок (<code>try/catch</code>), и ошибки молча проглатываются</td><td>Ловить ошибки там, где их можно осмысленно обработать</td></tr>","<tr><td>Дублирование</td><td>Одна и та же логика в трёх местах с мелкими отличиями</td><td>Вынести общую часть в одно место и убедиться, что отличия намеренные</td></tr>","<tr><td>Переизобретение</td><td>ИИ написал свою функцию, хотя такая уже есть в проекте</td><td>Указать модели на существующие части</td></tr>","<tr><td>Заглушки</td><td>Пометки <code>TODO</code> («доделать»), фиктивные данные и имитации в рабочем коде</td><td>Искать по проекту перед каждым сохранением</td></tr>","<tr><td>Гигантские функции</td><td>Одна функция на 200 строк делает всё сразу</td><td>Разбить на небольшие части с одной задачей</td></tr>","<tr><td>Мёртвый код</td><td>Неиспользуемые подключения, переменные, ветки логики</td><td>Автоматические проверки при каждом изменении</td></tr>","<tr><td>Магические значения</td><td>Непонятные числа вроде <code>status === 3</code> или <code>4700</code> без объяснения</td><td>Дать им имена и пояснения</td></tr>"],"cols":3},{"t":"p","h":"Большинство этих проблем ловит автоматика: <strong>линтер</strong> (программа, которая проверяет код на типичные ошибки и неряшливость, как корректор в текстовом редакторе), <strong>форматтер</strong> (приводит код к единому виду), <strong>проверка типов</strong> (ищет ситуации вроде «здесь ожидалось число, а пришёл текст») и поиск по <code>TODO</code>. Настройте их в CI (напомним: это автоматическая проверка при каждом изменении) до того, как поток сгенерированного кода станет большим. Новичку проще попросить ИИ: «Подключи к проекту линтер и проверку типов и покажи, как их запускать»."},{"t":"note","h":"<div class=\"note tip\"><span class=\"nl\">Совет</span> Раз в несколько задач задавайте ИИ вопрос: «Найди в проекте дублирование, мёртвый код и заглушки. Составь список и предложи, что можно безопасно убрать». Это дешёвая «уборка», которая не даёт проекту превратиться в свалку.</div>"},{"t":"h3","id":"s32","h":"<h3>Стратегии отладки: поиск и исправление ошибок</h3>"},{"t":"p","h":"Отладка с ИИ эффективна, если вы ведёте процесс, а не просто пересылаете ошибки в чат. Классический цикл остаётся прежним: воспроизвести ошибку, сузить круг поиска, выдвинуть гипотезу, проверить её и исправить причину, а не следствие."},{"t":"p","h":"Что дать ИИ при отладке:"},{"t":"list","tag":"ul","c":"ul","items":["<li>Полный текст ошибки и <strong>стектрейс</strong> (так называют «след» ошибки: список мест в программе, через которые она прошла) вместо пересказа.</li>","<li>Ожидаемое и фактическое поведение: что должно было случиться и что случилось.</li>","<li>Минимальные шаги, которые приводят к ошибке (<strong>сценарий воспроизведения</strong>).</li>","<li>Что уже пробовали и что из этого вышло.</li>","<li>Недавние изменения: что поменялось с тех пор, как всё работало.</li>"]},{"t":"fig","n":"ch5_stacktrace","cap":"Рис. 5.2 · какую строку искать в стектрейсе"},{"t":"p","h":"Как читать схему: первая строка говорит, что случилось. Подсвеченная строка — первое упоминание вашего файла: искать надо здесь. Строки с node_modules относятся к чужим библиотекам."},{"t":"code","c":"prompt","label":"Запрос","lines":["Вот ошибка, стектрейс и шаги воспроизведения. Не исправляй код.","Предложи до трёх гипотез о первопричине, ранжируй их по вероятности и для каждой укажи, как её проверить одним действием: лог, тест или команда."]},{"t":"p","h":"Запрет исправлять сразу — ключевой. Иначе модель часто лечит симптом: добавляет проверку на «значение не пришло» вместо того, чтобы выяснить, почему оно не пришло. Это как класть пластырь на сломанную руку."},{"t":"fig","n":"ch5_debug","cap":"Рис. 5.3 · цикл отладки с ИИ"},{"t":"p","h":"Как читать схему: главное в схеме — порядок: сначала найти причину, потом исправлять. Если после исправления проблема осталась, вы идёте не вперёд, а назад к причине. Так вы не наращиваете заплатки одну поверх другой."},{"t":"p","h":"Когда ошибка появилась после серии изменений, используйте приём <code>git bisect</code>. Он перебирает сохранения (коммиты) проекта половинным делением и находит то, после которого всё сломалось. Это часто быстрее любых рассуждений. Новичку не нужно запоминать команду, достаточно попросить: «Найди, после какого коммита это перестало работать, используя <code>git bisect</code>, и покажи, что именно изменилось»."},{"t":"fig","n":"ch5_bisect","cap":"Рис. 5.4 · поиск поломки делением пополам"},{"t":"p","h":"Как читать схему: кружки — сохранения проекта от старых к новым. Зелёный хороший, красный плохой, синий проверяется сейчас. Каждая проверка отсекает половину кандидатов."},{"t":"h3","id":"s33","h":"<h3>Рефакторинг как способ поддержки кода: превращаем код ИИ в свой</h3>"},{"t":"p","h":"<strong>Рефакторинг</strong> — это наведение порядка в коде без изменения того, что программа делает снаружи. Он нужен, чтобы сгенерированный код стал понятным вам и вашей команде. Код, который вы структурировали под свои правила, становится вашим в полном смысле слова."},{"t":"p","h":"ИИ отлично справляется с механическим рефакторингом: переименование, выделение функций, замена устаревшего способа по всему проекту, приведение к единому стилю. Хуже — с изменениями общего устройства проекта без явного плана: он может «улучшить» структуру так, что нарушит неявные договорённости."},{"t":"p","h":"Правила безопасного рефакторинга с ИИ:"},{"t":"list","tag":"ol","c":"ol","items":["<li data-n=\"1\"><strong>Тесты до рефакторинга.</strong> Если тестов нет, сначала попросите написать тесты, которые фиксируют текущее поведение: они скажут, если что-то сломается.</li>","<li data-n=\"2\"><strong>Рефакторинг отдельно от новых функций.</strong> Одно сохранение (коммит) меняет устройство, другое — поведение. Смешанные изменения невозможно нормально проверить.</li>","<li data-n=\"3\"><strong>Маленькие шаги.</strong> После каждого шага тесты проходят («зелёные») и вы делаете коммит.</li>","<li data-n=\"4\"><strong>Явный план для крупных изменений.</strong> Сначала план в виде шагов, потом его согласование, потом исполнение по одному шагу.</li>"]},{"t":"note","h":"<div class=\"note simple\"><span class=\"nl\">Простыми словами</span> Рефакторинг похож на перестановку мебели в квартире: вещей столько же, они делают то же, что и раньше, но теперь вы быстрее находите нужное. Тесты в этом случае работают как опись имущества: после уборки вы сверяете, что ничего не пропало.</div>"},{"t":"fig","n":"ch5_refactor","cap":"Рис. 5.5 · безопасный рефакторинг"},{"t":"p","h":"Как читать схему: каждый виток — маленький шаг под защитой тестов: изменили, запустили проверки, сохранили. Если тесты покраснели, откатываем только этот шаг, а не всю работу."},{"t":"h3","id":"s34","h":"<h3>Важный этап тестирования: модульные, интеграционные и сквозные тесты</h3>"},{"t":"p","h":"Тесты — главный инструмент доверия к коду, написанному ИИ. Они превращают «вроде работает» в «проверено на этих сценариях». И именно тесты ИИ пишет быстрее всего, поэтому отговорок не осталось."},{"t":"p","h":"Главная ловушка — тесты, подогнанные под реализацию. Если попросить «напиши тесты для этой функции», модель часто проверяет то, что функция делает, включая её ошибки. Тесты должны вытекать из <strong>требований</strong> (описания того, что программа должна делать), а не из уже готового кода."},{"t":"fig","n":"ch5_failing_test","cap":"Рис. 5.6 · красный тест: правим код, а не тест"},{"t":"p","h":"Как читать схему: слева тест упал, посередине ИИ правит код, справа тот же тест зелёный. Тест при этом не менялся: он описывает правильное поведение."},{"t":"p","h":"Тесты бывают трёх видов, и их удобно представить пирамидой:"},{"t":"list","tag":"ul","c":"ul","items":["<li
