сность."},{"t":"p","h":"Практики надёжного развёртывания:"},{"t":"list","tag":"ul","c":"ul","items":["<li><strong>Ворота в CI.</strong> Сборка, проверка типов, тесты и проверки безопасности обязательны; пока что-то красное, изменение в основную версию не вливается («не сливается» на профессиональном жаргоне).</li>","<li><strong>Тестовое окружение (staging)</strong> с данными, похожими на боевые, и прогоном сквозных тестов.</li>","<li><strong>Фича-флаги.</strong> Выключатели, которые позволяют включать новую функцию постепенно и выключать её без выпуска новой версии.</li>","<li><strong>Канареечные релизы.</strong> Название идёт от шахтёров, которые брали в шахту канарейку для проверки воздуха. Сначала новая версия выкладывается для небольшой доли пользователей, и только потом для всех.</li>","<li><strong>Быстрый откат.</strong> Проверенный способ вернуть предыдущую версию за минуты.</li>","<li><strong>Обратно совместимые миграции.</strong> Изменения в базе делаются в три шага: сначала расширить схему, потом перевести код на новую схему, потом удалить старое. Так приложение не ломается посреди пути.</li>","<li><strong>Мониторинг и оповещения.</strong> <strong>Мониторинг</strong> — постоянное наблюдение за здоровьем приложения, <strong>оповещения</strong> (алерты) — уведомления, когда что-то пошло не так: растёт число ошибок, замедлился ответ или упали заказы.</li>","<li><strong>Минимальные права для агентов.</strong> У агента нет доступа к боевому серверу, ключам развёртывания и настоящим данным.</li>","<li><strong>Резервные копии с проверкой восстановления.</strong> Копия, из которой ни разу не восстанавливались, — не копия.</li>"]},{"t":"note","h":"<div class=\"note simple\"><span class=\"nl\">Простыми словами</span> Выпуск новой версии похож на открытие нового блюда в ресторане. Разумно не ставить его сразу в меню для всех гостей, а сначала предложить нескольким постоянным посетителям (канарейка), убедиться, что никто не отравился (мониторинг), и иметь план на случай жалоб: быстро убрать блюдо из меню (откат).</div>"},{"t":"fig","n":"ch8_rollout","cap":"Рис. 8.12 · канареечный релиз"},{"t":"p","h":"Как читать схему: новую версию сначала видит малая часть людей (закрашенный кружок), и вы следите за мониторингом. Если всё хорошо, доля растёт. Если нет, версию откатывают, а пострадал один из двадцати, а не все."},{"t":"h3","id":"s56","h":"<h3>Итоги и дальнейшие шаги</h3>"},{"t":"p","h":"ИИ-код небезопасен по умолчанию примерно в половине случаев, поэтому безопасность встраивается в процесс: явные требования в запросах, автоматические проверки, ревью с акцентом на бизнес-логику, негативные тесты и развёртывание, которое ограничивает ущерб от пропущенной ошибки. Для новичка главное: просить о безопасности прямо, проверять то, что можно проверить руками, и не давать агентам больше прав, чем нужно."},{"t":"lbl","h":"<div class=\"lbl\">Упражнения</div>"},{"t":"list","tag":"ul","c":"tasks","items":["<li><label><input type=\"checkbox\" data-task=\"t36\"><span>Скопируйте запрос «Запрос простыми словами» из раздела про аудит и отправьте его ИИ, указав свой проект. Выберите одну самую серьёзную находку и проверьте её руками или с помощью ИИ.</span></label></li>","<li><label><input type=\"checkbox\" data-task=\"t37\"><span>Попросите ИИ подключить к вашему проекту автоматическую проверку на ключи и пароли в файлах и на известные уязвимости в используемых библиотеках. Попросите объяснить, как читать результат.</span></label></li>","<li><label><input type=\"checkbox\" data-task=\"t38\"><span>Для одной функции, которая работает с данными пользователя, спросите ИИ: «Что произойдёт, если пользователь А попытается получить или изменить данные пользователя Б? Покажи, как это проверить, и напиши тест».</span></label></li>","<li><label><input type=\"checkbox\" data-task=\"t39\"><span>Проверьте все библиотеки, которые добавил агент за последний месяц: попросите ИИ составить список с датой появления и автором каждой, и отметьте подозрительные.</span></label></li>","<li><label><input type=\"checkbox\" data-task=\"t57\"><span>Возьмите список «Реальные провалы» и для каждой истории ответьте про свой проект: могло ли такое случиться у вас? Если да, попросите ИИ помочь закрыть эту дыру.</span></label></li>"]},{"t":"ch","id":"ch9","head":"Глава 9 · Этические вопросы вайб-кодинга","h":"<header class=\"ch-open\"><div class=\"ch-kicker\">Глава</div><div class=\"ch-big\">9</div><h2>Этические вопросы вайб-кодинга</h2></header>"},{"t":"p","h":"Этика в работе с ИИ — это не абстрактная философия, а набор практических решений: чей это код, кому и что мы обязаны сообщить, кого наш продукт может незаметно обидеть. Ошибки здесь стоят денег, репутации и доверия пользователей. Эта глава даёт ориентиры, но не заменяет юриста: правовые нормы различаются по странам и быстро меняются."},{"t":"p","h":"Тема этой главы менее техническая, чем предыдущие, но не менее важная. Если вы собираетесь делать приложения для других людей и зарабатывать на них, вопросы из этой главы рано или поздно к вам придут. Лучше знать о них заранее."},{"t":"h3","id":"s57","h":"<h3>Размышления по поводу интеллектуальной собственности</h3>"},{"t":"p","h":"<strong>Интеллектуальная собственность</strong> — это права на результаты творческой работы: тексты, изображения, программы. Вопросы интеллектуальной собственности в ИИ-разработке делятся на три группы: кому принадлежит результат, не нарушает ли он чужие права и что происходит с вашими данными."},{"t":"p","h":"<strong>Кому принадлежит сгенерированный код.</strong> Во многих правовых системах автором может быть только человек. Бюро авторского права США в докладе января 2025 года указало, что охраняется человеческий творческий вклад, а не то, что машина создала самостоятельно. Российский Гражданский кодекс также признаёт автором гражданина, чьим творческим трудом создан результат. Практический вывод: чем существеннее ваш вклад — идея и устройство проекта, отбор вариантов, переработка, — тем увереннее ваша позиция. Если вы просто нажали «сгенерировать» и взяли первый результат, вклад минимален."},{"t":"p","h":"<strong>Не нарушает ли код чужие права.</strong> Модель иногда воспроизводит фрагменты из обучающих данных почти дословно. У открытого кода есть <strong>лицензии</strong> — правила, на каких условиях им можно пользоваться. Одни лицензии очень свободные, другие, так называемые <strong>копилефт-лицензии</strong> (например, GPL), требуют, чтобы и ваш код, в который попал такой фрагмент, тоже был открыт. Если такой код окажется в <strong>проприетарном</strong> (закрытом, коммерческом) продукте, это создаёт юридический риск."},{"t":"note","h":"<div class=\"note simple\"><span class=\"nl\">Простыми словами</span> Представьте, что вы пишете книгу и позаимствовали абзац из чужой. Если автор разрешил цитировать с указанием источника, всё в порядке. Если нет, вы нарушили его права. С кодом так же: чужой код нельзя брать без условий лицензии, а ИИ иногда подкладывает такие фрагменты, не предупреждая.</div>"},{"t":"p","h":"<strong>Что происходит с вашими данными.</strong> Условия использования инструментов различаются: используется ли ваш код для обучения моделей, где он хранится, кто имеет к нему доступ. Корпоративные тарифы обычно дают более строгие гарантии, чем бесплатные."},{"t":"p","h":"<strong>Можно ли сделать своё по образцу чужого.</strong> Можно, если брать идеи и поведение, а код, тексты, оформление и название делать своими. Где проходит граница и как работает метод «чистой комнаты», разобрано в главе 12."},{"t":"p","h":"Практические меры:"},{"t":"list","tag":"ul","c":"ul","items":["<li>Включите <strong>сканер лицензий</strong> (автоматическую проверку) в CI, чтобы ловить фрагменты известного открытого кода.</li>","<li>Используйте фильтры дословных совпадений, если инструмент их предлагает.</li>","<li>Не вставляйте чужой закрытый код и секреты компании в инструменты без корпоративного соглашения.</li>","<li>Прочитайте условия использования своих инструментов в части прав на результат и обучения на ваших данных.</li>","<li>Зафиксируйте в компании письменную политику использования ИИ. Если вы работаете один, составьте для себя короткий список правил.</li>"]},{"t":"fig","n":"ch9_ip","cap":"Рис. 9.1 · три вопроса об интеллектуальной собственности"},{"t":"p","h":"Как читать схему: сверху три вопроса, снизу — что с каждым делать. Колонки читаются сверху вниз. Это обзор, а не юридическая консультация, и по спорным случаям нужен юрист."},{"t":"note","h":"<div class=\"note warn\"><span class=\"nl\">Внимание</span> Этот раздел — обзор, а не юридическая консультация. Для коммерческих продуктов и спорных ситуаций обращайтесь к юристу, который знает право вашей страны.</div>"},{"t":"h3","id":"s58","h":"<h3>Прозрачность и признание авторства</h3>"},{"t":"p","h":"Прозрачность — это честность о том, какую роль ИИ сыграл в работе. Она нужна коллегам, которые проверяют ваши изменения, заказчику, работодателю, преподавателю и сообществу открытого кода."},{"t":"p","h":"Где прозрачность особенно важна:"},{"t":"list","tag":"ul","c":"ul","items":["<li><strong>В команде.</strong> Метка в сообщении о сохранении (коммите) или в предложении об изменениях (пул-реквесте) помогает проверяющему понять, на что смотреть внимательнее. Распространённая практика: строка <code>Co-Authored-By</code> («соавтор») с указанием инструмента в сообщении коммита.</li>","<li><strong>В открытом коде.</strong> У проектов разные правила. Некоторые, например Gentoo и NetBSD, ещё в 2024 году запретили вклад, сгенерированный ИИ. Другие требуют раскрытия. Читайте правила проекта до отправки изменений.</li>","<li><strong>В учёбе и на собеседованиях.</strong> Выдавать сгенерированное решение за своё там, где проверяют ваши навыки, — обман, и он обычно раскрывается на первом же уточняющем вопросе.</li>","<li><strong>Перед заказчиком.</strong> Если договор или ожидания заказчика касаются способа работы, обсудите использование ИИ заранее.</li>"]},{"t":"fig","n":"ch9_commit_label","cap":"Рис. 9.2 · метка об участии ИИ"},{"t":"p","h":"Как читать схему: слева сообщение о сохранении с пометкой об ИИ, справа описание пул-реквеста. В описании стоит коротко сказать, что сделал ИИ и что проверили вы."},{"t":"p","h":"Признание роли ИИ не отменяет вашей ответственности. Формула простая: ИИ — инструмент, автор и ответственный — человек."},{"t":"fig","n":"ch9_transp","cap":"Рис. 9.3 · где важна прозрачность"},{"t":"p","h":"Как читать схему: из центрального блока расходятся четыре ситуации, где окружающим важно знать, какую роль сыграл ИИ. Нижняя полоса даёт простой тест: сможете ли вы спокойно рассказать, как вы это сделали."},{"t":"note","h":"<div class=\"note tip\"><span class=\"nl\">Совет</span> Простое правило честности: если вас спросят, как вы это сделали, вы должны без стеснения рассказать, что делал ИИ, а что вы. Если рассказывать неловко, подумайте, почему.</div>"},{"t":"h3","id":"s59","h":"<h3>Предвзятость (дискриминация) и справедливость</h3>"},{"t":"p","h":"<strong>Предвзятость</strong> — это когда система систематически хуже работает для одних людей и лучше для других. Модель воспроизводит допущения из обучающих данных, и эти допущения попадают в ваш продукт незаметно. Предвзятость в коде редко выглядит как злой умысел. Она выглядит как «разумное значение по умолчанию», которое исключает часть людей."},{"t":"p","h":"Классический пример — проверка имени:"},{"t":"code","c":"","label":"TypeScript","lines":["// Сгенерировано «по умолчанию»: отсекает реальных людей","const isValidName = (name: string) => /^[A-Za-z]+$/.test(name);","// Не пройдут: «Ёлкина», «O'Connor», «Мария-Луиза», «李小龙»","","// Справедливее: любые буквы любых алфавитов, пробелы, дефисы, апострофы","const isValidNameFair = (name: string) =>","  /^[\\p{L}\\p{M}][\\p{L}\\p{M}\\s'\\-]*$/u.test(name.trim()) && name.trim().length <= 100;"]},{"t":"p","h":"Что здесь происходит. Обе строки решают одну задачу: проверить, что человек ввёл допустимое имя. Первая пропускает только латинские буквы без пробелов, дефисов и апострофов. Значит, в форму не смогут записаться ни Ёлкина, ни O'Connor, ни Мария-Луиза, ни пользователь с китайским именем. Вторая допускает буквы любых алфавитов, пробелы, дефисы и апострофы, но не больше ста символов. Странные значки между слешами называются регулярным выражением: это короткая запись правила «что считать допустимым». Вам не нужно писать их самому, достаточно сказать ИИ: «Имя может быть на любом языке, содержать пробелы, дефисы и апострофы»."},{"t":"fig","n":"ch9_bias","cap":"Рис. 9.4 · проверка имени «по умолчанию» и справедливая"},{"t":"p","h":"Как читать схему: слева правило пропускает только латиницу, и реальные имена отсекаются. Справа то же имя проходит. Схема напоминает проверять формы на разных алфавитах до выпуска."},{"t":"p","h":"Где ещё прячется несправедливость:"},{"t":"list","tag":"ul","c":"ul","items":["<li><strong>Формы и форматы.</strong> Адреса, телефоны, даты и имена устроены по-разному в разных странах.</li>","<li><strong>Доступность.</strong> Сгенерированный интерфейс часто забывает про скринридеры (программы, которые зачитывают экран), достаточный контраст между цветом текста и фона и управление только с клавиатуры, без мыши.</li>","<li><strong>Алгоритмы решений.</strong> Скоринг (оценка человека по баллам, например кредитная), модерация (удаление недопустимого содержимого), отбор кандидатов, ранжирование — места, где смещение влияет на судьбы людей.</li>","<li><strong>Языки и локализация.</strong> <strong>Локализация</strong> — адаптация продукта под язык и обычаи пользователей. Интерфейс, который корректно работает только на английском, исключает многих.</li>"]},{"t":"fig","n":"ch9_keyboard","cap":"Рис. 9.5 · проверка формы клавиатурой"},{"t":"p","h":"Как читать схему: попробуйте пройти форму без мыши: Tab переводит на следующее поле, Enter нажимает кнопку. Цифры показывают ожидаемый порядок, а рамка вокруг поля — видимый фокус."},{"t":"p","h":"Как снижать риск:"},{"t":"list","tag":"ol","c":"ol","items":["<li data-n=\"1\">Явно указывайте в запросах требования к поддержке разных языков и доступности.</li>","<li data-n=\"2\">Тестируйте на разнообразных данных: разные алфавиты, длины, форматы, крайние значения.</li>","<li data-n=\"3\">Для систем, принимающих решения о людях, проводите отдельную проверку справедливости и документируйте её.</li>","<li data-n=\"4\">Привлекайте к тестированию людей из разных групп пользователей.</li>"]},{"t":"p","h":"Законодательство тоже движется в эту сторону. Европейский закон об ИИ (AI Act) вступил в силу в 2024 году и вводится поэтапно. Запреты самых опасных применений действуют с 2025 года, а с августа 2026 года — требования прозрачности: например, люди должны знать, что общаются с ИИ. Требования к системам высокого риска, например в найме и кредитовании, в 2026 году перенесли: они начнут действовать с декабря 2027 года. Если ваш продукт работает с пользователями из ЕС, это касается и вас. В России отдельного закона об ИИ пока нет: в 2026 году Минцифры подготовило законопроект о регулировании ИИ, в том числе о маркировке созданного ИИ контента, но вступить в силу он должен не раньше 2027 года."},{"t":"note","h":"<div class=\"note simple\"><span class=\"nl\">Простыми словами</span> Простая проверка для новичка: прежде чем выпускать форму или приложение, попробуйте им воспользоваться глазами человека, не похожего на вас. Введите имя с апострофом, адрес из другой страны, откройте сайт только с клавиатуры. То, что у вас «просто сломалось», у реальных людей закрывает дверь в приложение.</div>"},{"t":"h3","id":"s60","h":"<h3>Золотые правила ответственного использования ИИ</h3>"},{"t":"list","tag":"ol","c":"ol","items":["<li data-n=\"1\"><strong>Ответственность не делегируется.</strong> За программу, которая ушла к настоящим пользователям, отвечает человек, который её принял.</li>","<li data-n=\"2\"><strong>Понимай то, что выпускаешь.</strong> Особенно там, где на кону деньги, здоровье, безопасность или права людей.</li>","<li data-n=\"3\"><strong>Защищай чужие данные.</strong> Персональные данные пользователей (имена, адреса, телефоны, всё, что позволяет определить человека) не попадают в запросы к внешним моделям без правового основания и необходимости.</li>","<li data-n=\"4\"><strong>Уважай лицензии.</strong> Проверяй происхождение крупных фрагментов кода и соблюдай правила проектов, в которые вносишь вклад.</li>","<li data-n=\"5\"><strong>Будь честен о роли ИИ.</strong> Там, где это важно для доверия, — говори.</li>","<li data-n=\"6\"><strong>Проверяй на разных людях.</strong> Значения по умолчанию не должны исключать пользователей.</li>","<li data-n=\"7\"><strong>Не автоматизируй вред.</strong> ИИ не должен помогать обходить защиту, манипулировать людьми или нарушать закон, даже если «технически это просто скрипт».</li>","<li data-n=\"8\"><strong>Учись, а не только получай.</strong> Сохраняй навыки, без которых не сможешь проверить ИИ.</li>"]},{"t":"fig","n":"ch9_rules","cap":"Рис. 9.6 · восемь правил по группам"},{"t":"p","h":"Как читать схему: восемь правил разложены по трём колонкам по смыслу, а номера на значках совпадают с номерами в списке выше. Если запомнить только колонки, этого уже достаточно, чтобы вспомнить правила."},{"t":"h3","id":"s61","h":"<h3>Итоги и дальнейшие шаги</h3>"},{"t":"p","h":"Этика ИИ-разработки складывается из конкретных привычек: проверять лицензии и условия использования, честно обозначать роль ИИ, тестировать продукт на разнообразных пользователях и не перекладывать ответственность на инструмент."},{"t":"lbl","h":"<div class=\"lbl\">Упражнения</div>"},{"t":"list","tag":"ul","c":"tasks","items":["<li><label><input type=\"checkbox\" data-task=\"t40\"><span>Откройте условия использования своего основного ИИ-инструмента (или попросите ИИ найти нужные разделы и пересказать) и выпишите, кому принадлежит результат и обучается ли модель на ваших данных. Если вы не уверены в ответе, это нормально: запишите вопрос и найдите, где его можно уточнить.</span></label></li>","<li><label><input type=\"checkbox\" data-task=\"t41\"><span>Найдите в своём проекте поле для имени, адреса или телефона и проверьте его на примерах из разных стран: имя с апострофом, имя на другом алфавите, длинный адрес. Если что-то не принимается, попросите ИИ исправить и объяснить.</span></label></li>","<li><label><input type=\"checkbox\" data-task=\"t42\"><span>Откройте свой сайт и попробуйте пройти главный сценарий только клавиатурой, без мыши. Запишите, где вы застряли.</span></label></li>","<li><label><input type=\"checkbox\" data-task=\"t43\"><span>Составьте для себя одностраничную политику использования ИИ: что вы никогда не отдаёте ИИ, что всегда проверяете, как рассказываете о роли ИИ.</span></label></li>"]},{"t":"ch","id":"ch10","head":"Глава 10 · Автономные агенты фонового программирования","h":"<header class=\"ch-open\"><div class=\"ch-kicker\">Глава</div><div class=\"ch-big\">10</div><h2>Автономные агенты фонового программирования</h2></header>"},{"t":"p","h":"Главный сдвиг 2025–2026 годов — переход от ИИ-напарника к ИИ-исполнителю. Вы ставите задачу, закрываете ноутбук, а утром проверяете готовое предложение об изменениях (пул-реквест). Это меняет экономику разработки, но и переносит основную нагрузку на две вещи: умение поставить задачу и умение проверить результат. Обе вы уже начали осваивать в предыдущих главах."},{"t":"h3","id":"s62","h":"<h3>От напарников к автономным агентам: что такое агенты фонового программирования</h3>"},{"t":"p","h":"<strong>Агент фонового программирования</strong> — это ИИ-система, которая получает задачу, самостоятельно работает над ней в изолированной среде и возвращает результат для проверки, обычно в виде ветки или пул-реквеста. Человек не участвует в каждом шаге. Если раньше ИИ был напарником, который сидит рядом, то теперь он больше похож на сотрудника на удалёнке: вы даёте поручение, он уходит работать и присылает отчёт."},{"t":"p","h":"Эволюция шла в четыре этапа:"},{"t":"list","tag":"ol","c":"ol","items":["<li data-n=\"1\"><strong>Автодополнение.</strong> ИИ дописывает строку, человек полностью ведёт процесс.</li>","<li data-n=\"2\"><strong>Чат.</strong> ИИ отвечает на вопросы и пишет фрагменты, человек переносит их в код.</li>","<li data-n=\"3\"><strong>Агент рядом.</strong> ИИ сам читает проект, запускает команды и правит файлы в терминале или редакторе, а человек наблюдает и подтверждает действия.</li>","<li data-n=\"4\"><strong>Агент в фоне.</strong> ИИ работает <strong>асинхронно</strong> (не дожидаясь вас) и <strong>параллельно</strong> (несколько задач одновременно), человек проверяет итог.</li>"]},{"t":"fig","n":"ch10_evolution","cap":"Рис. 10.1 · четыре этапа развития ИИ-помощников"},{"t":"p","h":"Как читать схему: ступени растут слева направо: чем выше ступень, тем больше самостоятельности у ИИ и тем меньше ручных шагов у вас. На последней ступени ваша роль — ставить задачу и проверять результат."},{"t":"p","h":"Ключевое отличие четвёртого этапа — асинхронность. Вы больше не ждёте ответа и не следите за каждым шагом. Ваше внимание переходит с процесса на вход (задачу) и выход (результат)."},{"t":"note","h":"<div class=\"note simple\"><span class=\"nl\">Простыми словами</span> Асинхронность — как заказать уборку квартиры. Можно стоять над душой у клинера и подсказывать каждый шаг (агент рядом), а можно оставить подробную записку, уйти по делам и вечером проверить результат (агент в фоне). Во втором случае всё зависит от того, насколько понятной была записка, и от того, как внимательно вы проверите работу.</div>"},{"t":"h3","id":"s63","h":"<h3>Как работают автономные агенты</h3>"},{"t":"p","h":"В основе любого агента — цикл: модель решает, какое действие сделать, инструмент его выполняет, результат возвращается модели, и так до тех пор, пока задача не решена или не исчерпан бюджет (время, деньги, токены)."},{"t":"fig","n":"10.1","cap":"Рис. 10.2 · агентный цикл в изолированной среде"},{"t":"p","h":"Как читать схему: внутри рамки (изолированной среды агента) идёт цикл «задача → план шага → действие → наблюдение → проверки пройдены?». Если проверки не пройдены, агент делает следующий круг. Если пройдены, агент оформляет результат в пул-реквест. Всё, что агент делает сам, происходит внутри этой защищённой среды; наружу выходит только пул-реквест, и решение о нём принимает человек."},{"t":"p","h":"Из чего состоит агент:"},{"t":"list","tag":"ul","c":"ul","items":["<li><strong>Модель</strong> — принимает решения о следующем шаге.</li>","<li><strong>Инструменты</strong> — терминал, чтение и запись файлов, поиск по коду, браузер, внешние системы через MCP (вы знаете этот «разъём» по главе 1).</li>","<li><strong>Среда</strong> — изолированный контейнер или виртуальная машина с копией проекта, где агент может безопасно запускать команды. <strong>Виртуальная машина</strong> — это «компьютер внутри компьютера», с которым можно обращаться как угодно, не рискуя настоящим. Такую изолированную среду часто называют <strong>песочницей</strong>: как в детской песочнице, всё построенное там не выйдет за её границы.</li>","<li><strong>Контекст и память</strong> — правила проекта, заметки агента и сжатие длинной истории, чтобы помещаться в контекстное окно (вспомните «рабочий стол» из главы 1).</li>","<li><strong>Ограничения</strong> — права доступа, доступ к интернету, бюджет времени и токенов, список запрещённых действий.</li>","<li><strong>Критерий завершения</strong> — прохождение тестов, сборки и проверок, после чего агент оформляет результат.</li>"]},{"t":"p","h":"Чем лучше определён критерий завершения, тем надёжнее агент. Задача «тесты должны проходить и покрывать новые случаи» выполняется заметно лучше, чем «сделай хорошо»."},{"t":"p","h":"Представление о том, насколько длинные задачи под силу агентам, даёт метрика METR «горизонт задач». Это длина задачи, измеренная временем, которое на неё потратил бы человек-специалист. Весной 2026 года рекорд принадлежал предварительной версии модели Claude Mythos, которая не вышла в открытый доступ: в половине случаев она доводила до конца задачи, которые у специалиста заняли бы 16 часов и больше. Сам METR предупреждает, что дальше 16 часов надёжно мерить пока не умеет: таких длинных задач в наборе слишком мало. При требовании 80% надёжности горизонт той же модели падал примерно до трёх часов, а у общедоступных моделей цифры были ниже. Разница между «иногда справляется» и «справляется надёжно» огромна, и её стоит помнить, выбирая задачи для делегирования."},{"t":"h3","id":"s64","h":"<h3>Сравнение фоновых агентов и ИИ-ассистентов в IDE</h3>"},{"t":"p","h":"Фоновые агенты не заменяют ассистентов в редакторе кода (IDE) или терминале — они решают другой класс задач."},{"t":"table","head":"<tr><th>Аспект</th><th>Ассистент в редакторе или терминале</th><th>Фоновый агент</th></tr>","rows":["<tr><td>Режим</td><td>Синхронный, вы рядом</td><td>Асинхронный, вы заняты другим</td></tr>","<tr><td>Контроль</td><td>Подтверждение каждого шага</td><td>Проверка итогового списка изменений (диффа)</td></tr>","<tr><td>Лучшие задачи</td><td>Исследование, сложные решения, неясные требования</td><td>Чётко описанные задачи, которые можно проверить тестами</td></tr>","<tr><td>Параллельность</td><td>Обычно одна сессия</td><td>Несколько задач одновременно</td></tr>","<tr><td>Где тратится внимание</td><td>Во время работы</td><td>На постановке задачи и проверке результата</td></tr>","<tr><td>Главный риск</td><td>Медленно, если задача механическая</td><td>Решил не ту задачу или подогнал проверку под себя</td></tr>"],"cols":3},{"t":"fig","n":"ch10_sync","cap":"Рис. 10.3 · синхронная и асинхронная работа"},{"t":"p","h":"Как читать схему: вверху ассистент: вы работаете вместе, шаг за шагом. Ниже агенты: вы ставите задачу, занимаетесь своим делом, а затем проверяете итог. Три агента работают одновременно, пока вы заняты другим."},{"t":"p","h":"В десктопном приложении Claude место работы выбирают перед запуском сессии: на вашем компьютере, в облаке или на удалённом сервере."},{"t":"fig","n":"dk_cloud","cap":"Рис. 10.4 · где работает Claude: Local, Cloud или SSH"},{"t":"p","h":"Как читать схему: три карточки — три места, где может работать агент. Для фоновых задач, когда вы заняты другим, подходит Cloud: сессия продолжается, даже если закрыть приложение. Для обычной работы рядом с экраном достаточно Local."},{"t":"p","h":"Удобная эвристика (то есть правило, которое помогает быстро решить): если вы заранее можете написать критерий готовности и тест, задачу можно отдавать в фон. Если вы сами ещё не понимаете, что нужно, работайте с ассистентом рядом: разберитесь вместе, а потом отдавайте."},{"t":"h3","id":"s65","h":"<h3>Объединение нескольких ИИ-моделей для максимального эффекта</h3>"},{"t":"p","h":"Разные модели сильны в разном и ошибаются по-разному. Сочетание моделей повышает качество так же, как проверка работы коллегой из другой команды."},{"t":"p","h":"Рабочие паттерны (то есть устойчивые схемы):"},{"t":"list","tag":"ul","c":"ul","items":["<li><strong>Планировщик и исполнитель.</strong> Сильная модель с высоким усилием рассуждения составляет план, более быстрая и дешёвая выполняет шаги.</li>","<li><strong>Перекрёстное ревью.</strong> Код, написанный моделью одного семейства, проверяет модель другого. Слепые пятна у них различаются, как у двух людей с разным опытом.</li>","<li><strong>Параллельные попытки.</strong> Несколько агентов решают одну задачу независимо, лучший вариант выбирается по тестам и проверке.</li>","<li><strong>Оркестратор и подагенты.</strong> <strong>Оркестратор</strong> — главный агент, который делит задачу на части и раздаёт их <strong>подагентам</strong>, у каждого из которых свой чистый контекст. Так большие задачи не переполняют контекст одной сессии. Это как руководитель проекта, который распределяет работу между специалистами.</li>","<li><strong>Маршрутизация по сложности.</strong> Простые задачи автоматически уходят быстрой модели, сложные — флагману.</li>"]},{"t":"note","h":"<div class=\"note tip\"><span class=\"nl\">Совет</span> Начинайте с одной модели и одного агента. Мультимодельные схемы окупаются, когда у вас уже есть тесты и метрики, чтобы понять, стало ли лучше. Без измерений это просто дорогая сложность.</div>"},{"t":"fig","n":"ch10_multi","cap":"Рис. 10.5 · оркестратор и перекрёстное ревью"},{"t":"p","h":"Как читать схему: слева один главный агент делит задачу между помощниками и собирает итог. Справа три модели по цепочке: планирует сильная, пишет быстрая, проверяет модель другого семейства, потому что она ошибается иначе."},{"t":"p","h":"В десктопном приложении несколько агентов — это несколько сессий в боковой панели. Они работают одновременно, и каждую можно открыть во второй панели рядом."},{"t":"fig","n":"dk_parallel","cap":"Рис. 10.6 · несколько сессий и отдельные копии проекта"},{"t":"p","h":"Как читать схему: слева список сессий со значками состояния, справа две открытые рядом. У каждой своя ветка и своя копия проекта (Worktree), поэтому два агента не наступают друг другу на ноги. Проверяйте результат каждой сессии отдельно, прежде чем объединять работу."},{"t":"h3","id":"s66","h":"<h3>Основные автономные агенты для написания кода</h3>"},{"t":"p","h":"Рынок агентов меняется каждые несколько месяцев. Таблица ниже — снимок на октябрь 2026 года, сфокусированный на том, как агенту ставят задачу и что он возвращает. Незнакомые слова из таблицы: <strong>CLI</strong> — программа, которой управляют из терминала командами; <strong>CI</strong> — автоматические проверки; <strong>issue</strong> («заявка») — запись о задаче на GitHub; <strong>API</strong> — способ, которым одна программа обращается к другой; <strong>Docker</strong> — технология, которая упаковывает программу вместе с окружением, чтобы она запускалась одинаково везде."},{"t":"table","head":"<tr><th>Агент</th><th>Где работает</th><th>Как поставить задачу</th><th>Результат</th></tr>","rows":["<tr><td>Claude Code (Anthropic)</td><td>Терминал, веб, десктоп, CI, облачные сессии</td><td>Запрос в сессии, скрипт, CI</td><td>Изменения в ветке, пул-реквест</td></tr>","<tr><td>Codex (OpenAI)</td><td>CLI с песочницей, редактор, облачные задачи</td><td>Запрос в CLI или веб-интерфейсе</td><td>Дифф или пул-реквест</td></tr>","<tr><td>Copilot cloud agent (GitHub)</td><td>Контейнер в инфраструктуре GitHub</td><td>Назначить issue на Copilot</td><td>Пул-реквест из issue</td></tr>","<tr><td>Cloud Agents в Cursor</td><td>Облачные виртуальные машины</td><td>Чат в редакторе</td><td>Пул-реквест</td></tr>","<tr><td>Devin (Cognition)</td><td>Облачная песочница с браузером и терминалом</td><td>Slack, веб, API</td><td>Пул-реквест</td></tr>","<tr><td>Jules (Google)</td><td>Облачная виртуальная машина</td><td>Веб-интерфейс, GitHub</td><td>Пул-реквест</td></tr>","<tr><td>OpenHands</td><td>Своя инфраструктура, Docker</td><td>Веб или API</td><td>Пул-реквест, любая модель</td></tr>"],"cols":4},{"t":"p","h":"При выборе смотрите на четыре вещи: насколько хорошо агент изолирован, может ли он работать с вашей инфраструктурой и автоматическими проверками, какие модели поддерживает и сколько стоит одна типичная задача. Новичку, который работает один, обычно хватает одного агента с понятным интерфейсом, а остальное можно узнать позже."},{"t":"h3","id":"s83","h":"<h3>Возможности Claude Code для самостоятельной работы</h3>"},{"t":"p","h":"Когда базовая работа освоена, у Claude Code есть возможности, которые превращают его из помощника в настраиваемую команду. Не включайте всё сразу: каждая возможность — ещё одно место, где что-то может пойти не так. Берите по одной, когда почувствуете, что она нужна."},{"t":"list","tag":"ul","c":"ul","items":["<li><strong>Навыки</strong> (skills) — папка с инструкцией <code>SKILL.md</code>. Claude подгружает её сам, когда задача подходит, или по команде <code>/имя-навыка</code>. Пригодится, если вы часто повторяете один и тот же порядок действий, например «подготовь релиз» или «проверь доступность».</li>","<li><strong>Хуки</strong> (hooks) — команды, которые запускаются автоматически: до действия агента (и могут его запретить) или после него. Пригодятся, когда нужна гарантия, а не просьба, например «после каждой правки запускай линтер».</li>","<li><strong>Подагенты</strong> — помощники со своей инструкцией и чистым контекстом. Описываются файлами в папке <code>.claude/agents/</code>. Пригодятся, когда большую задачу удобно разделить на исследование, тесты и ревью.</li>","<li><strong>Плагины</strong> — готовые наборы навыков, хуков, подагентов и MCP-подключений. Ставятся из каталога командой <code>/plugin</code>. Пригодятся, если хочется взять проверенную сборку, а не настраивать всё самому.</li>","<li><strong>Задачи по расписанию</strong> — облачная сессия сама запускается по расписанию (команда <code>/schedule</code>), не чаще раза в час. Пригодятся для регулярной работы: еженедельного обновления библиотек, утренней сводки по проекту.</li>","<li><strong>Remote Control</strong> — сессию, запущенную на компьютере, можно продолжить с телефона (команда <code>/remote-control</code>). Компьютер при этом должен оставаться включённым. Пригодится, когда агент работает дома, а вы отвечаете на его вопросы в дороге.</li>","<li><strong>Claude in Chrome</strong> — Claude управляет вашим браузером Chrome: открывает страницы, нажимает кнопки, заполняет формы (запуск <code>claude --chrome</code>). Пригодится, чтобы проверить сайт в настоящем браузере, где вы уже вошли в нужные сервисы.</li>"]},{"t":"note","h":"<div class=\"note warn\"><span class=\"nl\">Внимание</span> Хуки и плагины выполняют команды на вашем компьютере. Ставьте плагины только из известных источников и читайте, что делает хук, прежде чем его включить: это такой же код, как любой другой. А Claude in Chrome действует от вашего имени во всех сайтах, где вы вошли: давайте ему только те задачи, которые доверили бы помощнику с доступом к вашему браузеру.</div>"},{"t":"h3","id":"s67","h":"<h3>Проблемы и ограничения</h3>"},{"t":"p","h":"Автономность усиливает и сильные, и слабые стороны ИИ. Ошибку, которую ассистент сделал бы у вас на глазах, агент сделает в фоне и аккуратно оформит в пул-реквест."},{"t":"list","tag":"ul","c":"ul","items":["<li><strong>Не та задача.</strong> Расплывчатое описание агент понимает по-своему и уверенно реализует это понимание.</li>","<li><strong>Подгонка под проверку.</strong> Встречаются случаи, когда агент ослабляет или удаляет тест, чтобы получить зелёный CI (то есть «все проверки пройдены»). Изменения тестов требуют особого внимания на проверке.</li>","<li><strong>Prompt injection.</strong> Агент читает заявки (issue), описания проектов, веб-страницы и журналы. Вредоносная инструкция в любом из них может заставить его сделать то, чего вы не просили.</li>","<li><strong>Перегрузка проверки.</strong> Десять агентов создают десять пул-реквестов в день. Если команда не успевает их читать, качество падает незаметно.</li>","<li><strong>Стоимость.</strong> Длинные агентные сессии расходуют много токенов, а неудачные попытки тоже оплачиваются.</li>","<li><strong>Зацикливание.</strong> Агент повторяет одни и те же неудачные действия, пока не исчерпает бюджет.</li>"]},{"t":"fig","n":"ch10_stuck","cap":"Рис. 10.7 · зацикливание агента"},{"t":"p","h":"Как читать схему: в журнале действий агент повторяет одно и то же и получает одну и ту же ошибку. Выделенный фрагмент — признак зацикливания: пора остановить агента."},{"t":"h3","id":"s68","h":"<h3>Лучшие методы эффективного использования ИИ-агентов для программирования</h3>"},{"t":"list","tag":"ol","c":"ol","items":["<li data-n=\"1\"><strong>Начните с низкого риска.</strong> Обновление зависимостей, тесты для кода, который ими ещё не покрыт, исправление предупреждений линтера, документация. Это задачи, где ошибка дёшева и результат легко проверить.</li>","<li data-n=\"2\"><strong>Пишите задачу как заявку для нового сотрудника.</strong> Контекст, цель, критерии готовности, что нельзя трогать. Новому коллеге вы бы ничего не оставили «на догадки».</li>","<li data-n=\"3\"><strong>Тесты — это договор.</strong> Агенту запрещено менять существующие тесты без явного разрешения в задаче.</li>","<li data-n=\"4\"><strong>Минимальные права.</strong> Песочница, отсутствие доступа к боевым данным и секретам, интернет только по необходимости.</li>","<li data-n=\"5\"><strong>Маленькие задачи.</strong> Одна задача — один пул-реквест, который можно проверить за 20–30 минут.</li>","<li data-n=\"6\"><strong>Проверяйте как работу новичка.</strong> Смотрите на изменения так же внимательно, как на работу человека, вышедшего на первую неделю.</li>","<li data-n=\"7\"><strong>Учитесь на неудачах.</strong> Каждый провал агента — повод уточнить правила проекта или формат задач.</li>"]},{"t":"fig","n":"ch10_perms","cap":"Рис. 10.8 · права агента"},{"t":"p","h":"Как читать схему: зелёные строки — что агенту можно, красные — что нельзя. Чем уже права, тем меньше вреда может принести ошибка агента."},{"t":"p","h":"Шаблон задачи для фонового агента. Не страшно, если вы пока не знакомы с названиями файлов: подставьте свои, а если не знаете, попросите агента самому найти нужные места."},{"t":"code","c":"","label":"Markdown","lines":["## Задача","Добавить экспорт привычек пользователя в CSV.","","## Контекст","- Данные: таблицы habits и checkins (src/db/schema.ts).","- Похожая функциональность: экспорт отчётов в src/reports/export.ts.","","## Критерии готовности","- GET /api/habits/export отдаёт CSV только с данными текущего пользователя.","- Колонки: title, day; кодировка UTF-8 с BOM.","- Новые тесты: свои данные, чужие данные недоступны, пустой список.","- npm run lint, typecheck и test проходят.","","## Ограничения","- Не менять существующие тесты и схему БД.","- Без новых зависимостей."]},{"t":"p","h":"Что здесь написано. Это поручение в четыре части. «Задача» — одно предложение о том, что нужно: выгрузка привычек в <strong>CSV</strong> (простой текстовый файл с таблицей, который открывается в Excel). «Контекст» — где лежат нужные данные и есть ли похожее решение, чтобы агент не изобретал своё. «Критерии готовности» — как понять, что всё сделано: что должен отдавать новый адрес, какие колонки будут в файле, какие проверки добавить. «Ограничения» — чего агенту делать нельзя. Заметьте, что в критериях есть тест на то, чтобы чужие данные были недоступны: это та самая защита из главы 8."},{"t":"fig","n":"ch10_issue_pr","cap":"Рис. 10.9 · путь одной задачи"},{"t":"p","h":"Как читать схему: слева задача с критериями готовности, посередине агент, справа его пул-реквест. Вы участвуете в начале и в конце: ставите задачу и принимаете результат."},{"t":"p","h":"Та же задача простыми словами, без технических названий:"},{"t":"code","c":"prompt","label":"Запрос","lines":["Задача: пользователь должен уметь скачать список своих привычек в виде таблицы, которая откроется в Excel.","Контекст: данные о привычках и отметках уже хранятся в приложении. Найди, где они, и найди, как в проекте уже сделана выгрузка отчётов, и сделай похоже.","Как понять, что всё готово: пользователь видит только свои данные, в файле нормально отображаются русские буквы, есть проверки для случаев «свои данные», «чужие данные недоступны» и «пустой список», и все автоматические проверки проходят.","Нельзя: менять существующие проверки и устройство базы данных, подключать новые библиотеки.","В конце напиши простыми словами, что ты сделал и как мне проверить результат руками."]},{"t":"p","h":"Как принять результат, если вы не читаете код:"},{"t":"list","tag":"ul","c":"ul","items":["<li>Прочитайте описание от агента. Совпадает ли оно с тем, о чём вы просили?</li>","<li>Посмотрите, какие файлы он изменил. Нет ли среди них тех, которых он трогать не должен (настройки, проверки, база данных)?</li>","<li>Откройте результат и проверьте руками главный сценарий и пару необычных случаев.</li>","<li>Убедитесь, что автоматические проверки прошли и что агент не отключал и не ослаблял их.</li>","<li>Если что-то непонятно, спросите агента. Если ответ вас не устраивает, не принимайте изменение.</li>"]},{"t":"fig","n":"ch10_accept","cap":"Рис. 10.10 · задача для агента и приёмка"},{"t":"p","h":"Как читать схему: слева четыре части хорошей задачи, посередине агент, справа четыре шага приёмки. Все стрелки сходятся в агента и расходятся от него: вы формулируете задачу сами и сами проверяете итог."},{"t":"fig","n":"ch10_agent_pr","cap":"Рис. 10.11 · приёмка результата агента"},{"t":"p","h":"Как читать схему: так выглядит результат работы агента. Цифры совпадают с четырьмя шагами проверки: описание, список файлов, нетронутые тесты и проверки плюс ручной прогон. Красный файл — повод вернуть работу."},{"t":"h3","id":"s69","h":"<h3>Итоги и дальнейшие шаги</h3>"},{"t":"p","h":"Фоновые агенты переносят работу разработчика с написания кода на постановку задач и проверку результата. Они эффективны там, где задача чётко описана и проверяема, а среда изолирована. Надёжность на длинных задачах растёт быстро, но разрыв между «иногда» и «надёжно» пока велик."},{"t":"lbl","h":"<div class=\"lbl\">Упражнения</div>"},{"t":"list","tag":"ul","c":"tasks","items":["<li><label><input type=\"checkbox\" data-task=\"t44\"><span>Выберите три низкорисковые задачи для своего проекта (например, обновить библиотеки, добавить проверки для одной функции, улучшить описание проекта) и отдайте их агенту по шаблону из этой главы.</span></label></li>","<li><label><input type=\"checkbox\" data-task=\"t45\"><span>Спросите ИИ или посмотрите настройки агента, к чему у него есть доступ (файлы, интернет, ключи). Уберите всё лишнее.</span></label></li>","<li><label><input type=\"checkbox\" data-task=\"t46\"><span>Когда агент пришлёт результат, пройдитесь по списку «Как принять результат» и запишите, что заметили.</span></label></li>","<li><label><input type=\"checkbox\" data-task=\"t47\"><span>Попробуйте перекрёстную проверку: попросите модель другого семейства оценить изменения, сделанные агентом, и сравните её замечания со своими.</span></label></li>"]},{"t":"ch","id":"ch11","head":"Глава 11 · Не просто генерация кода","h":"<header class=\"ch-open\"><div class=\"ch-kicker\">Глава</div><div class=\"ch-big\">11</div><h2>Не просто генерация кода: что стоит ожидать от ИИ в будущем</h2></header>"},{"t":"p","h":"Генерация кода — только первая и самая заметная часть изменений. Следующие годы ИИ будет всё глубже входить в тестирование, сопровождение, дизайн, управление проектами и сами языки программирования. Прогнозы в этой главе — не обещания, а направления, которые уже видны в 2026 году."},{"t":"p","h":"Эта глава поможет вам понять, какие навыки не потеряют ценности, что бы ни случилось с инструментами. В каждом разделе есть абзац «Что это значит для вас»."},{"t":"h3","id":"s70","h":"<h3>ИИ в тестировании, отладке и сопровождении</h3>"},{"t":"p","h":"<strong>Сопровождение</strong> — это всё, что происходит с программой после выпуска: исправление ошибок, обновления, адаптация к новым условиям. Оно занимает большую часть жизни любой системы, и именно здесь ИИ может дать наибольший накопленный эффект. Скучная, но важная работа — обновления, перенос данных, разбор журналов — хорошо подходит агентам."},{"t":"p","h":"Что уже происходит и будет расти:"},{"t":"list","tag":"ul","c":"ul","items":["<li><strong>Тесты из требований.</strong> Агент читает описание того, что должна делать программа (спецификацию), и пишет тесты до реализации, а при изменении требований обновляет их.</li>","<li><strong>Самовосстанавливающиеся тесты.</strong> Сквозные тесты (те, что управляют браузером, как человек), которые сами подстраиваются под изменение вёрстки, но сообщают, если изменилось поведение.</li>","<li><strong>Разбор инцидентов.</strong> <strong>Инцидент</strong> — это сбой, из-за которого приложение работает неправильно или не работает совсем. Агент на дежурстве собирает журналы, показатели и недавние изменения, формулирует гипотезы и предлагает исправление, а человек принимает решение.</li>","<li><strong>Непрерывные миграции.</strong> Обновление библиотек и переход на новые версии чужих сервисов превращаются из квартальных проектов в фоновый процесс.</li>","<li><strong>Поиск уязвимостей.</strong> Сильные модели находят уязвимости в больших проектах, и защитники получают инструмент, которым раньше располагали только крупные команды.</li>"]},{"t":"fig","n":"ch11_spec_to_tests","cap":"Рис. 11.1 · из спецификации в тесты"},{"t":"p","h":"Как читать схему: слева требования словами, справа проверки, которые написал агент. Каждое требование превращается в отдельный тест."},{"t":"p","h":"Главный вызов — доверие. Автоматическое исправление на боевом сервере без человека остаётся риском, пока надёжность агентов на длинных задачах далека от 100%."},{"t":"fig","n":"ch11_incident","cap":"Рис. 11.2 · разбор инцидента"},{"t":"p","h":"Как читать схему: верхний ряд — работа агента: собрать данные, предложить гипотезы и исправление. Нижний ряд — ваша часть: решение и тест, который не даст ошибке вернуться."},{"t":"p","h":"<strong>Что это значит для вас.</strong> Чем больше рутины возьмут на себя агенты, тем важнее будут простые привычки: тесты, понятные записи о том, что и почему сделано, и способность проверить результат. Заведите их уже сейчас на небольшом проекте."},{"t":"h3","id":"s71","h":"<h3>Дизайн и персонализация пользовательского опыта</h3>"},{"t":"p","h":"Граница между дизайном и разработкой размывается. Описание или эскиз превращаются в рабочий интерфейс за минуты, а <strong>дизайн-система</strong> (набор правил оформления: цвета, шрифты, готовые блоки) становится контекстом, по которому ИИ собирает экраны в едином стиле."},{"t":"p","h":"Направления, которые стоит отслеживать:"},{"t":"list","tag":"ul","c":"ul","items":["<li><strong>Дизайн-системы как контекст для ИИ.</strong> Цвета, шрифты и готовые блоки интерфейса (компоненты), описанные так, чтобы их мог прочитать компьютер, позволяют генерировать интерфейсы, которые не нужно перерисовывать.</li>","<li><strong>Генеративные интерфейсы.</strong> Часть интерфейса собирается под конкретный запрос пользователя, а не рисуется заранее для всех.</li>","<li><strong>Персонализация.</strong> Интерфейс подстраивается под опыт и задачи человека: новичку — подсказки, эксперту — плотная компоновка и горячие клавиши.</li>","<li><strong>Доступность по умолчанию.</strong> ИИ проверяет контраст, подписи и управление с клавиатуры на этапе создания, а не после жалоб (вспомните главу 9).</li>"]},{"t":"p","h":"Риски тоже понятны: непредсказуемый интерфейс сложнее тестировать и запоминать, а персонализация требует данных о пользователе и бережного отношения к ним."},{"t":"p","h":"<strong>Что это значит для вас.</strong> Вкус и понимание того, как людям удобно пользоваться, остаются за человеком. Если вы разбираетесь в дизайне или в предметной области, это ваше сильное преимущество: ИИ сделает много вариантов, но выбрать лучший должны вы."},{"t":"h3","id":"s72","h":"<h3>Эволюция проджект-менеджмента с помощью ИИ</h3>"},{"t":"p","h":"<strong>Проджект-менеджмент</strong> — управление проектами: планирование, распределение задач, контроль сроков. Когда код дешевеет, дорожает ясность. Главным документом проекта становится спецификация: от её качества зависит, сколько агенты сделают правильно с первого раза."},{"t":"p","h":"Как меняется управление проектами:"},{"t":"list","tag":"ul","c":"ul","items":["<li><strong>Спецификация — центр процесса.</strong> Требования, критерии готовности и ограничения пишутся так, чтобы их мог исполнить и человек, и агент.</li>","<li><strong>Задачи из обсуждений.</strong> ИИ превращает встречи и переписку в черновики задач, а менеджер их редактирует и расставляет приоритеты. Командные агенты уже живут прямо в рабочих мессенджерах.</li>","<li><strong>Новая математика оценок.</strong> Написание кода сокращается, а проверка, соединение частей и согласование занимают прежнее время. Оценки нужно пересчитывать с учётом этого сдвига.</li>","<li><strong>Прототип вместо документа.</strong> Менеджер продукта может показать работающий прототип там, где раньше писал страницы требований.</li>","<li><strong>Другие метрики.</strong> Количество строк и закрытых задач теряет смысл, когда их генерирует агент. Важнее время от идеи до проверенной гипотезы и количество инцидентов.</li>"]},{"t":"fig","n":"ch11_pm","cap":"Рис. 11.3 · проект с агентами"},{"t":"p","h":"Как читать схему: спецификация стоит между обсуждениями и работой агентов. Если проверка показывает неясность, пунктир возвращает вас к спецификации, а не к правкам кода вслепую."},{"t":"fig","n":"ch11_costs","cap":"Рис. 11.4 · новая математика оценок"},{"t":"p","h":"Как читать схему: левые столбики — как было, правые — как стало с агентами. Короче стало только написание кода, а проверка, соединение частей и согласование заняли прежнее время."},{"t":"p","h":"<strong>Что это значит для вас.</strong> Если вы руководите собственным проектом, вы уже проджект-менеджер. Учитесь писать короткие и ясные описания задач с критериями «как понять, что готово»: этот навык окупается и с людьми, и с агентами."},{"t":"h3","id":"s73","h":"<h3>Как автономные агенты изменят сферу разработки ПО</h3>"},{"t":"p","h":"Самое заметное изменение — роль разработчика. Он всё меньше автор каждой строки и всё больше редактор, постановщик задач и руководитель группы агентов."},{"t":"fig","n":"11.1","cap":"Рис. 11.5 · как меняется роль разработчика"},{"t":"p","h":"Как читать схему: по горизонтали идёт время (до ИИ, автодополнение и чат, агенты рядом, фоновые агенты), а по вертикали показаны роли: автор (пишет каждую строку сам), редактор (принимает и правит подсказки ИИ), постановщик (пишет спецификации и проверяет код) и оркестратор (руководит агентами и отвечает за итог). Роли не сменяют друг друга полностью: в один день человек бывает и автором, и оркестратором, но основа внизу остаётся неизменной: ответственность за результат и понимание того, что вы выпускаете."},{"t":"p","h":"Что, вероятно, нас ждёт:"},{"t":"list","tag":"ul","c":"ul","items":["<li><strong>Растущий горизонт задач.</strong> По данным METR, длина задач, которые агенты решают в половине случаев, удваивалась каждые 4–7 месяцев, а по оценкам начала 2026 года в последние годы — ещё быстрее, примерно раз в 3–4 месяца. Если тренд продолжится, агенты будут брать задачи размером в недели работы. Но экстраполяции тренда (продолжение его линии в будущее) — это не гарантия.</li>","<li><strong>Проверка как узкое место.</strong> Когда агенты производят код быстрее, чем люди его читают, ценность смещается к тестам, формальным договорённостям между частями системы (контрактам), наблюдаемости (способности видеть, как работает приложение) и умению быстро проверять.</li>","<li><strong>Маленькие команды с большим охватом.</strong> Команда из нескольких человек и десятков агентов может поддерживать продукт, для которого раньше требовалась команда в десятки человек.</li>","<li><strong>Новые роли.</strong> Инженер по агентной инфраструктуре, специалист по оценке качества ИИ-систем, ревьюер с акцентом на безопасность.</li>","<li><strong>Инфраструктура для агентов.</strong> Песочницы, правила доступа, журналы действий, бюджеты и аудит станут такой же стандартной частью платформы, как автоматические проверки (CI) сегодня.</li>"]},{"t":"p","h":"<strong>Что это значит для вас.</strong> Вы можете выбрать роль, в которой вам комфортно: от постановщика задач до оркестратора. Для начала достаточно научиться ставить задачи и проверять результат: это и есть основа обеих ролей."},{"t":"h3","id":"s74","h":"<h3>Будущее языков программирования и возможность разработки на основе естественного языка</h3>"},{"t":"p","h":"Естественный язык (то есть обычный человеческий) становится новым «языком высокого уровня»: мы всё чаще описываем, что нужно, а не как. Но у него есть фундаментальный недостаток — неоднозначность. «Сделай кнопку побольше» можно понять по-разному. Поэтому точные средства выражения не исчезнут, а сменят роль."},{"t":"p","h":"Что останется и даже усилится:"},{"t":"list","tag":"ul","c":"ul","items":["<li><strong>Типы.</strong> <strong>Строгая типизация</strong> — свойство языка, при котором у каждого значения есть чётко заданный вид (число, текст, дата), а ошибки вида «вместо числа дали текст» ловятся сразу. Она даёт ИИ и человеку мгновенную проверку. Популярность языков со строгими типами в ИИ-разработке растёт не случайно.</li>","<li><strong>Тесты и контракты.</strong> Они превращают расплывчатое намерение в проверяемое условие.</li>","<li><strong>Спецификации.</strong> Структурированные описания требований — промежуточный слой между разговорным языком и кодом.</li>","<li><strong>Формальная верификация.</strong> Это математическое доказательство того, что программа делает именно то, что заявлено. ИИ уже помогает писать такие доказательства в системах вроде Lean. Там, где цена ошибки высока, доказанная корректность может стать доступнее.</li>"]},{"t":"p","h":"Вероятный сценарий — не исчезновение кода, а смещение внимания. Код становится промежуточным представлением, которое читают реже, но которое по-прежнему должно быть понятным в момент, когда что-то пошло не так."},{"t":"fig","n":"ch11_layers","cap":"Рис. 11.6 · смещение внимания"},{"t":"p","h":"Как читать схему: внимание человека поднимается вверх по ступеням: от строк кода к намерению и условиям проверки. Код остаётся, но читают его реже, и он по-прежнему должен быть понятным, когда что-то пошло не так."},{"t":"note","h":"<div class=\"note simple\"><span class=\"nl\">Простыми словами</span> Это похоже на то, как со временем изменилась работа с чертежами. Раньше их рисовали вручную, потом начали делать на компьютере. Но сами чертежи никуда не делись: по ним до сих пор строят дома. Так же и код: его будут писать реже, но он останется «чертежом», по которому всё работает, и в нужный момент его придётся прочитать.</div>"},{"t":"p","h":"<strong>Что это значит для вас.</strong> Учитесь формулировать мысли точно: перечисляйте случаи, приводите примеры и описывайте, как проверить результат. Это и есть программирование на естественном языке."},{"t":"h3","id":"s75","h":"<h3>Как вайб-кодинг меняет индустрию</h3>"},{"t":"p","h":"Вайб-кодинг расширил круг людей, которые создают программы. Это одно из самых демократизирующих изменений в истории разработки (оно делает программирование доступнее для всех) — и одно из самых рискованных."},{"t":"p","h":"Что меняется:"},{"t":"list","tag":"ul","c":"ul","items":["<li><strong>Взрыв количества программ.</strong> Личные инструменты, внутренние утилиты, программы «для одного пользователя» становятся нормой.</li>","<li><strong>Найм и обучение.</strong> Порог входа в профессию сместился: от начинающего специалиста ждут умения работать с ИИ и, главное, проверять его результат.</li>","<li><strong>Ценность вкуса и суждения.</strong> Когда сделать что-то стало дёшево, решающим становится понимание, что именно стоит делать.</li>","<li><strong>Новые компании.</strong> Небольшие команды строят продукты, которые раньше требовали десятков разработчиков.</li>","<li><strong>Волна уязвимого ПО.</strong> Обратная сторона доступности: много кода, который никто не проверял. Спрос на безопасность и надёжность будет только расти.</li>"]},{"t":"p","h":"<strong>Что это значит для вас.</strong> Вы как раз входите в эту новую волну людей. Ваше преимущество не в том, что вы быстрее всех генерируете код, а в том, что вы понимаете, что делаете, проверяете результат и отвечаете за него. Это то, чему учила эта книга."},{"t":"h3","id":"s76","h":"<h3>Итоги и дальнейшие шаги</h3>"},{"t":"p","h":"ИИ меняет не только то, как пишется код, но и то, кем становится разработчик. Генерация дешевеет, а понимание, постановка задач, проверка и ответственность дорожают. Это хорошая новость для тех, кто вкладывается именно в них."},{"t":"p","h":"Вся книга сводится к нескольким мыслям:"},{"t":"list","tag":"ol","c":"ol","items":["<li data-n=\"1\">Выбирайте режим работы с ИИ под цену ошибки.</li>","<li data-n=\"2\">Передавайте ИИ намерение, контекст и критерии проверки, а не только команды.</li>","<li data-n=\"3\">Помните о последних 30% и закладывайте на них время.</li>","<li data-n=\"4\">Понимайте всё, что выпускаете, и проверяйте это тестами.</li>","<li data-n=\"5\">Встраивайте безопасность в процесс, а не в финальный этап.</li>","<li data-n=\"6\">Делегируйте агентам то, что можно проверить, и оставляйте себе решения.</li>"]},{"t":"lbl","h":"<div class=\"lbl\">Упражнения</div>"},{"t":"list","tag":"ul","c":"tasks","items":["<li><label><input type=\"checkbox\" data-task=\"t48\"><span>Напишите, как изменится ваша работа через два года, если горизонт задач агентов вырастет в четыре раза. Затем попросите ИИ найти в вашем описании слабые места и предположения, которые стоит проверить.</span></label></li>","<li><label><input type=\"checkbox\" data-task=\"t49\"><span>Выберите одну область сопровождения в вашем проекте (например, обновление библиотек или проверка ошибок) и попробуйте отдать её агенту на месяц. Запишите, что получилось и что вы проверяли.</span></label></li>","<li><label><input type=\"checkbox\" data-task=\"t50\"><span>Вернитесь к упражнениям главы 1 и сравните, как изменился ваш подход за время чтения книги. Что вы теперь делаете иначе?</span></label></li>"]},{"t":"part","id":"p4","num":"IV","title":"Практикум","h":"<div class=\"part-in\"><div class=\"pt-kicker\">Часть</div><div class=\"pt-num\">IV</div><h2 class=\"pt-title\">Практикум</h2><ol class=\"pt-list\"><li><span>12</span>Обратная инженерия: как сделать своё приложение по образцу</li></ol></div>"},{"t":"ch","id":"ch12","head":"Глава 12 · Обратная инженерия","h":"<header class=\"ch-open\"><div class=\"ch-kicker\">Глава</div><div class=\"ch-big\">12</div><h2>Обратная инженерия: как сделать своё приложение по образцу</h2></header>"},{"t":"p","h":"Почти каждое новое приложение начинается с фразы «хочу как у них, только…». Как известный трекер привычек, но для занятий музыкой. Как популярная доска задач, но для ремонта квартиры. Это нормальный путь: у готового продукта уже проверены сценарии, решены сотни мелких вопросов, и на нём видно, что людям действительно нужно. Вопрос в том, как взять у образца лучшее, не скопировав чужое и не утонув в деталях."},{"t":"p","h":"<strong>Обратная инженерия</strong> (<em>reverse engineering</em>) — разбор готового продукта, чтобы понять, как он устроен. Обычная разработка идёт от идеи к коду, обратная — от готового продукта к пониманию: что он умеет, из каких частей состоит, по каким правилам работает. В этой главе вы научитесь разбирать <strong>эталон</strong> — приложение, на которое ориентируетесь, — и собирать по этому разбору своё: своим кодом и со своим лицом."},{"t":"p","h":"ИИ сделал этот путь доступным новичку. Модель видит скриншоты и превращает увиденное в описание, а агент собирает приложение по описанию. Но ИИ так же легко скопирует чужое один в один, если не провести границу. Поэтому сначала разберёмся, где она проходит."},{"t":"h3","id":"s84","h":"<h3>Что такое обратная инженерия и зачем она вам</h3>"},{"t":"p","h":"Прямая разработка идёт по цепочке «идея → описание (спецификация) → код → продукт». Обратная идёт навстречу: «готовый продукт → разбор → описание». Когда по этому описанию вы пишете свой код, цепочки сходятся: получается своё приложение, которое умеет то же, что эталон, но построено заново."},{"t":"fig","n":"ch12_directions","cap":"Рис. 12.1 · прямая и обратная разработка"},{"t":"p","h":"Как читать схему: верхний ряд — обычная разработка, слева направо. Нижний — обратная, справа налево: от эталона через разбор к описанию своими словами. Синяя стрелка показывает, где вы входите в обычную разработку. Код эталона в этой цепочке не участвует."},{"t":"p","h":"Вайб-кодеру обратная инженерия нужна в пяти ситуациях:"},{"t":"list","tag":"ul","c":"ul","items":["<li><strong>Своё приложение по образцу.</strong> Главная тема этой главы: разобрать эталон и сделать функциональный аналог.</li>","<li><strong>Свой проект, написанный ИИ.</strong> Код писали не вы, поэтому каждый раз, когда нужно понять собственный проект, вы разбираете чужую работу. Это та же обратная инженерия, только без юридических оговорок.</li>","<li><strong>Учёба на открытых проектах.</strong> Взять приложение с открытым кодом, разобрать его с агентом и собрать упрощённую версию с нуля — один из самых быстрых способов научиться.</li>","<li><strong>Старая система без документации.</strong> Сначала восстановить описание того, что она делает, потом строить новую версию (вспомните историю о переносе интерфейса в главе 7).</li>","<li><strong>Сами модели.</strong> Бенчмарки из главы 1 — тоже обратная инженерия: по поведению модели вы выясняете, что она умеет.</li>"]},{"t":"note","h":"<div class=\"note simple\"><span class=\"nl\">Простыми словами</span> Повар пробует блюдо в ресторане и пытается понять, из чего оно и как приготовлено. Потом пишет свой рецепт и готовит по нему у себя на кухне. Он не крадёт рецепт с чужой кухни и не подаёт блюдо под чужим названием. Обратная инженерия устроена так же: пробовать можно, красть нельзя.</div>"},{"t":"h3","id":"s85","h":"<h3>Где проходит граница: что можно взять у эталона</h3>"},{"t":"p","h":"Главное правило звучит так: <strong>идеи и поведение свободны, исполнение защищено</strong>. Гражданский кодекс РФ прямо говорит, что авторское право не распространяется на идеи, концепции, принципы, методы, процессы и способы (статья 1259). Охраняется конкретная форма: код, тексты, изображения, оригинальное оформление. Похожие правила действуют в большинстве стран."},{"t":"p","h":"Изучать, как работает программа, чтобы понять её идеи и принципы, тоже можно: статья 1280 ГК РФ разрешает это законному владельцу программы, а европейское право — законному пользователю. А вот <strong>декомпиляция</strong> — перевод готовой программы обратно в исходный код — разрешена только в узком случае: чтобы добиться совместимости со своей программой. Использовать полученные таким путём сведения, чтобы сделать похожую программу, закон прямо запрещает. Для функционального аналога декомпиляция и не нужна."},{"t":"p","h":"Есть ещё три слоя защиты, о которых новички забывают:"},{"t":"list","tag":"ul","c":"ul","items":["<li><strong>Условия использования.</strong> Многие сервисы в пользовательском соглашении запрещают обратную инженерию, автоматический сбор данных и копирование контента. Нарушить их можно, даже не трогая код.</li>","<li><strong>Товарный знак и узнаваемый облик.</strong> Название, логотип, фирменные цвета и характерный вид продукта защищаются отдельно. Копирование, из-за которого люди путают ваш продукт с чужим, считается недобросовестной конкуренцией.</li>","<li><strong>Лицензии открытого кода.</strong> Если эталон открыт, прочитайте его лицензию. Код под копилефт-лицензией (например, GPL) можно использовать, только если ваш код тоже станет открытым (глава 9).</li>"]},{"t":"p","h":"Насколько близко к эталону можно подойти, удобно представить как шкалу:"},{"t":"fig","n":"ch12_scale","cap":"Рис. 12.2 · шкала: от вдохновения до копии"},{"t":"p","h":"Как читать схему: слева направо растёт близость к эталону и вместе с ней риск. Вдохновение безопасно, функциональный аналог — нормальная конкуренция, визуальный двойник уже рискован, копия запрещена. Цель этой главы — второе деление шкалы."},{"t":"p","h":"Так появились многие известные продукты. В начале 1980-х компания Compaq сделала компьютер, совместимый с IBM PC. Одни её инженеры изучили, как работает служебная программа IBM, управляющая компьютером (BIOS), и описали это словами, а другие, никогда не видевшие её кода, написали свою по этому описанию. Такой приём назвали <strong>«чистой комнатой»</strong> (<em>clean room</em>), и на нём построен метод из следующего раздела."},{"t":"note","h":"<div class=\"note warn\"><span class=\"nl\">Внимание</span> Этот раздел — ориентир, а не юридическая консультация. Если вы делаете коммерческий продукт по образцу известного сервиса, покажите план юристу до запуска: это дешевле, чем переделывать после претензии.</div>"},{"t":"h3","id":"s86","h":"<h3>Метод чистой комнаты: пять шагов</h3>"},{"t":"p","h":"Метод разбит на пять шагов. Между третьим и четвёртым стоит «стена»: всё, что вы узнали об эталоне, проходит через неё только в виде описания своими словами. Сборка идёт по описанию, а не по скриншотам."},{"t":"fig","n":"ch12_cleanroom","cap":"Рис. 12.3 · пять шагов чистой комнаты"},{"t":"p","h":"Как читать схему: слева от стены — работа с эталоном, справа — ваша разработка. Через стену проходит одна стрелка, и это описание. Скриншоты, тексты и код эталона остаются по ту сторону."},{"t":"list","tag":"ol","c":"ol","items":["<li data-n=\"1\"><strong>Собрать материал</strong> так, как его видит обычный пользователь.</li>","<li data-n=\"2\"><strong>Разобрать</strong> эталон на слои: экраны, данные, сценарии, правила.</li>","<li data-n=\"3\"><strong>Описать</strong> своё приложение своими словами и решить, чем оно будет отличаться.</li>","<li data-n=\"4\"><strong>Собрать заново</strong> по описанию, в новой сессии, без скриншотов эталона.</li>","<li data-n=\"5\"><strong>Сверить</strong> поведение с эталоном и с описанием.</li>"]},{"t":"p","h":"Дальше — каждый шаг подробно. Для примера возьмём условный эталон: популярный трекер привычек, по образцу которого вы хотите сделать свой — для тех, кто учится играть на гитаре."},{"t":"h3","id":"s87","h":"<h3>Шаги 1–2: собрать материал и разобрать эталон</h3>"},{"t":"p","h":"Материал собирают так, как его видит обычный пользователь. Заведите в эталоне свой аккаунт и пройдите его целиком:"},{"t":"list","tag":"ul","c":"ul","items":["<li>скриншоты каждого экрана, включая пустые состояния («у вас пока нет привычек»), ошибки и настройки;</li>","<li>запись экрана главных сценариев: регистрация, основное действие, оплата, удаление аккаунта;</li>","<li>справочный центр и страница с ценами: в них записаны правила, которых не видно в интерфейсе;</li>","<li>публичная документация и список изменений, если они есть;</li>","<li>отзывы пользователей в магазинах приложений: на что жалуются люди, там и ваше будущее отличие.</li>"]},{"t":"p","h":"Пройти эталон можно и вместе с Claude in Chrome (глава 10): агент нажимает кнопки и делает скриншоты, а вы наблюдаете. Работайте в своём аккаунте и по одному сценарию, как обычный пользователь."},{"t":"note","h":"<div class=\"note warn\"><span class=\"nl\">Внимание</span> Чего делать нельзя: вскрывать код приложения, обходить вход и защиту, массово выкачивать данные и контент, пользоваться закрытым API без разрешения. Если сервис в соглашении запрещает автоматический сбор данных, не поручайте агенту обходить его в цикле.</div>"},{"t":"p","h":"Теперь разберите собранное на слои. Каждый слой отвечает на свой вопрос:"},{"t":"list","tag":"ul","c":"ul","items":["<li><strong>Карта экранов</strong> — какие экраны есть и как между ними переходят.</li>","<li><strong>Сущности и данные</strong> — какие объекты живут в приложении (пользователь, привычка, отметка, напоминание), какие у них свойства и как они связаны. По интерфейсу модель данных почти всегда восстанавливается: каждая форма подсказывает поля, каждый список — связь.</li>","<li><strong>Сценарии</strong> — что пользователь делает шаг за шагом в главных случаях.</li>","<li><strong>Правила и крайние случаи</strong> — что происходит при пустом поле, при удалении, после полуночи, без интернета, на бесплатном и платном тарифе.</li>","<li><strong>Оформление</strong> — сетка, отступы, типы элементов (карточки, списки, вкладки). Это образец того, как устроено удобство, а не макет для копирования.</li>","<li><strong>Невидимое</strong> — скорость, уведомления, работа без интернета, синхронизация между устройствами.</li>"]},{"t":"p","h":"Отдайте материал ИИ и попросите разбор. Сразу скажите, что вам нужно описание, а не копия:"},{"t":"code","c":"prompt","label":"Запрос","lines":["Ниже скриншоты и описание сценариев приложения-эталона.","Не копируй тексты, названия и оформление: мне нужно описание устройства, по которому я сделаю своё приложение.","1. Карта экранов: список экранов и переходы между ними.","2. Сущности: какие объекты есть в приложении, их поля и связи.","3. Сценарии: 3–5 главных действий пользователя по шагам.","4. Правила и крайние случаи, которые видны или угадываются.","5. Невидимое: уведомления, работа без интернета, синхронизация.","6. Чего по материалам не понять — список вопросов, которые я проверю вручную."]},{"t":"p","h":"Что здесь важно. Последний пункт самый ценный. ИИ охотно додумывает то, чего не видел, и подаёт догадки как факты. Список вопросов отделяет то, что вы знаете, от того, что предполагаете. Каждый вопрос проверьте руками в эталоне."},{"t":"h3","id":"s88","h":"<h3>Шаг 3: описание своими словами</h3>"},{"t":"p","h":"Это ключевой шаг чистой комнаты. Из разбора эталона вы пишете спецификацию своего приложения: что оно делает, без названий, текстов и картинок эталона. Заодно по каждой возможности эталона вы принимаете одно из трёх решений:"},{"t":"list","tag":"ul","c":"ul","items":["<li><strong>Берём</strong> — без этого продукт не работает. Для трекера это привычки, отметки и серии дней подряд.</li>","<li><strong>Меняем</strong> — здесь ваше отличие. Для гитаристов это учёт минут занятий вместо галочек и встроенный метроном.</li>","<li><strong>Откладываем</strong> — всё, без чего можно выпустить первую версию: друзья, достижения, темы оформления.</li>"]},{"t":"note","h":"<div class=\"note tip\"><span class=\"nl\">Совет</span> Не стремитесь к полному повторению. У зрелого эталона сотни возможностей, накопленных за годы. Первой версии достаточно повторить то немногое, чем пользуется большинство людей, и добавить одно отличие, ради которого к вам перейдут. Отличие подскажут отзывы пользователей эталона: на что они жалуются чаще всего.</div>"},{"t":"p","h":"Шаблон спецификации:"},{"t":"code","c":"","label":"Markdown","lines":["# [Название вашего приложения]","","## Для кого и зачем","[Кто пользуется и какую задачу решает.]","","## Чем отличается от похожих приложений","[Почему ваш пользователь выберет вас.]","","## Сущности","- [Объект]: [поля], связан с [объектом]","","## Сценарии","1. [Пользователь открывает… нажимает… видит…]","","## Правила и крайние случаи","- [Что происходит, если…]","","## Не входит в первую версию","- [Что откладываем]"]},{"t":"p","h":"Попросите ИИ заполнить шаблон по разбору, а потом прочитайте результат с одним вопросом: нет ли в нём чужих названий, текстов и фирменных деталей. Если есть, замените своими. Это и есть «стена»: дальше идёт только этот документ."},{"t":"code","c":"prompt","label":"Запрос","lines":["Вот разбор приложения-эталона: [вставьте результат шага 2].","Составь по шаблону спецификацию моего приложения: [вставьте шаблон].","Мой пользователь: [кто]. Моё отличие: [что].","Пиши своими словами: без названий, текстов интерфейса и фирменных деталей эталона.","Отметь, какие возможности эталона мы берём, какие меняем и какие откладываем, и объясни почему."]},{"t":"h3","id":"s89","h":"<h3>Шаги 4–5: собрать по описанию и сверить</h3>"},{"t":"p","h":"Сборку начинайте в <strong>новой сессии</strong>, в которую даёте только спецификацию. Без скриншотов эталона агент не перенесёт чужие тексты и пиксели, а построит своё. Дальше всё как в главе 7: свой стек, вертикальные срезы, тесты для главных сценариев."},{"t":"p","h":"Оформление тоже делайте своё. Опишите характер продукта словами («спокойный, для вечерних занятий, крупные кнопки») и попросите ИИ предложить свою дизайн-систему: цвета, шрифты, компоненты. Удобно делать это в дизайн-холсте вроде Claude Design (глава 6), а потом передать агенту."},{"t":"p","h":"Когда первая версия готова, сверьте её с эталоном. Для этого заведите таблицу <strong>паритета функций</strong> — список возможностей с отметкой, что уже есть у вас:"},{"t":"table","head":"<tr><th>Возможность</th><th>У них → у нас</th><th>Решение</th></tr>","rows":["<tr><td>Создать привычку</td><td>Есть → есть</td><td>Готово</td></tr>","<tr><td>Отметить занятие</td><td>Галочка → минуты и метроном</td><td>Наше отличие</td></tr>","<tr><td>Серия дней подряд</td><td>Есть → есть</td><td>Готово</td></tr>","<tr><td>Напоминания</td><td>Есть → нет</td><td>Во второй версии</td></tr>","<tr><td>Друзья и рейтинг</td><td>Есть → нет</td><td>Не делаем</td></tr>"],"cols":3},{"t":"p","h":"Пройдите главные сценарии в двух приложениях бок о бок. Сравнивайте не внешний вид, а поведение: что происходит при тех же действиях, где ваша версия ведёт себя иначе и задумано ли это."},{"t":"code","c":"prompt","label":"Запрос","lines":["Вот спецификация моего приложения: [вставьте].","Вот список возможностей эталона из разбора: [вставьте].","1. Составь таблицу паритета: возможность, есть ли у эталона, есть ли у нас, решение (готово, наше отличие, позже, не делаем).","2. Для каждого сценария из спецификации напиши сквозной тест.","3. Перечисли места, где наше поведение отличается от эталона без явного решения в спецификации."]},{"t":"h3","id":"s90","h":"<h3>Ловушки обратной инженерии с ИИ</h3>"},{"t":"list","tag":"ol","c":"ol","items":["<li data-n=\"1\"><strong>«Сделай так же» по скриншоту.</strong> Агент перенесёт тексты, иконки и цвета один в один, и вы получите визуального двойника, сами того не желая. Сначала описание, потом сборка по описанию.</li>","<li data-n=\"2\"><strong>Память модели.</strong> Если эталон — известный проект с открытым кодом, модель может «вспомнить» его код почти дословно. Проверьте лицензию и включите сканер лицензий (глава 9).</li>","<li data-n=\"3\"><strong>Чужое имя.</strong> Название, созвучное эталону, логотип «по мотивам», похожая иконка в магазине приложений — прямой путь к претензиям из-за товарного знака.</li>","<li data-n=\"4\"><strong>Копирование ошибок.</strong> Эталон тоже не идеален. Повторяя его поведение без понимания, вы переносите и его неудачные решения. Спрашивайте «зачем это здесь?», прежде чем брать.</li>","<li data-n=\"5\"><strong>Бесконечный паритет.</strong> Погоня за полным повторением превращает проект в вечно догоняющий. Первая версия — главные сценарии и ваше отличие, остальное потом.</li>","<li data-n=\"6\"><strong>Чужие данные.</strong> Тексты, каталоги, базы и отзывы эталона — не ваши. Выкачать их «для наполнения» значит нарушить и права, и условия сервиса. Наполняйте приложение своими или открытыми данными с понятной лицензией.</li>","<li data-n=\"7\"><strong>Догадки ИИ как факты.</strong> Модель уверенно описывает то, чего не видела: «скорее всего, здесь хранится так». Проверяйте руками всё, на чём держится ваша логика.</li>"]},{"t":"h3","id":"s91","h":"<h3>Разбор своего и чужого кода: три прохода</h3>"},{"t":"p","h":"Обратная инженерия нужна не только для чужих продуктов. Чаще всего вы будете разбирать собственный проект, написанный ИИ, или открытый проект, на котором учитесь. Здесь работает простой метод из трёх проходов:"},{"t":"list","tag":"ol","c":"ol","items":["<li data-n=\"1\"><strong>Карта.</strong> Как устроен проект: главные части, как они связаны, откуда всё начинается.</li>","<li data-n=\"2\"><strong>Один сценарий.</strong> Что происходит файл за файлом, когда пользователь нажимает «Отметить». Это та же трассировка, что в главе 5.</li>","<li data-n=\"3\"><strong>Описание.</strong> Что приложение умеет, какие правила соблюдает и какие крайние случаи обрабатывает, — спецификация, восстановленная по коду.</li>"]},{"t":"p","h":"Третий проход особенно полезен, когда проект разросся от правок: по восстановленной спецификации его можно пересобрать с чистого листа (вспомните совет из главы 6). А для учёбы есть приём «разобрать и пересобрать»: возьмите небольшой открытый проект, пройдите три прохода, закройте его код и соберите свою упрощённую версию по описанию. Потом сравните. За неделю такой практики вы поймёте больше, чем за месяц чтения учебников."},{"t":"code","c":"prompt","label":"Запрос","lines":["Помоги мне разобраться в этом проекте. Я новичок и код построчно не читаю.","1. Карта: главные части проекта, как они связаны, откуда начинается работа приложения. Нарисуй схему текстом.","2. Один сценарий: проследи файл за файлом, что происходит, когда пользователь [действие].","3. Описание: восстанови по коду, что приложение умеет, какие правила соблюдает и какие крайние случаи обрабатывает.","Где ты не уверен, так и скажи — не додумывай."]},{"t":"h3","id":"s92","h":"<h3>Итоги и дальнейшие шаги</h3>"},{"t":"p","h":"Обратная инженерия — умение смотреть на готовый продукт глазами разработчика: видеть за экранами данные, сценарии и правила. С ИИ такой разбор занимает часы, а не недели. Но граница остаётся прежней: идеи и поведение можно брать, исполнение — нет. Главное из этой главы:"},{"t":"list","tag":"ul","c":"ul","items":["<li>разбирайте эталон как пользователь, без вскрытия кода и обхода защиты;</li>","<li>пишите спецификацию своими словами — это стена между разбором и сборкой;</li>","<li>собирайте по описанию в новой сессии, со своим кодом, оформлением и названием;</li>","<li>сверяйте поведение по таблице паритета и не гонитесь за полным повторением;</li>","<li>ищите своё отличие в жалобах пользователей эталона.</li>"]},{"t":"lbl","h":"<div class=\"lbl\">Упражнения</div>"},{"t":"list","tag":"ul","c":"tasks","items":["<li><label><input type=\"checkbox\" data-task=\"t58\"><span>Выберите эталон для своего будущего приложения. Соберите материал по шагу 1: скриншоты всех экранов, запись одного главного сценария, страницу цен и десять отзывов пользователей.</span></label></li>","<li><label><input type=\"checkbox\" data-task=\"t59\"><span>Отдайте материал ИИ с запросом на разбор из этой главы. Проверьте руками в эталоне три пункта из списка «чего не понять».</span></label></li>","<li><label><input type=\"checkbox\" data-task=\"t60\"><span>Напишите спецификацию своего приложения по шаблону. Прочитайте её и вычеркните всё, что выдаёт эталон: названия, тексты, фирменные детали.</span></label></li>","<li><label><input type=\"checkbox\" data-task=\"t61\"><span>Возьмите небольшой открытый проект на GitHub и сделайте три прохода разбора. Закройте его код и соберите свою упрощённую версию по описанию.</span></label></li>"]},{"t":"ch","id":"glossary","head":"Словарь терминов","h":"<header class=\"ch-open\"><h2>Словарь терминов</h2></header>"},{"t":"p","h":"Здесь собраны все термины книги с короткими объяснениями. Если слово встретилось и вы забыли, что оно значит, найдите его тут. Справа указано, где термин разобран подробнее: нажмите на номер главы, чтобы перейти."},{"t":"list","tag":"ul","c":"gl","items":["<li><strong class=\"tt\">Агент</strong> — ИИ, который не только отвечает на вопросы, но и сам действует: читает файлы, запускает команды, правит код. <span class=\"refs\"><button class=\"go\" data-go=\"abc\">Азбука</button></span></li>","<li><strong class=\"tt\">Агент фонового программирования</strong> — ИИ-система, которая получает задачу, самостоятельно работает над ней в изолированной среде и возвращает результат на проверку. <span class=\"refs\"><button class=\"go\" data-go=\"ch10\">гл.&nbsp;10</button></span></li>","<li><strong class=\"tt\">Агентная инженерия (agentic engineering)</strong> — Подход, при котором человек ставит задачи ИИ-агентам, проверяет их работу и отвечает за результат. Термин Андрея Карпати (2026) для взрослой работы с ИИ. <span class=\"refs\"><button class=\"go\" data-go=\"ch1\">гл.&nbsp;1</button></span></li>","<li><strong class=\"tt\">Агентный цикл</strong> — Повторяющаяся схема работы агента: решил действие, выполнил, увидел результат, повторил, пока задача не решена. <span class=\"refs\"><button class=\"go\" data-go=\"ch10\">гл.&nbsp;10</button></span></li>","<li><strong class=\"tt\">Алерт (оповещение)</strong> — Уведомление о том, что в работе приложения что-то пошло не так. <span class=\"refs\"><button class=\"go\" data-go=\"ch8\">гл.&nbsp;8</button></span></li>","<li><strong class=\"tt\">Арена (рейтинг моделей)</strong> — Сайт, где люди вслепую сравнивают ответы двух моделей и голосуют за лучший; из голосов складывается рейтинг. Самая известная — Arena (раньше LMArena). <span class=\"refs\"><button class=\"go\" data-go=\"ch1\">гл.&nbsp;1</button></span></li>",
