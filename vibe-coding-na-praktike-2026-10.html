<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Вайб-кодинг на практике</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Literata:ital,opsz,wght@0,7..72,400..700;1,7..72,400..600&family=Onest:wght@400..800&display=swap">
<style>
/* Layout: книга лежит на столе — разворот из двух страниц на широком экране и одна страница на телефоне; страницы переворачиваются вокруг корешка */
:root{
  --desk:#D9DCD7; --desk-ink:#24272D; --desk-soft:#5D626B;
  --paper:#FBFAF6; --paper-edge:#DEDBD2; --ink:#1C1E22; --ink-soft:#5B606A; --rule:#DAD7CE;
  --accent:#2B3FBF; --accent-ink:#2B3FBF; --tint:rgba(43,63,191,.075); --code-bg:#EFEEE8; --warn:#AE3F1C;
  --cover-bg:#1D2B8F; --cover-ink:#F4F5FF; --cover-soft:#B2BAF0; --cover-add:#90E4BE; --cover-del:#FFAD9E;
  --fig-ink:#1C1E22; --fig-soft:#5B606A; --fig-line:#A3A196; --fig-grid:#D4D1C7; --fig-zone:rgba(28,30,34,.035); --fig-risk:#C4432C;
  --shadow:0 26px 50px -28px rgba(18,22,40,.55),0 6px 14px -8px rgba(18,22,40,.25);
  --font-body:'Literata',Georgia,'Times New Roman',serif;
  --font-ui:'Onest','Segoe UI',Roboto,Arial,sans-serif;
  --font-code:'JetBrains Mono',Menlo,Consolas,'Courier New',monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --desk:#111317; --desk-ink:#DCDDE1; --desk-soft:#9A9EA7;
  --paper:#1F2228; --paper-edge:#30343B; --ink:#E8E5DD; --ink-soft:#A4A8B0; --rule:#3A3E46;
  --accent:#8D9CFF; --accent-ink:#A8B3FF; --tint:rgba(141,156,255,.12); --code-bg:#2A2D34; --warn:#F18D6B;
  --fig-ink:#E8E5DD; --fig-soft:#A4A8B0; --fig-line:#767A83; --fig-grid:#3C4048; --fig-zone:rgba(255,255,255,.035); --fig-risk:#F2765E;
  --shadow:0 26px 50px -24px rgba(0,0,0,.85),0 6px 14px -8px rgba(0,0,0,.6);
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --desk:#111317; --desk-ink:#DCDDE1; --desk-soft:#9A9EA7;
  --paper:#1F2228; --paper-edge:#30343B; --ink:#E8E5DD; --ink-soft:#A4A8B0; --rule:#3A3E46;
  --accent:#8D9CFF; --accent-ink:#A8B3FF; --tint:rgba(141,156,255,.12); --code-bg:#2A2D34; --warn:#F18D6B;
  --fig-ink:#E8E5DD; --fig-soft:#A4A8B0; --fig-line:#767A83; --fig-grid:#3C4048; --fig-zone:rgba(255,255,255,.035); --fig-risk:#F2765E;
  --shadow:0 26px 50px -24px rgba(0,0,0,.85),0 6px 14px -8px rgba(0,0,0,.6);
  color-scheme:dark;
}

html{height:100%;box-sizing:border-box}
*,*::before,*::after{box-sizing:inherit}
body{height:100%;margin:0;background:var(--desk);color:var(--desk-ink);font:14px/1.4 var(--font-ui);display:flex;flex-direction:column;overflow:hidden;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit}

/* Панели управления */
.bar{flex:none;display:flex;align-items:center;gap:6px;padding:8px 16px;min-height:52px}
.top{justify-content:space-between}
.brand{display:flex;flex-direction:column;min-width:0;line-height:1.2}
.brand b{font-weight:700;font-size:15px;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand span{font-size:12px;color:var(--desk-soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tools{display:flex;align-items:center;gap:4px;flex:none}
.btn{appearance:none;border:0;background:transparent;font:600 13px/1 var(--font-ui);padding:9px 11px;border-radius:8px;cursor:pointer;display:inline-flex;align-items:center;gap:7px;color:var(--desk-ink);white-space:nowrap}
.btn:hover{background:var(--tint)}
.btn:focus-visible,.go:focus-visible,.slider:focus-visible,.zoom-scroll:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn[disabled]{opacity:.32;cursor:default;background:transparent}
.btn svg{width:16px;height:16px;flex:none}
.btn .aa{font:700 15px/1 var(--font-body)}
.sep{width:1px;height:20px;background:var(--rule);margin:0 4px}
.bottom{gap:12px;justify-content:center}
.slider{flex:1;max-width:520px;min-width:60px;accent-color:var(--accent);margin:0}
.where{font:500 13px/1 var(--font-ui);font-variant-numeric:tabular-nums;color:var(--desk-soft);min-width:9.5em;text-align:center}

/* Сцена и книга */
.stage{flex:1;min-height:0;position:relative;display:grid;place-items:center;padding:4px 16px 8px}
.book{position:relative;display:flex;perspective:calc(var(--pw) * 5.5);--sl:0px;--sr:0px}
.book[data-mode="single"]{perspective:calc(var(--pw) * 4.5)}
.slot{position:relative;width:var(--pw);height:var(--ph)}
.slot.empty{visibility:hidden}
.book[data-mode="single"] #slotL{display:none}
.slot:not(.empty){box-shadow:var(--shadow)}
.slot.measure{position:absolute;left:0;top:0;visibility:hidden;pointer-events:none;box-shadow:none;z-index:-1}
.book::before,.book::after{content:"";position:absolute;top:3px;bottom:3px;background:repeating-linear-gradient(90deg,var(--paper) 0 1px,var(--paper-edge) 1px 2px);pointer-events:none}
.book::before{right:100%;width:var(--sl);border-radius:3px 0 0 3px}
.book::after{left:100%;width:var(--sr);border-radius:0 3px 3px 0}

/* Лист, который переворачивается */
.leaf{position:absolute;top:0;width:var(--pw);height:var(--ph);transform-style:preserve-3d;z-index:5;pointer-events:none}
.leaf.fwd{left:var(--pw);transform-origin:left center}
.leaf.bwd{left:0;transform-origin:right center}
.leaf.one{left:0;transform-origin:left center}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.face.back{transform:rotateY(180deg)}
.face .page{box-shadow:0 0 22px rgba(0,0,0,.18)}
.shade{position:absolute;inset:0;pointer-events:none;opacity:0;z-index:3}
.shade.from-l{background:linear-gradient(90deg,rgba(0,0,0,.32),rgba(0,0,0,.06) 55%,rgba(0,0,0,0))}
.shade.from-r{background:linear-gradient(270deg,rgba(0,0,0,.32),rgba(0,0,0,.06) 55%,rgba(0,0,0,0))}

/* Страница */
.page{position:absolute;inset:0;background:var(--paper);color:var(--ink);font-family:var(--font-body);font-size:var(--fs);line-height:1.56;padding:var(--pt) 0 var(--pb);display:flex;flex-direction:column;overflow:hidden;font-optical-sizing:auto;font-kerning:normal;cursor:default}
.page.side-l::after,.page.side-r::after{content:"";position:absolute;top:0;bottom:0;width:7%;pointer-events:none}
.page.side-l::after{right:0;background:linear-gradient(90deg,rgba(0,0,0,0),rgba(0,0,0,.075))}
.page.side-r::after{left:0;background:linear-gradient(270deg,rgba(0,0,0,0),rgba(0,0,0,.075))}
.page.blankback{background:var(--paper)}
.pg-head,.pg-body,.pg-foot{padding-inline:var(--px)}
.pg-head{flex:none;height:2.6em;font:500 .64em/1.25 var(--font-ui);letter-spacing:.09em;text-transform:uppercase;color:var(--ink-soft);display:flex;align-items:flex-start;white-space:nowrap;overflow:hidden}
.pg-head span{overflow:hidden;text-overflow:ellipsis}
.pg-body{flex:1;min-height:0;overflow:hidden;display:flow-root;position:relative}
.pg-foot{flex:none;height:2.3em;font:500 .7em/1 var(--font-ui);font-variant-numeric:tabular-nums;color:var(--ink-soft);display:flex;align-items:flex-end}
.side-l .pg-head,.side-l .pg-foot{justify-content:flex-start}
.side-r .pg-head,.side-r .pg-foot{justify-content:flex-end}
.side-s .pg-head{justify-content:flex-start}
.side-s .pg-foot{justify-content:center}

/* Текст на странице */
.pg-body>*{margin:0}
.pg-body>*+*{margin-top:.72em}
.pg-body>p{text-align:justify;hyphens:auto;-webkit-hyphens:auto;text-indent:1.45em}
.pg-body>p+p{margin-top:0}
.pg-body>p:first-child,.pg-body>p.cont,.pg-body>:not(p)+p{text-indent:0}
.pg-body>p.sp{text-align-last:justify}
.book.nohyph .pg-body>p,.book.nohyph .pg-body>p.sp{text-align:left;text-align-last:auto}
.pg-body strong{font-weight:650}
.pg-body a{color:var(--accent-ink);text-decoration-thickness:1px;text-underline-offset:.15em}
.pg-body code{font-family:var(--font-code);font-size:.84em;background:var(--code-bg);padding:.06em .3em;border-radius:3px;overflow-wrap:anywhere;hyphens:none}
.pg-body h3{font:650 1.04em/1.3 var(--font-ui);letter-spacing:-.005em;text-wrap:balance;color:var(--ink)}
.pg-body>*+h3{margin-top:1.35em}
.pg-body>h3+*{margin-top:.45em}
.lbl{font:700 .66em/1.2 var(--font-ui);letter-spacing:.15em;text-transform:uppercase;color:var(--accent-ink)}
.pg-body>.lbl+*{margin-top:.5em}

.ch-open{padding-top:2.2em}
.ch-kicker{font:700 .66em/1 var(--font-ui);letter-spacing:.18em;text-transform:uppercase;color:var(--accent-ink)}
.ch-big{font:800 3.6em/1 var(--font-ui);color:var(--accent-ink);letter-spacing:-.04em;margin:.12em 0 .18em;font-variant-numeric:lining-nums}
.ch-open h2{font:760 1.62em/1.14 var(--font-ui);letter-spacing:-.022em;text-wrap:balance;margin:0;color:var(--ink)}
.ch-open::after{content:"";display:block;width:2.4em;height:3px;background:var(--accent);margin-top:1.05em}
.pg-body>.ch-open+*{margin-top:1.5em}

.pg-body ul,.pg-body ol{list-style:none;padding:0}
.pg-body li{position:relative;padding-left:1.35em;hyphens:auto;-webkit-hyphens:auto}
.pg-body li+li{margin-top:.32em}
.pg-body ul.ul>li::before{content:"—";position:absolute;left:0;color:var(--ink-soft)}
.pg-body ol.ol>li::before{content:attr(data-n) ".";position:absolute;left:0;top:.08em;font:650 .86em/1.6 var(--font-ui);color:var(--accent-ink);font-variant-numeric:tabular-nums}
.pg-body ul.src li{overflow-wrap:anywhere}
.tasks li{padding-left:0}
.tasks label{display:flex;gap:.65em;align-items:flex-start;cursor:pointer}
.tasks input{flex:none;width:1.02em;height:1.02em;margin:.28em 0 0;accent-color:var(--accent);cursor:pointer}
.tasks li.done span{color:var(--ink-soft);text-decoration:line-through;text-decoration-color:var(--rule)}

.tbl{width:100%;border-collapse:collapse;font:400 .76em/1.38 var(--font-ui);border-top:1.5px solid var(--ink);border-bottom:1px solid var(--ink-soft);hyphens:auto;-webkit-hyphens:auto}
.tbl th{text-align:left;font-weight:650;padding:.5em .65em .45em 0;border-bottom:1px solid var(--ink-soft);vertical-align:bottom}
.tbl td{padding:.42em .65em .42em 0;border-top:1px solid var(--rule);vertical-align:top;overflow-wrap:break-word}
.tbl tbody tr:first-child td{border-top:0}
.tbl th:last-child,.tbl td:last-child{padding-right:0}
.tbl code{font-size:.9em}
.book[data-narrow="1"] .tbl{font-size:.72em}
.book[data-narrow="1"] .tbl th,.book[data-narrow="1"] .tbl td{overflow-wrap:anywhere;padding-right:.5em}

.code{font:400 .74em/1.56 var(--font-code);background:var(--code-bg);color:var(--ink);padding:.85em 1em;border-radius:6px;white-space:pre-wrap;overflow-wrap:anywhere;hyphens:none}
.code code{background:none;padding:0;font-size:1em;font-family:inherit;border-radius:0}
.code .plabel{display:block;font:700 .84em/1 var(--font-ui);letter-spacing:.14em;text-transform:uppercase;color:var(--ink-soft);margin-bottom:.75em}
.code.prompt{background:var(--tint)}
.code.prompt .plabel{color:var(--accent-ink)}

.note{font-size:.93em;line-height:1.52;padding:.7em 0;border-top:1px solid var(--rule);border-bottom:1px solid var(--rule);hyphens:auto;-webkit-hyphens:auto}
.note .nl{font:700 .72em/1 var(--font-ui);letter-spacing:.14em;text-transform:uppercase;color:var(--accent-ink);margin-right:.35em}
.note.warn .nl{color:var(--warn)}

.fig{margin-inline:calc(var(--px) * -.55);cursor:zoom-in;border-radius:6px}
.fig svg{display:block;width:100%;height:auto;margin:0 auto;font-family:var(--font-ui)}
.fig figcaption{display:flex;justify-content:space-between;gap:1em;align-items:baseline;font:400 .68em/1.4 var(--font-ui);color:var(--ink-soft);margin-top:.5em;padding-inline:calc(var(--px) * .55)}
.fig .zh{flex:none;color:var(--accent-ink);font-weight:600}
.fig:hover .zh{text-decoration:underline}

/* Оглавление и указатель */
.go{appearance:none;border:0;background:none;padding:0;margin:0;font:inherit;color:inherit;text-align:left;cursor:pointer;border-radius:2px}
.go:hover{color:var(--accent-ink)}
.toclist li,.idx li{display:flex;align-items:flex-end;gap:.35em;padding-left:0}
.toclist li+li,.idx li+li{margin-top:.28em}
.toclist i,.idx i{flex:1;min-width:1.2em;border-bottom:1.5px dotted var(--rule);margin-bottom:.34em}
.toclist .pn{flex:none;min-width:2.3em;text-align:right;font:500 .86em/1.4 var(--font-ui);font-variant-numeric:tabular-nums;color:var(--ink-soft)}
.toc.lv0{margin-top:1em}
.toc.lv0 .go{font:700 .7em/1.4 var(--font-ui);letter-spacing:.14em;text-transform:uppercase;color:var(--accent-ink)}
.toc.lv1 .go{font:600 .92em/1.35 var(--font-ui)}
.toc.lv1 .go b{font-weight:750}
.toc.lv1{margin-top:.55em}
.toc.lv2{padding-left:1.1em}
.toc.lv2 .go{font-size:.88em;line-height:1.4;color:var(--ink)}
.toc.lv2 .go:hover{color:var(--accent-ink)}
.idx li{font-size:.92em}
.idx .refs{flex:none;font:500 .86em/1.5 var(--font-ui);color:var(--ink-soft)}
.idx .refs .go{color:var(--accent-ink);font-variant-numeric:tabular-nums}
.idx .refs .go:hover{text-decoration:underline}

/* Обложка */
.page.cover{background:var(--cover-bg);color:var(--cover-ink);padding:0}
.cover-in{position:absolute;inset:0;padding:9% 10% 8%;display:flex;flex-direction:column;justify-content:space-between;gap:1em}
.cv-top{font:600 .66em/1.3 var(--font-ui);letter-spacing:.18em;text-transform:uppercase;color:var(--cover-soft)}
.cv-title{font:800 2.85em/.98 var(--font-ui);letter-spacing:-.035em;margin:0;text-wrap:balance}
.cv-sub{font:italic 400 1.08em/1.4 var(--font-body);color:var(--cover-soft);margin:.9em 0 0;max-width:22em}
.cv-diff{font:400 .76em/1.75 var(--font-code);margin:0;white-space:pre-wrap;border-top:1px solid rgba(255,255,255,.18);padding-top:1.1em}
.cv-diff .h{color:var(--cover-soft)}
.cv-diff .d{color:var(--cover-del)}
.cv-diff .a{color:var(--cover-add)}
.cv-bot{display:flex;justify-content:space-between;font:500 .7em/1 var(--font-ui);letter-spacing:.06em;color:var(--cover-soft)}
.page.cover::before{content:"";position:absolute;left:0;top:0;bottom:0;width:6%;background:linear-gradient(90deg,rgba(0,0,0,.28),rgba(0,0,0,0));pointer-events:none}
.page.cover.side-r::after{display:none}

/* Страница части */
.page.part{padding:0}
.part-in{position:absolute;inset:0;padding:12% 11%;display:flex;flex-direction:column;justify-content:center}
.pt-kicker{font:700 .7em/1 var(--font-ui);letter-spacing:.2em;text-transform:uppercase;color:var(--accent-ink)}
.pt-num{font:800 5.2em/1 var(--font-ui);letter-spacing:-.04em;color:var(--accent-ink);margin:.1em 0 .15em}
.pt-title{font:760 1.75em/1.12 var(--font-ui);letter-spacing:-.022em;margin:0 0 1.4em;text-wrap:balance}
.pt-list{list-style:none;margin:0;padding:1.1em 0 0;border-top:1px solid var(--rule);display:flex;flex-direction:column;gap:.55em}
.pt-list li{display:flex;gap:.9em;font-size:.94em;line-height:1.4}
.pt-list span{flex:none;width:1.4em;font:700 .9em/1.55 var(--font-ui);color:var(--accent-ink);font-variant-numeric:tabular-nums}

/* Оглавление сбоку */
.drawer{position:fixed;inset:0;z-index:30;display:flex}
.drawer-bg{position:absolute;inset:0;background:rgba(10,12,18,.42)}
.drawer-panel{position:relative;width:min(380px,88vw);height:100%;background:var(--paper);color:var(--ink);box-shadow:var(--shadow);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
.drawer-head{display:flex;justify-content:space-between;align-items:center;padding:12px 12px 10px 20px;border-bottom:1px solid var(--rule)}
.drawer-head b{font:750 17px/1.2 var(--font-ui)}
.drawer-list{list-style:none;margin:0;padding:8px 0 24px;overflow:auto;flex:1;overscroll-behavior:contain}
.drawer-list li button{display:flex;width:100%;gap:12px;justify-content:space-between;align-items:baseline;border:0;background:none;text-align:left;cursor:pointer;padding:7px 20px;font:500 14px/1.35 var(--font-ui);color:var(--ink)}
.drawer-list li button:hover{background:var(--tint)}
.drawer-list li button:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.drawer-list .lv0 button{font:700 11px/1.3 var(--font-ui);letter-spacing:.14em;text-transform:uppercase;color:var(--accent-ink);padding-top:16px}
.drawer-list .lv1 button{font-weight:650}
.drawer-list .lv2 button{padding-left:34px;font-size:13px;color:var(--ink-soft)}
.drawer-list .cur button{background:var(--tint)}
.drawer-list .n{flex:none;font-variant-numeric:tabular-nums;color:var(--ink-soft);font-size:12px;font-weight:500}

/* Увеличенная схема */
.zoom{position:fixed;inset:0;z-index:40;background:var(--paper);display:flex;flex-direction:column}
.zoom-bar{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 12px 10px 20px;padding-top:calc(10px + env(safe-area-inset-top,0px));border-bottom:1px solid var(--rule);color:var(--ink)}
.zoom-bar span{font:500 13px/1.35 var(--font-ui);color:var(--ink-soft)}
.zoom-scroll{flex:1;overflow:auto;padding:24px 16px;display:flex}
.zoom-scroll svg{margin:auto;flex:none;height:auto;font-family:var(--font-ui)}

.loading{position:absolute;inset:0;display:grid;place-items:center;font:500 14px/1 var(--font-ui);color:var(--desk-soft);z-index:8}

/* Цвета схем */
.fg-t{fill:var(--fig-ink)}
.fg-q{fill:var(--fig-soft)}
.fg-box{fill:none;stroke:var(--fig-line);stroke-width:1.25}
.fg-hi{fill:var(--accent);fill-opacity:.12;stroke:var(--accent);stroke-width:2}
.fg-ln{fill:none;stroke:var(--fig-line);stroke-width:1.25}
.fg-grid{fill:none;stroke:var(--fig-grid);stroke-width:1.25;stroke-dasharray:4 4}
.fg-dash{stroke-dasharray:4 4}
.fg-dots{stroke-dasharray:3 4}
.fg-dot{fill:var(--fig-line)}
.fg-risk{fill:var(--fig-risk)}
.fg-riskzone{fill:var(--fig-risk);fill-opacity:.07;stroke:var(--fig-risk);stroke-opacity:.5;stroke-dasharray:4 4}
.fg-curve{fill:none;stroke:var(--accent);stroke-width:2.5}
.fg-tier{fill:var(--accent);stroke:var(--accent);stroke-width:1.25}
.fg-zone{fill:var(--fig-zone);stroke:var(--fig-grid);stroke-width:1.25}
.fg-zone-edge{stroke:var(--fig-line)}
.fg-arrowhead{fill:var(--fig-line)}

@media (max-width:640px){
  .bar{padding:6px 8px;min-height:48px}
  .btn .lbl-wide{display:none}
  .where{min-width:6.5em;font-size:12px}
  .stage{padding:2px 8px 4px}
  .brand span{display:none}
}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
/* --- адаптация для начинающих --- */
.note.simple{background:var(--tint);border:0;border-radius:6px;padding:.8em .95em}
.note.simple .nl{color:var(--accent-ink)}
.gl li{display:block;font-size:.92em;line-height:1.5}
.gl li+li{margin-top:.5em}
.gl .tt{font-weight:650}
.gl .refs{font:500 .84em/1.5 var(--font-ui);color:var(--ink-soft);white-space:nowrap}
.gl .refs .go{color:var(--accent-ink)}
/* Новые цвета и линии для схем */
:root{--fig-ok:#2F7D5B}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--fig-ok:#5CC49A}}
:root[data-theme="dark"]{--fig-ok:#5CC49A}
.fg-ok{fill:var(--fig-ok)}
.fg-acc{fill:var(--accent-ink)}
.fg-okbox{fill:var(--fig-ok);fill-opacity:.09;stroke:var(--fig-ok);stroke-opacity:.6;stroke-width:1.25}
.fg-riskbox{fill:var(--fig-risk);fill-opacity:.08;stroke:var(--fig-risk);stroke-opacity:.6;stroke-width:1.25}
.fg-ln-acc{fill:none;stroke:var(--accent);stroke-width:1.75}
.fg-ln-risk{fill:none;stroke:var(--fig-risk);stroke-width:1.5}
.fg-ln-ok{fill:none;stroke:var(--fig-ok);stroke-width:1.5}
.fg-arrowhead-acc{fill:var(--accent)}
.fg-arrowhead-risk{fill:var(--fig-risk)}
.fg-arrowhead-ok{fill:var(--fig-ok)}
/* Новые цвета для схем */
:root{--fig-ok:#2E7D5B;--fig-on:#FFFFFF}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--fig-ok:#5CC49A;--fig-on:#1B1D24}}
:root[data-theme=dark]{--fig-ok:#5CC49A;--fig-on:#1B1D24}
.fg-on{fill:var(--fig-on)}
.fg-okbox{fill:var(--fig-ok);fill-opacity:.1;stroke:var(--fig-ok);stroke-width:1.5}
.fg-okln{fill:none;stroke:var(--fig-ok);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.fg-okt{fill:var(--fig-ok)}
.fg-riskbox{fill:var(--fig-risk);fill-opacity:.09;stroke:var(--fig-risk);stroke-width:1.5}
.fg-riskln{fill:none;stroke:var(--fig-risk);stroke-width:2;stroke-linecap:round}
.fg-riskt{fill:var(--fig-risk)}
.fg-acc{fill:var(--accent-ink)}
.fg-accln{fill:none;stroke:var(--accent);stroke-width:2}
.fg-solid{fill:var(--fig-line);fill-opacity:.35;stroke:var(--fig-line);stroke-width:1.25}
.fg-ghost{fill:none;stroke:var(--fig-grid);stroke-width:1.25;stroke-dasharray:3 3}
.fg-onln{fill:none;stroke:var(--fig-on);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
/* Окна, терминал, дифф для пошаговых картинок */
.fg-mono{font-family:ui-monospace,"SF Mono",Menlo,Consolas,"DejaVu Sans Mono","Liberation Mono",monospace}
.fg-win{fill:var(--fig-ink);fill-opacity:.03;stroke:var(--fig-line);stroke-width:1.25}
.fg-bar{fill:var(--fig-ink);fill-opacity:.07}
.fg-term{fill:#1E2027;stroke:var(--fig-line);stroke-width:1.25}
.fg-tbar{fill:#2A2D37}
.fg-tt{fill:#DADCE3}.fg-tp{fill:#8FA3FF}.fg-tok{fill:#6FD3A6}.fg-terr{fill:#FF8C7A}.fg-tdim{fill:#8B90A0}.fg-tyel{fill:#E8C877}
.fg-add{fill:var(--fig-ok);fill-opacity:.16}
.fg-del{fill:var(--fig-risk);fill-opacity:.14}
.fg-sel{fill:var(--accent);fill-opacity:.15}
.fg-line{fill:var(--fig-grid)}
</style>

<script>
(() => {
"use strict";
const BOOK = {"title":"Вайб-кодинг на практике","blocks":[{"t":"ch","id":"pre","head":"Предисловие","h":"<header class=\"ch-open\"><h2>Предисловие</h2></header>"},{"t":"p","h":"Эта книга о том, как создавать программы вместе с ИИ и при этом понимать, что вы делаете. Вы не просто нажимаете кнопку «сгенерировать» и надеетесь на удачу, а ведёте проект осознанно: знаете, что просить, как проверить результат и что делать, если что-то сломалось."},{"t":"p","h":"ИИ уже пишет большую часть нового кода во многих компаниях. Вопрос больше не в том, пользоваться ли им. Вопрос в том, как сделать результат надёжным, чтобы приложение работало не только на показе, но и у реальных людей."},{"t":"p","h":"За последние годы инструменты прошли путь от подсказки одной строки до <strong>агентов</strong> (программ на основе ИИ, которые сами читают ваш проект, правят файлы и запускают команды, иногда часами и без вашего участия). Интерфейсы меняются каждый месяц. Принципы меняются намного медленнее: ясно объяснить задачу, проверить результат и самому отвечать за то, что вы выпускаете. Эти три вещи остаются за человеком."},{"t":"h3","id":"s1","h":"<h3>Для кого предназначена эта книга</h3>"},{"t":"p","h":"Главный читатель этой книги — человек <strong>без опыта программирования</strong>. Вы можете быть предпринимателем, дизайнером, аналитиком, студентом, маркетологом или просто человеком с идеей приложения. Вы умеете пользоваться компьютером и общаться с ИИ в чате. Больше ничего знать не нужно."},{"t":"p","h":"Вы не обязаны уметь писать код. Но чтобы получать хороший результат, вам придётся понимать, из чего состоит программа, какие слова используют разработчики и где обычно прячутся проблемы. Это и есть то, чему учит книга. Все незнакомые слова мы объясняем сразу, простыми словами и на примерах из обычной жизни."},{"t":"p","h":"Книга пригодится и другим читателям:"},{"t":"list","tag":"ul","c":"ul","items":["<li><strong>Начинающие разработчики.</strong> Вы уже немного пишете код и хотите понять, как встроить в работу ИИ и не потерять качество.</li>","<li><strong>Опытные разработчики и техлиды.</strong> Вы можете пропустить «Азбуку» и первые примеры и сразу читать разделы про проверку, безопасность и работу команды.</li>","<li><strong>Руководители и менеджеры.</strong> Вам нужно понимать, как устроена работа с ИИ, чтобы выстроить правила, оценить риски и бюджет.</li>"]},{"t":"p","h":"Глубокие знания о нейросетях не нужны. Нужны любопытство и желание разобраться, почему один запрос к ИИ даёт отличный результат, а другой — мусор."},{"t":"h3","id":"s2","h":"<h3>Ожидания</h3>"},{"t":"p","h":"Книга не обещает, что вы станете программистом за выходные. И она не обещает, что ИИ сделает всё за вас. Честная картина такая: чем мощнее ИИ, тем ценнее человек, который понимает задачу, умеет оценить результат и заметит ошибку, которую ИИ написал уверенно и красиво."},{"t":"p","h":"Вот что вы унесёте из книги:"},{"t":"list","tag":"ol","c":"ol","items":["<li data-n=\"1\"><strong>Понимание, как думает ИИ:</strong> что он делает хорошо, где систематически ошибается и почему.</li>","<li data-n=\"2\"><strong>Умение ставить задачи:</strong> набор приёмов, которые работают с любым ИИ.</li>","<li data-n=\"3\"><strong>Рабочий цикл «запрос → проверка → доработка»:</strong> шаги, которыми вы пройдёте путь от идеи до работающего приложения.</li>","<li data-n=\"4\"><strong>Чек-листы для самопроверки:</strong> как убедиться, что приложение безопасно, не разваливается и делает то, что вы хотели, даже если вы не читаете код.</li>","<li data-n=\"5\"><strong>Понимание автономных агентов:</strong> когда им можно доверить задачу, а когда нужно держать руку на руле.</li>","<li data-n=\"6\"><strong>Словарь:</strong> в конце книги вы найдёте все термины с объяснениями, чтобы разговаривать с разработчиками и с ИИ на одном языке.</li>"]},{"t":"p","h":"Инструменты и модели меняются каждые несколько месяцев. Поэтому названия и цифры в книге даны как снимок на октябрь 2026 года. Принципы рассчитаны на более долгий срок."},{"t":"h3","id":"s3","h":"<h3>Используемые в этой книге условные обозначения</h3>"},{"t":"list","tag":"ul","c":"ul","items":["<li><strong>Жирный шрифт</strong> — новое слово в момент, когда мы впервые его объясняем. Объяснение идёт рядом, в скобках или следующим предложением.</li>","<li><code>Моноширинный шрифт</code> — то, что пишут на компьютере буквально: код, команды, имена файлов.</li>","<li>Блоки с подписью «Запрос» — готовые тексты, которые вы можете скопировать и отправить ИИ, подставив свои данные.</li>","<li>«Простыми словами» — короткое объяснение сложной мысли через пример из обычной жизни.</li>","<li>«Совет» — приём, который экономит время.</li>","<li>«Внимание» — место, где легко ошибиться или создать уязвимость, то есть слабое место, которым можно воспользоваться во вред.</li>","<li>Схемы и рисунки показывают то, что трудно удержать в голове по тексту.</li>","<li>Блоки с кодом показывают, как выглядит программа. <strong>Читать код построчно вам не нужно.</strong> После каждого блока мы объясняем, что в нём происходит, обычными словами.</li>"]},{"t":"p","h":"Примеры кода написаны на языках TypeScript и Python. Это два самых популярных языка в работе с ИИ. Не страшно, если названия вам пока ничего не говорят: «Азбука» расскажет, что это такое."},{"t":"h3","id":"s4","h":"<h3>Как пользоваться материалами книги</h3>"},{"t":"p","h":"Начните с «Азбуки». Это короткая глава о словах и понятиях, без которых дальше будет трудно. Потом читайте главы части I по порядку: они закладывают основу. Части II и III можно читать выборочно, по своим задачам. Часть IV — практикум: к нему удобно вернуться, когда вы задумаете своё приложение по образцу чужого."},{"t":"fig","n":"pre_map","cap":"Рис. П.1 · карта книги: с чего начать"},{"t":"p","h":"Как читать схему: пять блоков идут слева направо в том порядке, в каком их удобно читать. Если слова из «Азбуки» вам уже знакомы, её можно пропустить. Нижняя полоса напоминает, что словарь в конце книги всегда под рукой."},{"t":"p","h":"Если встретили незнакомое слово, не пугайтесь и не пропускайте его. Посмотрите его в «Азбуке» или в словаре в конце книги."},{"t":"p","h":"Каждая глава заканчивается разделом «Итоги и дальнейшие шаги» с упражнениями. Они сделаны так, чтобы их мог выполнить человек без опыта, с ИИ-помощником под рукой. Лучший способ освоить материал: заведите небольшой учебный проект, например простой сайт или личный трекер, и применяйте приёмы из каждой главы к нему."},{"t":"p","h":"Все запросы из книги — это отправные точки, а не заклинания. Копируйте их, меняйте под свой проект и сравнивайте результаты."},{"t":"p","h":"Книга обновляется вместе с инструментами. Если вы нашли устаревший пример или хотите добавить свой, напишите автору."},{"t":"ch","id":"abc","head":"Азбука","h":"<header class=\"ch-open\"><h2>Азбука: слова, которые нужно знать с первого дня</h2></header>"},{"t":"p","h":"Эту главу стоит прочитать до всего остального. В ней нет кода и сложных идей. Здесь мы по-человечески объясним слова, которыми разработчики и ИИ пользуются на каждом шагу: сервер, репозиторий, коммит, деплой, зависимость. Если вы их знаете, листайте дальше. Если нет, пять минут здесь сэкономят вам часы растерянности потом."},{"t":"p","h":"Главная мысль: <strong>вам не нужно уметь писать код, чтобы понимать, что происходит с вашим проектом.</strong> Достаточно знать, из каких частей он состоит и что с ними делают. Это как владелец ресторана, который не стоит у плиты, но знает, где зал, где кухня, где склад и что будет, если сломается холодильник."},{"t":"h3","id":"sa1","h":"<h3>Из чего состоит любое приложение</h3>"},{"t":"p","h":"Почти любое приложение, от интернет-магазина до трекера привычек, устроено как ресторан. У ресторана есть зал, где сидят гости, кухня, где готовят, склад с продуктами и официанты, которые носят заказы между залом и кухней. В приложении то же самое."},{"t":"p","h":"<strong>Интерфейс</strong> — это всё, что вы видите и нажимаете: кнопки, формы, тексты, картинки. Часть приложения, которая отвечает за интерфейс, называется <strong>фронтендом</strong> (от английского «передняя часть»). Фронтенд работает на устройстве пользователя: в браузере или на телефоне. В ресторане это зал."},{"t":"p","h":"<strong>Бэкенд</strong> («задняя часть») — это то, что происходит за кулисами: проверить пароль, посчитать сумму заказа, отправить письмо. Бэкенд работает не у пользователя, а на <strong>сервере</strong>. Сервер — это обычный компьютер, который стоит в дата-центре, никогда не выключается и отвечает на запросы из интернета. В ресторане это кухня."},{"t":"p","h":"<strong>База данных</strong> — организованное хранилище информации: пользователи, заказы, товары, сообщения. Это как склад или картотека с очень строгим порядком. Если бэкенд что-то запоминает, он кладёт это в базу, а когда нужно, достаёт обратно."},{"t":"p","h":"<strong>API</strong> (читается «эй-пи-ай») — это правила, по которым одна часть программы просит что-то у другой. Если фронтенд хочет получить список заказов, он «просит» бэкенд через API, а тот отвечает. В ресторане API — это официант и меню: вы не заходите на кухню сами, а делаете заказ в понятной форме и получаете блюдо. Кроме того, API — это способ, которым ваше приложение общается с чужими сервисами: оплатой, картами, почтой, ИИ."},{"t":"note","h":"<div class=\"note simple\"><span class=\"nl\">Простыми словами</span> Представьте, что вы заказываете пиццу в приложении. Кнопка «Заказать» — это фронтенд (зал). Проверка, что вы ввели правильный адрес, и расчёт цены — бэкенд (кухня). Список ваших прошлых заказов лежит в базе данных (склад). А то, как кнопка передаёт заказ на кухню, — это работа API (официант).</div>"},{"t":"table","head":"<tr><th>Часть</th><th>Что это</th><th>Как в ресторане</th><th>Пример</th></tr>","rows":["<tr><td>Фронтенд</td><td>То, что видит и нажимает пользователь</td><td>Зал и меню</td><td>Страница с кнопкой «Войти»</td></tr>","<tr><td>Бэкенд</td><td>Логика, которая работает на сервере</td><td>Кухня</td><td>Проверка пароля, расчёт цены</td></tr>","<tr><td>Сервер</td><td>Компьютер, который всегда включён и отвечает на запросы</td><td>Здание кухни</td><td>Арендованная машина в дата-центре</td></tr>","<tr><td>База данных</td><td>Хранилище данных</td><td>Склад</td><td>Таблицы пользователей и заказов</td></tr>","<tr><td>API</td><td>Правила общения между частями или с чужими сервисами</td><td>Официант и меню</td><td>«Дай список заказов за сегодня»</td></tr>"],"cols":4},{"t":"fig","n":"abc_restaurant","cap":"Рис. А.1 · приложение как ресторан"},{"t":"p","h":"Как читать схему: слева направо идёт путь вашего нажатия: зал (то, что вы видите), кухня (программа на сервере), склад (база данных) и официант, который переносит заказы между ними. Каждой части приложения соответствует своя часть ресторана."},{"t":"p","h":"Когда вы просите ИИ «сделать сайт», он в большинстве случаев делает одну, две или все эти части. Поэтому полезно уточнять, что именно вам нужно: просто красивую страницу (только фронтенд) или приложение, в котором пользователи регистрируются и хранят свои данные (все части)."},{"t":"h3","id":"sa2","h":"<h3>Код, языки и чужие детали</h3>"},{"t":"p","h":"<strong>Код</strong> — это набор инструкций для компьютера, написанный текстом. Так же, как рецепт состоит из шагов («взбить яйца, добавить муку»), код состоит из команд («если пароль неверный, показать ошибку»)."},{"t":"p","h":"Инструкции пишут на <strong>языках программирования</strong>. Их много, как человеческих языков, и у каждого свои задачи. В этой книге вам встретятся несколько:"},{"t":"list","tag":"ul","c":"ul","items":["<li><strong>HTML и CSS</strong> — языки, которыми описывают внешний вид страницы. HTML задаёт, что на странице есть (заголовок, кнопка, картинка), а CSS — как это выглядит (цвета, отступы, шрифты). Строго говоря, это не программирование, а разметка, но на практике их пишут вместе.</li>","<li><strong>JavaScript</strong> — язык, который «оживляет» страницы: кнопки нажимаются, меню раскрываются, данные подгружаются.</li>","<li><strong>TypeScript</strong> — тот же JavaScript, но со строгой проверкой. Он сразу подсвечивает ошибки вроде «здесь должно быть число, а вы передали текст». Это как корректор, который подчёркивает опечатки прямо при наборе.</li>","<li><strong>Python</strong> — универсальный язык, популярный для обработки данных, скриптов и работы с ИИ.</li>"]},{"t":"p","h":"Код хранится в <strong>файлах</strong>, а файлы лежат в <strong>папках</strong> — так же, как документы на вашем компьютере. Все файлы и папки одного приложения называются <strong>проектом</strong>."},{"t":"p","h":"Программисты почти никогда не пишут всё с нуля. Они берут готовые детали:"},{"t":"list","tag":"ul","c":"ul","items":["<li><strong>Библиотека</strong> (или <strong>пакет</strong>) — готовый кусок кода, который решает одну задачу: показать календарь, отправить письмо, нарисовать график. Как покупное тесто вместо того, чтобы молоть муку.</li>","<li><strong>Зависимость</strong> — библиотека, без которой ваш проект не заработает. Если вы добавили в проект календарь, то проект теперь «зависит» от него. Чем больше зависимостей, тем больше чужого кода вы пустили в свой проект. Поэтому ИИ стоит просить не добавлять новые без нужды.</li>","<li><strong>Фреймворк</strong> — это не деталь, а целый каркас: готовая заготовка приложения со своими правилами, куда вы встраиваете своё. React и Next.js, которые упоминаются в книге, — популярные фреймворки для сайтов. Как готовая кухня с оборудованием: вам остаётся только придумать меню.</li>"]},{"t":"note","h":"<div class=\"note simple\"><span class=\"nl\">Простыми словами</span> Библиотека — это набор инструментов. Фреймворк — это готовый дом с фундаментом и стенами, внутри которого вы расставляете свою мебель. Оба экономят время, но с обоими нужно считаться: если дом построен по чужим правилам, стену посередине просто так не снести.</div>"},{"t":"p","h":"И последнее в этом разделе — <strong>секреты</strong>. Приложению часто нужны пароли для других сервисов: ключ для оплаты, ключ для доступа к ИИ. Такие пароли для программ называют <strong>ключами API</strong>. Их хранят в отдельном файле настроек, чаще всего он называется <code>.env</code>, и никогда не кладут в публичное место."},{"t":"note","h":"<div class=\"note warn\"><span class=\"nl\">Внимание</span> Ключ API — это как пин-код от банковской карты. Кто его получит, сможет тратить ваши деньги и данные. Никогда не вставляйте ключи в чат с ИИ, не публикуйте их на GitHub и не отправляйте в мессенджерах.</div>"},{"t":"h3","id":"sa3","h":"<h3>Где живёт код: терминал, редактор и репозиторий</h3>"},{"t":"p","h":"<strong>Терминал</strong> (его ещё называют командной строкой или консолью) — окно, в котором вы не нажимаете кнопки, а печатаете команды текстом. Выглядит непривычно, как чёрный экран с мигающей чертой. Но это просто другой способ сказать компьютеру «сделай вот это». Многие ИИ-агенты, в том числе Claude Code, работают именно в терминале: вы пишете им задачу обычным языком, а они запускают команды сами."},{"t":"fig","n":"abc_terminal","cap":"Рис. А.2 · терминал: команда и ответ"},{"t":"p","h":"Как читать схему: тёмное окно — это терминал. Строки со знаком $ вы пишете сами, остальные строки — ответ компьютера. Цифры на картинке совпадают с цифрами в пояснениях справа."},{"t":"p","h":"Если вы работаете в десктопном приложении Claude, терминал открывать не обязательно: тот же агент работает в обычном окне. Сравните оба вида."},{"t":"fig","n":"dk_two","cap":"Рис. А.3 · терминал и десктопное приложение: один и тот же агент"},{"t":"p","h":"Как читать схему: слева терминал, справа приложение. Вы пишете одну и ту же задачу и получаете один и тот же результат. Отличается только вид: в терминале всё текстом, в приложении есть кнопки и отдельные окна для изменений и сайта."},{"t":"p","h":"<strong>Редактор кода</strong> (или <strong>IDE</strong>, читается «ай-ди-и») — программа, в которой открывают проект и видят все его файлы. Это как Word, но для кода: с подсветкой, подсказками и поиском. Популярные редакторы — VS Code и Cursor. Если вы работаете только с агентом в терминале, редактор вам нужен редко, но смотреть в него иногда полезно."},{"t":"fig","n":"abc_editor","cap":"Рис. А.4 · редактор кода по частям"},{"t":"p","h":"Как читать схему: слева файлы проекта, в центре текст выбранного файла, внизу встроенный терминал. Красная подсветка — место, где редактор заметил возможную проблему."},{"t":"p","h":"Дальше идёт самое важное слово этой главы: <strong>Git</strong> (читается «гит»). Это система, которая запоминает всю историю изменений проекта. Её главная идея знакома каждому, кто играл в игры: <strong>сохранения</strong>. Вы дошли до сложного места, сохранились, и если что-то пошло не так, можно вернуться."},{"t":"list","tag":"ul","c":"ul","items":["<li><strong>Репозиторий</strong> (от английского <em>repository</em>, «хранилище») — проект вместе со всей историей его изменений. Часто его называют просто «репо».</li>","<li><strong>Коммит</strong> — одно сохранение с подписью: «добавил форму входа», «починил расчёт цены». Это точка, к которой можно вернуться.</li>","<li><strong>Ветка</strong> — параллельная копия проекта, в которой можно безопасно экспериментировать. Основная версия остаётся нетронутой, а когда эксперимент удался, его присоединяют обратно.</li>","<li><strong>Дифф</strong> (от <em>difference</em>, «разница») — наглядный список отличий между двумя версиями: что было и что стало. Удалённое выделяют красным, добавленное — зелёным.</li>","<li><strong>GitHub</strong> — сайт, где хранят репозитории в интернете. Это как облачный диск, но для проектов с историей.</li>","<li><strong>Пул-реквест</strong> (от <em>pull request</em>, «просьба влить изменения») — предложение присоединить ветку к основной версии. Перед этим кто-то должен посмотреть изменения и одобрить. ИИ-агенты часто работают так: делают задачу в отдельной ветке и присылают вам пул-реквест на проверку.</li>"]},{"t":"fig","n":"abc_pr","cap":"Рис. А.5 · как выглядит пул-реквест"},{"t":"p","h":"Как читать схему: так на сайте хранилища выглядит предложение изменений. Читайте окно сверху вниз: название, список файлов, дифф (красное удалено, зелёное добавлено), проверки и кнопка принятия."},{"t":"note","h":"<div class=\"note simple\"><span class=\"nl\">Простыми словами</span> Git похож на историю версий в Google Документах, только намного точнее. Каждый коммит — именная версия, ветка — копия документа, в которой вы пробуете другой вариант, а пул-реквест — вопрос коллеге: «Посмотри, можно ли это внести в основной документ?»</div>"},{"t":"fig","n":"abc_git","cap":"Рис. А.6 · Git как сохранения в игре"},{"t":"p","h":"Как читать схему: кружки на линии — сохранения (коммиты), а стрелка по ним показывает ход времени. Ответвление вверх — запасная копия, где можно пробовать новое, не портя главную линию. Дуга под линией показывает откат к удачному сохранению."},{"t":"fig","n":"abc_commit","cap":"Рис. А.7 · сохранение в Git тремя командами"},{"t":"p","h":"Как читать схему: три окна терминала идут слева направо: посмотреть изменения, выбрать их и сохранить с подписью. После третьего шага в истории проекта появляется новая точка."},{"t":"note","h":"<div class=\"note tip\"><span class=\"nl\">Совет</span> Привычка, которая спасает проекты: перед тем как просить ИИ о крупном изменении, попросите его сделать коммит с понятной подписью. Если результат вам не понравится, вы вернётесь к рабочей версии за минуту.</div>"},{"t":"h3","id":"sa4","h":"<h3>Как код становится работающим сайтом</h3>"},{"t":"p","h":"Пока вы пишете код, он живёт у вас на компьютере. Чтобы им могли пользоваться другие люди, его нужно запустить и выложить в интернет."},{"t":"p","h":"<strong>Запустить локально</strong> — значит запустить приложение на своём компьютере, чтобы посмотреть, как оно работает. Для этого обычно используют адрес <code>localhost</code> (читается «локалхост», «этот компьютер»). Откройте его в браузере, и вы увидите свой сайт, хотя больше никто его не видит. Это как репетиция перед спектаклем."},{"t":"fig","n":"abc_localhost","cap":"Рис. А.8 · запуск сайта на своём компьютере"},{"t":"p","h":"Как читать схему: слева терминал, справа браузер. Команда в терминале запускает сайт, а адрес из зелёной строки вы открываете в браузере. Увидите сайт только вы, пока он не выложен в интернет."},{"t":"p","h":"В десктопном приложении Claude сайт можно смотреть, не выходя из окна: для этого есть панель Browser."},{"t":"fig","n":"dk_browser","cap":"Рис. А.9 · панель Browser: сайт внутри приложения"},{"t":"p","h":"Как читать схему: справа от чата открыта панель с вашим сайтом. Адрес localhost:3000 — тот самый адрес «этого компьютера» из предыдущей схемы. Если нажать на значок выбора элемента, а потом на кнопку на странице, вы покажете Claude мышкой, что именно хотите изменить."},{"t":"p","h":"<strong>Сборка</strong> — подготовка кода к выходу в свет. Исходный код удобен для людей, но не самый быстрый для браузера. При сборке программа превращает его в компактную, оптимизированную версию."},{"t":"p","h":"<strong>Деплой</strong> (от английского <em>deploy</em>, «развернуть») — выкладывание приложения в интернет, чтобы оно стало доступно всем. Для этого нужен <strong>хостинг</strong> — компьютеры, на которых будет жить ваш сайт, и обычно <strong>домен</strong> — адрес вроде <code>myapp.ru</code>. Сегодня многие сервисы делают деплой почти автоматически: вы подключаете репозиторий, и сайт обновляется при каждом изменении."},{"t":"p","h":"Вам часто встретятся слова <strong>окружение</strong> и <strong>продакшен</strong>. Окружение — это место, где работает ваш проект. Обычно их несколько:"},{"t":"list","tag":"ul","c":"ul","items":["<li><strong>Разработка</strong> — ваш компьютер. Здесь можно ломать что угодно.</li>","<li><strong>Тестовое окружение</strong> (его называют <em>staging</em>) — копия боевой версии, где всё проверяют перед выпуском.</li>","<li><strong>Продакшен</strong> (от <em>production</em>, «боевая версия») — настоящее приложение, которым пользуются живые люди. Ошибка здесь стоит дорого.</li>"]},{"t":"note","h":"<div class=\"note simple\"><span class=\"nl\">Простыми словами</span> Разработка — репетиция в пустом зале. Тестовое окружение — генеральная репетиция в костюмах. Продакшен — премьера перед настоящими зрителями. Чем ближе к премьере, тем осторожнее нужно действовать.</div>"},{"t":"fig","n":"abc_envs","cap":"Рис. А.10 · три окружения"},{"t":"p","h":"Как читать схему: приложение движется слева направо: сначала на вашем компьютере, потом в тестовой копии, потом у настоящих людей. Чем правее, тем дороже ошибка, поэтому проверять нужно раньше."},{"t":"h3","id":"sa5","h":"<h3>Как понять, что всё работает</h3>"},{"t":"p","h":"Нет программ без ошибок. Опытные разработчики отличаются от новичков не тем, что у них нет ошибок, а тем, что у них есть система, которая их ловит. Вот слова этой системы:"},{"t":"list","tag":"ul","c":"ul","items":["<li><strong>Баг</strong> — ошибка в программе: кнопка не нажимается, цена считается неверно.</li>","<li><strong>Тест</strong> — автоматическая проверка. Это маленькая программа, которая запускает вашу программу и проверяет, что результат правильный. Например: «если ввести цену 100 и скидку 10%, получится 90». Хороший набор тестов — как контрольный лист пилота перед взлётом.</li>","<li><strong>Лог</strong> (журнал) — запись о том, что делала программа и что пошло не так. Когда приложение ведёт себя странно, первым делом смотрят в логи.</li>","<li><strong>Отладка</strong> — поиск причины бага. Часто её описывают как работу детектива: собрать улики, выдвинуть версию, проверить.</li>","<li><strong>CI</strong> (читается «си-ай», «непрерывная интеграция») — робот, который автоматически запускает все тесты и проверки каждый раз, когда в проект попадает новое изменение. Если что-то красное, изменение не пропустят.</li>","<li><strong>Рефакторинг</strong> — наведение порядка в коде без изменения того, что программа делает снаружи. Как уборка и перекладывание вещей в шкафу: всё те же вещи, но найти их проще.</li>","<li><strong>Миграция</strong> — аккуратное изменение устройства базы данных, например добавление новой колонки. Это как перестановка полок на складе, когда там уже лежат товары: нужно переложить всё и ничего не потерять.</li>"]},{"t":"fig","n":"abc_devtools","cap":"Рис. А.11 · панель разработчика и красная ошибка"},{"t":"p","h":"Как читать схему: внизу страницы открыта панель разработчика. На вкладке Console красным выводятся ошибки. Скопируйте их текст целиком и отправьте ИИ вместе с описанием своих действий."},{"t":"p","h":"Что делать, когда видите непонятное сообщение об ошибке? Не паниковать. Сообщения об ошибках пугающе выглядят, но обычно содержат то, что нужно, просто на техническом языке. Три правила:"},{"t":"list","tag":"ol","c":"ol","items":["<li data-n=\"1\"><strong>Не пересказывайте, копируйте целиком.</strong> Скопируйте весь текст ошибки и отправьте его ИИ вместе с описанием, что вы делали перед этим.</li>","<li data-n=\"2\"><strong>Укажите, что ожидали и что получили.</strong> «Нажал «Сохранить», ожидал сообщение об успехе, получил белый экран и вот это».</li>","<li data-n=\"3\"><strong>Не правьте вслепую.</strong> Если ИИ предложил исправление, а ошибка не исчезла, не нужно просить «ещё раз». Попросите объяснить, почему это должно было сработать, и что именно мы проверим.</li>"]},{"t":"fig","n":"abc_error","cap":"Рис. А.12 · что приложить, отправляя ошибку ИИ"},{"t":"p","h":"Как читать схему: в центре — ваше сообщение, вокруг — то, что к нему стоит приложить. Чем больше из этого вы дадите, тем точнее будет ответ. Пересказ «своими словами» среди них отсутствует намеренно."},{"t":"h3","id":"sa6","h":"<h3>Слова про ИИ, которые встретятся сразу</h3>"},{"t":"p","h":"Подробнее эти понятия разобраны в главе 1. Пока достаточно краткой шпаргалки:"},{"t":"list","tag":"ul","c":"ul","items":["<li><strong>Модель</strong> — сам ИИ, «мозг», который отвечает на ваши запросы: Claude, GPT, Gemini и другие.</li>","<li><strong>Запрос</strong> (по-английски <strong>промпт</strong>, <em>prompt</em>) — текст, который вы отправляете ИИ.</li>","<li><strong>Контекст</strong> — всё, что ИИ «видит» в данный момент: ваш запрос, предыдущие сообщения, прочитанные файлы. Если чего-то нет в контексте, ИИ этого не знает.</li>","<li><strong>Токен</strong> — кусочек текста, из которых модель складывает слова. Цена и лимиты считаются в токенах.</li>","<li><strong>Агент</strong> — ИИ, который не просто отвечает на вопросы, а сам действует: читает файлы, запускает команды, правит код.</li>","<li><strong>Галлюцинация</strong> — когда ИИ уверенно выдумывает то, чего нет: несуществующую библиотеку, неверную команду, ложный факт.</li>","<li><strong>MCP</strong> — стандартный «разъём», через который к агенту подключают внешние инструменты: календарь, базу данных, браузер.</li>"]},{"t":"h3","id":"sa7","h":"<h3>Итоги и дальнейшие шаги</h3>"},{"t":"p","h":"Приложение — это ресторан: зал (фронтенд), кухня (бэкенд), склад (база данных) и официант (API). Код лежит в файлах проекта, Git хранит историю как сохранения в игре, а между вашим компьютером и настоящими пользователями стоят окружения: разработка, тестовое и продакшен. Тесты и логи помогают понять, что программа работает, а сообщения об ошибках нужно копировать целиком и отправлять ИИ."},{"t":"p","h":"Запоминать всё это наизусть не нужно. Закладка на эту главу и словарь в конце книги всегда под рукой."},{"t":"lbl","h":"<div class=\"lbl\">Упражнения</div>"},{"t":"list","tag":"ul","c":"tasks","items":["<li><label><input type=\"checkbox\" data-task=\"t1\"><span>Опишите свою идею приложения по схеме «ресторана»: что в нём будет залом (экраны), кухней (логика) и складом (данные). Если не получается, попросите ИИ помочь вам разобраться.</span></label></li>","<li><label><input type=\"checkbox\" data-task=\"t2\"><span>Откройте любой проект или попросите ИИ создать маленький сайт «Привет, мир». Найдите в нём папки и файлы и спросите ИИ, для чего нужен каждый из них.</span></label></li>","<li><label><input type=\"checkbox\" data-task=\"t3\"><span>Выпишите пять слов из этой главы, которые вам пока непонятны, и попросите ИИ объяснить каждое на примере из вашей сферы.</span></label></li>"]},{"t":"part","id":"p1","num":"I","title":"Основы","h":"<div class=\"part-in\"><div class=\"pt-kicker\">Часть</div><div class=\"pt-num\">I</div><h2 class=\"pt-title\">Основы</h2><ol class=\"pt-list\"><li><span>1</span>Введение: что такое вайб-кодинг?</li><li><span>2</span>Искусство составления запросов: эффективный способ общения с ИИ</li></ol></div>"},{"t":"ch","id":"ch1","head":"Глава 1 · Введение","h":"<header class=\"ch-open\"><div class=\"ch-kicker\">Глава</div><div class=\"ch-big\">1</div><h2>Введение: что такое вайб-кодинг?</h2></header>"},{"t":"p","h":"<strong>Вайб-кодинг</strong> — это способ создавать программы, описывая желаемый результат обычным языком и почти не читая код, который пишет ИИ. Вы говорите, что хотите увидеть, ИИ пишет программу, вы запускаете её, смотрите, что получилось, и просите поправить. Термин предложил Андрей Карпати в феврале 2025 года, и за год он стал названием целой культуры разработки: в ноябре 2025 года словарь Collins выбрал <em>vibe coding</em> словом года."},{"t":"p","h":"Если вы когда-нибудь просили ИИ «сделай мне сайт» и получали работающую страницу, вы уже занимались вайб-кодингом. В этой главе мы разберём, где он уместен, где опасен и чем отличается от более взрослого подхода, когда ИИ помогает, а человек контролирует процесс. Попутно вы познакомитесь с инструментами и моделями, с которыми будете работать."},{"t":"p","h":"Сам Карпати в феврале 2026 года назвал вайб-кодинг пройденным этапом и предложил для взрослого подхода другое название — <strong>агентная инженерия</strong> (<em>agentic engineering</em>): человек ставит задачи ИИ-агентам, проверяет их работу и отвечает за результат. Оба слова живут параллельно. В этой книге вайб-кодинг — точка старта, а агентная инженерия — цель: к последней главе вы будете работать именно так."},{"t":"h3","id":"s5","h":"<h3>Спектр ИИ-кодирования: от вайб-кодинга до разработки с помощью ИИ</h3>"},{"t":"p","h":"Работа с ИИ — это не выключатель «ИИ включён» или «ИИ выключен», а шкала, которую в науке называют <strong>спектром</strong>. На одном конце человек пишет каждую строку сам, а ИИ только подсказывает, как закончить слово. На другом конце человек формулирует цель, а ИИ-агент сам составляет план, пишет код, проверяет его и присылает готовое изменение на просмотр."},{"t":"p","h":"Между этими полюсами лежат пять типичных режимов:"},{"t":"list","tag":"ul","c":"ul","items":["<li><strong>Автодополнение.</strong> ИИ предлагает следующую строку или кусок кода, как подсказка слов в телефоне. Человек нажимает «принять» или игнорирует. Контроль полностью у человека.</li>","<li><strong>Чат-ассистент.</strong> Вы задаёте вопрос в чате, получаете ответ, копируете его в свой проект и правите. ИИ работает как справочник и генератор заготовок.</li>","<li><strong>Вайб-кодинг.</strong> Вы описываете результат, ИИ пишет весь код, а вы смотрите только на то, как программа себя ведёт: нажимаете кнопки, пробуете сценарии. Сам код почти не читается.</li>","<li><strong>Разработка с помощью ИИ</strong> (по-английски <em>AI-assisted engineering</em>). Человек держит в руках общий план проекта, ставит задачи небольшими порциями и проверяет каждое изменение. ИИ — быстрый исполнитель под надзором.</li>","<li><strong>Делегирование агентам.</strong> Агент получает задачу и выполняет её самостоятельно, часто в фоне, пока вы занимаетесь другим. Человек проверяет итог, а не каждый шаг.</li>"]},{"t":"note","h":"<div class=\"note simple\"><span class=\"nl\">Простыми словами</span> Режимы похожи на поездку на машине. Автодополнение: вы за рулём, навигатор иногда подсказывает поворот. Чат-ассистент: вы за рулём, а рядом сидит знающий штурман. Вайб-кодинг: вы называете адрес такси и едете на заднем сиденье, не следя за маршрутом. Разработка с помощью ИИ: вы тоже в такси, но следите за дорогой и вмешиваетесь, если водитель поехал не туда. Делегирование агентам: вы отправили машину с грузом без себя и принимаете груз на месте.</div>"},{"t":"fig","n":"1.1","cap":"Рис. 1.1 · пять режимов работы с ИИ на двух осях"},{"t":"p","h":"Как читать схему: по горизонтали отложено, сколько кода пишет ИИ (чем правее, тем больше), по вертикали — насколько хорошо человек понимает результат (чем выше, тем лучше). Точки стоят приблизительно: это качественная оценка, а не измерение. Вайб-кодинг оказывается в нижнем правом углу: ИИ пишет почти всё, а человек понимает мало. Это и есть «зона риска» на рисунке."},{"t":"fig","n":"ch1_chat_vs_agent","cap":"Рис. 1.2 · чат и агент"},{"t":"p","h":"Как читать схему: в верхнем ряду вы сами переносите код из чата в проект. В нижнем это делает агент, а вам остаётся поставить задачу и посмотреть итог. Синим выделены шаги ИИ."},{"t":"p","h":"Главное различие между режимами не в инструменте, а в том, <strong>кто отвечает за понимание кода</strong>. В вайб-кодинге понимание принесено в жертву скорости. В разработке с помощью ИИ скорость получена без отказа от понимания."},{"t":"table","head":"<tr><th>Режим</th><th>Кто проверяет результат</th><th>Где уместен</th><th>Главный риск</th></tr>","rows":["<tr><td>Вайб-кодинг</td><td>Почти никто не читает код, проверяют только поведение</td><td>Прототипы (пробные версии), личные утилиты, эксперименты</td><td>Код, который никто не может чинить и развивать</td></tr>","<tr><td>Разработка с помощью ИИ</td><td>Человек читает каждое изменение построчно</td><td>Настоящие продукты, командные проекты</td><td>Усталость от проверки и пропущенные ошибки</td></tr>","<tr><td>Делегирование агентам</td><td>Человек смотрит итоговый список изменений</td><td>Чётко описанные задачи, результат которых легко проверить</td><td>Агент решает не ту задачу</td></tr>"],"cols":4},{"t":"p","h":"Один и тот же человек в течение дня переходит между режимами. Утром он вайб-кодит прототип для демонстрации, днём аккуратно ведёт работу над платёжным модулем, вечером отдаёт агенту рутинное обновление. Зрелость — это умение выбрать режим под цену ошибки: чем больнее обойдётся промах, тем больше вы контролируете."},{"t":"note","h":"<div class=\"note simple\"><span class=\"nl\">Простыми словами</span> Если вы делаете сайт-визитку для себя, вайб-кодинг подходит. Если вы принимаете деньги или храните данные клиентов, нужно переходить к режиму, в котором вы понимаете и проверяете, что происходит. Именно этому учит остальная книга.</div>"},{"t":"h3","id":"s6","h":"<h3>Чтение между строк: программирование с намерением</h3>"},{"t":"p","h":"ИИ устроен так, что всё, чего вы не сказали, он достраивает самым вероятным вариантом. Не уточнили, где хранить пароли пользователей, и он выберет то, что чаще всего встречалось в его обучающих данных, а не то, что безопасно для вашего проекта. Поэтому главный навык в работе с ИИ — <strong>передавать намерение</strong>: объяснять, что нужно, зачем и в каких рамках."},{"t":"p","h":"Сравните два запроса к ИИ. Оба просят сделать форму входа. Слово <strong>аутентификация</strong> в них означает проверку, что человек тот, за кого себя выдаёт: обычно это вход по логину и паролю."},{"t":"code","c":"prompt","label":"Запрос (без намерения)","lines":["Сделай форму входа."]},{"t":"code","c":"prompt","label":"Запрос (с намерением)","lines":["Сделай форму входа для закрытой страницы сотрудников на Next.js.","Цель: пустить только сотрудников, остальным показать понятную ошибку.","Ограничения: проверка пароля уже есть в файле lib/auth.ts, используй её; пароль не записывать в журнал; после трёх неверных попыток сделать паузу 30 секунд.","Не добавляй новых библиотек."]},{"t":"p","h":"Next.js в запросе — это популярный каркас для сайтов (подробнее в «Азбуке»). Не страшно, если вы не знаете, что такое <code>lib/auth.ts</code>: в своём проекте вы будете подставлять свои названия, а ИИ их прочитает."},{"t":"p","h":"Второй запрос длиннее на минуту работы, но экономит час переделок. Он задаёт цель, контекст, ограничения и критерий успеха. Эти четыре элемента мы подробно разберём в главе 2."},{"t":"p","h":"Программирование с намерением меняет вашу роль. Вы меньше думаете о том, как именно записать команду, и больше о том, что считать правильным результатом. Парадоксально, но это требует более глубокого понимания предметной области, а не менее глубокого. Если вы делаете приложение для записи к врачу, лучше вас никто не знает, что бывает, когда два человека записываются на одно время."},{"t":"fig","n":"ch1_skills","cap":"Рис. 1.3 · четыре навыка вместо набора кода"},{"t":"p","h":"Как читать схему: каждая карточка — один навык, который растёт в цене, когда код пишет ИИ. Читайте их как короткий список того, чему стоит учиться в первую очередь."},{"t":"h3","id":"s7","h":"<h3>Производительность, доступность и меняющаяся природа программирования</h3>"},{"t":"p","h":"ИИ действительно ускоряет многие задачи: шаблонный код, тесты, перенос данных, перевод кода с языка на язык, разбор незнакомой библиотеки. Но ускорение неравномерно и не гарантировано. В июле 2025 года организация METR провела <strong>рандомизированное исследование</strong>, то есть участникам случайным образом разрешали или запрещали пользоваться ИИ, чтобы честно сравнить результаты. В нём участвовали 16 разработчиков и 246 задач. Опытные разработчики в знакомых им крупных проектах работали с ИИ на 19% медленнее, хотя сами считали, что ускорились примерно на 20%."},{"t":"p","h":"Этот результат не означает, что ИИ бесполезен. Он означает, что ощущение скорости обманчиво, а выигрыш зависит от задачи, опыта и того, сколько времени уходит на проверку и исправление. В феврале 2026 года METR опубликовал продолжение. На новых инструментах замедления уже не видно, и ускорение, по оценке самих исследователей, теперь вероятно. Но измерить его надёжно не удалось: многие разработчики отказывались работать без ИИ даже ради эксперимента, и это искажает сравнение. Правило осталось прежним: измеряйте, а не верьте ощущениям."},{"t":"p","h":"Второе изменение — <strong>доступность</strong>. Дизайнеры, аналитики, предприниматели и школьники собирают работающие приложения без классического обучения программированию. Это расширяет круг людей, создающих программы, но и увеличивает количество кода, который никто до конца не понимает. Эта книга написана как раз для того, чтобы вы оказались в первой группе, а не во второй."},{"t":"p","h":"Третье изменение — сама природа работы. Центр тяжести смещается с набора кода на четыре навыка:"},{"t":"list","tag":"ul","c":"ul","items":["<li><strong>Постановка задачи.</strong> Превратить расплывчатое «хочу как у них» в понятное и проверяемое описание.</li>","<li><strong>Декомпозиция.</strong> Разбить большую задачу на небольшие части, с которыми ИИ справится надёжно.</li>","<li><strong>Проверка.</strong> Читать, запускать, тестировать и пытаться сломать то, что сгенерировал ИИ.</li>","<li><strong>Интеграция.</strong> Собрать части в систему, которую можно развивать и поддерживать годами.</li>"]},{"t":"p","h":"Обратите внимание: ни один из этих навыков не требует уметь печатать код. Они требуют ясно думать, и это можно тренировать."},{"t":"h3","id":"s8","h":"<h3>Краткий обзор инструментов: становление экосистемы</h3>"},{"t":"p","h":"Инструменты для работы с ИИ сложились в несколько классов. Названия ниже — снимок на октябрь 2026 года: классы меняются медленнее, чем продукты внутри них."},{"t":"table","head":"<tr><th>Класс</th><th>Как работает</th><th>Примеры</th></tr>","rows":["<tr><td>Автодополнение в редакторе кода</td><td>Подсказывает код по мере набора</td><td>GitHub Copilot, встроенные подсказки редакторов</td></tr>","<tr><td>ИИ-редакторы</td><td>Редактор кода, построенный вокруг чата и агента</td><td>Cursor, Zed</td></tr>","<tr><td>Терминальные агенты</td><td>Агент в командной строке читает ваш проект, запускает команды и правит файлы</td><td>Claude Code, Codex CLI, Antigravity CLI (бывший Gemini CLI), OpenCode</td></tr>","<tr><td>Облачные и фоновые агенты</td><td>Агент работает на удалённом компьютере и присылает готовое изменение (пул-реквест)</td><td>Codex в облаке, Devin, Copilot cloud agent</td></tr>","<tr><td>Конструкторы приложений</td><td>Приложение целиком из описания, сразу с хостингом</td><td>Lovable, Bolt, v0, Replit</td></tr>"],"cols":3},{"t":"fig","n":"ch1_agent_session","cap":"Рис. 1.4 · так выглядит сеанс с агентом"},{"t":"p","h":"Как читать схему: это обычное окно терминала, но вместо команд вы пишете задачу словами. Агент читает проект, составляет план, правит файлы и перед важным действием просит разрешения."},{"t":"p","h":"Что здесь важно новичку. <strong>Конструкторы приложений</strong> самые простые: вы описываете идею в чате и сразу видите сайт. Но чем сложнее проект, тем чаще вы упираетесь в их ограничения. <strong>Терминальные агенты</strong> сложнее в начале (нужно привыкнуть к терминалу), зато работают с настоящим проектом на вашем компьютере и дают гораздо больше свободы."},{"t":"p","h":"Claude Code — это не только терминал. У него есть <strong>десктопное приложение</strong>: обычная программа для компьютера, в которой тот же агент работает в привычном окне, с кнопками, списком задач и просмотром изменений. В приложении Claude две главные вкладки: Home, где собраны обычные разговоры (Chat) и длительные задачи (Cowork), и Code для работы с проектами. Chat и Cowork объединили в одну вкладку осенью 2026 года, и обновление приходит не всем сразу, поэтому у вас они ещё могут быть отдельными. Нам нужна вкладка Code. Если вы только начинаете, работайте в ней: терминал можно вообще не открывать."},{"t":"fig","n":"dk_window","cap":"Рис. 1.5 · окно Claude Code в десктопном приложении"},{"t":"p","h":"Как читать схему: цифры на окне совпадают с пояснениями под ним. Названия кнопок оставлены такими, как их пишет приложение (по-английски). Приложение обновляется часто, поэтому у вас что-то может называться иначе или стоять в другом месте, но смысл останется тем же."},{"t":"fig","n":"dk_keys","cap":"Рис. 1.6 · горячие клавиши приложения"},{"t":"p","h":"Как читать схему: слева и справа по пять самых полезных сочетаний. Горячие клавиши — это нажатие нескольких кнопок сразу, чтобы выполнить действие без мыши. Полный список всегда показывает сочетание Ctrl + / (на Mac ⌘ + /)."},{"t":"p","h":"Отдельно стоит упомянуть <strong>Model Context Protocol (MCP)</strong> — открытый стандарт, который компания Anthropic представила в ноябре 2024 года. Он позволяет подключать к агенту внешние возможности: базы данных, трекеры задач, документацию, браузер. Проще говоря, это универсальный «разъём»: подключили один раз, и агент может пользоваться новым инструментом. Сегодня MCP поддерживают большинство агентов. В декабре 2025 года Anthropic передала его независимому фонду Agentic AI Foundation при Linux Foundation, который создали вместе с OpenAI и Block. Теперь стандарт развивает не одна компания, а сообщество, и на него можно спокойно опираться."},{"t":"note","h":"<div class=\"note tip\"><span class=\"nl\">Совет</span> Не гонитесь за каждым новым инструментом. Выберите один основной агент и один редактор, освойте их глубоко, а новинки проверяйте на своих обычных задачах.</div>"},{"t":"h3","id":"s9","h":"<h3>Модели ИИ: современный ландшафт генерации кода</h3>"},{"t":"p","h":"<strong>Большая языковая модель</strong> (по-английски <em>LLM</em>) — это нейросеть, обученная предсказывать, какой фрагмент текста идёт следующим. Код для неё — тоже текст, и в обучающих данных его очень много. После первого этапа обучения модели дообучают на диалогах и на задачах, где результат можно проверить: код либо проходит тесты, либо нет."},{"t":"note","h":"<div class=\"note simple\"><span class=\"nl\">Простыми словами</span> Представьте человека, который прочитал почти весь интернет и все открытые программы мира и научился очень точно продолжать любую начатую фразу. Он не «знает», как правильно, он знает, как обычно бывает. Отсюда и сила ИИ (он видел тысячи похожих задач), и его слабость (он может уверенно выдать «обычное», которое вам не подходит).</div>"},{"t":"p","h":"Несколько понятий понадобятся вам постоянно:"},{"t":"list","tag":"ul","c":"ul","items":["<li><strong>Токен</strong> — единица текста для модели, примерно 3–4 символа английского текста. Русский текст обычно дробится на более мелкие куски, поэтому «стоит» дороже. От токенов зависят цена и лимиты.</li>","<li><strong>Контекстное окно</strong> — сколько токенов модель видит одновременно, её «рабочий стол». Всё, что не поместилось на стол, она не видит. У флагманов 2026 года окно достигает миллиона токенов, но на таком объёме точность сильно различается от модели к модели.</li>","<li><strong>Рассуждение</strong> (по-английски <em>reasoning</em>) — режим, в котором модель сначала «думает» скрытыми токенами, а потом отвечает. У многих моделей есть уровни усилия: от low («низкое») до max («максимальное»). У Claude их пять: low, medium, high, xhigh и max, а уровень по умолчанию зависит от модели. Чем выше усилие, тем глубже рассуждение, но тем дольше и дороже ответ.</li>","<li><strong>Вызов инструментов</strong> (<em>tool use</em>) — способность модели не просто писать текст, а просить выполнить команду, прочитать файл или сделать запрос. Это основа любого агента.</li>","<li><strong>Галлюцинация</strong> — уверенный, правдоподобный, но неверный ответ: несуществующая функция библиотеки, выдуманный параметр, неправильная версия.</li>"]},{"t":"p","h":"Важно понимать, что модель не «знает» ваш проект. Она видит только то, что попало в контекст: открытые файлы, ваш запрос, результаты команд. Всё остальное она достраивает по аналогии с миллионами чужих проектов."},{"t":"fig","n":"ch1_context","cap":"Рис. 1.7 · контекстное окно как рабочий стол"},{"t":"p","h":"Как читать схему: рабочий стол модели имеет границы: всё, что на нём лежит, модель видит, а то, что не поместилось или осталось за рамкой, для неё не существует. Поэтому важное нужно класть на стол явно, а не надеяться, что она «помнит»."},{"t":"h3","id":"s10","h":"<h3>Основные модели</h3>"},{"t":"p","h":"На октябрь 2026 года самые сильные модели («фронтир», то есть передний край) делят несколько семейств. Конкретные версии обновляются каждые несколько месяцев, поэтому смотрите на роли, а не на номера."},{"t":"table","head":"<tr><th>Разработчик</th><th>Семейство и линейка</th><th>Сильные стороны для кода</th></tr>","rows":["<tr><td>Anthropic</td><td>Claude: Fable 5.1 (самая мощная), Opus 5.5 и Sonnet 5.5, лёгкая Haiku 5.5</td><td>Работа в роли агента, длинные задачи, работа в терминале</td></tr>","<tr><td>OpenAI</td><td>GPT-6: Astra (флагман), Sol (с конца сентября — GPT-6.1 Sol, модель по умолчанию в Codex) и лёгкая Luna</td><td>Математика и рассуждение, экономия токенов, экосистема Codex</td></tr>","<tr><td>Google</td><td>Gemini 4 Argon (флагман) и быстрые Gemini 3.x Flash</td><td>Скорость и цена, работа с картинками и видео, длинный контекст</td></tr>","<tr><td>Открытые модели</td><td>DeepSeek V4.1, Qwen3.8, Kimi K3, GLM-5.3, Xiaomi MiMo-V2.6</td><td>Можно запускать у себя, низкая цена, отставание от лидеров в несколько месяцев</td></tr>"],"cols":3},{"t":"p","h":"<strong>Открытые модели</strong> — это модели, которые можно скачать и запускать на своём оборудовании, а не только пользоваться ими через сайт компании. По данным Epoch AI, с начала 2026 года лучшие открытые модели отставали от закрытых в среднем примерно на четыре месяца. Это значит, что вчерашний лидер быстро становится доступным для запуска у себя."},{"t":"h3","id":"s77","h":"<h3>Как понять, что представляет собой модель</h3>"},{"t":"p","h":"Название модели почти ничего не говорит: «Opus», «Sol», «Argon» — это бренды, а не описание. Чтобы понять, с чем вы имеете дело, у модели нужно узнать три вещи: что о ней пишет сам производитель, как она выступает на независимых проверках и как справляется с вашими задачами. Первое берут из карточки модели, второе — из бенчмарков, третье проверяете вы сами."},{"t":"p","h":"<strong>Карточка модели</strong> (<em>model card</em>; у Anthropic и OpenAI она называется <em>system card</em>) — документ, который компания публикует вместе с моделью. В нём результаты тестов, оценки безопасности и известные ограничения. Технические характеристики и цены обычно лежат рядом, на странице модели в документации для разработчиков. Карточки Claude собраны на anthropic.com/system-cards, OpenAI — на deploymentsafety.openai.com, Google — на deepmind.google в разделе Model cards."},{"t":"note","h":"<div class=\"note simple\"><span class=\"nl\">Простыми словами</span> Карточка модели — как этикетка на продукте. Состав (чему и как учили), срок годности (дата среза знаний), цена за килограмм (за миллион токенов) и предупреждения мелким шрифтом (известные ограничения). Новички смотрят только на название, опытные покупатели переворачивают упаковку.</div>"},{"t":"p","h":"Что смотреть в первую очередь:"},{"t":"list","tag":"ul","c":"ul","items":["<li><strong>Контекстное окно</strong> — сколько помещается на «рабочий стол». У флагманов 2026 года это около миллиона токенов.</li>","<li><strong>Максимальная длина ответа</strong> — сколько модель может написать за один раз. Важно, когда агент создаёт большие файлы.</li>","<li><strong>Дата среза знаний</strong> (<em>knowledge cutoff</em>) — до какого момента модель знает мир. О библиотеках и сервисах, вышедших позже, она не знает и будет уверенно советовать старое, если не дать ей свежую документацию.</li>","<li><strong>Цена</strong> — за миллион токенов, отдельно на входе (ваш запрос и контекст) и на выходе (ответ). Ответ обычно в 4–5 раз дороже вопроса.</li>","<li><strong>Скорость</strong> — сколько токенов в секунду модель выдаёт и как быстро начинает отвечать.</li>","<li><strong>Уровни усилия</strong> — можно ли регулировать глубину рассуждения и какой уровень стоит по умолчанию.</li>","<li><strong>Что понимает кроме текста</strong> — картинки, скриншоты, документы.</li>","<li><strong>Ограничения и безопасность</strong> — раздел, который новички пропускают, а зря: там производитель сам пишет, где модель ошибается.</li>"]},{"t":"fig","n":"ch1_modelcard","cap":"Рис. 1.8 · карточка модели: что смотреть"},{"t":"p","h":"Как читать схему: слева страница условной модели, справа пояснения с теми же номерами. Название в шапке ничего не решает. Решают семь строк под ним, и на каждую стоит потратить минуту до того, как доверить модели проект."},{"t":"p","h":"Вот как эти характеристики выглядят у линейки Claude на октябрь 2026 года:"},{"t":"table","head":"<tr><th>Характеристика</th><th>Haiku 5.5</th><th>Sonnet 5.5</th><th>Opus 5.5</th></tr>","rows":["<tr><td>Роль</td><td>Быстрая и дешёвая</td><td>Работа на каждый день</td><td>Сложные задачи</td></tr>","<tr><td>Контекстное окно</td><td>1 млн токенов</td><td>1 млн токенов</td><td>1 млн токенов</td></tr>","<tr><td>Максимальный ответ</td><td>128 тыс. токенов</td><td>128 тыс. токенов</td><td>128 тыс. токенов</td></tr>","<tr><td>Дата среза знаний</td><td>июнь 2026</td><td>июнь 2026</td><td>июнь 2026</td></tr>","<tr><td>Цена за 1 млн токенов, вход / выход</td><td>$0,10 / $0,50*</td><td>$2 / $10</td><td>$4 / $20</td></tr>","<tr><td>Скорость, токенов в секунду</td><td>≈140–240</td><td>≈90–135</td><td>≈80–95</td></tr>"],"cols":4},{"t":"p","h":"* Для запросов до 100 тыс. токенов, для более длинных — $0,50 / $2,50. Самая мощная модель линейки, Fable 5.1, стоит $10 / $50. Скорость — по замерам Artificial Analysis, она меняется в зависимости от нагрузки."},{"t":"p","h":"Посмотрите, что таблица говорит без единого бенчмарка: окно, длина ответа и срез знаний у всех трёх одинаковые, а цена различается в 40 раз. Значит, разница между ними — в «уме» и скорости. Именно её и пытаются измерить бенчмарки."},{"t":"h3","id":"s78","h":"<h3>Бенчмарки: как читать оценки моделей</h3>"},{"t":"p","h":"<strong>Бенчмарк</strong> — стандартный набор задач, по которому сравнивают модели, как единый экзамен для всех. У каждого бенчмарка своя тема, поэтому одна и та же модель может быть первой в одном рейтинге и десятой в другом. Для работы с кодом полезно различать пять видов проверок:"},{"t":"table","head":"<tr><th>Что проверяет</th><th>Примеры (октябрь 2026)</th><th>Что значат цифры</th></tr>","rows":["<tr><td>Исправление задач в настоящих проектах</td><td>SWE-bench Verified, SWE-bench Pro, DeepSWE</td><td>Доля задач, после которых проходят тесты проекта. SWE-bench уже почти не различает лидеров (80–95%), DeepSWE пока различает: лидеры около 75%</td></tr>","<tr><td>Работу агента в терминале</td><td>Terminal-Bench 4.0</td><td>Доля решённых задач длиной до 8 часов. Лидеры набирают примерно 50–60%</td></tr>","<tr><td>Длину задач, которые агент доводит до конца</td><td>Горизонт задач METR</td><td>Сколько часов работы специалиста модель выполняет в половине случаев</td></tr>","<tr><td>Знания и рассуждение</td><td>Humanity’s Last Exam, ARC-AGI-3, GPQA Diamond</td><td>Экзамены экспертного уровня и головоломки. GPQA уже насыщен, на Humanity’s Last Exam лидеры набирают около 55–65%</td></tr>","<tr><td>Предпочтения людей</td><td>Arena (раньше LMArena), разделы WebDev и Code</td><td>Рейтинг по слепому сравнению: люди выбирают лучший из двух анонимных ответов</td></tr>"],"cols":3},{"t":"p","h":"Где смотреть рейтинги:"},{"t":"list","tag":"ul","c":"ul","items":["<li><strong>Artificial Analysis</strong> (artificialanalysis.ai) — сводный «индекс интеллекта» по десяти тестам, а рядом цена, скорость и многословность каждой модели. Хорошая первая остановка.</li>","<li><strong>Arena</strong> (arena.ai, до 2026 года — LMArena) — рейтинг по голосам людей. Есть отдельные разделы для веб-разработки и кода.</li>","<li><strong>Epoch AI</strong> (epoch.ai) — независимые замеры по десяткам бенчмарков и общая шкала возможностей, удобная, чтобы видеть прогресс во времени.</li>","<li><strong>Vals AI</strong> (vals.ai) — замеры на закрытых наборах задач, которые модели не могли увидеть при обучении.</li>","<li><strong>Сайты самих бенчмарков</strong>: swebench.com, tbench.ai, deepswe.datacurve.ai, metr.org. Там видно, в каких условиях мерили.</li>"]},{"t":"p","h":"Цифры легко прочитать неправильно. Прежде чем поверить строчке «модель X — лучшая для кода», проверьте восемь ловушек:"},{"t":"list","tag":"ol","c":"ol","items":["<li data-n=\"1\"><strong>Кто мерил.</strong> В анонсе компания показывает тесты, где модель сильна, и мерит в выгодных для себя условиях. Это не обман, а реклама. Ищите те же тесты у независимых площадок.</li>","<li data-n=\"2\"><strong>Насыщение.</strong> Когда лидеры набирают 90% и больше, тест перестаёт различать модели: разница в пару пунктов — уже шум. В феврале 2026 года OpenAI перестала ссылаться на насыщенный SWE-bench Verified.</li>","<li data-n=\"3\"><strong>Загрязнение.</strong> Если задачи теста попали в обучающие данные, модель «видела ответы». В том же SWE-bench Verified модели дословно воспроизводили эталонные исправления. Свежие и закрытые наборы задач защищают от этого лучше.</li>","<li data-n=\"4\"><strong>Сломанные задачи и жульничество.</strong> Тесты пишут люди, и они ошибаются. В июле 2026 года OpenAI выяснила, что около 30% задач SWE-bench Pro сломаны: верное решение могло не пройти проверку, а неверное — пройти. А модели иногда обходят проверку вместо решения: по данным METR, не меньше 16% «успехов» на самых длинных задачах были таким обходом.</li>","<li data-n=\"5\"><strong>Условия замера.</strong> Результат зависит не только от модели, но и от <strong>обвязки</strong> — программы-агента вокруг неё, — от уровня усилия и числа попыток. Один и тот же Claude Opus 5.5 набирает в индексе Artificial Analysis 42 балла на уровне усилия low и 58 на max. GPT-6 Astra решила головоломки ARC-AGI-3 на 62,7% в стандартной обвязке и на 99,9% в специально подобранной. Пометка pass@1 значит «с первой попытки», pass@k — «хотя бы одна из k попыток удачна»: второе число всегда выше.</li>","<li data-n=\"6\"><strong>Погрешность.</strong> Разница в 1–2 пункта часто укладывается в случайный разброс. Хорошие площадки показывают интервал, например «70% ± 3%». У горизонта задач METR разброс огромный: для оценки около 12 часов интервал был от 5 до 61 часа.</li>","<li data-n=\"7\"><strong>Арена — не правильность.</strong> На арене люди голосуют за ответ, который понравился, а нравятся длинные, уверенные и красиво оформленные ответы. Весной 2025 года экспериментальная версия Llama 4 заняла на LMArena второе место, а версия, которую выпустили для всех, оказалась примерно на 32-м. Арена хорошо показывает удобство общения и хуже — правильность кода.</li>","<li data-n=\"8\"><strong>Цена результата.</strong> Цена за токен — ещё не цена за задачу. Многословная модель тратит больше токенов: на прогон тестов индекса Artificial Analysis Opus 5.5 потратил около 260 млн токенов, а типичная модель — около 85 млн. Модель, которая на 2 пункта лучше, может обходиться в разы дороже.</li>"]},{"t":"fig","n":"ch1_trust","cap":"Рис. 1.9 · три уровня доверия к цифрам"},{"t":"p","h":"Как читать схему: внизу самый широкий и самый общий уровень — то, что о модели рассказывает производитель. Выше независимые замеры в одинаковых условиях. На вершине ваш собственный мини-набор: он узкий, зато отвечает именно на ваш вопрос."},{"t":"p","h":"Итоговая проверка — ваш <strong>мини-набор</strong>: 5–10 задач из вашей реальной работы. Ни один рейтинг не знает ваш проект, ваш язык и ваши привычки. Как его собрать:"},{"t":"list","tag":"ol","c":"ol","items":["<li data-n=\"1\">Возьмите задачи из своего списка (вы составите его в упражнениях к этой главе): пару простых, пару средних, одну-две трудные.</li>","<li data-n=\"2\">Для каждой запишите критерий «готово»: тест проходит, страница выглядит как на макете, ответ совпадает с образцом.</li>","<li data-n=\"3\">Дайте одинаковый запрос разным моделям в одинаковых условиях: тот же агент, тот же уровень усилия, чистый контекст.</li>","<li data-n=\"4\">Оценивайте результат, а не впечатление: сколько задач решено
