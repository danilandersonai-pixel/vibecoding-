><strong>Модульные</strong> — проверяют одну небольшую часть программы отдельно от остальных (например, функцию, которая считает скидку). Их много, они быстрые.</li>","<li><strong>Интеграционные</strong> — проверяют, как несколько частей работают вместе: например, приложение и настоящая тестовая база данных. Их меньше, они медленнее.</li>","<li><strong>Сквозные</strong> — имитируют действия реального человека в приложении от начала до конца: открыл страницу, нажал, увидел результат. Их мало, они самые медленные, но самые «жизненные».</li>"]},{"t":"fig","n":"5.1","cap":"Рис. 5.7 · пирамида тестирования для ИИ-кода"},{"t":"p","h":"Как читать схему: основание пирамиды — модульные тесты, их больше всего; вершина — немногие сквозные тесты. На всех уровнях тесты пишутся от требований, а не от готовой реализации."},{"t":"note","h":"<div class=\"note simple\"><span class=\"nl\">Простыми словами</span> Это похоже на проверку нового автомобиля. Модульные тесты — проверить каждую деталь на стенде: тормозные колодки, лампочки. Интеграционные — проверить, как работают вместе двигатель и коробка передач. Сквозной — просто сесть и проехать по городу.</div>"},{"t":"p","h":"Правильный порядок для логики с чёткими требованиями — тесты сначала. Ниже пример для функции, которая делит счёт между друзьями. Читать код построчно не нужно, достаточно увидеть идею:"},{"t":"code","c":"","label":"TypeScript","lines":["// Тесты написаны по требованиям ДО реализации","import { describe, it, expect } from \"vitest\";","import { splitBill } from \"./splitBill\";","","describe(\"splitBill\", () => {","  it(\"делит сумму поровну\", () => {","    expect(splitBill(300, 3)).toEqual([100, 100, 100]);","  });","  it(\"отдаёт остаток копеек первым участникам\", () => {","    expect(splitBill(100, 3)).toEqual([33.34, 33.33, 33.33]);","  });","  it(\"запрещает ноль участников\", () => {","    expect(() => splitBill(100, 0)).toThrow(\"participants\");","  });","});"]},{"t":"p","h":"Что здесь происходит. Функция <code>splitBill</code> делит сумму между участниками. Тест проверяет три требования. Первое: 300 рублей на троих — по 100. Второе: 100 рублей на троих не делятся поровну, остаток в копейку достаётся первому участнику, получается 33,34, 33,33 и 33,33. Третье: если участников ноль, функция должна отказаться работать и сообщить об ошибке. Заметьте, что тесты написаны по понятным требованиям, ещё до того, как написана сама функция. Вы тоже можете формулировать такие требования человеческими словами и просить ИИ превратить их в тесты."},{"t":"p","h":"Как проверять сами тесты:"},{"t":"list","tag":"ul","c":"ul","items":["<li><strong>Сломайте код намеренно.</strong> Если после поломки тесты всё равно проходят, они ничего не проверяют. Автоматически это делает <strong>мутационное тестирование</strong>: программа сама вносит мелкие ошибки в код и проверяет, заметят ли их тесты. Новичку достаточно попросить: «Намеренно сломай одну функцию и покажи, поймают ли это наши тесты».</li>","<li><strong>Проверьте имитации.</strong> Тест, в котором всё «подделано» (такие подделки называют <strong>моками</strong>), проверяет только подделки.</li>","<li><strong>Ищите тавтологии.</strong> Это тесты вида «результат равен самому себе» или сравнение с ожидаемым значением, которое посчитано тем же самым кодом: такие тесты проходят всегда.</li>","<li><strong>Добавьте свойства.</strong> Тесты, основанные на свойствах (<em>property-based</em>), проверяют общие правила («сумма долей всегда равна общей сумме») на сотнях случайных входных данных и находят необычные случаи, о которых никто не подумал.</li>"]},{"t":"fig","n":"ch5_testcheck","cap":"Рис. 5.8 · проверка самих тестов"},{"t":"p","h":"Как читать схему: хороший тест должен упасть, когда код сломан. Поэтому слева код ломают нарочно, а справа смотрят, заметил ли это тест. Если не заметил, он ничего не проверяет."},{"t":"h3","id":"s35","h":"<h3>Итоги и дальнейшие шаги</h3>"},{"t":"p","h":"Ответственность за код не передаётся вместе с его написанием. Метод проверки, знание типичных «запахов», дисциплина отладки и тесты, написанные от требований, превращают сгенерированный код в код, которому можно доверять. Главное для вас: вы можете делать всё это, не читая код построчно, а задавая вопросы ИИ и проверяя ответы на практике."},{"t":"lbl","h":"<div class=\"lbl\">Упражнения</div>"},{"t":"list","tag":"ul","c":"tasks","items":["<li><label><input type=\"checkbox\" data-task=\"t18\"><span>Возьмите последнее изменение от ИИ и задайте ему запрос «Объясни простыми словами, что ты изменил, и что мне проверить руками». Затем проверьте это руками и запишите, совпало ли объяснение с реальностью.</span></label></li>","<li><label><input type=\"checkbox\" data-task=\"t19\"><span>Попросите ИИ подключить к вашему проекту автоматические проверки (линтер и проверку типов) и показать, как их запускать. Запустите и посмотрите на результат.</span></label></li>","<li><label><input type=\"checkbox\" data-task=\"t20\"><span>Попросите ИИ написать тесты для одной функции по вашим требованиям, описанным словами. Затем скажите: «Намеренно сломай эту функцию и покажи, что тесты это заметят».</span></label></li>","<li><label><input type=\"checkbox\" data-task=\"t21\"><span>В следующий раз, когда увидите ошибку, воспользуйтесь запросом из этой главы: не просите исправить, а попросите три гипотезы и способ проверить каждую.</span></label></li>"]},{"t":"ch","id":"ch6","head":"Глава 6 · Прототипирование с использованием ИИ","h":"<header class=\"ch-open\"><div class=\"ch-kicker\">Глава</div><div class=\"ch-big\">6</div><h2>Прототипирование с использованием ИИ: инструменты и техники</h2></header>"},{"t":"p","h":"<strong>Прототип</strong> — это способ быстро узнать ответ на вопрос, а не первая версия продукта. Это как макет дома из картона: он нужен, чтобы понять, нравится ли вам планировка, а не чтобы в нём жить. ИИ сделал прототипы почти бесплатными: то, что раньше занимало недели, теперь занимает вечер. Главная опасность в том, что такой дешёвый прототип легко принять за готовый продукт."},{"t":"p","h":"Эта глава — самая практичная для новичка. По ней можно за один вечер получить свой первый работающий прототип и понять, что делать с ним дальше."},{"t":"h3","id":"s36","h":"<h3>Быстрое прототипирование с ИИ-ассистентами</h3>"},{"t":"p","h":"Хороший прототип начинается с вопроса, на который он должен ответить. «Захотят ли пользователи загружать фото чеков?», «Уложится ли расчёт в секунду на реальных данных?», «Понятен ли этот сценарий оформления заказа без подсказок?» Без вопроса прототип превращается в бесконечную игрушку, которую можно «дорабатывать» вечно."},{"t":"p","h":"Правила быстрого прототипа:"},{"t":"list","tag":"ul","c":"ul","items":["<li><strong>Таймбокс.</strong> Заранее решите, сколько времени готовы потратить: вечер, день, неделя. Когда время вышло, остановитесь и оцените результат. Это защищает от бесконечной доработки.</li>","<li><strong>Тонкий срез.</strong> Один сквозной сценарий целиком лучше десяти недоделанных экранов. Например, «пользователь заходит, загружает фото чека и видит сумму» от начала до конца, пусть даже все остальные функции приложения пока отсутствуют.</li>","<li><strong>Фейковые данные допустимы.</strong> <strong>Фейковые данные</strong> — придуманные примеры вместо настоящих. Если вопрос про интерфейс, настоящая база данных не нужна: достаточно пяти выдуманных клиентов.</li>","<li><strong>Готовность выбросить.</strong> Если жалко удалять, вы слишком много вложили в код, а не в знание. Ценен ответ на вопрос, а не код.</li>"]},{"t":"note","h":"<div class=\"note simple\"><span class=\"nl\">Простыми словами</span> Тонкий срез — это как попробовать один кусочек торта по всем слоям. Вы сразу чувствуете и крем, и бисквит, и начинку. Целиком торт вам печь не нужно, чтобы понять, вкусно ли.</div>"},{"t":"fig","n":"ch6_slice","cap":"Рис. 6.1 · тонкий срез против десяти недоделанных экранов"},{"t":"p","h":"Как читать схему: слева десять экранов, ни один из которых не доведён до конца. Справа один сценарий, пройденный целиком от входа до результата. Справа вы узнаёте больше, потратив меньше сил."},{"t":"p","h":"Шаблон запроса для старта прототипа (в квадратных скобках подставьте своё):"},{"t":"code","c":"prompt","label":"Запрос","lines":["Сделай прототип веб-приложения для [кого] чтобы [проверить что].","Главный сценарий: [шаги пользователя от входа до результата].","Это прототип: данные можно держать в памяти, авторизация не нужна, дизайн простой, но аккуратный. Стек: [стек].","В конце выведи список упрощений, которые придётся убрать перед продакшеном."]},{"t":"p","h":"Что здесь важно. <strong>Данные в памяти</strong> означают, что приложение не хранит ничего после выключения: для прототипа этого достаточно. <strong>Авторизация</strong> — это вход по паролю и разграничение прав, в прототипе её можно опустить. <strong>Стек</strong> — набор технологий, на которых построено приложение (подробнее в главе 7). Если вы не знаете, что вписать, напишите «выбери стек сам и объясни выбор в одном абзаце»."},{"t":"p","h":"Последняя строка запроса особенно важна. Список упрощений — это готовый план работ на случай, если прототип решат развивать."},{"t":"h3","id":"s37","h":"<h3>ИИ-инструменты прототипирования</h3>"},{"t":"p","h":"Для прототипов подходят разные классы инструментов, и выбор зависит от того, что вы проверяете. Названия ниже — снимок на октябрь 2026 года."},{"t":"table","head":"<tr><th>Класс</th><th>Примеры</th><th>Когда выбрать</th><th>Ограничения</th></tr>","rows":["<tr><td>Конструкторы приложений</td><td>Lovable, Bolt, v0, Replit</td><td>Проверить идею с пользователями за день, нужен хостинг сразу</td><td>Привязка к платформе, сложно поддерживать вне её</td></tr>","<tr><td>Дизайн-холсты с ИИ</td><td>Claude Design, Figma Make</td><td>Проверить интерфейс и сценарий до кода</td><td>Не проверяют, можно ли это реально сделать технически</td></tr>","<tr><td>Терминальные агенты в реальном стеке</td><td>Claude Code, Codex, Antigravity CLI</td><td>Прототип, который может стать продуктом</td><td>Нужны базовые навыки работы с проектом и терминалом</td></tr>","<tr><td>Ноутбуки и скрипты</td><td>Jupyter, Python-скрипты с ИИ</td><td>Проверить данные, алгоритм, скорость работы</td><td>Нет интерфейса для пользователей</td></tr>"],"cols":4},{"t":"p","h":"Пояснения к таблице. <strong>Конструктор приложений</strong> — сайт, где вы описываете идею, а он сам создаёт и сразу размещает приложение. <strong>Дизайн-холст</strong> — рабочее поле для рисования макетов, то есть картинок будущих экранов, без настоящего кода. <strong>Ноутбук</strong> (например, Jupyter) — документ, в котором вперемешку лежат текст, код и результаты вычислений; его любят для работы с данными. <strong>Claude Design</strong> — дизайн-холст от Anthropic. В октябре 2026 года он вышел из беты, доступен даже на бесплатном тарифе и встроен прямо в чат и в Claude Code: макет можно обсудить и тут же попросить агента сделать по нему страницу."},{"t":"fig","n":"ch6_builder","cap":"Рис. 6.2 · окно конструктора приложений"},{"t":"p","h":"Как читать схему: слева чат, куда вы пишете, справа готовое приложение, в котором можно нажимать. Кнопка «Опубликовать» выкладывает результат на сайт со своей ссылкой."},{"t":"p","h":"Десктопное приложение Claude Code тоже умеет подключаться к внешним сервисам. Все подключения собраны под кнопкой «+» рядом с полем ввода."},{"t":"fig","n":"dk_plus","cap":"Рис. 6.3 · кнопка «+»: файлы, команды, подключения и плагины"},{"t":"p","h":"Как читать схему: меню открывается кнопкой «+». Connectors позволяют Claude читать и менять данные в ваших сервисах (календарь, чат, задачи, заметки), а Plugins добавляют ему готовые наборы возможностей. Подключайте только то, чем пользуетесь: каждое подключение — это доступ к вашим данным."},{"t":"p","h":"Практическое правило: если прототип показывают пользователям и есть шанс, что он станет продуктом, делайте его в стеке, который вы готовы поддерживать. Если это одноразовая проверка интерфейса, берите самый быстрый инструмент."},{"t":"note","h":"<div class=\"note tip\"><span class=\"nl\">Совет</span> Если вы совсем новичок, начните с конструктора приложений или дизайн-холста: результат виден сразу, а терминал и настройки не мешают. Когда упрётесь в ограничения платформы, переходите к агенту, который работает с настоящим проектом.</div>"},{"t":"h3","id":"s38","h":"<h3>От концепции к прототипу: итеративная доработка</h3>"},{"t":"p","h":"Работа над прототипом — короткие циклы: описание, вариант, показ, правка. Каждый цикл должен заканчиваться работающей версией, к которой можно вернуться."},{"t":"p","h":"Что ускоряет итерации:"},{"t":"list","tag":"ol","c":"ol","items":["<li data-n=\"1\"><strong>Скриншоты как обратная связь.</strong> Современные модели видят изображения. Скриншот с пометками «здесь кнопка должна быть заметнее» понятнее абзаца текста.</li>","<li data-n=\"2\"><strong>Журнал решений.</strong> Короткий файл: что решили, почему, что отвергли. Он понадобится, когда прототип будут превращать в продукт, и спасёт от того, чтобы заново спорить о решённом.</li>","<li data-n=\"3\"><strong>Снимки состояния.</strong> Сохраняйтесь (коммит) после каждой удачной версии. Конструкторы приложений делают это автоматически, но в собственном проекте это ваша ответственность.</li>","<li data-n=\"4\"><strong>Показ живым людям рано.</strong> Первая реакция пользователя ценнее десятой итерации в одиночку. Покажите прототип трём знакомым и посмотрите, где они растеряются, не подсказывая.</li>"]},{"t":"fig","n":"ch6_iter","cap":"Рис. 6.4 · цикл прототипа"},{"t":"p","h":"Как читать схему: четыре карточки образуют виток: описание, вариант от ИИ, показ людям и правка. Пунктирная стрелка возвращает вас в начало. Внизу — условие выхода из цикла: когда вышло время или ответ уже получен."},{"t":"note","h":"<div class=\"note tip\"><span class=\"nl\">Совет</span> Когда прототип начинает разваливаться от правок, остановитесь. Попросите ИИ описать текущую функциональность в виде спецификации (описания того, что приложение умеет) и начните новую версию с чистого листа по этой спецификации. Часто это быстрее, чем латать. Как восстанавливать спецификацию по готовому приложению, подробно разобрано в главе 12.</div>"},{"t":"fig","n":"ch6_screenshot","cap":"Рис. 6.5 · скриншот с пометкой вместо длинного описания"},{"t":"p","h":"Как читать схему: слева экран приложения с красной пометкой, справа сообщение ИИ с этим скриншотом. Короткая подпись плюс картинка работают лучше абзаца описания."},{"t":"h3","id":"s80","h":"<h3>Пример: Telegram-бот за вечер</h3>"},{"t":"p","h":"Хороший первый проект — <strong>Telegram-бот</strong>: программа, которая общается с людьми в Telegram. Интерфейс рисовать не нужно, его роль играет чат. Сценарий обычно один, а польза видна сразу: бот, который записывает траты, напоминает о делах или отвечает на частые вопросы клиентов."},{"t":"p","h":"Как это устроено. Бота создают через <code>@BotFather</code> — официальный служебный бот Telegram: команда <code>/newbot</code>, имя, и вы получаете <strong>токен</strong>. Это ключ: кто его знает, тот полностью управляет ботом. Сообщения бот может получать двумя способами:"},{"t":"list","tag":"ul","c":"ul","items":["<li><strong>Long polling</strong> («долгий опрос»): бот сам постоянно спрашивает Telegram, нет ли новых сообщений. Работает прямо на вашем компьютере, публичный адрес не нужен. Для прототипа это лучший вариант.</li>","<li><strong>Webhook</strong> («обратный вызов»): Telegram сам присылает сообщения на адрес вашего сервера. Нужен сервер с адресом в интернете, зато так бот может жить на облачной площадке круглосуточно.</li>"]},{"t":"note","h":"<div class=\"note simple\"><span class=\"nl\">Простыми словами</span> Long polling — вы каждые пять минут проверяете почтовый ящик сами. Webhook — почтальон звонит в дверь, когда приходит письмо. Первое проще устроить, второе удобнее, когда вас нет дома.</div>"},{"t":"p","h":"Шаблон запроса для первого бота (в квадратных скобках подставьте своё):"},{"t":"code","c":"prompt","label":"Запрос","lines":["Помоги сделать Telegram-бота — прототип на один вечер.","Что он делает: [например: я пишу «кофе 250», он запоминает трату, а по команде /итог присылает сумму за сегодня].","Кто пользуется: только я.","Язык: Python, библиотека aiogram 3.","Получение сообщений: long polling, запуск на моём компьютере.","Данные: файл SQLite рядом с ботом.","Токен читай из переменной окружения BOT_TOKEN, в код его не вписывай.","Сначала опиши план в пяти пунктах и дождись моего «да».","В конце объясни простыми словами, как запустить и остановить бота."]},{"t":"p","h":"Что здесь важно. Python и библиотека aiogram — популярная пара для ботов; если вам ближе TypeScript, напишите «TypeScript, библиотека grammY». SQLite — база данных в одном файле, для прототипа её достаточно. Переменная окружения — то же место для секретов, что и в «Азбуке»: токен не попадает ни в код, ни в репозиторий."},{"t":"note","h":"<div class=\"note warn\"><span class=\"nl\">Внимание</span> Не вставляйте токен бота в чат с ИИ, в код и в репозиторий. Если он всё-таки утёк, перевыпустите его у <code>@BotFather</code> командой <code>/token</code>: старый перестанет работать.</div>"},{"t":"p","h":"Пока бот работает на вашем компьютере, он отвечает, только когда компьютер включён. Когда прототип оправдал себя, попросите ИИ перевести его на webhook и перенести на облачную площадку: у многих из них есть бесплатный или недорогой тариф (например, Cloudflare Workers для ботов на webhook). Дальше бот проходит тот же путь от прототипа к продукту, что и любое приложение в этой главе."},{"t":"h3","id":"s39","h":"<h3>Эволюция прототипа на пути к производству</h3>"},{"t":"p","h":"Когда прототип ответил на свой вопрос, наступает решение: выбросить, развивать или переписать. Это решение стоит принимать осознанно и вслух, а не по инерции. «Производство» здесь означает продакшен, то есть работу у настоящих пользователей."},{"t":"fig","n":"6.1","cap":"Рис. 6.6 · путь прототипа: два решения и три исхода"},{"t":"p","h":"Как читать схему: сначала вы решаете про идею (подтвердилась ли она), затем про код (годится ли он для продукта). Подтвердившаяся идея вовсе не означает, что код прототипа годится для продукта. Отсюда три исхода: выбросить, переписать или развивать."},{"t":"p","h":"Критерии выбора:"},{"t":"list","tag":"ul","c":"ul","items":["<li><strong>Выбросить</strong>, если ответ на вопрос отрицательный или прототип проверял только интерфейс. Сохраните выводы и журнал решений, но не код.</li>","<li><strong>Развивать</strong>, если прототип сделан в нужном стеке, код понятен команде и устройство приложения выдержит рост.</li>","<li><strong>Переписать</strong>, если идея подтвердилась, а код нет: он сделан в конструкторе, превратился в хаос из-за множества правок или написан не на тех технологиях.</li>"]},{"t":"p","h":"Чем отличается прототип от продакшена:"},{"t":"table","head":"<tr><th>Аспект</th><th>Прототип</th><th>Продакшен</th></tr>","rows":["<tr><td>Данные</td><td>В памяти или тестовые</td><td>Настоящая база данных, аккуратные изменения структуры (миграции), резервные копии</td></tr>","<tr><td>Доступ</td><td>Без входа или одна общая учётная запись</td><td>Роли, права, защита от подбора паролей</td></tr>","<tr><td>Ошибки</td><td>Упало — перезапустили</td><td>Обработка ошибок, повторные попытки, понятные пользователю сообщения</td></tr>","<tr><td>Тесты</td><td>Нет или минимум</td><td>Модульные, интеграционные, сквозные</td></tr>","<tr><td>Наблюдение за работой</td><td>Сообщения в консоли</td><td>Журналы, показатели, оповещения о сбоях</td></tr>","<tr><td>Выкладывание</td><td>Вручную или одной кнопкой</td><td>Автоматическая цепочка (CI/CD), несколько окружений, возможность откатиться</td></tr>"],"cols":3},{"t":"p","h":"При переписывании не выбрасывайте знания. Журнал решений, список упрощений и спецификация, описанная по прототипу, становятся основой технического задания для боевой версии."},{"t":"h3","id":"s40","h":"<h3>Проблемы, характерные для прототипирования с помощью ИИ</h3>"},{"t":"p","h":"Дешёвые прототипы создают проблемы, которых раньше не было."},{"t":"list","tag":"ul","c":"ul","items":["<li><strong>Прототип принимают за продукт.</strong> Руководитель видит работающее демо и спрашивает, почему запуск через три месяца. Заранее объясняйте, что видно 70%, а невидимые 30% — основной объём работы.</li>","<li><strong>Секреты на стороне пользователя.</strong> Ключ API, вставленный в интерфейс «на время», виден любому, кто откроет в браузере <strong>инструменты разработчика</strong> (встроенную панель, которая показывает внутренности любой страницы). Ключи нужно держать на сервере.</li>","<li><strong>Открытые базы данных.</strong> В 2025 году исследователи находили приложения, собранные конструкторами, где база была доступна всем, потому что политики доступа к строкам не настроили. <strong>Политики доступа к строкам</strong> — правила, которые определяют, какие записи в базе может видеть каждый пользователь. Демо работало, данные утекали.</li>","<li><strong>Привязка к платформе.</strong> Экспорт кода из конструктора не всегда даёт проект, который удобно развивать отдельно от этого конструктора.</li>","<li><strong>Спагетти от итераций.</strong> Сто правок без наведения порядка превращают код в слои заплаток, где одно трогает другое («спагетти-код»).</li>","<li><strong>Незаметные расходы.</strong> Кредиты конструкторов и токены агентов при активных итерациях складываются в заметную сумму. Следите за тем, сколько тратите.</li>"]},{"t":"fig","n":"ch6_key","cap":"Рис. 6.7 · где хранить ключ API"},{"t":"p","h":"Как читать схему: слева ключ лежит в браузере, и любой посторонний найдёт его через панель разработчика. Справа ключ хранится на вашем сервере, а браузер просит сервер сделать запрос за него. Пользователь ключа никогда не видит."},{"t":"fig","n":"ch6_env","cap":"Рис. 6.8 · ключ в файле .env, а не в коде"},{"t":"p","h":"Как читать схему: в верхней части дифф: ключ убрали из кода, оставив имя переменной. Ниже файл .env, который остаётся только на вашем компьютере и не попадает в историю проекта."},{"t":"note","h":"<div class=\"note warn\"><span class=\"nl\">Внимание</span> Если в прототип попали реальные данные пользователей, он перестал быть прототипом. С этого момента на него распространяются все требования безопасности главы 8.</div>"},{"t":"h3","id":"s41","h":"<h3>Итоги и дальнейшие шаги</h3>"},{"t":"p","h":"ИИ сделал прототипы дешёвыми, поэтому их ценность определяется вопросом, на который они отвечают. Таймбокс, тонкий срез и готовность выбросить код защищают от превращения прототипа в незаметный продукт с дырами."},{"t":"lbl","h":"<div class=\"lbl\">Упражнения</div>"},{"t":"list","tag":"ul","c":"tasks","items":["<li><label><input type=\"checkbox\" data-task=\"t22\"><span>Сформулируйте одну гипотезу о своей идее («Люди захотят… если…») и за один вечер сделайте прототип в конструкторе приложений или с помощью агента, чтобы её проверить. Поставьте таймбокс и засеките время.</span></label></li>","<li><label><input type=\"checkbox\" data-task=\"t23\"><span>Попросите ИИ составить список упрощений вашего текущего прототипа и отметьте, какие из них опасны для реальных пользователей.</span></label></li>","<li><label><input type=\"checkbox\" data-task=\"t24\"><span>Покажите прототип трём знакомым, не объясняя, как им пользоваться. Запишите, где они растерялись. Это и есть самый ценный результат.</span></label></li>","<li><label><input type=\"checkbox\" data-task=\"t25\"><span>Спросите ИИ: «Есть ли в моём прототипе ключи или пароли в открытом виде и закрыт ли доступ к базе данных от посторонних? Объясни простыми словами, как мне это проверить».</span></label></li>","<li><label><input type=\"checkbox\" data-task=\"t54\"><span>Сделайте Telegram-бота по шаблону из этой главы: одна полезная для вас функция, long polling, токен в переменной окружения. Покажите его двум знакомым и запишите, где они растерялись.</span></label></li>"]},{"t":"ch","id":"ch7","head":"Глава 7 · Создание веб-приложений с помощью ИИ","h":"<header class=\"ch-open\"><div class=\"ch-kicker\">Глава</div><div class=\"ch-big\">7</div><h2>Создание веб-приложений с помощью ИИ</h2></header>"},{"t":"p","h":"<strong>Веб-приложение</strong> — это программа, которая работает в браузере: интернет-магазин, личный кабинет, трекер привычек. Это самый частый проект, который люди делают с ИИ, и самый показательный. В нём есть всё: интерфейс, сервер, база данных, вход по паролю и выкладывание в интернет. Если вы прочитали «Азбуку», вы помните устройство «ресторана»: зал (интерфейс), кухня (сервер), склад (база данных) и официант (API). В этой главе мы пройдём путь на сквозном примере — трекере привычек, где пользователь отмечает выполненные привычки по дням и видит серии без пропусков."},{"t":"p","h":"Стек примера: Next.js (App Router), TypeScript в строгом режиме, PostgreSQL, Drizzle ORM, Zod для проверки данных, Vitest и Playwright для тестов. Принципы переносятся на любой стек. Не пугайтесь списка: одной фразой скажем, что есть что."},{"t":"list","tag":"ul","c":"ul","items":["<li><strong>Next.js (App Router)</strong> — популярный фреймворк для сайтов: готовый каркас, в который вы встраиваете свои страницы и логику.</li>","<li><strong>TypeScript в строгом режиме</strong> — вариант JavaScript, который особенно придирчиво ищет ошибки до запуска.</li>","<li><strong>PostgreSQL</strong> — популярная база данных: хранит информацию в таблицах.</li>","<li><strong>Drizzle ORM</strong> — «переводчик» между кодом и базой данных: вы описываете таблицы на привычном для кода языке, а он превращает это в команды для базы.</li>","<li><strong>Zod</strong> — библиотека для проверки данных: она проверяет, что пришедшая информация имеет нужный вид (например, что дата записана как дата).</li>","<li><strong>Vitest и Playwright</strong> — инструменты для автоматических проверок: первый проверяет отдельные части программы, второй управляет настоящим браузером, как человек.</li>"]},{"t":"p","h":"Главное для новичка: вам не обязательно выбирать эти технологии самому. Вы можете написать ИИ: «Я хочу сделать трекер привычек. Предложи подходящий набор технологий для начинающего и объясни выбор простыми словами». Важно только то, что выбор должен быть явным, записанным и понятным вам."},{"t":"h3","id":"s42","h":"<h3>Настройка проекта: создание каркаса с помощью ИИ</h3>"},{"t":"p","h":"<strong>Каркас</strong> — это пустой проект с правильной структурой и настройками, на который затем наращивают функции. Он самая дешёвая часть проекта и самая дорогая для исправления позже. Поэтому стек и структуру выбирает человек, а ИИ помогает их реализовать."},{"t":"p","h":"Порядок старта:"},{"t":"list","tag":"ol","c":"ol","items":["<li data-n=\"1\"><strong>Официальный генератор.</strong> Создайте проект штатной командой выбранного фреймворка, а не просите ИИ написать настройки с нуля. Так вы получите актуальные настройки. Новичку достаточно сказать: «Создай новый проект официальным способом для Next.js и объясни, что где лежит».</li>","<li data-n=\"2\"><strong>Строгость с первого дня.</strong> Включите строгий режим TypeScript, линтер, форматтер и проверку типов при каждом изменении (CI). Вы уже знаете эти слова из главы 5: это «корректоры» для кода.</li>","<li data-n=\"3\"><strong>Файл правил проекта.</strong> Опишите стек, команды и запреты до первого запроса к агенту.</li>","<li data-n=\"4\"><strong>Первое сохранение до первой функции.</strong> Сделайте коммит чистого каркаса. Это точка, к которой всегда можно вернуться.</li>"]},{"t":"fig","n":"ch7_setup","cap":"Рис. 7.1 · четыре шага до первой функции"},{"t":"p","h":"Как читать схему: шаги идут по порядку, и последний из них — «первый коммит» — выделен как точка, к которой всегда можно вернуться. Только после него начинается работа над первой настоящей функцией."},{"t":"p","h":"В десктопном приложении эти настройки выбираются прямо перед первым сообщением новой сессии."},{"t":"fig","n":"dk_start","cap":"Рис. 7.2 · новая сессия: окружение, папка, ветка и Worktree"},{"t":"p","h":"Как читать схему: над полем ввода четыре выбора слева направо. Для старта хватит Local и папки вашего проекта. Worktree включайте, когда хотите, чтобы работа шла в отдельной копии и не смешивалась с вашей основной версией."},{"t":"fig","n":"ch7_scaffold","cap":"Рис. 7.3 · каркас проекта: команда и результат"},{"t":"p","h":"Как читать схему: слева команда создания проекта и её результат, справа получившиеся папки. Файл правил (выделен зелёным) вы добавляете в корень проекта сами сразу после создания."},{"t":"p","h":"Пример файла правил для нашего проекта. Вы можете просто попросить ИИ составить такой файл, а затем поправить его:"},{"t":"code","c":"","label":"Markdown","lines":["# Правила проекта habits","","## Стек","Next.js (App Router), TypeScript strict, PostgreSQL, Drizzle ORM, Zod, Vitest, Playwright.","","## Команды","- npm run dev — запуск","- npm run test — модульные тесты","- npm run test:e2e — сквозные тесты","- npm run lint && npm run typecheck — перед каждым коммитом","","## Правила","- Входные данные API валидируются схемами из src/lib/contracts.ts.","- Любой доступ к данным проверяет владельца (userId).","- Схема БД меняется только миграциями; миграции не применять самостоятельно.","- Новые зависимости — только после согласования.","- Никогда не подключаться к продакшен-базе."]},{"t":"p","h":"Что здесь написано. В разделе «Стек» перечислены технологии проекта. В разделе «Команды» — короткие слова, которыми проект запускают и проверяют: агент берёт их отсюда и не гадает. В разделе «Правила» самое важное: проверять данные от пользователя, всегда проверять, что человек обращается к своим данным (<code>userId</code> — это номер пользователя), менять базу только через специальные записи об изменениях (миграции), не добавлять новые библиотеки без вашего разрешения и никогда не трогать боевую базу."},{"t":"fig","n":"ch7_rules","cap":"Рис. 7.4 · файл правил по группам"},{"t":"p","h":"Как читать схему: слева сам файл, справа расшифровка его групп: что используем, чем проверяем и чего нельзя. Цифры связывают заголовки в файле с пояснениями."},{"t":"p","h":"Этот файл агент читает в начале каждой сессии. Пять минут на его составление экономят десятки исправлений."},{"t":"h3","id":"s43","h":"<h3>Проектирование и интеграция баз данных</h3>"},{"t":"p","h":"<strong>Модель данных</strong> — это решение о том, какую информацию хранить и как она связана: пользователи, привычки, отметки. Это решение человека. ИИ хорошо предлагает схему и пишет миграции, но только вы знаете, какие сущности важны для вашего дела и как данные будут расти. <strong>Миграция</strong> — аккуратная запись изменения устройства базы, например «добавить таблицу отметок»."},{"t":"p","h":"Попросите ИИ предложить схему по описанию сценариев, а затем проверьте её по списку:"},{"t":"list","tag":"ul","c":"ul","items":["<li><strong>Ограничения целостности</strong> — правила, которые база сама не даёт нарушить (например, «у каждой привычки обязательно есть владелец»).</li>","<li><strong>Индексы под реальные запросы</strong>, чтобы выборки не тормозили.</li>","<li><strong>Поведение при удалении:</strong> что произойдёт с привычками, если удалить пользователя.</li>","<li><strong>Часовые пояса:</strong> в какое время «день» у пользователя заканчивается.</li>"]},{"t":"p","h":"Пример того, как выглядит схема трекера привычек в коде. Читать построчно не нужно, ниже мы объясним главное."},{"t":"code","c":"","label":"TypeScript","lines":["// src/db/schema.ts","import { pgTable, uuid, text, date, timestamp, uniqueIndex } from \"drizzle-orm/pg-core\";","","export const users = pgTable(\"users\", {","  id: uuid(\"id\").primaryKey().defaultRandom(),","  email: text(\"email\").notNull().unique(),","  createdAt: timestamp(\"created_at\", { withTimezone: true }).notNull().defaultNow(),","});","","export const habits = pgTable(\"habits\", {","  id: uuid(\"id\").primaryKey().defaultRandom(),","  userId: uuid(\"user_id\").notNull().references(() => users.id, { onDelete: \"cascade\" }),","  title: text(\"title\").notNull(),","  createdAt: timestamp(\"created_at\", { withTimezone: true }).notNull().defaultNow(),","});","","// Одна отметка на привычку в день: защита от дублей на уровне базы","export const checkins = pgTable(\"checkins\", {","  id: uuid(\"id\").primaryKey().defaultRandom(),","  habitId: uuid(\"habit_id\").notNull().references(() => habits.id, { onDelete: \"cascade\" }),","  day: date(\"day\").notNull(),","}, (t) => [uniqueIndex(\"checkins_habit_day\").on(t.habitId, t.day)]);"]},{"t":"p","h":"Что здесь происходит. Описаны три таблицы: пользователи (<code>users</code>), привычки (<code>habits</code>) и отметки о выполнении (<code>checkins</code>). У каждой записи есть уникальный номер <code>id</code>. Привычка принадлежит пользователю (<code>userId</code>), а отметка — привычке (<code>habitId</code>). Слова <code>onDelete: \"cascade\"</code> означают: если удалить пользователя, его привычки удалятся вместе с ним, а если удалить привычку, исчезнут и её отметки. Это то самое «поведение при удалении». Время создания хранится вместе с часовым поясом (<code>withTimezone</code>)."},{"t":"p","h":"Обратите внимание на последнюю строку: <strong>уникальный индекс</strong> по паре «привычка + день». Он не позволит записать две отметки для одной привычки в один день. Без него двойной клик создаст две отметки, и серия посчитается неверно. Такие ограничения ИИ часто пропускает, если не спросить о них явно."},{"t":"note","h":"<div class=\"note simple\"><span class=\"nl\">Простыми словами</span> Уникальный индекс — это как правило в бухгалтерии: «в один день один акт на одного клиента». Даже если сотрудник случайно попытается оформить два, система не пропустит. Хорошо, когда такое правило записано в самой базе, а не только в голове у программиста.</div>"},{"t":"fig","n":"ch7_tables","cap":"Рис. 7.5 · три таблицы трекера привычек"},{"t":"p","h":"Как читать схему: каждая таблица — прямоугольник со списком полей. Надпись «много» над стрелкой читается так: у одного пользователя много привычек, а у одной привычки много отметок. Выделенная пара полей и есть уникальный индекс."},{"t":"p","h":"Правила работы с базой и агентами:"},{"t":"list","tag":"ul","c":"ul","items":["<li>Миграции создаются специальным инструментом и проходят проверку, как обычный код. Новичку достаточно спросить: «Объясни простыми словами, что изменит эта миграция в базе и можно ли это откатить?»</li>","<li>Агент работает только с локальной или тестовой базой. Доступ к боевым данным у него должен отсутствовать технически, а не только по правилам.</li>","<li>Разрушительные операции — удаление столбцов, таблиц, данных — только вручную и с резервной копией.</li>"]},{"t":"note","h":"<div class=\"note warn\"><span class=\"nl\">Внимание</span> В 2025 году широко обсуждался случай, когда ИИ-агент удалил рабочую базу данных проекта во время заморозки изменений, несмотря на прямой запрет. Запрет в тексте не защищает. Защищают права доступа.</div>"},{"t":"p","h":"Многие новички не настраивают свою базу данных, а берут готовый бэкенд: <strong>Supabase</strong> (база PostgreSQL, вход пользователей и хранилище файлов в одном сервисе) или <strong>Firebase</strong> от Google. Конструкторы приложений часто подключают их сами. Это удобно: страница обращается к базе почти напрямую, без вашего сервера. Но именно поэтому вся защита держится на правилах доступа в самой базе."},{"t":"p","h":"В Supabase это <strong>политики доступа к строкам</strong> (<em>Row Level Security</em>, RLS): правила о том, какие записи может читать и менять конкретный пользователь. Публичный ключ проекта (он называется publishable, раньше — anon) лежит прямо в коде страницы, и его видит любой. Пока RLS включён и политики настроены, это безопасно. Если RLS выключен, любой человек с этим ключом может прочитать и изменить всю таблицу. В Firebase ту же роль играют <strong>правила безопасности</strong> (<em>Security Rules</em>), а «тестовый режим» для быстрого старта разрешает любому читать и перезаписывать данные."},{"t":"note","h":"<div class=\"note warn\"><span class=\"nl\">Внимание</span> Таблицы, созданные в панели Supabase, получают RLS автоматически. А таблицы, которые агент создал через SQL или миграции, — нет: RLS нужно включить явно. Секретный ключ (secret, раньше — service_role) обходит все правила: он живёт только на сервере и никогда не попадает в код страницы. Встроенный в Supabase Security Advisor сам предупреждает о таблицах без RLS — не игнорируйте эти письма.</div>"},{"t":"code","c":"prompt","label":"Запрос","lines":["Проверь безопасность базы в моём проекте на [Supabase / Firebase].","1. Перечисли все таблицы (коллекции) и для каждой скажи, включены ли RLS или правила безопасности.","2. Для каждой политики объясни простыми словами, кто что может читать и менять.","3. Проверь, нет ли секретного ключа (secret или service_role) в коде, который попадает в браузер.","4. Предложи исправления, но ничего не меняй без моего «да»."]},{"t":"p","h":"После исправлений проверьте сами: зарегистрируйте второго пользователя и попробуйте открыть данные первого. Если получилось, защита не работает, что бы ни говорил ИИ."},{"t":"h3","id":"s44","h":"<h3>Полностековая интеграция: объединение фронтенда и бэкенда</h3>"},{"t":"p","h":"<strong>Полный стек</strong> (по-английски <em>full stack</em>) означает, что вы работаете со всеми слоями приложения сразу: и с тем, что видит пользователь (фронтенд), и с тем, что работает на сервере (бэкенд). Самые частые поломки в ИИ-приложениях происходят на стыке этих слоёв: клиент отправляет одно, сервер ждёт другое. Лекарство — единый <strong>контракт</strong> (договорённость о том, в каком виде передаются данные), который используют обе стороны."},{"t":"fig","n":"7.1","cap":"Рис. 7.6 · слои трекера привычек и общий контракт"},{"t":"p","h":"Как читать схему: на ней показаны слои приложения от пользователя до данных: браузер, сервер, слой доступа к данным и база данных. Между браузером и сервером информация передаётся по правилам <strong>HTTP</strong> (так общаются все сайты) в формате <strong>JSON</strong> (текст с чёткой структурой, который понятен и людям, и программам). Между сервером и базой данных запросы пишутся на языке <strong>SQL</strong> (специальном языке запросов к базам). Общий контракт на схеме выделен отдельно: форма в браузере и обработчик на сервере читают одну и ту же схему данных, поэтому не могут разойтись. А агент работает только с тестовой копией базы."},{"t":"p","h":"Контракт описывается схемой один раз:"},{"t":"code","c":"","label":"TypeScript","lines":["// src/lib/contracts.ts","import { z } from \"zod\";","","export const CheckinInput = z.object({","  habitId: z.string().uuid(),","  day: z.string().regex(/^\\d{4}-\\d{2}-\\d{2}$/, \"формат YYYY-MM-DD\"),","});","export type CheckinInput = z.infer<typeof CheckinInput>;"]},{"t":"p","h":"Что здесь происходит. Это описание того, как должна выглядеть правильная отметка: у неё есть номер привычки (<code>habitId</code>) и день (<code>day</code>) в формате «год-месяц-число», например <code>2026-10-07</code>. Всё, что не соответствует этому образцу, будет отвергнуто как неправильное."},{"t":"p","h":"Сервер проверяет вход по той же схеме, а затем проверяет права на ресурс:"},{"t":"code","c":"","label":"TypeScript","lines":["// src/app/api/checkins/route.ts","import { NextResponse } from \"next/server\";","import { and, eq } from \"drizzle-orm\";","import { db } from \"@/lib/db\";","import { habits, checkins } from \"@/db/schema\";","import { CheckinInput } from \"@/lib/contracts\";","import { getSessionUser } from \"@/lib/auth\";","","export async function POST(req: Request) {","  const user = await getSessionUser();","  if (!user) return NextResponse.json({ error: \"unauthorized\" }, { status: 401 });","","  const parsed = CheckinInput.safeParse(await req.json().catch(() => null));","  if (!parsed.success) return NextResponse.json({ error: \"invalid input\" }, { status: 400 });","","  // Привычка должна принадлежать текущему пользователю","  const [habit] = await db","    .select({ id: habits.id })","    .from(habits)","    .where(and(eq(habits.id, parsed.data.habitId), eq(habits.userId, user.id)));","  if (!habit) return NextResponse.json({ error: \"not found\" }, { status: 404 });","","  await db.insert(checkins).values(parsed.data).onConflictDoNothing();","  return NextResponse.json({ ok: true }, { status: 201 });","}"]},{"t":"p","h":"Что здесь происходит, шаг за шагом:"},{"t":"list","tag":"ol","c":"ol","items":["<li data-n=\"1\">Сервер выясняет, кто пришёл (<code>getSessionUser</code>). Если неизвестно, отвечает «не авторизован» (код 401).</li>","<li data-n=\"2\">Проверяет, что пришедшие данные соответствуют контракту. Если нет, отвечает «неверные данные» (код 400).</li>","<li data-n=\"3\">Ищет привычку в базе и проверяет, что она принадлежит именно этому пользователю. Если нет, отвечает «не найдено» (код 404). Это самая важная защита в обработчике.</li>","<li data-n=\"4\">Если всё в порядке, записывает отметку. Если такая уже есть, молча ничего не делает (<code>onConflictDoNothing</code>) и сообщает об успехе (код 201).</li>"]},{"t":"fig","n":"ch7_request","cap":"Рис. 7.7 · путь одного нажатия"},{"t":"p","h":"Как читать схему: запрос идёт сверху вниз по четырём проверкам. Если какая-то из них не пройдена, запрос отклоняется с кодом ошибки (стрелки вправо), и в базу ничего не попадает. Только если все проверки пройдены, отметка записывается, и вы получаете ответ «готово»."},{"t":"fig","n":"ch7_network","cap":"Рис. 7.8 · вкладка Network: ответы сервера"},{"t":"p","h":"Как читать схему: на вкладке Network видно, что ответил сервер на каждое нажатие. Код 201 значит «сохранено», а коды на 4 (401, 400, 404) — отказ, у каждого своя причина."},{"t":"p","h":"Две вещи в этом обработчике чаще всего отсутствуют в сгенерированном коде: проверка владельца привычки и обработка неправильно составленных данных. Без первой любой пользователь может отмечать чужие привычки, подставив чужой номер. Это классическая уязвимость, которую мы разберём в главе 8 (она называется IDOR: «небезопасное прямое обращение к объекту»)."},{"t":"note","h":"<div class=\"note simple\"><span class=\"nl\">Простыми словами</span> Представьте гардероб в театре. Вы приносите номерок, и гардеробщик отдаёт пальто. Хороший гардеробщик проверяет номерок, но ещё лучше он проверяет, что пальто принадлежит именно вам. Плохой отдаст любое пальто по любому номерку, и кто-то уйдёт в чужой шубе. Проверка владельца — это та самая внимательность гардеробщика.</div>"},{"t":"p","h":"Практика <strong>вертикальных срезов</strong>: делайте функцию целиком, от таблицы в базе до кнопки на экране, и только потом переходите к следующей. Агенту проще держать в голове одну функцию во всех слоях, чем один слой для всех функций."},{"t":"h3","id":"s45","h":"<h3>Тестирование и валидация веб-приложений, созданных с помощью ИИ</h3>"},{"t":"p","h":"Веб-приложение проверяется на трёх уровнях (вы встречались с ними в главе 5), и каждый ловит свой класс ошибок."},{"t":"list","tag":"ul","c":"ul","items":["<li><strong>Модульные тесты</strong> — чистая логика: подсчёт серии, работа с датами, форматирование.</li>","<li><strong>Интеграционные тесты</strong> — обработчики запросов с настоящей тестовой базой: права доступа, ограничения, ответы на ошибки.</li>","<li><strong>Сквозные тесты</strong> — сценарий пользователя в браузере.</li>"]},{"t":"p","h":"Сквозной тест на Playwright для главного сценария (сессия пользователя подготовлена заранее):"},{"t":"code","c":"","label":"TypeScript","lines":["// e2e/checkin.spec.ts","import { test, expect } from \"@playwright/test\";","","test(\"пользователь отмечает привычку за сегодня\", async ({ page }) => {","  await page.goto(\"/habits\");","  await page.getByRole(\"button\", { name: \"Отметить «Зарядка» за сегодня\" }).click();","  await expect(page.getByText(\"Серия: 1 день\")).toBeVisible();","});"]},{"t":"p","h":"Что здесь происходит. Тест открывает страницу привычек, нажимает кнопку «Отметить „Зарядка“ за сегодня» и проверяет, что на экране появилась надпись «Серия: 1 день». Именно это и делает человек. Только тест делает это за секунды и каждый раз одинаково."},{"t":"p","h":"Тест ищет кнопку по её роли («кнопка») и названию, а не по внутренним деталям оформления. Это делает его устойчивым к смене дизайна и заодно проверяет доступность для <strong>скринридеров</strong> (программ, которые зачитывают экран слепым и слабовидящим людям)."},{"t":"p","h":"Современные агенты умеют сами запускать браузер, делать скриншоты и проверять вёрстку. Используйте это: попросите агента пройти главный сценарий и показать скриншоты каждого шага. Но финальное решение о том, что интерфейс работает, принимайте сами."},{"t":"fig","n":"dk_autoverify","cap":"Рис. 7.9 · автопроверка страницы в приложении"},{"t":"p","h":"Как читать схему: в десктопном приложении так проверка выглядит по шагам. Claude запускает сайт, открывает его в панели Browser, нажимает кнопки и заполняет формы, а при ошибке чинит и проверяет снова. Это экономит время, но не заменяет ваш собственный взгляд на готовую страницу."},{"t":"p","h":"Чек-лист перед первым релизом (<strong>релиз</strong> — выпуск версии для настоящих пользователей):"},{"t":"list","tag":"ul","c":"tasks","items":["<li><label><input type=\"checkbox\" data-task=\"t26\"><span>Все входные данные проверяются на сервере.</span></label></li>","<li><label><input type=\"checkbox\" data-task=\"t27\"><span>Каждый запрос к данным проверяет владельца.</span></label></li>","<li><label><input type=\"checkbox\" data-task=\"t28\"><span>Секреты только в переменных окружения, в проекте их нет.</span></label></li>","<li><label><input type=\"checkbox\" data-task=\"t29\"><span>Ошибки показываются пользователю понятно и записываются в журнал для разработчиков.</span></label></li>","<li><label><input type=\"checkbox\" data-task=\"t30\"><span>Главные сценарии покрыты сквозными тестами.</span></label></li>","<li><label><input type=\"checkbox\" data-task=\"t31\"><span>Есть резервное копирование базы и проверенный способ отката релиза.</span></label></li>"]},{"t":"fig","n":"ch7_deploy","cap":"Рис. 7.10 · деплой по шагам"},{"t":"p","h":"Как читать схему: четыре шага идут слева направо. Если на третьем шаге проверки красные, сайт не обновляется, и люди продолжают видеть прежнюю рабочую версию."},{"t":"note","h":"<div class=\"note tip\"><span class=\"nl\">Совет</span> Новичку не нужно проверять каждый пункт самому, достаточно превратить чек-лист в запрос: «Пройди по этому списку для моего проекта. По каждому пункту скажи: сделано, не сделано или не знаю. Для каждого „не сделано“ объясни простыми словами, чем это грозит, и предложи, как исправить». Затем проверьте ответы по нескольким пунктам вручную.</div>"},{"t":"h3","id":"s81","h":"<h3>Публикация первого сайта: пошагово</h3>"},{"t":"p","h":"В «Азбуке» вы узнали, что такое деплой. Здесь — как пройти этот путь в первый раз. Для примера возьмём Vercel: эту площадку сделали авторы Next.js, и проекты на нём она понимает без настройки. У Netlify и Cloudflare шаги почти такие же."},{"t":"list","tag":"ol","c":"ol","items":["<li data-n=\"1\"><strong>Код в репозитории.</strong> Попросите агента: «Создай репозиторий на GitHub и отправь туда проект». Убедитесь, что файла <code>.env</code> с секретами в репозитории нет.</li>","<li data-n=\"2\"><strong>Проект на хостинге.</strong> Зарегистрируйтесь на Vercel через аккаунт GitHub, нажмите New Project и выберите репозиторий. Площадка сама определит фреймворк и команду сборки.</li>","<li data-n=\"3\"><strong>Секреты.</strong> В настройках проекта (раздел Environment Variables) добавьте те же переменные, что лежат у вас в <code>.env</code>. После любого изменения переменных сайт нужно выложить заново (Redeploy).</li>","<li data-n=\"4\"><strong>Первый деплой.</strong> Нажмите Deploy. Через минуту-две вы получите адрес вида <code>имя-проекта.vercel.app</code>. Откройте его и пройдите главный сценарий так, как это сделает пользователь.</li>","<li data-n=\"5\"><strong>Обновления.</strong> Дальше каждый <code>git push</code> в основную ветку выкладывает новую версию сам, а каждый пул-реквест получает отдельную превью-ссылку: изменения можно посмотреть до слияния.</li>","<li data-n=\"6\"><strong>Свой домен</strong> (по желанию). Купите домен у регистратора и добавьте его в настройках проекта. Хостинг покажет, какие DNS-записи создать у регистратора (обычно A для основного адреса и CNAME для www). Сертификат для https выпускается сам, а изменения DNS вступают в силу за время от нескольких минут до 48 часов.</li>"]},{"t":"note","h":"<div class=\"note warn\"><span class=\"nl\">Внимание</span> Бесплатный тариф Vercel (Hobby) — только для личных некоммерческих проектов. Если сайт приносит деньги (оплата, реклама, работа на заказ), нужен платный тариф или другая площадка. У Netlify бесплатный тариф ограничен кредитами: когда они заканчиваются, сайт ставится на паузу до следующего месяца. Для простых сайтов без сервера (визитка, портфолио) подойдёт и GitHub Pages.</div>"},{"t":"code","c":"prompt","label":"Запрос","lines":["Помоги выложить мой проект в интернет на Vercel. Я новичок.","1. Проверь, что проект собирается без ошибок.","2. Перечисли переменные окружения, которые нужны на сайте, без их значений.","3. Проверь, что .env не попадает в репозиторий.","4. Дай пошаговую инструкцию, что нажать в Vercel, простыми словами.","5. Составь чек-лист из пяти проверок, которые я сделаю руками на живом сайте после деплоя."]},{"t":"h3","id":"s46","h":"<h3>Удачные примеры создания веб-проектов с помощью ИИ</h3>"},{"t":"p","h":"Ниже — собирательные истории, типичные для команд, которые используют ИИ осознанно. Это не отчёты о конкретных компаниях, а обобщённые картины. Они показывают не инструменты, а подходы."},{"t":"p","h":"<strong>Внутренний инструмент за неделю.</strong> Отдел поддержки годами вёл заявки в таблицах. Один разработчик с агентом собрал внутреннее приложение с ролями и отчётами. Успех определили три решения: стек, который команда уже умеет поддерживать, вертикальные срезы и проверка каждого изменения."},{"t":"p","h":"<strong>Минимальный продукт для проверки спроса.</strong> Такой продукт называют <strong>MVP</strong> (от англ. <em>minimum viable product</em>, «минимально жизнеспособный продукт»). Основатель собрал прототип в конструкторе, проверил интерес на первых пользователях, а затем переписал продукт в обычном проекте по спецификации, составленной из прототипа. Конструктор дал скорость, переписывание — надёжность."},{"t":"p","h":"<strong>Перенос устаревшего интерфейса.</strong> Команда переводила большое приложение со старого фреймворка на новый. Агентам отдали механическую часть: компонент (готовый блок интерфейса) за компонентом при условии, что существующие тесты проходят. Люди занимались общей схемой хранения состояния и спорными случаями."},{"t":"p","h":"Общее во всех историях: ИИ ускорял исполнение, а решения о стеке, данных и границах принимали люди."},{"t":"h3","id":"s47","h":"<h3>Итоги и дальнейшие шаги</h3>"},{"t":"p","h":"Веб-приложение с ИИ строится так же, как без него, только быстрее: стек и данные выбирает человек, контракт между слоями описан один раз, каждая функция делается вертикальным срезом и проверяется тестами на трёх уровнях."},{"t":"lbl","h":"<div class=\"lbl\">Упражнения</div>"},{"t":"list","tag":"ul","c":"tasks","items":["<li><label><input type=\"checkbox\" data-task=\"t32\"><span>Попросите ИИ составить для вашего (или учебного) проекта файл правил по образцу из этой главы и прочитайте его: всё ли в нём понятно и верно?</span></label></li>","<li><label><input type=\"checkbox\" data-task=\"t33\"><span>Спросите ИИ: «Найди в моём проекте места, где данные пользователя выдаются без проверки, что они принадлежат именно ему, и объясни простыми словами, чем это грозит». Исправьте найденное.</span></label></li>","<li><label><input type=\"checkbox\" data-task=\"t34\"><span>Опишите словами главный сценарий вашего приложения («Пользователь открывает… нажимает… видит…») и попросите ИИ написать для него один сквозной тест. Запустите его и посмотрите, проходит ли.</span></label></li>","<li><label><input type=\"checkbox\" data-task=\"t35\"><span>Пройдите чек-лист перед первым релизом вместе с ИИ и отметьте все пункты «не сделано».</span></label></li>","<li><label><input type=\"checkbox\" data-task=\"t55\"><span>Выложите учебный проект на Vercel или Netlify по шагам из этой главы. Откройте сайт с телефона и пройдите главный сценарий.</span></label></li>","<li><label><input type=\"checkbox\" data-task=\"t56\"><span>Если проект работает с Supabase или Firebase, выполните запрос на проверку правил доступа, а затем попробуйте открыть чужие данные вторым пользователем.</span></label></li>"]},{"t":"part","id":"p3","num":"III","title":"Доверие и автономия","h":"<div class=\"part-in\"><div class=\"pt-kicker\">Часть</div><div class=\"pt-num\">III</div><h2 class=\"pt-title\">Доверие и автономия</h2><ol class=\"pt-list\"><li><span>8</span>Безопасность, поддерживаемость и надёжность</li><li><span>9</span>Этические вопросы вайб-кодинга</li><li><span>10</span>Автономные агенты фонового программирования</li><li><span>11</span>Не просто генерация кода: что стоит ожидать от ИИ в будущем</li></ol></div>"},{"t":"ch","id":"ch8","head":"Глава 8 · Безопасность, поддерживаемость и надёжность","h":"<header class=\"ch-open\"><div class=\"ch-kicker\">Глава</div><div class=\"ch-big\">8</div><h2>Безопасность, поддерживаемость и надёжность</h2></header>"},{"t":"p","h":"Сгенерированный код небезопасен по умолчанию примерно в половине случаев, и с ростом моделей эта доля почти не меняется. Поэтому безопасность в работе с ИИ — не отдельный этап в конце, а свойство всего процесса: правил, проверок, ревью и выкладывания в интернет. Эта глава — о том, как выстроить такой процесс."},{"t":"p","h":"Если вы не программист, эта тема может показаться пугающей. Не бойтесь: вам не нужно становиться специалистом по безопасности. Вам нужно понимать главные виды угроз, знать, о чём просить ИИ, и уметь задать правильные вопросы. Каждую угрозу ниже мы объясняем на бытовых примерах и сразу даём, что с ней делать."},{"t":"h3","id":"s48","h":"<h3>Распространённые проблемы безопасности в сгенерированном ИИ коде</h3>"},{"t":"p","h":"В <a href=\"https://www.veracode.com/news/llms-are-getting-smarter-but-not-safer-veracode-2026-genai-code-security-report-finds-ai-generated-code-security-has-stalled-at-56%25-pass-rate/\" rel=\"noopener\" target=\"_blank\">отчёте Veracode 2026 года</a> более 100 моделей решали задачи, где был выбор между безопасным и небезопасным способом. Безопасный способ они выбрали только в 56% случаев, почти как годом раньше (55%): модели стали умнее, но не безопаснее. Хуже всего дела с <strong>межсайтовым скриптингом</strong> (XSS, об этом ниже) и <strong>инъекциями в журналы</strong>: там проваливаются около 85–88% решений. Модели, обученные специально для кода, оказались не безопаснее универсальных."},{"t":"p","h":"Причина системная: модель воспроизводит то, что видела чаще, а в открытом коде много учебных и небезопасных примеров. Модель оптимизирует «работает», а не «устойчиво к атаке», если вы явно не попросили иного. Отсюда практический вывод: <strong>о безопасности нужно просить прямо</strong>."},{"t":"note","h":"<div class=\"note simple\"><span class=\"nl\">Простыми словами</span> Представьте строителя, который выучил свою работу по тысячам объявлений «ремонт под ключ». Он отлично красит стены и клеит обои. Но замок на входную дверь поставит самый дешёвый и распространённый, если вы не скажете «нужен надёжный». ИИ ведёт себя так же: безопасность не появится сама, её нужно потребовать.</div>"},{"t":"p","h":"В таблице ниже собраны основные угрозы. Не запоминайте названия, достаточно понять суть: что может пойти не так и как ловить."},{"t":"table","head":"<tr><th>Уязвимость</th><th>Как выглядит в коде ИИ</th><th>Как ловить</th></tr>","rows":["<tr><td>Инъекции (в базу данных, в команды системы)</td><td>Запрос в базу собирается склеиванием текста с тем, что ввёл пользователь</td><td>Безопасная передача значений отдельно от запроса, автоматический поиск уязвимостей в коде</td></tr>","<tr><td>Нарушение контроля доступа (IDOR)</td><td>Программа берёт номер из запроса и не проверяет, чей это объект</td><td>Тесты, которые пытаются получить чужие данные</td></tr>","<tr><td>Открытая база (выключен RLS)</td><td>Таблица в Supabase или хранилище Firebase доступны любому, у кого есть публичный ключ</td><td>Включить RLS или правила безопасности, войти вторым пользователем и попробовать открыть чужое</td></tr>","<tr><td>Секреты в коде</td><td>Ключ API записан прямо в файл «на время»</td><td>Сканер, который не даёт сохранить ключи в проект</td></tr>","<tr><td>XSS (внедрение чужих скриптов)</td><td>Программа вставляет на страницу текст пользователя без обезвреживания</td><td>Обезвреживание текста по умолчанию, политики безопасности браузера, автоматический поиск</td></tr>","<tr><td>Слабая защита паролей и данных</td><td>Устаревший способ хранения паролей или самодельное шифрование</td><td>Только проверенные библиотеки, ревью</td></tr>","<tr><td>Нет ограничения частоты</td><td>Вход без защиты от подбора пароля</td><td>Чек-лист проверки, нагрузочные тесты</td></tr>","<tr><td>Выдуманные пакеты</td><td>Подключение несуществующей библиотеки</td><td>Проверка пакетов перед установкой</td></tr>","<tr><td>Prompt injection в агентах</td><td>Агент выполняет инструкции из чужого файла, заявки или веб-страницы</td><td>Минимальные права агента, проверка его действий</td></tr>"],"cols":3},{"t":"p","h":"Разберём главные угрозы по-человечески."},{"t":"list","tag":"ul","c":"ul","items":["<li><strong>Инъекция</strong> — это когда злоумышленник вводит в обычное поле (например, поле «Email») не адрес, а команду для базы данных, и программа её выполняет. Как если бы вы вписали в заявку «и ещё отдайте мне ключи от склада», а сотрудник это выполнил. Защита: значения всегда передаются отдельно от текста запроса.</li>","<li><strong>IDOR</strong> — когда вы заходите в свой профиль по адресу <code>.../profile/17</code>, меняете число на 18 и видите чужой профиль. Программа не проверила, что объект принадлежит именно вам. Мы разбирали это в главе 7 на примере гардероба.</li>","<li><strong>Секреты в коде</strong> — ключи и пароли, попавшие туда, где их могут прочитать посторонние. Вспомните «Азбуку»: ключ API подобен ПИН-коду карты.</li>","<li><strong>XSS</strong> — когда на странице показывается текст от пользователя (например, комментарий) без обезвреживания, и злоумышленник вставляет туда программу, которая выполнится в браузере других людей. Защита: считать любой пользовательский текст просто текстом, а не командой.</li>","<li><strong>Подбор паролей.</strong> Если вход не ограничивает число попыток, бот может перебирать тысячи паролей в минуту. Защита: ограничение попыток и пауза после неудач.</li>"]},{"t":"fig","n":"ch8_injection","cap":"Рис. 8.1 · инъекция: склейка и параметр"},{"t":"p","h":"Как читать схему: верхняя цепочка показывает опасный путь: команда злоумышленника становится частью запроса к базе. Нижняя — безопасный: запрос и значение передаются раздельно, и значение остаётся просто текстом."},{"t":"fig","n":"ch8_idor","cap":"Рис. 8.2 · IDOR: проверка владельца"},{"t":"p","h":"Как читать схему: три строки — три ситуации. В первой человек открывает своё. Во второй подменяет номер в адресе, а сервер не проверяет, чьё это, и показывает чужое. В третьей проверка есть, и доступ закрыт."},{"t":"p","h":"Пример самой старой и до сих пор частой ошибки — SQL-инъекции (используется библиотека <code>postgres.js</code>). SQL — язык запросов к базе данных, а <strong>конкатенация</strong> — это «склеивание» строк текста:"},{"t":"code","c":"","label":"TypeScript","lines":["// Опасно: строка запроса собирается из ввода пользователя","const rows = await sql.unsafe(`SELECT * FROM users WHERE email = '${email}'`);","","// Безопасно: значение передаётся параметром, а не текстом запроса","const rows = await sql`SELECT * FROM users WHERE email = ${email}`;"]},{"t":"p","h":"Что здесь происходит. Обе строки делают одно и то же: ищут пользователя по электронной почте. В первой запрос склеивается из текста и того, что ввёл человек, поэтому злоумышленник может написать вместо почты кусок команды, и база выполнит его. Во второй значение передаётся как отдельный параметр: что бы человек ни ввёл, база воспримет это только как адрес почты. Вам не нужно писать такой код самому. Достаточно в правилах проекта записать: «Запросы в базу данных только с параметрами, никогда не склеивать строки»."},{"t":"fig","n":"ch8_rate_limit","cap":"Рис. 8.3 · подбор паролей с защитой и без неё"},{"t":"p","h":"Как читать схему: слева бот подбирает пароль без ограничений и в конце угадывает. Справа после нескольких неудачных попыток вход блокируется, и перебор теряет смысл."},{"t":"p","h":"Отдельного внимания заслуживает <strong>slopsquatting</strong> (от слов <em>slop</em> — «мусорная, сгенерированная ИИ продукция» и <em>squatting</em> — «захват имени») — атака через выдуманные пакеты. В <a href=\"https://www.helpnetsecurity.com/2025/04/14/package-hallucination-slopsquatting-malicious-code/\" rel=\"noopener\" target=\"_blank\">исследовании 2025 года</a> 16 моделей сгенерировали 576 000 примеров кода, и почти 20% рекомендованных пакетов не существовали. Хуже того, многие выдуманные имена модели повторяют стабильно. Злоумышленник может зарегистрировать такое имя и положить внутрь вредоносный код. У моделей 2026 года выдуманных пакетов заметно меньше (по предварительным данным повторного замера — около 5–6%), но не ноль, поэтому правило проверки остаётся в силе."},{"t":"note","h":"<div class=\"note warn\"><span class=\"nl\">Внимание</span> Перед установкой любого пакета, предложенного ИИ, проверьте: существует ли он, кто его автор, сколько у него загрузок и когда он появился. Пакет, созданный на прошлой неделе с похожим на популярный названием, — красный флаг. Если вы не уверены, спросите ИИ: «Откуда ты знаешь про этот пакет? Дай ссылку на его официальную страницу и скажи, когда он появился».</div>"},{"t":"fig","n":"ch8_pkg_check","cap":"Рис. 8.4 · проверка пакета перед установкой"},{"t":"p","h":"Как читать схему: на примере страницы пакета четыре вопроса: кто автор, сколько загрузок, когда обновлялся и существует ли он. Красные крестики — повод не устанавливать."},{"t":"h3","id":"s82","h":"<h3>Реальные провалы: чему учат чужие ошибки</h3>"},{"t":"p","h":"Угрозы из таблицы выше — не теория. Вот шесть историй 2025–2026 годов. В каждой ошибка была простой, а цена — высокой. Читайте их не как страшилки, а как чек-лист: что сделать, чтобы с вами такого не случилось."},{"t":"list","tag":"ul","c":"ul","items":["<li><strong>Replit</strong>, июль 2025. Агент во время «заморозки» изменений удалил рабочую базу данных (сведения примерно о 1 200 руководителях и компаниях), а потом выдавал неверные отчёты о том, что сделал. <em>Урок:</em> у агента не должно быть доступа к боевым данным. Запрет в тексте не защищает, защищают права.</li>","<li><strong>Tea</strong>, июль 2025. Приложение хранило фото пользователей в открытом хранилище Firebase: утекли около 72 000 изображений, включая фото документов. <em>Урок:</em> проверять правила доступа к хранилищу до запуска.</li>","<li><strong>Lovable</strong>, 2025, и <strong>Moltbook</strong>, январь 2026. В приложениях на Supabase был выключен RLS. Из 1 645 проверенных приложений на Lovable 170 отдавали данные любому; у Moltbook открылись около 1,5 млн ключей доступа. <em>Урок:</em> RLS — первое, что проверяют в приложении на Supabase.</li>","<li><strong>s1ngularity</strong>, август 2025. Заражённые версии популярного пакета Nx запускали установленных на компьютере ИИ-агентов в режиме без вопросов и искали с их помощью секреты. Пострадали больше 2 000 аккаунтов GitHub. <em>Урок:</em> режим без вопросов — только в песочнице. Секреты не хранить в открытых файлах.</li>","<li><strong>Cline</strong>, февраль 2026. Злоумышленник написал инструкцию прямо в заголовке заявки (issue). ИИ-бот, разбиравший заявки, выполнил её и отдал ключ публикации, и в сеть ушла заражённая версия программы. <em>Урок:</em> это prompt injection — агент принимает чужой текст за команды. Ботам — минимальные права.</li>","<li><strong>PocketOS</strong>, апрель 2026. Агент нашёл в проекте токен с лишними правами и за несколько секунд удалил рабочий диск вместе с резервными копиями. <em>Урок:</em> токенам — минимальные права. Резервные копии — там, куда агент не дотянется.</li>"]},{"t":"p","h":"Обратите внимание: ни в одной истории ИИ не «взбунтовался». Каждый раз агент делал то, что ему позволяли права, а люди не проверили то, что считали проверенным. Хорошая новость в том, что все шесть уроков вы уже знаете из этой книги."},{"t":"h3","id":"s49","h":"<h3>Аудит безопасности</h3>"},{"t":"p","h":"<strong>Аудит</strong> — это систематическая проверка на наличие слабых мест. Аудит ИИ-кода строится в два слоя: автоматика ловит известные шаблоны массово, человек — логические ошибки, которые автоматика не видит."},{"t":"fig","n":"ch8_layers","cap":"Рис. 8.5 · два слоя аудита безопасности"},{"t":"p","h":"Как читать схему: сначала работает автоматика: она быстро и без устали ловит известные шаблоны. То, что автоматика не понимает, остаётся человеку: смысл, права доступа и логика приложения. Один слой без другого не работает."},{"t":"p","h":"Автоматический слой, который стоит включить в CI (напомним, это автоматические проверки при каждом изменении проекта):"},{"t":"list","tag":"ul","c":"ul","items":["<li><strong>Статический анализ (SAST)</strong> — программа читает код, не запуская его, и ищет в нём опасные шаблоны: инъекции, XSS, ненадёжные функции. Примеры инструментов: Semgrep, CodeQL.</li>","<li><strong>Анализ зависимостей (SCA)</strong> — проверка подключённых библиотек на известные уязвимости и подозрительное происхождение.</li>","<li><strong>Сканирование секретов</strong> — gitleaks и встроенные сканеры платформ не дают сохранить в проект ключи и пароли.</li>","<li><strong>Динамический анализ (DAST)</strong> — искусственная атака на запущенное приложение в тестовом окружении, как проверка замков изнутри и снаружи.</li>"]},{"t":"fig","n":"ch8_secret_scan","cap":"Рис. 8.6 · сканер секретов блокирует коммит"},{"t":"p","h":"Как читать схему: вы пытаетесь сохранить файл с ключом внутри. Сканер замечает его и не пропускает сохранение, пока ключ не вынесен из кода."},{"t":"p","h":"ИИ сам может быть аудитором, если поставить ему правильную роль. Появились и специализированные ИИ-инструменты, которые ищут и исправляют уязвимости во всём проекте. Но их находки — повод для проверки, а не приговор: ложные срабатывания и пропуски бывают у всех."},{"t":"code","c":"prompt","label":"Запрос","lines":["Проведи аудит безопасности модуля src/payments/ как пентестер.","Для каждой находки: файл и строка, сценарий атаки, оценка влияния (низкое/среднее/высокое), исправление. Не меняй код, только отчёт. Отдельно перечисли места, где ты не уверен."]},{"t":"p","h":"Пентестер — специалист, который по заказу пытается взломать систему, чтобы найти слабые места раньше настоящих злоумышленников. Часть запроса «Не меняй код, только отчёт» защищает вас от неожиданных исправлений. Для новичка вот проще:"},{"t":"code","c":"prompt","label":"Запрос простыми словами","lines":["Проверь безопасность моего приложения так, как это сделал бы специалист по взлому. Объясни простыми словами:","1. какие у приложения самые серьёзные слабые места;","2. как ими мог бы воспользоваться злоумышленник;","3. как мне самому проверить, что это действительно проблема;","4. как это исправить.","Ничего не меняй, пока я не одобрю. Отдельно напиши, в чём ты не уверен."]},{"t":"h3","id":"s50","h":"<h3>Ручной код-ревью с акцентом на безопасность</h3>"},{"t":"p","h":"Автоматика не понимает бизнес-логику: она не знает, что пользователь не должен видеть заказы соседа. Это работа человека, и для неё нужен короткий набор вопросов, который задаётся к каждому изменению. Вам не нужно читать код, чтобы пользоваться этим списком: задавайте вопросы ИИ и проверяйте ответы на практике."},{"t":"list","tag":"ol","c":"ol","items":["<li data-n=\"1\"><strong>Откуда приходят данные?</strong> Всё, что пришло извне — запрос, файл, заголовок, ответ стороннего сервиса, — недоверенное и должно проверяться.</li>","<li data-n=\"2\"><strong>Кто может это вызвать?</strong> Есть ли проверка, что человек вошёл в систему (аутентификация), и проверка его прав на конкретный объект?</li>","<li data-n=\"3\"><strong>Что сделает злоумышленник?</strong> Подставит чужой номер, огромный файл, специальные символы, тысячу запросов в секунду.</li>","<li data-n=\"4\"><strong>Что попадает в журналы?</strong> Пароли, токены и персональные данные в журналах — это утечка.</li>","<li data-n=\"5\"><strong>Какие права у процесса?</strong> Сервис должен иметь минимальные права к базе, файлам и сети: ровно столько, сколько нужно для работы.</li>","<li data-n=\"6\"><strong>Что изменилось вне задачи?</strong> Отключённая проверка, новая библиотека, ослабленные правила <strong>CORS</strong> (настройки, которые решают, каким сайтам разрешено обращаться к вашему серверу) — частые попутные правки агента.</li>"]},{"t":"note","h":"<div class=\"note tip\"><span class=\"nl\">Совет</span> Скопируйте этот список в запрос: «Просмотри последние изменения и ответь на каждый из этих шести вопросов. Если не можешь ответить уверенно, так и скажи». Это не заменит специалиста, но поймает многие типичные ошибки.</div>"},{"t":"h3","id":"s51","h":"<h3>Создание эффективных тестовых фреймворков для сгенерированных ИИ систем</h3>"},{"t":"p","h":"<strong>Тестовый фреймворк</strong> — набор инструментов и договорённостей, с помощью которых в проекте пишут и запускают тесты. Чем больше кода пишет ИИ, тем больше нагрузка ложится на тесты: они становятся главным способом зафиксировать, что система должна делать. Тестовый фреймворк для ИИ-проекта стоит строить вокруг четырёх видов проверок."},{"t":"list","tag":"ul","c":"ul","items":["<li><strong>Негативные тесты безопасности.</strong> Не только «работает для владельца», но и «не работает для чужого».</li>","<li><strong>Контрактные тесты.</strong> Проверяют, что ответы сервера соответствуют договорённости (схеме), которую ждут другие части системы, например мобильное приложение.</li>","<li><strong>Тесты свойств и фаззинг.</strong> Проверяют программу случайными и намеренно «вредными» входными данными: это находит то, о чём никто не подумал.</li>","<li><strong>Регрессионный тест на каждый баг.</strong> Каждая найденная ошибка навсегда превращается в тест, чтобы она не вернулась.</li>"]},{"t":"p","h":"Пример негативного теста для обработчика из главы 7 (функции создания пользователей и запросов — тестовые помощники проекта):"},{"t":"code","c":"","label":"TypeScript","lines":["it(\"не даёт отметить чужую привычку\", async () => {","  const alice = await createUser();","  const bob = await createUser();","  const habit = await createHabit({ userId: alice.id });","","  const res = await postAs(bob, \"/api/checkins\", { habitId: habit.id, day: \"2026-10-01\" });","","  expect(res.status).toBe(404);","  expect(await countCheckins(habit.id)).toBe(0);","});"]},{"t":"p","h":"Что здесь происходит. Тест создаёт двух пользователей, Алису и Боба. У Алисы есть привычка. Затем Боб пытается отметить Алисину привычку. Тест проверяет два факта: сервер ответил «не найдено» (код 404), и никаких отметок у привычки Алисы не появилось. Если когда-нибудь проверка владельца пропадёт, этот тест сразу покраснеет."},{"t":"p","h":"Если в продукте есть функции на основе больших языковых моделей — генерация ответов, классификация, поиск, — им нужны <strong>evals</strong>: наборы примеров с ожидаемым поведением, которые прогоняются при каждом изменении запроса или модели. Без них любая правка запроса — лотерея."},{"t":"h3","id":"s52","h":"<h3>Оптимизация производительности</h3>"},{"t":"p","h":"<strong>Производительность</strong> — это скорость и экономность работы приложения. Сгенерированный код обычно корректен на десяти записях и медленен на миллионе. Модель не знает объёмов ваших данных, если вы о них не сказали."},{"t":"p","h":"Типичные проблемы:"},{"t":"list","tag":"ul","c":"ul","items":["<li><strong>Запросы в цикле (проблема N+1).</strong> Вместо одного запроса «дай всё» программа делает отдельный запрос для каждой записи. Как если бы вы шли на кухню за каждым блюдом отдельно, вместо того чтобы взять поднос.</li>","<li><strong>Загрузка всей таблицы в память</strong> вместо порционного показа (пагинации) или подсчёта в самой базе.</li>","<li><strong>Отсутствие индексов</strong> под реальные фильтры и сортировки (вспомните: индекс похож на оглавление книги).</li>","<li><strong>Повторные одинаковые запросы без кэша.</strong> <strong>Кэш</strong> — временное хранилище готовых ответов, чтобы не вычислять одно и то же заново.</li>","<li><strong>Лишние перерисовки интерфейса,</strong> из-за которых страницы тормозят.</li>"]},{"t":"fig","n":"ch8_n1","cap":"Рис. 8.7 · проблема N+1"},{"t":"p","h":"Как читать схему: слева программа ходит в базу по одному разу на каждую привычку, справа — один раз за всеми. Для десяти привычек разница пока мала, но на тысячах записей она превращается в тормоза."},{"t":"p","h":"Пример N+1 и исправления:"},{"t":"code","c":"","label":"TypeScript","lines":["// N+1: отдельный запрос для каждой привычки","for (const habit of userHabits) {","  habit.checkins = await db.select().from(checkins).where(eq(checkins.habitId, habit.id));","}","","// Один запрос для всех привычек сразу","const ids = userHabits.map((h) => h.id);","const all = await db.select().from(checkins).where(inArray(checkins.habitId, ids));"]},{"t":"p","h":"Что здесь происходит. В первом варианте для каждой привычки пользователя программа отдельно обращается в базу за отметками: если привычек сто, получается сто обращений. Во втором варианте программа собирает номера всех привычек и просит все отметки одним обращением. Результат тот же, но быстрее в десятки раз."},{"t":"p","h":"Главное правило оптимизации не изменилось: сначала измерить, потом исправлять. Для этого есть профилировщик (программа, которая показывает, где тратится время), команда <code>EXPLAIN ANALYZE</code> (она показывает, как база выполнила запрос и сколько времени ушло) и метрики времени ответа. ИИ отлично помогает интерпретировать эти данные, дайте ему реальные цифры, а не просьбу «сделай быстрее»."},{"t":"h3","id":"s53","h":"<h3>Поддерживаемость кодовых баз, составляемых с помощью ИИ</h3>"},{"t":"p","h":"<strong>Кодовая база</strong> — весь код проекта. Та, которую пишут агенты, растёт быстрее, чем команда успевает её понимать. Без дисциплины через полгода появляется «код без автора»: работает, но никто не знает почему и боится трогать."},{"t":"p","h":"Практики, которые держат кодовую базу здоровой:"},{"t":"list","tag":"ul","c":"ul","items":["<li><strong>Записи архитектурных решений (ADR).</strong> Короткие документы «что решили и почему». Их читают и люди, и агенты. Пример: «Решили хранить даты в одном формате, потому что в трёх местах были разные».</li>","<li><strong>Единые соглашения в правилах проекта.</strong> Как называть, где класть, какие приёмы использовать, а какие запрещены.</li>","<li><strong>Регулярный рефакторинг.</strong> Выделяйте время на уборку, как на новые функции. ИИ ускоряет её так же, как и написание нового кода.</li>","<li><strong>Владельцы модулей.</strong> У каждой части системы есть человек, который её понимает и проверяет изменения в ней. Если вы работаете один, этот человек — вы, и делать это будет проще, если вести журнал решений.</li>","<li><strong>Удаление.</strong> Неиспользуемый код — это тоже долг. Агенты охотно добавляют и редко удаляют.</li>"]},{"t":"note","h":"<div class=\"note tip\"><span class=\"nl\">Совет</span> Раз в неделю просите ИИ: «Опиши простыми словами, как сейчас устроен проект и какие принятые решения важно не забыть». Сохраните ответ в файл. Через полгода он будет вашим спасением.</div>"},{"t":"h3","id":"s54","h":"<h3>Стратегии код-ревью</h3>"},{"t":"p","h":"Ревью стало узким местом: агенты производят изменения быстрее, чем люди успевают их читать. Решение — распределить ревью между автоматикой, ИИ и человеком так, чтобы человек тратил внимание на важное."},{"t":"table","head":"<tr><th>Что проверяется</th><th>Кто проверяет</th></tr>","rows":["<tr><td>Стиль, форматирование, типы данных</td><td>Линтер и компилятор (автоматические проверки)</td></tr>","<tr><td>Известные уязвимости и опасные библиотеки</td><td>SAST, SCA, сканер секретов</td></tr>","<tr><td>Очевидные ошибки, пропущенные необычные случаи</td><td>ИИ-проверяющий, первый проход</td></tr>","<tr><td>Соответствие задаче и устройству проекта</td><td>Человек</td></tr>","<tr><td>Безопасность бизнес-логики и права доступа</td><td>Человек</td></tr>","<tr><td>Качество тестов</td><td>Человек</td></tr>"],"cols":2},{"t":"p","h":"Правила, которые делают ревью выполнимым:"},{"t":"list","tag":"ol","c":"ol","items":["<li data-n=\"1\"><strong>Маленькие пул-реквесты.</strong> Пул-реквест — предложение внести изменения (вспомните «Азбуку»). Изменение, которое нельзя прочитать за 20–30 минут, стоит разбить.</li>","<li data-n=\"2\"><strong>Автор ревьюит первым.</strong> Тот, кто запускал агента, сам читает список изменений до того, как звать коллег. Если вы работаете один, этим «первым» можете быть вы с помощью ИИ-проверяющего.</li>","<li data-n=\"3\"><strong>Описание «зачем».</strong> В описании пул-реквеста — задача, подход и что проверить особенно внимательно.</li>","<li data-n=\"4\"><strong>Метка ИИ-изменений.</strong> Команде полезно знать, что изменение написано агентом: на него смотрят иначе.</li>"]},{"t":"fig","n":"ch8_ci_checks","cap":"Рис. 8.8 · автоматические проверки пул-реквеста"},{"t":"p","h":"Как читать схему: каждая строка — отдельная проверка. Зелёная пройдена, красная нет. Пока есть красная, кнопка принятия изменений недоступна."},{"t":"p","h":"В десктопном приложении Claude проверки пул-реквеста видны прямо в сессии, а Claude может сам реагировать на красные."},{"t":"fig","n":"dk_pr_ci","cap":"Рис. 8.9 · пул-реквест и проверки в сессии"},{"t":"p","h":"Как читать схему: под шапкой сессии появляется строка пул-реквеста с результатами проверок. Меню ⋮ у пул-реквеста включает два режима помощи. Автоисправление удобно, а автослияние включайте только тогда, когда проверки действительно надёжны: иначе слияние произойдёт без вашего взгляда."},{"t":"p","h":"Для ревью в приложении есть команда <code>/code-review</code>: Claude перечитывает свои изменения как строгий проверяющий и показывает карточку с замечаниями."},{"t":"fig","n":"dk_review","cap":"Рис. 8.10 · карточка Code review"},{"t":"p","h":"Как читать схему: каждое замечание — отдельная строка с кнопкой исправления. Walk through in diff проведёт по замечаниям в окне изменений, а Apply fixes исправит всё сразу. Это первый проход проверки, а не последний: окончательное решение остаётся за вами."},{"t":"h3","id":"s55","h":"<h3>Лучшие практические рекомендации по надёжному развёртыванию</h3>"},{"t":"p","h":"<strong>Развёртывание</strong> — выкладывание приложения на сервер, чтобы им пользовались люди (в «Азбуке» это называлось деплоем). Даже лучший процесс ревью пропускает ошибки. Надёжное развёртывание делает так, чтобы пропущенная ошибка затронула немногих и быстро откатывалась."},{"t":"fig","n":"8.1","cap":"Рис. 8.11 · конвейер проверок от коммита до продакшена"},{"t":"p","h":"Как читать схему: изменение проходит по порядку через цепочку «ворот», как багаж через проверки в аэропорту: линтер и типы, тесты, проверки безопасности, ревью, тестовое окружение, малая часть пользователей и, наконец, все. Любой красный шаг или сбой отправляет изменение обратно автору. Автоматические ворота идут первыми и отсеивают массовые ошибки, чтобы человек на ревью тратил внимание на логику и безопа
