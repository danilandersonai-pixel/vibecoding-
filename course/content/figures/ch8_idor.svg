<svg viewBox="0 0 760 410" role="img" aria-label="IDOR: что случается, если не проверить владельца" font-size="13"><text x="24" y="28" font-size="15" font-weight="600" class="fg-t">IDOR: что случается, если не проверить владельца</text><text x="24" y="66" font-size="12.5" font-weight="600" class="fg-t">Обычный случай: вы открываете свой профиль</text><rect x="24" y="78" width="208" height="80" rx="8" class="fg-box"/><text x="128" y="111.855" text-anchor="middle" font-weight="600" class="fg-t">…/profile/17</text><text x="128" y="131.755" text-anchor="middle" font-size="11.5" class="fg-q">адрес в браузере</text><rect x="276" y="78" width="208" height="80" rx="8" class="fg-hi"/><text x="380" y="111.855" text-anchor="middle" font-weight="600" class="fg-t">Сервер</text><text x="380" y="131.755" text-anchor="middle" font-size="11.5" class="fg-q">Номер совпал с вашим</text><rect x="528" y="78" width="208" height="80" rx="8" class="fg-okbox"/><text x="632" y="122.29" text-anchor="middle" font-weight="600" class="fg-t">Ваш профиль</text><path d="M232 118L276 118" class="fg-ln" marker-end="url(#bk-arrow)"/><path d="M484 118L528 118" class="fg-ln" marker-end="url(#bk-arrow)"/><text x="24" y="184" font-size="12.5" font-weight="600" class="fg-riskt">Вы поменяли число на 18, а проверки нет</text><rect x="24" y="196" width="208" height="80" rx="8" class="fg-box"/><text x="128" y="229.855" text-anchor="middle" font-weight="600" class="fg-t">…/profile/18</text><text x="128" y="249.755" text-anchor="middle" font-size="11.5" class="fg-q">адрес в браузере</text><rect x="276" y="196" width="208" height="80" rx="8" class="fg-riskbox"/><text x="380" y="221.92" text-anchor="middle" font-weight="600" class="fg-t">Сервер</text><text x="380" y="241.82" text-anchor="middle" font-size="11.5" class="fg-q">Берёт номер из адреса и не</text><text x="380" y="257.69" text-anchor="middle" font-size="11.5" class="fg-q">сверяет</text><rect x="528" y="196" width="208" height="80" rx="8" class="fg-riskbox