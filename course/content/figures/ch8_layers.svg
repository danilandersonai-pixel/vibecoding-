<svg viewBox="0 0 760 424" role="img" aria-label="Аудит безопасности: два слоя проверки" font-size="13"><text x="24" y="28" font-size="15" font-weight="600" class="fg-t">Аудит безопасности: два слоя проверки</text><rect x="24" y="50" width="712" height="156" rx="10" class="fg-zone"/><text x="40" y="74" font-weight="600" class="fg-t">Слой 1. Автоматика: работает при каждом изменении проекта</text><rect x="40" y="88" width="158" height="100" rx="8" class="fg-box"/><text x="119" y="123.92" text-anchor="middle" font-weight="600" class="fg-t">SAST</text><text x="119" y="143.82" text-anchor="middle" font-size="11.5" class="fg-q">Читает код, не</text><text x="119" y="159.69" text-anchor="middle" font-size="11.5" class="fg-q">запуская его</text><rect x="214" y="88" width="158" height="100" rx="8" class="fg-box"/><text x="293" y="115.985" text-anchor="middle" font-weight="600" class="fg-t">SCA</text><text x="293" y="135.885" text-anchor="middle" font-size="11.5" class="fg-q">Проверяет</text><text x="293" y="151.755" text-anchor="middle" font-size="11.5" class="fg-q">подключённые</text><text x="293" y="167.625" text-anchor="middle" font-size="11.5" class="fg-q">библиотеки</text><rect x="388" y="88" width="158" height="100" rx="8" class="fg-box"/><text x="467" y="123.92" text-anchor="middle" font-weight="600" class="fg-t">Секреты</text><text x="467" y="143.82" text-anchor="middle" font-size="11.5" class="fg-q">Не даёт сохранить</text><text x="467" y="159.69" text-anchor="middle" font-size="11.5" class="fg-q">ключи и пароли</text><rect x="562" y="88" width="158" height="100" rx="8" class="fg-box"/><text x="641" y="115.985" text-anchor="middle" font-weight="600" class="fg-t">DAST</text><text x="641" y="135.885" text-anchor="middle" font-size="11.5" class="fg-q">Имитирует атаку на</text><text x="641" y="151.755" text-anchor="middle" font-size="11.5" class="fg-q">запущенное</text><text x="641" y="167.625" text-anchor="middle" font-size="11.5" class="fg-q">приложение</text><path d="M380 206L380 238" class="fg-ln" marker-end="url(#bk-arrow)"/><text x="392" y="228" font-size="11.5" class="fg-q">остаётся то, что автоматика не понимает</text><rect x="24" y="242" width="712" height="166" rx="10" class="fg-hi" style="fill-opacity:.12"/><text x="40" y="266" font-weight="600" class="fg-t">Слой 2. Человек: смысл и права доступа (бизнес-логика)</text><rect x="40" y="280" width="216" height="100" rx="8" class="fg-box"/><text x="148" y="315.92" text-anchor="middle" font-weight="600" class="fg-t">Откуда данные?</text><text x="148" y="335.82" text-anchor="middle" font-size="11.5" class="fg-q">Всё, что пришло извне,</text><text x="148" y="351.69" text-anchor="middle" font-size="11.5" class="fg-q">недоверенное</text><rect x="272" y="280" width="216" height="100" rx="8" class="fg-box"/><text x="380" y="315.92" text-anchor="middle" font-weight="600" class="fg-t">Кто может вызвать?</text><text x="380" y="335.82" text-anchor="middle" font-size="11.5" class="fg-q">Вошёл ли человек и его ли это</text><text x="380" y="351.69" text-anchor="middle" font-size="11.5" class="fg-q">объект</text><rect x="504" y="280" width="216" height="100" rx="8" class="fg-box"/><text x="612" y="307.47" text-anchor="middle" font-weight="600" class="fg-t">Что сделает</text><text x="612" y="324.37" text-anchor="middle" font-weight="600" class="fg-t">злоумышленник?</text><text x="612" y="344.27" text-anchor="middle" font-size="11.5" class="fg-q">Чужой номер, огромный файл,</text><text x="612" y="360.14" text-anchor="middle" font-size="11.5" class="fg-q">тысяча запросов</text><text x="40" y="398" font-size="11.5" class="fg-q">Ещё: что попадает в журналы · какие права у процесса · что изменилось вне задачи</text></svg>