<svg viewBox="0 0 760 386" role="img" aria-label="Задача для агента и приёмка результата" font-size="13"><text x="24" y="28" font-size="15" font-weight="600" class="fg-t">Задача для агента и приёмка результата</text><text x="24" y="56" font-weight="600" class="fg-t">Как поставить задачу</text><rect x="24" y="70" width="230" height="66" rx="8" class="fg-box"/><text x="139" y="96.855" text-anchor="middle" font-weight="600" class="fg-t">Задача</text><text x="139" y="116.755" text-anchor="middle" font-size="11.5" class="fg-q">одно предложение: что сделать</text><rect x="24" y="148" width="230" height="66" rx="8" class="fg-box"/><text x="139" y="174.855" text-anchor="middle" font-weight="600" class="fg-t">Контекст</text><text x="139" y="194.755" text-anchor="middle" font-size="11.5" class="fg-q">где лежат данные и образец</text><rect x="24" y="226" width="230" height="66" rx="8" class="fg-box"/><text x="139" y="252.855" text-anchor="middle" font-weight="600" class="fg-t">Критерии готовности</text><text x="139" y="272.755" text-anchor="middle" font-size="11.5" class="fg-q">как понять, что готово</text><rect x="24" y="304" width="230" height="66" rx="8" class="fg-box"/><text x="139" y="330.855" text-anchor="middle" font-weight="600" class="fg-t">Ограничения</text><text x="139" y="350.755" text-anchor="middle" font-size="11.5" class="fg-q">что нельзя менять</text><rect x="302" y="170" width="150" height="100" rx="8" class="fg-hi"/><text x="377" y="205.405" text-anchor="middle" font-weight="600" class="fg-t">Агент работает в</text><text x="377" y="222.305" text-anchor="middle" font-weight="600" class="fg-t">фоне</text><text x="377" y="242.205" text-anchor="middle" font-size="11.5" class="fg-q">Вы заняты своим</text><path d="M254 103L278 103L278 220L302 220" class="fg-ln"/><path d="M254 181L278 181L278 220L302 220" class="fg-ln"/><path d="M254 259L278 259L278 220L302 220" class="fg-ln"/><path d="M254 337L278 337L278 220L302 220" class="fg-ln" marker-end="url(#bk-arrow)"/><text x="500" y="56" font-weight="600" class="fg-t">Как принять результат</text><rect x="500" y="70" width="236" height="66" rx="8" class="fg-okbox"/><text x="544" y="98.84" font-weight="600" class="fg-t">Прочитать описание:</text><text x="544" y="115.74" font-weight="600" class="fg-t">совпадает ли с просьбой</text><rect x="500" y="148" width="236" height="66" rx="8" class="fg-okbox"/><text x="544" y="176.84" font-weight="600" class="fg-t">Посмотреть, какие</text><text x="544" y="193.74" font-weight="600" class="fg-t">файлы изменены</text><rect x="500" y="226" width="236" height="66" rx="8" class="fg-okbox"/><text x="544" y="254.84" font-weight="600" class="fg-t">Проверить руками</text><text x="544" y="271.74" font-weight="600" class="fg-t">главный сценарий</text><rect x="500" y="304" width="236" height="66" rx="8" class="fg-okbox"/><text x="544" y="332.84" font-weight="600" class="fg-t">Убедиться, что проверки</text><text x="544" y="349.74" font-weight="600" class="fg-t">прошли и не ослаблены</text><circle cx="520" cy="103" r="10" class="fg-tier"/><text x="520" y="107" text-anchor="middle" font-size="12" font-weight="600" class="fg-on">1</text><circle cx="520" cy="181" r="10" class="fg-tier"/><text x="520" y="185" text-anchor="middle" font-size="12" font-weight="600" class="fg-on">2</text><circle cx="520" cy="259" r="10" class="fg-tier"/><text x="520" y="263" text-anchor="middle" font-size="12" font-weight="600" class="fg-on">3</text><circle cx="520" cy="337" r="10" class="fg-tier"/><text x="520" y="341" text-anchor="middle" font-size="12" font-weight="600" class="fg-on">4</text><path d="M452 220L476 220L476 103L500 103" class="fg-ln"/><path d="M452 220L476 220L476 181L500 181" class="fg-ln"/><path d="M452 220L476 220L476 259L500 259" class="fg-ln"/><path d="M452 220L476 220L476 337L500 337" class="fg-ln" marker-end="url(#bk-arrow)"/></svg>