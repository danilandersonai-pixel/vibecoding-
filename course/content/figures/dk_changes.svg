<svg viewBox="0 0 760 475" role="img" aria-label="Окно Changes: список файлов, дифф, комментарии" font-size="13"><text x="24" y="28" font-size="15" font-weight="600" class="fg-t">Окно изменений: что именно поменял Claude</text><rect x="24" y="46" width="712" height="40" rx="8" class="fg-win"/><text x="40" y="71" font-size="12" class="fg-t">Добавил форму входа и проверку пароля.</text><rect x="656.78" y="55" width="63.22" height="22" rx="11" class="fg-okbox"/><text x="688.39" y="69.85" text-anchor="middle" font-size="11" font-weight="600" class="fg-ok">+36 −5</text><circle cx="626" cy="66" r="10" class="fg-tier"/><text x="626" y="70" text-anchor="middle" font-size="12" font-weight="600" class="fg-on">1</text><path d="M641 66H650" class="fg-ln-acc" marker-end="url(#bk-arrow-acc)"/><rect x="24" y="98" width="712" height="238" rx="10" class="fg-win"/><rect x="220" y="98" width="1" height="238" rx="0" class="fg-line"/><text x="38" y="120" font-size="10" font-weight="600" class="fg-q">Изменённые файлы</text><rect x="30" y="132" width="184" height="26" rx="5" class="fg-sel"/><text x="38" y="149" font-size="11" class="fg-t fg-mono" xml:space="preserve">form.ts</text><text x="208" y="149" text-anchor="end" font-size="10" font-weight="600" class="fg-ok">+24 −2</text><text x="38" y="179" font-size="11" class="fg-t fg-mono" xml:space="preserve">auth.ts</text><text x="208" y="179" text-anchor="end" font-size="10" font-weight="600" class="fg-ok">+9 −3</text><text x="38" y="209" font-size="11" class="fg-t fg-mono" xml:space="preserve">form.test.ts</text><text x="208" y="209" text-anchor="end" font-size="10" font-weight="600" class="fg-ok">+3 −0</text><circle cx="220" cy="144" r="10" class="fg-tier"/><text x="220" y="148" text-anchor="middle" font-size="12" font-weight="600" class="fg-on">2</text><text x="238" y="124" font-size="11" class="fg-t fg-mono" xml:space="preserve">src/form.ts</text><text x="248" y="150" font-size="10" class="fg-q fg-mono" xml:space="preserve">12</text><text x="274" y="150" font-size="11" class="fg-t fg-mono" xml:space="preserve"> function login(user, password) {</text><rect x="234" y="158" width="486" height="20" rx="2" class="fg-del"/><text x="248" y="172" font-size="10" class="fg-q fg-mono" xml:space="preserve">13</text><text x="274" y="172" font-size="11" class="fg-t fg-mono" xml:space="preserve">−  if (password.length &gt; 0) {</text><rect x="234" y="180" width="486" height="20" rx="2" class="fg-add"/><text x="248" y="194" font-size="10" class="fg-q fg-mono" xml:space="preserve">14</text><text x="274" y="194" font-size="11" class="fg-t fg-mono" xml:space="preserve">+  if (password.length &gt;= 8) {</text><text x="248" y="216" font-size="10" class="fg-q fg-mono" xml:space="preserve">15</text><text x="274" y="216" font-size="11" class="fg-t fg-mono" xml:space="preserve">     return check(user, password);</text><text x="248" y="238" font-size="10" class="fg-q fg-mono" xml:space="preserve">16</text><text x="274" y="238" font-size="11" class="fg-t fg-mono" xml:space="preserve">   }</text><rect x="274" y="250" width="330" height="30" rx="6" class="fg-hi"/><text x="286" y="269" font-size="11" class="fg-acc">А если пароль пустой? Добавь проверку</text><circle cx="624" cy="265" r="10" class="fg-tier"/><text x="624" y="269" text-anchor="middle" font-size="12" font-weight="600" class="fg-on">3</text><rect x="553.47" y="302" width="168.53" height="22" rx="11" class="fg-hi"/><text x="637.74" y="316.68" text-anchor="middle" font-size="10.5" font-weight="600" class="fg-acc">Отправить комментарии</text><circle cx="518" cy="313" r="10" class="fg-tier"/><text x="518" y="317" text-anchor="middle" font-size="12" font-weight="600" class="fg-on">4</text><circle cx="34" cy="364" r="10" class="fg-tier"/><text x="34" y="368" text-anchor="middle" font-size="12" font-weight="600" class="fg-on">1</text><text x="52" y="368" font-size="12" class="fg-q">Значок «+36 −5» под ответом: сколько строк</text><text x="52" y="383.84" font-size="12" class="fg-q">добавлено и удалено. Нажмите на него —</text><text x="52" y="399.68" font-size="12" class="fg-q">откроется окно изменений.</text><circle cx="34" cy="427.52" r="10" class="fg-tier"/><text x="34" y="431.52" text-anchor="middle" font-size="12" font-weight="600" class="fg-on">2</text><text x="52" y="431.52" font-size="12" class="fg-q">Слева файлы, которые Claude тронул. Нажмите</text><text x="52" y="447.36" font-size="12" class="fg-q">на файл, и справа появится его дифф.</text><circle cx="404" cy="364" r="10" class="fg-tier"/><text x="404" y="368" text-anchor="middle" font-size="12" font-weight="600" class="fg-on">3</text><text x="422" y="368" font-size="12" class="fg-q">Красное удалено, зелёное добавлено. Нажмите</text><text x="422" y="383.84" font-size="12" class="fg-q">на строку и напишите комментарий. Enter</text><text x="422" y="399.68" font-size="12" class="fg-q">добавляет его.</text><circle cx="404" cy="427.52" r="10" class="fg-tier"/><text x="404" y="431.52" text-anchor="middle" font-size="12" font-weight="600" class="fg-on">4</text><text x="422" y="431.52" font-size="12" class="fg-q">Комментарии можно собрать и отправить</text><text x="422" y="447.36" font-size="12" class="fg-q">Claude разом: Ctrl + Enter (на Mac ⌘ + Enter).</text></svg>