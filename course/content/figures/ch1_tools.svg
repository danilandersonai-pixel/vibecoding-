<svg viewBox="0 0 760 402" role="img" aria-label="Классы ИИ-инструментов: от подсказки до самостоятельной работы" font-size="13"><text x="24" y="28" font-size="15" font-weight="600" class="fg-t">Классы ИИ-инструментов: от подсказки до самостоятельной работы</text><rect x="24" y="172" width="140" height="96" rx="8" class="fg-box"/><text x="94" y="206.445" text-anchor="middle" font-size="12.5" font-weight="600" class="fg-t">Автодополнение</text><text x="94" y="225.695" text-anchor="middle" font-size="11" class="fg-q">Подсказывает код</text><text x="94" y="240.875" text-anchor="middle" font-size="11" class="fg-q">по мере набора</text><rect x="172" y="144" width="140" height="124" rx="8" class="fg-box"/><text x="242" y="177.265" text-anchor="middle" font-size="12.5" font-weight="600" class="fg-t">ИИ-редактор</text><text x="242" y="196.515" text-anchor="middle" font-size="11" class="fg-q">Редактор,</text><text x="242" y="211.695" text-anchor="middle" font-size="11" class="fg-q">построенный</text><text x="242" y="226.875" text-anchor="middle" font-size="11" class="fg-q">вокруг чата и</text><text x="242" y="242.055" text-anchor="middle" font-size="11" class="fg-q">агента</text><rect x="320" y="116" width="140" height="152" rx="8" class="fg-hi"/><text x="390" y="162.73" text-anchor="middle" font-size="12.5" font-weight="600" class="fg-t">Терминальный</text><text x="390" y="178.98" text-anchor="middle" font-size="12.5" font-weight="600" class="fg-t">агент</text><text x="390" y="198.23" text-anchor="middle" font-size="11" class="fg-q">Читает проект,</text><text x="390" y="213.41" text-anchor="middle" font-size="11" class="fg-q">запускает команды,</text><text x="390" y="228.59" text-anchor="middle" font-size="11" class="fg-q">правит файлы</text><rect x="468" y="88" width="140" height="180" rx="8" class="fg-box"/><text x="538" y="133.55" text-anchor="middle" font-size="12.5" font-weight="600" class="fg-t">Облачный и</text><text x="538" y="149.8" text-anchor="middle" font-size="12.5" font-weight="600" class="fg-t">фоновый агент</text><text x="538" y="169.05" text-anchor="middle" font-size="11" class="fg-q">Работает на</text><text x="538" y="184.23" text-anchor="middle" font-size="11" class="fg-q">удалённом</text><text x="538" y="199.41" text-anchor="middle" font-size="11" class="fg-q">компьютере,</text><text x="538" y="214.59" text-anchor="middle" font-size="11" class="fg-q">присылает готовое</text><text x="538" y="229.77" text-anchor="middle" font-size="11" class="fg-q">изменение</text><path d="M24 282L604 282" class="fg-ln" marker-end="url(#bk-arrow)"/><text x="24" y="302" font-size="11.5" class="fg-q">всё больше самостоятельности ИИ</text><rect x="624" y="88" width="112" height="180" rx="8" class="fg-zone"/><text x="680" y="133.71" text-anchor="middle" font-size="12" font-weight="600" class="fg-t">Конструктор</text><text x="680" y="149.31" text-anchor="middle" font-size="12" font-weight="600" class="fg-t">приложений</text><text x="680" y="167.91" text-anchor="middle" font-size="11" class="fg-q">Приложение</text><text x="680" y="183.09" text-anchor="middle" font-size="11" class="fg-q">целиком из</text><text x="680" y="198.27" text-anchor="middle" font-size="11" class="fg-q">описания,</text><text x="680" y="213.45" text-anchor="middle" font-size="11" class="fg-q">сразу с</text><text x="680" y="228.63" text-anchor="middle" font-size="11" class="fg-q">хостингом</text><rect x="24" y="320" width="712" height="66" rx="8" class="fg-okbox"/><text x="380" y="346.855" text-anchor="middle" font-weight="600" class="fg-t">MCP: универсальный разъём</text><text x="380" y="366.755" text-anchor="middle" font-size="11.5" class="fg-q">Подключили один раз, и агент пользуется базой данных, трекером задач, документацией, браузером</text></svg>