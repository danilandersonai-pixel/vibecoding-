<svg viewBox="0 0 760 387" role="img" aria-label="Интеллектуальная собственность: три вопроса и что с ними делать" font-size="13"><text x="24" y="28" font-size="15" font-weight="600" class="fg-t">Интеллектуальная собственность: три вопроса и что с ними делать</text><rect x="24" y="56" width="224" height="116" rx="8" class="fg-hi"/><text x="136" y="99.92" text-anchor="middle" font-weight="600" class="fg-t">Кому принадлежит код?</text><text x="136" y="119.82" text-anchor="middle" font-size="11.5" class="fg-q">Во многих странах автором</text><text x="136" y="135.69" text-anchor="middle" font-size="11.5" class="fg-q">может быть только человек</text><rect x="268" y="56" width="224" height="116" rx="8" class="fg-hi"/><text x="380" y="83.535" text-anchor="middle" font-weight="600" class="fg-t">Не нарушает ли он чужие</text><text x="380" y="100.435" text-anchor="middle" font-weight="600" class="fg-t">права?</text><text x="380" y="120.335" text-anchor="middle" font-size="11.5" class="fg-q">Модель иногда повторяет</text><text x="380" y="136.205" text-anchor="middle" font-size="11.5" class="fg-q">обучающие данные почти</text><text x="380" y="152.075" text-anchor="middle" font-size="11.5" class="fg-q">дословно</text><rect x="512" y="56" width="224" height="116" rx="8" class="fg-hi"/><text x="624" y="99.92" text-anchor="middle" font-weight="600" class="fg-t">Что с моими данными?</text><text x="624" y="119.82" text-anchor="middle" font-size="11.5" class="fg-q">Условия инструментов разные:</text><text x="624" y="135.69" text-anchor="middle" font-size="11.5" class="fg-q">учатся ли на вашем коде</text><rect x="24" y="222" width="224" height="116" rx="8" class="fg-okbox"/><text x="136" y="257.985" text-anchor="middle" font-weight="600" class="fg-t">Что делать</text><text x="136" y="277.885" text-anchor="middle" font-size="11.5" class="fg-q">Для коммерческого продукта</text><text x="136" y="293.755" text-anchor="middle" font-size="11.5" class="fg-q">уточните у юриста; ваши правки</text><text x="136" y="309.625" text-anchor="middle" font-size="11.5" class="fg-q">и проверка важны</text><rect x="268" y="222" width="224" height="116" rx="8" class="fg-okbox"/><text x="380" y="265.92" text-anchor="middle" font-weight="600" class="fg-t">Что делать</text><text x="380" y="285.82" text-anchor="middle" font-size="11.5" class="fg-q">Сканер лицензий в CI и фильтр</text><text x="380" y="301.69" text-anchor="middle" font-size="11.5" class="fg-q">дословных совпадений</text><rect x="512" y="222" width="224" height="116" rx="8" class="fg-okbox"/><text x="624" y="257.985" text-anchor="middle" font-weight="600" class="fg-t">Что делать</text><text x="624" y="277.885" text-anchor="middle" font-size="11.5" class="fg-q">Не вставляйте закрытый код и</text><text x="624" y="293.755" text-anchor="middle" font-size="11.5" class="fg-q">секреты без договора; читайте</text><text x="624" y="309.625" text-anchor="middle" font-size="11.5" class="fg-q">условия</text><path d="M136 172L136 222" class="fg-ln" marker-end="url(#bk-arrow)"/><path d="M380 172L380 222" class="fg-ln" marker-end="url(#bk-arrow)"/><path d="M624 172L624 222" class="fg-ln" marker-end="url(#bk-arrow)"/><text x="24" y="366" font-size="11.5" class="fg-q">Это обзор, а не юридическая консультация.</text></svg>