<svg viewBox="0 0 760 333" role="img" aria-label="Чат и агент: кто переносит код в проект" font-size="13"><text x="24" y="28" font-size="15" font-weight="600" class="fg-t">Чат и агент: кто переносит код в проект</text><text x="24" y="60" font-weight="600" class="fg-t">Чат</text><rect x="24" y="72" width="158.5" height="80" rx="8" class="fg-box"/><text x="103.25" y="105.855" text-anchor="middle" font-weight="600" class="fg-t">Вы</text><text x="103.25" y="125.755" text-anchor="middle" font-size="11.5" class="fg-q">задаёте вопрос</text><rect x="208.5" y="72" width="158.5" height="80" rx="8" class="fg-hi"/><text x="287.75" y="97.92" text-anchor="middle" font-weight="600" class="fg-t">ИИ</text><text x="287.75" y="117.82" text-anchor="middle" font-size="11.5" class="fg-q">показывает кусок</text><text x="287.75" y="133.69" text-anchor="middle" font-size="11.5" class="fg-q">кода</text><rect x="393" y="72" width="158.5" height="80" rx="8" class="fg-box"/><text x="472.25" y="105.855" text-anchor="middle" font-weight="600" class="fg-t">Вы</text><text x="472.25" y="125.755" text-anchor="middle" font-size="11.5" class="fg-q">копируете код в файл</text><rect x="577.5" y="72" width="158.5" height="80" rx="8" class="fg-box"/><text x="656.75" y="97.92" text-anchor="middle" font-weight="600" class="fg-t">Вы</text><text x="656.75" y="117.82" text-anchor="middle" font-size="11.5" class="fg-q">запускаете и</text><text x="656.75" y="133.69" text-anchor="middle" font-size="11.5" class="fg-q">смотрите, что вышло</text><path d="M182.5 112L208.5 112" class="fg-ln" marker-end="url(#bk-arrow)"/><path d="M367 112L393 112" class="fg-ln" marker-end="url(#bk-arrow)"/><path d="M551.5 112L577.5 112" class="fg-ln" marker-end="url(#bk-arrow)"/><text x="24" y="188" font-weight="600" class="fg-t">Агент</text><rect x="24" y="200" width="158.5" height="80" rx="8" class="fg-box"/><text x="103.25" y="233.855" text-anchor="middle" font-weight="600" class="fg-t">Вы</text><text x="103.25" y="253.755" text-anchor="middle" font-size="11.5" class="fg-q">ставите задачу</text><rect x="208.5" y="200" width="158.5" height="80" rx="8" class="fg-hi"/><text x="287.75" y="225.92" text-anchor="middle" font-weight="600" class="fg-t">Агент</text><text x="287.75" y="245.82" text-anchor="middle" font-size="11.5" class="fg-q">читает проект и</text><text x="287.75" y="261.69" text-anchor="middle" font-size="11.5" class="fg-q">составляет план</text><rect x="393" y="200" width="158.5" height="80" rx="8" class="fg-hi"/><text x="472.25" y="225.92" text-anchor="middle" font-weight="600" class="fg-t">Агент</text><text x="472.25" y="245.82" text-anchor="middle" font-size="11.5" class="fg-q">правит файлы и</text><text x="472.25" y="261.69" text-anchor="middle" font-size="11.5" class="fg-q">запускает проверки</text><rect x="577.5" y="200" width="158.5" height="80" rx="8" class="fg-box"/><text x="656.75" y="233.855" text-anchor="middle" font-weight="600" class="fg-t">Вы</text><text x="656.75" y="253.755" text-anchor="middle" font-size="11.5" class="fg-q">смотрите итог</text><path d="M182.5 240L208.5 240" class="fg-ln" marker-end="url(#bk-arrow)"/><path d="M367 240L393 240" class="fg-ln" marker-end="url(#bk-arrow)"/><path d="M551.5 240L577.5 240" class="fg-ln" marker-end="url(#bk-arrow)"/><text x="24" y="312" font-size="11.5" class="fg-q">В чате вы переносите код сами. Агент делает это за вас, а вы проверяете результат.</text></svg>