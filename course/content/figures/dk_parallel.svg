<svg viewBox="0 0 760 421" role="img" aria-label="Параллельные сессии: боковая панель и две панели рядом" font-size="13"><text x="24" y="28" font-size="15" font-weight="600" class="fg-t">Несколько сессий одновременно, каждая в своей копии</text><rect x="24" y="46" width="712" height="236" rx="10" class="fg-win"/><path d="M194 46H34Q24 46 24 56V272Q24 282 34 282H194Z" class="fg-bar"/><rect x="36" y="58" width="146" height="26" rx="6" class="fg-hi"/><text x="109" y="75.03" text-anchor="middle" font-size="11.5" font-weight="600" class="fg-acc">+ New session</text><text x="38" y="106" font-size="10" class="fg-q">Status ▾   Project ▾</text><rect x="30" y="114" width="158" height="38" rx="6" class="fg-sel"/><circle cx="42" cy="129" r="4" class="fg-acc"/><text x="54" y="128" font-size="11.5" font-weight="600" class="fg-t">Форма входа</text><text x="54" y="143" font-size="9.5" class="fg-q">feat/login · Worktree</text><circle cx="42" cy="171" r="4" class="fg-ok"/><text x="54" y="170" font-size="11.5" class="fg-t">Починить тесты</text><text x="54" y="185" font-size="9.5" class="fg-q">fix/tests · Worktree</text><circle cx="42" cy="213" r="4" class="fg-risk"/><text x="54" y="212" font-size="11.5" class="fg-t">Страница меню</text><text x="54" y="227" font-size="9.5" class="fg-q">feat/menu · Worktree</text><rect x="194" y="82" width="542" height="1" rx="0" class="fg-line"/><text x="210" y="69" font-size="12" font-weight="600" class="fg-t">Форма входа ▾</text><rect x="700" y="54" width="24" height="22" rx="11" class="fg-bar"/><text x="712" y="68.85" text-anchor="middle" font-size="11" class="fg-t">⋮</text><rect x="628.15" y="54" width="65.85" height="22" rx="11" class="fg-bar"/><text x="661.07" y="68.85" text-anchor="middle" font-size="11" class="fg-t">Changes</text><rect x="204" y="92" width="256" height="150" rx="8" class="fg-box"/><text x="216" y="112" font-size="11.5" font-weight="600" class="fg-t">Форма входа</text><rect x="378.24" y="98" width="71.76" height="18" rx="9" class="fg-hi"/><text x="414.12" y="110.33" text-anchor="middle" font-size="9.5" class="fg-acc">работает…</text><text x="216" y="140" font-size="11" class="fg-q">Пишу форму и проверку</text><text x="216" y="156" font-size="11" class="fg-q">пароля.</text><rect x="216" y="178" width="232" height="22" rx="5" class="fg-bar"/><text x="224" y="193" font-size="10.5" class="fg-t fg-mono" xml:space="preserve">feat/login</text><rect x="390.89" y="206" width="57.11" height="20" rx="10" class="fg-okbox"/><text x="419.45" y="219.5" text-anchor="middle" font-size="10" font-weight="600" class="fg-ok">+24 −2</text><rect x="470" y="92" width="256" height="150" rx="8" class="fg-box"/><text x="482" y="112" font-size="11.5" font-weight="600" class="fg-t">Починить тесты</text><rect x="666.44" y="98" width="49.56" height="18" rx="9" class="fg-okbox"/><text x="691.22" y="110.33" text-anchor="middle" font-size="9.5" class="fg-ok">готово</text><text x="482" y="140" font-size="11" class="fg-q">Исправил 2 теста,</text><text x="482" y="156" font-size="11" class="fg-q">все проверки зелёные.</text><rect x="482" y="178" width="232" height="22" rx="5" class="fg-bar"/><text x="490" y="193" font-size="10.5" class="fg-t fg-mono" xml:space="preserve">fix/tests</text><rect x="663.85" y="206" width="50.15" height="20" rx="10" class="fg-okbox"/><text x="688.92" y="219.5" text-anchor="middle" font-size="10" font-weight="600" class="fg-ok">+6 −4</text><circle cx="192" cy="126" r="10" class="fg-tier"/><text x="192" y="130" text-anchor="middle" font-size="12" font-weight="600" class="fg-on">1</text><circle cx="474" cy="92" r="10" class="fg-tier"/><text x="474" y="96" text-anchor="middle" font-size="12" font-weight="600" class="fg-on">2</text><circle cx="364" cy="216" r="10" class="fg-tier"/><text x="364" y="220" text-anchor="middle" font-size="12" font-weight="600" class="fg-on">3</text><circle cx="702" cy="189" r="10" class="fg-tier"/><text x="702" y="193" text-anchor="middle" font-size="12" font-weight="600" class="fg-on">4</text><circle cx="34" cy="310" r="10" class="fg-tier"/><text x="34" y="314" text-anchor="middle" font-size="12" font-weight="600" class="fg-on">1</text><text x="52" y="314" font-size="12" class="fg-q">В боковой панели все ваши сессии. Фильтры</text><text x="52" y="329.84" font-size="12" class="fg-q">вверху отбирают их по статусу, проекту и</text><text x="52" y="345.68" font-size="12" class="fg-q">окружению.</text><circle cx="34" cy="373.52" r="10" class="fg-tier"/><text x="34" y="377.52" text-anchor="middle" font-size="12" font-weight="600" class="fg-on">2</text><text x="52" y="377.52" font-size="12" class="fg-q">Нажмите на сессию с зажатым Ctrl (на Mac ⌘) —</text><text x="52" y="393.36" font-size="12" class="fg-q">она откроется во второй панели рядом.</text><circle cx="404" cy="310" r="10" class="fg-tier"/><text x="404" y="314" text-anchor="middle" font-size="12" font-weight="600" class="fg-on">3</text><text x="422" y="314" font-size="12" class="fg-q">У каждой сессии своя история беседы и свои</text><text x="422" y="329.84" font-size="12" class="fg-q">изменения. Задачи не мешают друг другу.</text><circle cx="404" cy="357.68" r="10" class="fg-tier"/><text x="404" y="361.68" text-anchor="middle" font-size="12" font-weight="600" class="fg-on">4</text><text x="422" y="361.68" font-size="12" class="fg-q">Worktree: у каждой сессии отдельная копия</text><text x="422" y="377.52" font-size="12" class="fg-q">проекта в своей ветке. Две сессии не правят</text><text x="422" y="393.36" font-size="12" class="fg-q">один и тот же файл одновременно.</text></svg>