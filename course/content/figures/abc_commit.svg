<svg viewBox="0 0 760 326" role="img" aria-label="Сохранить изменения в Git: три команды подряд" font-size="13"><text x="24" y="28" font-size="15" font-weight="600" class="fg-t">Сохранить изменения в Git: три команды подряд</text><rect x="24" y="54" width="220" height="100" rx="8" class="fg-term"/><path d="M24 80V62Q24 54 32 54H236Q244 54 244 62V80Z" class="fg-tbar"/><circle cx="38" cy="67" r="3.5" class="fg-tdim"/><circle cx="51" cy="67" r="3.5" class="fg-tdim"/><circle cx="64" cy="67" r="3.5" class="fg-tdim"/><text x="134" y="71" text-anchor="middle" font-size="11" class="fg-tdim">Шаг 1</text><text x="38" y="105.5" font-size="11.5" class="fg-tp fg-mono" xml:space="preserve">$</text><text x="51.846" y="105.5" font-size="11.5" class="fg-tt fg-mono" xml:space="preserve">git status</text><text x="38" y="123.5" font-size="11.5" class="fg-tyel fg-mono" xml:space="preserve">modified: form.ts</text><rect x="270" y="54" width="220" height="100" rx="8" class="fg-term"/><path d="M270 80V62Q270 54 278 54H482Q490 54 490 62V80Z" class="fg-tbar"/><circle cx="284" cy="67" r="3.5" class="fg-tdim"/><circle cx="297" cy="67" r="3.5" class="fg-tdim"/><circle cx="310" cy="67" r="3.5" class="fg-tdim"/><text x="380" y="71" text-anchor="middle" font-size="11" class="fg-tdim">Шаг 2</text><text x="284" y="105.5" font-size="11.5" class="fg-tp fg-mono" xml:space="preserve">$</text><text x="297.846" y="105.5" font-size="11.5" class="fg-tt fg-mono" xml:space="preserve">git add .</text><rect x="516" y="54" width="220" height="100" rx="8" class="fg-term"/><path d="M516 80V62Q516 54 524 54H728Q736 54 736 62V80Z" class="fg-tbar"/><circle cx="530" cy="67" r="3.5" class="fg-tdim"/><circle cx="543" cy="67" r="3.5" class="fg-tdim"/><circle cx="556" cy="67" r="3.5" class="fg-tdim"/><text x="626" y="71" text-anchor="middle" font-size="11" class="fg-tdim">Шаг 3</text><text x="530" y="105.5" font-size="11.5" class="fg-tp fg-mono" xml:space="preserve">$</text><text x="543.846" y="105.5" font-size="11.5" class="fg-tt fg-mono" xml:space="preserve">git commit -m "Add form"</text><text x="530" y="123.5" font-size="11.5" class="fg-tok fg-mono" xml:space="preserve">1 file changed</text><path d="M246 104L268 104" class="fg-ln" marker-end="url(#bk-arrow)"/><path d="M492 104L514 104" class="fg-ln" marker-end="url(#bk-arrow)"/><circle cx="34" cy="179" r="10" class="fg-tier"/><text x="34" y="183" text-anchor="middle" font-size="12" font-weight="600" class="fg-on">1</text><text x="52" y="183" font-size="12" class="fg-q">Посмотреть, что изменилось</text><text x="52" y="198.84" font-size="12" class="fg-q">с прошлого раза</text><circle cx="280" cy="179" r="10" class="fg-tier"/><text x="280" y="183" text-anchor="middle" font-size="12" font-weight="600" class="fg-on">2</text><text x="298" y="183" font-size="12" class="fg-q">Выбрать изменения, которые</text><text x="298" y="198.84" font-size="12" class="fg-q">попадут в сохранение</text><circle cx="526" cy="179" r="10" class="fg-tier"/><text x="526" y="183" text-anchor="middle" font-size="12" font-weight="600" class="fg-on">3</text><text x="544" y="183" font-size="12" class="fg-q">Сохранить с короткой</text><text x="544" y="198.84" font-size="12" class="fg-q">подписью: что и зачем</text><rect x="24" y="244" width="712" height="66" rx="8" class="fg-okbox"/><text x="380" y="270.855" text-anchor="middle" font-weight="600" class="fg-t">В истории проекта появилась новая точка</text><text x="380" y="290.755" text-anchor="middle" font-size="11.5" class="fg-q">К ней можно вернуться, если следующие правки что-то сломают</text></svg>