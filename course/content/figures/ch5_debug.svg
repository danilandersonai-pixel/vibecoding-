<svg viewBox="0 0 760 385" role="img" aria-label="Цикл отладки с ИИ: сначала причина, потом исправление" font-size="13"><text x="24" y="28" font-size="15" font-weight="600" class="fg-t">Цикл отладки с ИИ: сначала причина, потом исправление</text><rect x="24" y="62" width="126.4" height="109.38" rx="8" class="fg-box"/><text x="87.2" y="86.74" text-anchor="middle" font-weight="600" class="fg-t">Воспроизвести</text><text x="87.2" y="106.64" text-anchor="middle" font-size="11.5" class="fg-q">Минимальные</text><text x="87.2" y="122.51" text-anchor="middle" font-size="11.5" class="fg-q">шаги, которые</text><text x="87.2" y="138.38" text-anchor="middle" font-size="11.5" class="fg-q">приводят к</text><text x="87.2" y="154.25" text-anchor="middle" font-size="11.5" class="fg-q">ошибке</text><rect x="170.4" y="62" width="126.4" height="109.38" rx="8" class="fg-box"/><text x="233.6" y="94.675" text-anchor="middle" font-weight="600" class="fg-t">Сузить круг</text><text x="233.6" y="114.575" text-anchor="middle" font-size="11.5" class="fg-q">Где именно</text><text x="233.6" y="130.445" text-anchor="middle" font-size="11.5" class="fg-q">что-то</text><text x="233.6" y="146.315" text-anchor="middle" font-size="11.5" class="fg-q">ломается?</text><rect x="316.8" y="62" width="126.4" height="109.38" rx="8" class="fg-hi"/><text x="380" y="86.74" text-anchor="middle" font-weight="600" class="fg-t">Три гипотезы</text><text x="380" y="106.64" text-anchor="middle" font-size="11.5" class="fg-q">ИИ не</text><text x="380" y="122.51" text-anchor="middle" font-size="11.5" class="fg-q">исправляет, а</text><text x="380" y="138.38" text-anchor="middle" font-size="11.5" class="fg-q">ранжирует</text><text x="380" y="154.25" text-anchor="middle" font-size="11.5" class="fg-q">версии</text><rect x="463.2" y="62" width="126.4" height="109.38" rx="8" class="fg-box"/><text x="526.4" y="86.74" text-anchor="middle" font-weight="600" class="fg-t">Проверить</text><text x="526.4" y="106.64" text-anchor="middle" font-size="11.5" class="fg-q">Одним</text><text x="526.4" y="122.51" text-anchor="middle" font-size="11.5" class="fg-q">действием: лог,</text><text x="526.4" y="138.38" text-anchor="middle" font-size="11.5" class="fg-q">тест или</text><text x="526.4" y="154.25" text-anchor="middle" font-size="11.5" class="fg-q">команда</text><rect x="609.6" y="62" width="126.4" height="109.38" rx="8" class="fg-okbox"/><text x="672.8" y="102.095" text-anchor="middle" font-weight="600" class="fg-t">Исправить</text><text x="672.8" y="118.995" text-anchor="middle" font-weight="600" class="fg-t">причину</text><text x="672.8" y="138.895" text-anchor="middle" font-size="11.5" class="fg-q">Не симптом</text><path d="M150.4 116.69L170.4 116.69" class="fg-ln" marker-end="url(#bk-arrow)"/><path d="M296.8 116.69L316.8 116.69" class="fg-ln" marker-end="url(#bk-arrow)"/><path d="M443.2 116.69L463.2 116.69" class="fg-ln" marker-end="url(#bk-arrow)"/><path d="M589.6 116.69L609.6 116.69" class="fg-ln" marker-end="url(#bk-arrow)"/><path d="M672.8 171.38L672.8 195.38L87.2 195.38L87.2 171.38" class="fg-ln fg-dash" marker-end="url(#bk-arrow)"/><text x="380" y="215.38" text-anchor="middle" font-size="11.5" class="fg-q">ошибка не ушла — новый круг</text><text x="24" y="249.38" font-size="11.5" class="fg-q">Что дать ИИ:</text><rect x="112" y="232.38" width="223.699" height="24" rx="12" class="fg-zone"/><text x="223.849" y="248.405" text-anchor="middle" font-size="11.5" class="fg-t">полный текст ошибки и стектрейс</text><rect x="343.699" y="232.38" width="196.339" height="24" rx="12" class="fg-zone"/><text x="441.869" y="248.405" text-anchor="middle" font-size="11.5" class="fg-t">что ожидали и что случилось</text><rect x="548.038" y="232.38" width="134.661" height="24" rx="12" class="fg-zone"/><text x="615.368" y="248.405" text-anchor="middle" font-size="11.5" class="fg-t">что уже пробовали</text><rect x="112" y="264.38" width="145.865" height="24" rx="12" class="fg-zone"/><text x="184.933" y="280.405" text-anchor="middle" font-size="11.5" class="fg-t">недавние изменения</text><rect x="24" y="304.38" width="712" height="64" rx="8" class="fg-riskbox"/><text x="380" y="330.235" text-anchor="middle" font-weight="600" class="fg-t">Запрет «не исправляй код сразу» важен</text><text x="380" y="350.135" text-anchor="middle" font-size="11.5" class="fg-q">Иначе ИИ лечит симптом (добавляет проверку «значение не пришло»), а не выясняет, почему оно не пришло</text></svg>