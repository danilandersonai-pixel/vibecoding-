<svg viewBox="0 0 760 300" role="img" aria-label="Шкала: от вдохновения до копии" font-size="13"><text x="24" y="28" font-size="15" font-weight="600" class="fg-t">Насколько близко к эталону: шкала</text><rect x="24" y="52" width="160" height="136" rx="8" class="fg-okbox"/><text x="104" y="80" text-anchor="middle" font-weight="600" class="fg-t">Вдохновение</text><text x="104" y="124" text-anchor="middle" font-size="11.5" class="fg-q">идея, общий подход</text><text x="104" y="172" text-anchor="middle" font-size="12" font-weight="600" class="fg-okt">безопасно</text><rect x="208" y="52" width="160" height="136" rx="8" class="fg-hi"/><text x="288" y="80" text-anchor="middle" font-weight="600" class="fg-t">Функциональный</text><text x="288" y="98" text-anchor="middle" font-weight="600" class="fg-t">аналог</text><text x="288" y="124" text-anchor="middle" font-size="11.5" class="fg-q">те же возможности,</text><text x="288" y="139" text-anchor="middle" font-size="11.5" class="fg-q">своё лицо</text><text x="288" y="172" text-anchor="middle" font-size="12" font-weight="600" class="fg-acc">цель этой главы</text><rect x="392" y="52" width="160" height="136" rx="8" class="fg-riskzone"/><text x="472" y="80" text-anchor="middle" font-weight="600" class="fg-t">Визуальный</text><text x="472" y="98" text-anchor="middle" font-weight="600" class="fg-t">двойник</text><text x="472" y="124" text-anchor="middle" font-size="11.5" class="fg-q">тот же вид</text><text x="472" y="139" text-anchor="middle" font-size="11.5" class="fg-q">до пикселя</text><text x="472" y="172" text-anchor="middle" font-size="12" font-weight="600" class="fg-riskt">рискованно</text><rect x="576" y="52" width="160" height="136" rx="8" class="fg-riskbox"/><text x="656" y="80" text-anchor="middle" font-weight="600" class="fg-t">Копия</text><text x="656" y="124" text-anchor="middle" font-size="11.5" class="fg-q">чужой код, тексты,</text><text x="656" y="139" text-anchor="middle" font-size="11.5" class="fg-q">логотип, название</text><text x="656" y="172" text-anchor="middle" font-size="12" font-weight="600" class="fg-riskt">нельзя</text><path d="M184 120L208 120" class="fg-ln" marker-end="url(#bk-arrow)"/><path d="M368 120L392 120" class="fg-ln" marker-end="url(#bk-arrow)"/><path d="M552 120L576 120" class="fg-ln" marker-end="url(#bk-arrow)"/><path d="M24 212L736 212" class="fg-ln" marker-end="url(#bk-arrow)"/><text x="24" y="232" font-size="11.5" class="fg-q">свободно: идеи и поведение</text><text x="736" y="232" text-anchor="end" font-size="11.5" class="fg-q">запрещено: чужое исполнение</text><text x="380" y="274" text-anchor="middle" font-size="12" class="fg-q">Берите поведение и идеи. Код, тексты, картинки, название и узнаваемый облик — только свои.</text></svg>