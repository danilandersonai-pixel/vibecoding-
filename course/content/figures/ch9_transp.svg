<svg viewBox="0 0 760 376" role="img" aria-label="Прозрачность: где важно говорить о роли ИИ" font-size="13"><text x="24" y="28" font-size="15" font-weight="600" class="fg-t">Прозрачность: где важно говорить о роли ИИ</text><rect x="240" y="54" width="280" height="64" rx="8" class="fg-hi"/><text x="380" y="79.855" text-anchor="middle" font-weight="600" class="fg-t">Роль ИИ в работе</text><text x="380" y="99.755" text-anchor="middle" font-size="11.5" class="fg-q">Честно сказать, что делал ИИ, а что вы</text><rect x="24" y="168" width="166" height="116" rx="8" class="fg-box"/><text x="107" y="211.92" text-anchor="middle" font-weight="600" class="fg-t">В команде</text><text x="107" y="231.82" text-anchor="middle" font-size="11.5" class="fg-q">Метка в коммите или</text><text x="107" y="247.69" text-anchor="middle" font-size="11.5" class="fg-q">пул-реквесте</text><rect x="206" y="168" width="166" height="116" rx="8" class="fg-box"/><text x="289" y="211.92" text-anchor="middle" font-weight="600" class="fg-t">В открытом коде</text><text x="289" y="231.82" text-anchor="middle" font-size="11.5" class="fg-q">У проектов свои</text><text x="289" y="247.69" text-anchor="middle" font-size="11.5" class="fg-q">правила, иногда запрет</text><rect x="388" y="168" width="166" height="116" rx="8" class="fg-box"/><text x="471" y="195.535" text-anchor="middle" font-weight="600" class="fg-t">В учёбе и на</text><text x="471" y="212.435" text-anchor="middle" font-weight="600" class="fg-t">собеседованиях</text><text x="471" y="232.335" text-anchor="middle" font-size="11.5" class="fg-q">Нельзя выдавать</text><text x="471" y="248.205" text-anchor="middle" font-size="11.5" class="fg-q">сгенерированное за</text><text x="471" y="264.075" text-anchor="middle" font-size="11.5" class="fg-q">своё</text><rect x="570" y="168" width="166" height="116" rx="8" class="fg-box"/><text x="653" y="211.92" text-anchor="middle" font-weight="600" class="fg-t">Перед заказчиком</text><text x="653" y="231.82" text-anchor="middle" font-size="11.5" class="fg-q">Если договор касается</text><text x="653" y="247.69" text-anchor="middle" font-size="11.5" class="fg-q">способа работы</text><path d="M380 118L380 142L107 142L107 168" class="fg-ln" marker-end="url(#bk-arrow)"/><path d="M380 118L380 142L289 142L289 168" class="fg-ln" marker-end="url(#bk-arrow)"/><path d="M380 118L380 142L471 142L471 168" class="fg-ln" marker-end="url(#bk-arrow)"/><path d="M380 118L380 142L653 142L653 168" class="fg-ln" marker-end="url(#bk-arrow)"/><rect x="24" y="308" width="712" height="52" rx="10" class="fg-okbox"/><text x="380" y="339" text-anchor="middle" font-size="12.5" font-weight="600" class="fg-t">Простое правило: если спросят, как вы это сделали, — ответьте без смущения</text></svg>