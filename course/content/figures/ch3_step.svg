<svg viewBox="0 0 760 362" role="img" aria-label="Один безопасный шаг: как не потерять рабочую версию" font-size="13"><text x="24" y="28" font-size="15" font-weight="600" class="fg-t">Один безопасный шаг: как не потерять рабочую версию</text><rect x="24" y="62" width="160" height="110.41" rx="8" class="fg-box"/><text x="104" y="95.19" text-anchor="middle" font-weight="600" class="fg-t">Сохраниться</text><text x="104" y="115.09" text-anchor="middle" font-size="11.5" class="fg-q">Коммит с текущей</text><text x="104" y="130.96" text-anchor="middle" font-size="11.5" class="fg-q">рабочей версией</text><text x="104" y="146.83" text-anchor="middle" font-size="11.5" class="fg-q">(правило 3)</text><rect x="208" y="62" width="160" height="110.41" rx="8" class="fg-box"/><text x="288" y="86.74" text-anchor="middle" font-weight="600" class="fg-t">Маленькая</text><text x="288" y="103.64" text-anchor="middle" font-weight="600" class="fg-t">просьба</text><text x="288" y="123.54" text-anchor="middle" font-size="11.5" class="fg-q">Одна задача — один</text><text x="288" y="139.41" text-anchor="middle" font-size="11.5" class="fg-q">проверяемый</text><text x="288" y="155.28" text-anchor="middle" font-size="11.5" class="fg-q">результат (правило 2)</text><rect x="392" y="62" width="160" height="110.41" rx="8" class="fg-box"/><text x="472" y="95.19" text-anchor="middle" font-weight="600" class="fg-t">Проверить</text><text x="472" y="115.09" text-anchor="middle" font-size="11.5" class="fg-q">По способу,</text><text x="472" y="130.96" text-anchor="middle" font-size="11.5" class="fg-q">записанному заранее</text><text x="472" y="146.83" text-anchor="middle" font-size="11.5" class="fg-q">(правило 4)</text><rect x="576" y="62" width="160" height="110.41" rx="8" class="fg-box"/><text x="656" y="86.74" text-anchor="middle" font-weight="600" class="fg-t">Просмотреть</text><text x="656" y="103.64" text-anchor="middle" font-weight="600" class="fg-t">изменения</text><text x="656" y="123.54" text-ancho