<svg viewBox="0 0 760 254" role="img" aria-label="Контекстное окно — рабочий стол модели" font-size="13"><text x="24" y="28" font-size="15" font-weight="600" class="fg-t">Контекстное окно — рабочий стол модели</text><rect x="24" y="52" width="548" height="186" rx="10" class="fg-box"/><text x="42" y="78" font-weight="600" class="fg-t">Контекстное окно</text><text x="182" y="78" font-size="11.5" class="fg-q">всё, что модель видит прямо сейчас</text><rect x="42" y="98" width="88" height="56" rx="8" class="fg-hi"/><text x="86" y="122.16" text-anchor="middle" font-size="12" font-weight="600" class="fg-t">Ваш</text><text x="86" y="137.76" text-anchor="middle" font-size="12" font-weight="600" class="fg-t">запрос</text><rect x="136" y="98" width="118" height="56" rx="8" class="fg-box"/><text x="195" y="122.16" text-anchor="middle" font-size="12" font-weight="600" class="fg-t">Прежняя</text><text x="195" y="137.76" text-anchor="middle" font-size="12" font-weight="600" class="fg-t">переписка</text><rect x="260" y="98" width="106" height="56" rx="8" class="fg-box"/><text x="313" y="122.16" text-anchor="middle" font-size="12" font-weight="600" class="fg-t">Открытые</text><text x="313" y="137.76" text-anchor="middle" font-size="12" font-weight="600" class="fg-t">файлы</text><rect x="372" y="98" width="106" height="56" rx="8" class="fg-box"/><text x="425" y="122.16" text-anchor="middle" font-size="12" font-weight="600" class="fg-t">Результаты</text><text x="425" y="137.76" text-anchor="middle" font-size="12" font-weight="600" class="fg-t">команд</text><rect x="484" y="98" width="70" height="56" rx="8" class="fg-ghost"/><text x="519" y="130" text-anchor="middle" font-size="11" class="fg-q">свободно</text><rect x="42" y="174" width="30" height="16" rx="4" class="fg-box"/><rect x="76" y="174" width="22" height="16" rx="4" class="fg-box"/><rect x="102" y="174" width="36" height="16" rx="4" class="fg-box"/><rect x="142" y="174" width="26" height="16" rx="4" class="fg-box"/><rect x="172" y="174" width="30" height="16" rx="4" class="fg-box"/><rect x="206" y="174" width="24" height="16" rx="4" class="fg-box"/><rect x="234" y="174" width="34" height="16" rx="4" class="fg-box"/><rect x="272" y="174" width="22" height="16" rx="4" class="fg-box"/><rect x="298" y="174" width="28" height="16" rx="4" class="fg-box"/><rect x="330" y="174" width="36" height="16" rx="4" class="fg-box"/><rect x="370" y="174" width="24" height="16" rx="4" class="fg-box"/><rect x="398" y="174" width="30" height="16" rx="4" class="fg-box"/><text x="42" y="210" font-size="11.5" class="fg-q">Токен — кусочек текста, из которых модель складывает слова. Окно измеряется в</text><text x="42" y="225.18" font-size="11.5" class="fg-q">токенах, от них зависят цена и лимиты.</text><rect x="596" y="52" width="140" height="186" rx="8" class="fg-ghost"/><text x="666" y="93.66" text-anchor="middle" font-weight="600" class="fg-t">Не поместилось</text><text x="666" y="113.56" text-anchor="middle" font-size="11" class="fg-q">Остальные файлы</text><text x="666" y="128.74" text-anchor="middle" font-size="11" class="fg-q">проекта и старая</text><text x="666" y="143.92" text-anchor="middle" font-size="11" class="fg-q">переписка. Модель</text><text x="666" y="159.1" text-anchor="middle" font-size="11" class="fg-q">их не видит и</text><text x="666" y="174.28" text-anchor="middle" font-size="11" class="fg-q">достраивает по</text><text x="666" y="189.46" text-anchor="middle" font-size="11" class="fg-q">аналогии с чужими</text><text x="666" y="204.64" text-anchor="middle" font-size="11" class="fg-q">проектами</text><path d="M572 145L596 145" class="fg-ln fg-dash"/></svg>