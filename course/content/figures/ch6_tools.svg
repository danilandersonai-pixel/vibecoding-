<svg viewBox="0 0 760 393" role="img" aria-label="Какой инструмент для прототипа выбрать" font-size="13"><text x="24" y="28" font-size="15" font-weight="600" class="fg-t">Какой инструмент для прототипа выбрать</text><rect x="24" y="52" width="166" height="60" rx="8" class="fg-hi"/><text x="107" y="78" text-anchor="middle" font-size="12.5" font-weight="600" class="fg-t">Конструктор</text><text x="107" y="94.25" text-anchor="middle" font-size="12.5" font-weight="600" class="fg-t">приложений</text><text x="24" y="134" font-size="11" font-weight="600" class="fg-okt">Когда</text><rect x="24" y="142" width="166" height="84" rx="8" class="fg-okbox"/><text x="107" y="172.845" text-anchor="middle" font-size="11.5" class="fg-t">Идея с</text><text x="107" y="187.795" text-anchor="middle" font-size="11.5" class="fg-t">пользователями за</text><text x="107" y="202.745" text-anchor="middle" font-size="11.5" class="fg-t">день, хостинг сразу</text><text x="24" y="248" font-size="11" font-weight="600" class="fg-riskt">Ограничение</text><rect x="24" y="256" width="166" height="84" rx="8" class="fg-riskbox"/><text x="107" y="301.795" text-anchor="middle" font-size="11.5" class="fg-t">Привязка к платформе</text><rect x="206" y="52" width="166" height="60" rx="8" class="fg-hi"/><text x="289" y="86.125" text-anchor="middle" font-size="12.5" font-weight="600" class="fg-t">Дизайн-холст</text><text x="206" y="134" font-size="11" font-weight="600" class="fg-okt">Когда</text><rect x="206" y="142" width="166" height="84" rx="8" class="fg-okbox"/><text x="289" y="180.32" text-anchor="middle" font-size="11.5" class="fg-t">Проверить интерфейс</text><text x="289" y="195.27" text-anchor="middle" font-size="11.5" class="fg-t">и сценарий до кода</text><text x="206" y="248" font-size="11" font-weight="600" class="fg-riskt">Ограничение</text><rect x="206" y="256" width="166" height="84" rx="8" class="fg-riskbox"/><text x="289" y="286.845" text-anchor="middle" font-size="11.5" class="fg-t">Не проверяет,</text><text x="289" y="301.795" text-anchor="middle" font-size="11.5" class="fg-t">реализуемо ли</text><text x="289" y="316.745" text-anchor="middle" font-size="11.5" class="fg-t">технически</text><rect x="388" y="52" width="166" height="60" rx="8" class="fg-hi"/><text x="471" y="86.125" text-anchor="middle" font-size="12.5" font-weight="600" class="fg-t">Терминальный агент</text><text x="388" y="134" font-size="11" font-weight="600" class="fg-okt">Когда</text><rect x="388" y="142" width="166" height="84" rx="8" class="fg-okbox"/><text x="471" y="172.845" text-anchor="middle" font-size="11.5" class="fg-t">Прототип, который</text><text x="471" y="187.795" text-anchor="middle" font-size="11.5" class="fg-t">может стать</text><text x="471" y="202.745" text-anchor="middle" font-size="11.5" class="fg-t">продуктом</text><text x="388" y="248" font-size="11" font-weight="600" class="fg-riskt">Ограничение</text><rect x="388" y="256" width="166" height="84" rx="8" class="fg-riskbox"/><text x="471" y="294.32" text-anchor="middle" font-size="11.5" class="fg-t">Нужны навыки работы</text><text x="471" y="309.27" text-anchor="middle" font-size="11.5" class="fg-t">с проектом</text><rect x="570" y="52" width="166" height="60" rx="8" class="fg-hi"/><text x="653" y="86.125" text-anchor="middle" font-size="12.5" font-weight="600" class="fg-t">Ноутбук и скрипт</text><text x="570" y="134" font-size="11" font-weight="600" class="fg-okt">Когда</text><rect x="570" y="142" width="166" height="84" rx="8" class="fg-okbox"/><text x="653" y="180.32" text-anchor="middle" font-size="11.5" class="fg-t">Проверить данные,</text><text x="653" y="195.27" text-anchor="middle" font-size="11.5" class="fg-t">алгоритм, скорость</text><text x="570" y="248" font-size="11" font-weight="600" class="fg-riskt">Ограничение</text><rect x="570" y="256" width="166" height="84" rx="8" class="fg-riskbox"/><text x="653" y="294.32" text-anchor="middle" font-size="11.5" class="fg-t">Нет интерфейса для</text><text x="653" y="309.27" text-anchor="middle" font-size="11.5" class="fg-t">людей</text><text x="24" y="372" font-size="11.5" class="fg-q">Совсем новичку проще начать с конструктора или холста, потом перейти к агенту.</text></svg>