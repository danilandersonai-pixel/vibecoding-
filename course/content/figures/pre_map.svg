<svg viewBox="0 0 760 302" role="img" aria-label="Карта книги: с чего начать и куда идти" font-size="13"><text x="24" y="28" font-size="15" font-weight="600" class="fg-t">Карта книги: с чего начать и куда идти</text><rect x="24.0" y="64" width="122" height="116" rx="8" class="fg-hi"/><text x="85.0" y="88" text-anchor="middle" font-weight="600" class="fg-t">Азбука</text><text x="85.0" y="109" text-anchor="middle" font-size="11" class="fg-q">Слова и устройство</text><text x="85.0" y="124" text-anchor="middle" font-size="11" class="fg-q">приложения.</text><text x="85.0" y="139" text-anchor="middle" font-size="11" class="fg-q">Если всё знакомо,</text><text x="85.0" y="154" text-anchor="middle" font-size="11" class="fg-q">листайте дальше</text><path d="M85.0 180L85.0 224" class="fg-ln fg-dash fg-dots"/><rect x="171.5" y="64" width="122" height="116" rx="8" class="fg-box"/><text x="232.5" y="88" text-anchor="middle" font-weight="600" class="fg-t">Часть I</text><text x="232.5" y="105" text-anchor="middle" font-weight="600" class="fg-t">Основы</text><text x="232.5" y="126" text-anchor="middle" font-size="11" class="fg-q">Главы 1–2:</text><text x="232.5" y="141" text-anchor="middle" font-size="11" class="fg-q">вайб-кодинг</text><text x="232.5" y="156" text-anchor="middle" font-size="11" class="fg-q">и запросы</text><path d="M146.0 122.0L171.5 122.0" class="fg-ln" marker-end="url(#bk-arrow)"/><path d="M232.5 180L232.5 224" class="fg-ln fg-dash fg-dots"/><rect x="319.0" y="64" width="122" height="116" rx="8" class="fg-box"/><text x="380.0" y="88" text-anchor="middle" font-weight="600" class="fg-t">Часть II</text><text x="380.0" y="105" text-anchor="middle" font-weight="600" class="fg-t">Практика</text><text x="380.0" y="126" text-anchor="middle" font-size="11" class="fg-q">Главы 3–7:</text><text x="380.0" y="141" text-anchor="middle" font-size="11" class="fg-q">проверка кода,</text><text x="380.0" y="156" text-anchor="middle" font-size="11" class="fg-q">прототип, сайт</text><path d="M293.5 122.0L319.0 122.0" class="fg-ln" marker-end="url(#bk-arrow)"/><path d="M380.0 180L380.0 224" class="fg-ln fg-dash fg-dots"/><rect x="466.5" y="64" width="122" height="116" rx="8" class="fg-box"/><text x="527.5" y="88" text-anchor="middle" font-weight="600" class="fg-t">Часть III</text><text x="527.5" y="105" text-anchor="middle" font-weight="600" class="fg-t">Доверие</text><text x="527.5" y="126" text-anchor="middle" font-size="11" class="fg-q">Главы 8–11:</text><text x="527.5" y="141" text-anchor="middle" font-size="11" class="fg-q">безопасность,</text><text x="527.5" y="156" text-anchor="middle" font-size="11" class="fg-q">этика, агенты</text><path d="M441.0 122.0L466.5 122.0" class="fg-ln" marker-end="url(#bk-arrow)"/><path d="M527.5 180L527.5 224" class="fg-ln fg-dash fg-dots"/><rect x="614.0" y="64" width="122" height="116" rx="8" class="fg-box"/><text x="675.0" y="88" text-anchor="middle" font-weight="600" class="fg-t">Часть IV</text><text x="675.0" y="105" text-anchor="middle" font-weight="600" class="fg-t">Практикум</text><text x="675.0" y="126" text-anchor="middle" font-size="11" class="fg-q">Глава 12:</text><text x="675.0" y="141" text-anchor="middle" font-size="11" class="fg-q">обратная</text><text x="675.0" y="156" text-anchor="middle" font-size="11" class="fg-q">инженерия</text><path d="M588.5 122.0L614.0 122.0" class="fg-ln" marker-end="url(#bk-arrow)"/><path d="M675.0 180L675.0 224" class="fg-ln fg-dash fg-dots"/><rect x="24" y="224" width="712" height="62" rx="8" class="fg-zone"/><text x="380" y="249" text-anchor="middle" font-weight="600" class="fg-t">Словарь терминов и алфавитный указатель</text><text x="380" y="269" text-anchor="middle" font-size="11.5" class="fg-q">в конце книги: загляните сюда, когда встретите незнакомое слово</text></svg>