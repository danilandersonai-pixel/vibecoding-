<svg viewBox="0 0 760 336" role="img" aria-label="Как вайб-кодинг меняет индустрию" font-size="13"><text x="24" y="28" font-size="15" font-weight="600" class="fg-t">Как вайб-кодинг меняет индустрию</text><rect x="24" y="56" width="226.667" height="77.64" rx="8" class="fg-box"/><text x="137.333" y="80.74" text-anchor="middle" font-weight="600" class="fg-t">Взрыв количества программ</text><text x="137.333" y="100.64" text-anchor="middle" font-size="11.5" class="fg-q">Личные инструменты, утилиты</text><text x="137.333" y="116.51" text-anchor="middle" font-size="11.5" class="fg-q">«для одного пользователя»</text><rect x="266.667" y="56" width="226.667" height="77.64" rx="8" class="fg-box"/><text x="380" y="80.74" text-anchor="middle" font-weight="600" class="fg-t">Найм и обучение</text><text x="380" y="100.64" text-anchor="middle" font-size="11.5" class="fg-q">От новичка ждут работы с ИИ и</text><text x="380" y="116.51" text-anchor="middle" font-size="11.5" class="fg-q">проверки результата</text><rect x="509.333" y="56" width="226.667" height="77.64" rx="8" class="fg-box"/><text x="622.667" y="80.74" text-anchor="middle" font-weight="600" class="fg-t">Вкус и суждение</text><text x="622.667" y="100.64" text-anchor="middle" font-size="11.5" class="fg-q">Когда делать дёшево, важно</text><text x="622.667" y="116.51" text-anchor="middle" font-size="11.5" class="fg-q">понимать, что делать</text><rect x="24" y="149.64" width="226.667" height="77.64" rx="8" class="fg-box"/><text x="137.333" y="174.38" text-anchor="middle" font-weight="600" class="fg-t">Новые компании</text><text x="137.333" y="194.28" text-anchor="middle" font-size="11.5" class="fg-q">Малые команды строят то, что</text><text x="137.333" y="210.15" text-anchor="middle" font-size="11.5" class="fg-q">требовало десятков людей</text><rect x="266.667" y="149.64" width="226.667" height="77.64" rx="8" class="fg-riskbox"/><text x="380" y="174.38" text-anchor="middle" font-weight="600" class="fg-t">Волна уязвимого ПО</text><text x="380" y="194.28" text-anchor="middle" font-size="11.5" class="fg-q">Много кода, который никто не</text><text x="380" y="210.15" text-anchor="middle" font-size="11.5" class="fg-q">проверял</text><rect x="24" y="249.28" width="712" height="70" rx="8" class="fg-hi"/><text x="380" y="278.135" text-anchor="middle" font-weight="600" class="fg-t">Ваше преимущество</text><text x="380" y="298.035" text-anchor="middle" font-size="11.5" class="fg-q">Не скорость генерации, а то, что вы понимаете, проверяете и отвечаете за результат</text></svg>