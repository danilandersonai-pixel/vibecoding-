<svg viewBox="0 0 760 328" role="img" aria-label="Проверка клавиатурой: можно ли пройти форму без мыши" font-size="13"><text x="24" y="28" font-size="15" font-weight="600" class="fg-t">Проверка клавиатурой: можно ли пройти форму без мыши</text><rect x="24" y="52" width="470" height="260" rx="8" class="fg-win"/><path d="M24 78V60Q24 52 32 52H486Q494 52 494 60V78Z" class="fg-bar"/><circle cx="38" cy="65" r="3.5" class="fg-dot"/><circle cx="51" cy="65" r="3.5" class="fg-dot"/><circle cx="64" cy="65" r="3.5" class="fg-dot"/><text x="259" y="69" text-anchor="middle" font-size="11" class="fg-q">Форма входа</text><text x="44" y="102" font-size="14" font-weight="600" class="fg-t">Вход для сотрудников</text><text x="44" y="130" font-size="11.5" class="fg-q">Email</text><rect x="44" y="138" width="300" height="30" rx="6" class="fg-hi"/><text x="56" y="158" font-size="12" class="fg-t">anna@example.com</text><text x="44" y="190" font-size="11.5" class="fg-q">Пароль</text><rect x="44" y="198" width="300" height="30" rx="6" class="fg-box"/><rect x="44" y="246" width="110" height="32" rx="8" class="fg-box"/><text x="99" y="267" text-anchor="middle" font-size="12.5" font-weight="600" class="fg-t">Войти</text><circle cx="366" cy="153" r="10" class="fg-tier"/><text x="366" y="157" text-anchor="middle" font-size="12" font-weight="600" class="fg-on">1</text><circle cx="366" cy="213" r="10" class="fg-tier"/><text x="366" y="217" text-anchor="middle" font-size="12" font-weight="600" class="fg-on">2</text><circle cx="176" cy="262" r="10" class="fg-tier"/><text x="176" y="266" text-anchor="middle" font-size="12" font-weight="600" class="fg-on">3</text><circle cx="530" cy="71" r="10" class="fg-tier"/><text x="530" y="75" text-anchor="middle" font-size="12" font-weight="600" class="fg-on">1</text><text x="548" y="75" font-size="12" class="fg-q">Уберите руку с мыши. Tab</text><text x="548" y="90.84" font-size="12" class="fg-q">переводит на следующее</text><text x="548" y="106.68" font-size="12" class="fg-q">поле, Enter нажимает кнопку</text><circle cx="530" cy="136.52" r="10" class="fg-tier"/><text x="530" y="140.52" text-anchor="middle" font-size="12" font-weight="600" class="fg-on">2</text><text x="548" y="140.52" font-size="12" class="fg-q">Фокус должен быть виден и</text><text x="548" y="156.36" font-size="12" class="fg-q">идти по порядку: сверху вниз</text><circle cx="530" cy="186.2" r="10" class="fg-tier"/><text x="530" y="190.2" text-anchor="middle" font-size="12" font-weight="600" class="fg-on">3</text><text x="548" y="190.2" font-size="12" class="fg-q">Если фокус пропадает или</text><text x="548" y="206.04" font-size="12" class="fg-q">кнопку не нажать, попросите</text><text x="548" y="221.88" font-size="12" class="fg-q">ИИ исправить</text></svg>