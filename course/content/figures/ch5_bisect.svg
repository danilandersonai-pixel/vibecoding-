r="middle" font-size="12" font-weight="600" class="fg-on">3</text><circle cx="334" cy="164" r="13" class="fg-ok"/><text x="334" y="168.5" text-anchor="middle" font-size="12" font-weight="600" class="fg-on">4</text><circle cx="422" cy="164" r="13" class="fg-solid"/><text x="422" y="168.5" text-anchor="middle" font-size="12" font-weight="600" class="fg-t">5</text><circle cx="510" cy="164" r="13" class="fg-tier"/><text x="510" y="168.5" text-anchor="middle" font-size="12" font-weight="600" class="fg-on">6</text><circle cx="598" cy="164" r="13" class="fg-solid"/><text x="598" y="168.5" text-anchor="middle" font-size="12" font-weight="600" class="fg-t">7</text><circle cx="686" cy="164" r="13" class="fg-risk"/><text x="686" y="168.5" text-anchor="middle" font-size="12" font-weight="600" class="fg-on">8</text><text x="24" y="200" font-size="12" class="fg-q">Шаг 2. Коммит 4 хороший, значит сломалось позже. Проверяем коммит 6.</text><path d="M40 250L716 250" class="fg-ln"/><circle cx="70" cy="250" r="13" class="fg-ok"/><text x="70" y="254.5" text-anchor="middle" font-size="12" font-weight="600" class="fg-on">1</text><circle cx="158" cy="250" r="13" class="fg-ok"/><text x="158" y="254.5" text-anchor="middle" font-size="12" font-weight="600" class="fg-on">2</text><circle cx="246" cy="250" r="13" class="fg-ok"/><text x="246" y="254.5" text-anchor="middle" font-size="12" font-weight="600" class="fg-on">3</text><circle cx="334" cy="250" r="13" class="fg-ok"/><text x="334" y="254.5" text-anchor="middle" font-size="12" font-weight="600" class="fg-on">4</text><circle cx="422" cy="250" r="13" class="fg-ok"/><text x="422" y="254.5" text-anchor="middle" font-size="12" font-weight="600" class="fg-on">5</text><circle cx="510" cy="250" r="13" class="fg-ok"/><text x="510" y="254.5" text-anchor="middle" font-size="12" font-weight="600" class="fg-on">6</text><circle cx="598" cy="250" r="13" class="fg-tier"/><text x="598" y="254.5" text-anchor="middle" font-size="12" font-weight="600" class="fg-on">7</text><circle cx="686" cy="250" r="13" class="fg-risk"/><text x="686" y="254.5" text-anchor="middle" font-size="12" font-weight="600" class="fg-on">8</text><text x="24" y="286" font-size="12" class="fg-q">Шаг 3. Коммит 6 хороший. Остался один кандидат — проверяем коммит 7.</text><rect x="24" y="308" width="712" height="80" rx="8" class="fg-hi"/><text x="380" y="333.92" text-anchor="middle" font-weight="600" class="fg-t">Коммит 7 — первый плохой: поломка появилась в нём</text><text x="380" y="353.82" text-anchor="middle" font-size="11.5" class="fg-q">Команда git bisect делает такой поиск сама, вы только отвечаете «хорошо» или «плохо». ИИ поможет её</text><text x="380" y="369.69" text-anchor="middle" font-size="11.5" class="fg-q">запустить.</text></svg>