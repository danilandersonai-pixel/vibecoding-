<svg viewBox="0 0 760 303" role="img" aria-label="Терминал: вы пишете команду — компьютер отвечает" font-size="13"><text x="24" y="28" font-size="15" font-weight="600" class="fg-t">Терминал: вы пишете команду — компьютер отвечает</text><rect x="24" y="52" width="440" height="158" rx="8" class="fg-term"/><path d="M24 78V60Q24 52 32 52H456Q464 52 464 60V78Z" class="fg-tbar"/><circle cx="38" cy="65" r="3.5" class="fg-tdim"/><circle cx="51" cy="65" r="3.5" class="fg-tdim"/><circle cx="64" cy="65" r="3.5" class="fg-tdim"/><text x="244" y="69" text-anchor="middle" font-size="11" class="fg-tdim">Терминал</text><text x="38" y="103.5" font-size="11.5" class="fg-tp fg-mono" xml:space="preserve">$</text><text x="51.846" y="103.5" font-size="11.5" class="fg-tt fg-mono" xml:space="preserve">pwd</text><text x="38" y="121.5" font-size="11.5" class="fg-tdim fg-mono" xml:space="preserve">/Users/anna/my-site</text><text x="38" y="139.5" font-size="11.5" class="fg-tp fg-mono" xml:space="preserve">$</text><text x="51.846" y="139.5" font-size="11.5" class="fg-tt fg-mono" xml:space="preserve">ls</text><text x="38" y="157.5" font-size="11.5" class="fg-tdim fg-mono" xml:space="preserve">index.html  style.css  README.md</text><text x="38" y="175.5" font-size="11.5" class="fg-tp fg-mono" xml:space="preserve">$</text><text x="51.846" y="175.5" font-size="11.5" class="fg-tt fg-mono" xml:space="preserve">npm run dev</text><text x="38" y="193.5" font-size="11.5" class="fg-tok fg-mono" xml:space="preserve">Ready: http://localhost:3000</text><circle cx="444" cy="99.475" r="10" class="fg-tier"/><text x="444" y="103.475" text-anchor="middle" font-size="12" font-weight="600" class="fg-on">1</text><circle cx="444" cy="117.475" r="10" class="fg-tier"/><text x="444" y="121.475" text-anchor="middle" font-size="12" font-weight="600" class="fg-on">2</text><circle cx="444" cy="153.475" r="10" class="fg-tier"/><text x="444" y="157.475" text-anchor="middle" font-size="12" font-weight="600" class="fg-on">3</text><circle cx="444" cy="189.475" r="10" class="fg-tier"/><text x="444" y="193.475" text-anchor="middle" font-size="12" font-weight="600" class="fg-on">4</text><circle cx="500" cy="71" r="10" class="fg-tier"/><text x="500" y="75" text-anchor="middle" font-size="12" font-weight="600" class="fg-on">1</text><text x="518" y="75" font-size="12" class="fg-q">Команда стоит после знака $.</text><text x="518" y="90.84" font-size="12" class="fg-q">Здесь pwd отвечает на вопрос</text><text x="518" y="106.68" font-size="12" class="fg-q">«где я?»</text><circle cx="500" cy="134.52" r="10" class="fg-tier"/><text x="500" y="138.52" text-anchor="middle" font-size="12" font-weight="600" class="fg-on">2</text><text x="518" y="138.52" font-size="12" class="fg-q">Нажмите Enter: компьютер</text><text x="518" y="154.36" font-size="12" class="fg-q">выполнит команду и ответит</text><text x="518" y="170.2" font-size="12" class="fg-q">серой строкой</text><circle cx="500" cy="198.04" r="10" class="fg-tier"/><text x="500" y="202.04" text-anchor="middle" font-size="12" font-weight="600" class="fg-on">3</text><text x="518" y="202.04" font-size="12" class="fg-q">Команда ls показывает файлы в</text><text x="518" y="217.88" font-size="12" class="fg-q">текущей папке</text><circle cx="500" cy="245.72" r="10" class="fg-tier"/><text x="500" y="249.72" text-anchor="middle" font-size="12" font-weight="600" class="fg-on">4</text><text x="518" y="249.72" font-size="12" class="fg-q">Зелёная строка: программа</text><text x="518" y="265.56" font-size="12" class="fg-q">запустилась, сайт ждёт по этому</text><text x="518" y="281.4" font-size="12" class="fg-q">адресу</text></svg>