<svg viewBox="0 0 760 262" role="img" aria-label="Роль смещается от набора кода к постановке задач и проверке" font-size="13"><text x="24" y="28" font-size="15" font-weight="600" class="fg-t">Роль смещается от набора кода к постановке задач и проверке</text><path d="M24 56H716" class="fg-ln" marker-end="url(#bk-arrow)"/><text x="716" y="48" text-anchor="end" font-size="11.5" class="fg-q">время</text><text x="102" y="82" text-anchor="middle" font-size="11.5" class="fg-q">до ИИ</text><text x="282" y="82" text-anchor="middle" font-size="11.5" class="fg-q">автодополнение и чат</text><text x="462" y="82" text-anchor="middle" font-size="11.5" class="fg-q">агенты рядом</text><text x="642" y="82" text-anchor="middle" font-size="11.5" class="fg-q">фоновые агенты</text><path d="M180 136H204" class="fg-ln" marker-end="url(#bk-arrow)"/><path d="M360 136H384" class="fg-ln" marker-end="url(#bk-arrow)"/><path d="M540 136H564" class="fg-ln" marker-end="url(#bk-arrow)"/><path d="M102 174V198" class="fg-ln"/><path d="M282 174V198" class="fg-ln"/><path d="M462 174V198" class="fg-ln"/><path d="M642 174V198" class="fg-ln"/><rect x="24" y="98" width="156" height="76" rx="8" class="fg-box"/><text x="102" y="124" text-anchor="middle" font-weight="600" class="fg-t">Автор</text><text x="102" y="142" text-anchor="middle" font-size="11.5" class="fg-q">пишет каждую</text><text x="102" y="158" text-anchor="middle" font-size="11.5" class="fg-q">строку сам</text><rect x="204" y="98" width="156" height="76" rx="8" class="fg-box"/><text x="282" y="124" text-anchor="middle" font-weight="600" class="fg-t">Редактор</text><text x="282" y="142" text-anchor="middle" font-size="11.5" class="fg-q">принимает и правит</text><text x="282" y="158" text-anchor="middle" font-size="11.5" class="fg-q">подсказки ИИ</text><rect x="384" y="98" width="156" height="76" rx="8" class="fg-box"/><text x="462" y="124" text-anchor="middle" font-weight="600" class="fg-t">Постановщик</text><text x="462" y="142" text-anchor="middle" font-size="11.5" class="fg-q">пишет спецификации</text><text x="462" y="158" text-anchor="middle" font-size="11.5" class="fg-q">и проверяет код</text><rect x="564" y="98" width="156" height="76" rx="8" class="fg-hi"/><text x="642" y="124" text-anchor="middle" font-weight="600" class="fg-t">Оркестратор</text><text x="642" y="142" text-anchor="middle" font-size="11.5" class="fg-t">руководит агентами</text><text x="642" y="158" text-anchor="middle" font-size="11.5" class="fg-t">и отвечает за итог</text><rect x="24" y="198" width="696" height="40" rx="8" class="fg-zone fg-zone-edge"/><text x="372" y="223" text-anchor="middle" class="fg-t">Неизменно: ответственность за результат и понимание выпускаемого кода</text></svg>