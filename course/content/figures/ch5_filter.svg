<svg viewBox="0 0 760 260" role="img" aria-label="Автоматические проверки снимают типичный мусор до вас" font-size="13"><text x="24" y="28" font-size="15" font-weight="600" class="fg-t">Автоматические проверки снимают типичный мусор до вас</text><rect x="24" y="60" width="124.8" height="96" rx="8" class="fg-box"/><text x="86.4" y="112.125" text-anchor="middle" font-size="12.5" font-weight="600" class="fg-t">Код от ИИ</text><rect x="170.8" y="60" width="124.8" height="96" rx="8" class="fg-box"/><text x="233.2" y="86.855" text-anchor="middle" font-size="12.5" font-weight="600" class="fg-t">Линтер</text><text x="233.2" y="106.105" text-anchor="middle" font-size="11" class="fg-q">Типичные</text><text x="233.2" y="121.285" text-anchor="middle" font-size="11" class="fg-q">ошибки и</text><text x="233.2" y="136.465" text-anchor="middle" font-size="11" class="fg-q">неряшливость</text><rect x="317.6" y="60" width="124.8" height="96" rx="8" class="fg-box"/><text x="380" y="102.035" text-anchor="middle" font-size="12.5" font-weight="600" class="fg-t">Форматтер</text><text x="380" y="121.285" text-anchor="middle" font-size="11" class="fg-q">Единый вид кода</text><rect x="464.4" y="60" width="124.8" height="96" rx="8" class="fg-box"/><text x="526.8" y="93.91" text-anchor="middle" font-size="12.5" font-weight="600" class="fg-t">Проверка</text><text x="526.8" y="110.16" text-anchor="middle" font-size="12.5" font-weight="600" class="fg-t">типов</text><text x="526.8" y="129.41" text-anchor="middle" font-size="11" class="fg-q">Число или текст</text><rect x="611.2" y="60" width="124.8" height="96" rx="8" class="fg-hi"/><text x="673.6" y="94.445" text-anchor="middle" font-size="12.5" font-weight="600" class="fg-t">Человек</text><text x="673.6" y="113.695" text-anchor="middle" font-size="11" class="fg-q">Читает то, что</text><text x="673.6" y="128.875" text-anchor="middle" font-size="11" class="fg-q">осталось</text><path d="M148.8 108L170.8 108" class="fg-ln" marker-end="url(#bk-arrow)"/><path d="M295.6 108L317.6 108" class="fg-ln" marker-end="url(#bk-arrow)"/><path d="M442.4 108L464.4 108" class="fg-ln" marker-end="url(#bk-arrow)"/><path d="M589.2 108L611.2 108" class="fg-ln" marker-end="url(#bk-arrow)"/><rect x="24" y="184" width="712" height="60" rx="10" class="fg-zone"/><text x="380" y="210" text-anchor="middle" font-size="12.5" font-weight="600" class="fg-t">Настройте это в CI до того, как хлынет поток сгенерированного кода:</text><text x="380" y="230" text-anchor="middle" font-size="12" class="fg-q">проверки запускаются сами при каждом изменении, а ваше внимание остаётся для смысла</text></svg>