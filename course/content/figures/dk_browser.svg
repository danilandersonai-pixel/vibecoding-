 font-size="11" class="fg-t">Terminal</text><text x="208" y="110" font-size="11" class="fg-q">Запустил сайт и открыл</text><text x="208" y="126" font-size="11" class="fg-q">форму входа. Проверяю.</text><rect x="204" y="248" width="172" height="40" rx="8" class="fg-box"/><text x="216" y="272" font-size="11" class="fg-q">Что сделать дальше?</text><rect x="390" y="90" width="336" height="204" rx="8" class="fg-box"/><text x="402" y="110" font-size="11" font-weight="600" class="fg-t">Browser</text><rect x="629.98" y="96" width="84.02" height="20" rx="10" class="fg-bar"/><text x="671.99" y="109.5" text-anchor="middle" font-size="10" class="fg-t">Dev servers ▾</text><rect x="400" y="122" width="316" height="20" rx="10" class="fg-bar"/><text x="412" y="136" font-size="10.5" class="fg-t fg-mono" xml:space="preserve">localhost:3000</text><circle cx="700" cy="132" r="6" class="fg-hi"/><rect x="402" y="152" width="312" height="128" rx="6" class="fg-box"/><rect x="416" y="166" width="171.6" height="12" rx="3" class="fg-bar"/><rect x="416" y="188" width="284" height="7" rx="3" class="fg-line"/><rect x="416" y="201" width="252" height="7" rx="3" class="fg-line"/><rect x="416" y="220" width="78" height="26" rx="6" class="fg-tier"/><text x="455" y="236.85" text-anchor="middle" font-size="11" font-weight="600" class="fg-on">Войти</text><rect x="410" y="214" width="90" height="38" rx="5" class="fg-hi"/><circle cx="703.52" cy="64" r="10" class="fg-tier"/><text x="703.52" y="68" text-anchor="middle" font-size="12" font-weight="600" class="fg-on">1</text><circle cx="615.98" cy="106" r="10" class="fg-tier"/><text x="615.98" y="110" text-anchor="middle" font-size="12" font-weight="600" class="fg-on">2</text><circle cx="674" cy="132" r="10" class="fg-tier"/><text x="674" y="136" text-anchor="middle" font-size="12" font-weight="600" class="fg-on">3</text><circle cx="524" cy="233" r="10" class="fg-tier"/><text x="524" y="237" text-anchor="middle" font-size="12" font-weight="600" class="fg-on">4</text><circle cx="370" cy="134" r="10" class="fg-tier"/><text x="370" y="138" text-anchor="middle" font-size="12" font-weight="600" class="fg-on">5</text><circle cx="34" cy="328" r="10" class="fg-tier"/><text x="34" y="332" text-anchor="middle" font-size="12" font-weight="600" class="fg-on">1</text><text x="52" y="332" font-size="12" class="fg-q">Кнопка Browser в шапке сессии открывает</text><text x="52" y="347.84" font-size="12" class="fg-q">панель с сайтом (Ctrl + Shift + B).</text><circle cx="34" cy="375.68" r="10" class="fg-tier"/><text x="34" y="379.68" text-anchor="middle" font-size="12" font-weight="600" class="fg-on">2</text><text x="52" y="379.68" font-size="12" class="fg-q">Меню Dev servers запускает и останавливает</text><text x="52" y="395.52" font-size="12" class="fg-q">серверы проекта: Claude обычно делает это сам.</text><circle cx="34" cy="423.36" r="10" class="fg-tier"/><text x="34" y="427.36" text-anchor="middle" font-size="12" font-weight="600" class="fg-on">3</text><text x="52" y="427.36" font-size="12" class="fg-q">Переключатель выбора элемента (Ctrl + Shift +</text><text x="52" y="443.2" font-size="12" class="fg-q">S): нажмите на него, затем на кнопку на</text><text x="52" y="459.04" font-size="12" class="fg-q">странице.</text><circle cx="404" cy="328" r="10" class="fg-tier"/><text x="404" y="332" text-anchor="middle" font-size="12" font-weight="600" class="fg-on">4</text><text x="422" y="332" font-size="12" class="fg-q">Так вы показываете Claude, что именно править:</text><text x="422" y="347.84" font-size="12" class="fg-q">«сделай вот эту кнопку больше».</text><circle cx="404" cy="375.68" r="10" class="fg-tier"/><text x="404" y="379.68" text-anchor="middle" font-size="12" font-weight="600" class="fg-on">5</text><text x="422" y="379.68" font-size="12" class="fg-q">Claude сам открывает страницу, делает</text><text x="422" y="395.52" font-size="12" class="fg-q">скриншоты, нажимает и заполняет формы,</text><text x="422" y="411.36" font-size="12" class="fg-q">чтобы проверить свою работу.</text></svg>