<svg viewBox="0 0 760 430" role="img" aria-label="Смещение внимания: от строк кода к намерению" font-size="13"><text x="24" y="28" font-size="15" font-weight="600" class="fg-t">Смещение внимания: от строк кода к намерению</text><rect x="24" y="58" width="560" height="80" rx="8" class="fg-hi"/><text x="304" y="91.855" text-anchor="middle" font-weight="600" class="fg-t">Намерение на человеческом языке</text><text x="304" y="111.755" text-anchor="middle" font-size="11.5" class="fg-q">Что нужно и как понять, что готово</text><rect x="64" y="150" width="480" height="80" rx="8" class="fg-box"/><text x="304" y="183.855" text-anchor="middle" font-weight="600" class="fg-t">Спецификации и контракты</text><text x="304" y="203.755" text-anchor="middle" font-size="11.5" class="fg-q">Структурированные требования</text><rect x="104" y="242" width="400" height="80" rx="8" class="fg-okbox"/><text x="304" y="275.855" text-anchor="middle" font-weight="600" class="fg-t">Тесты, типы, доказательства</text><text x="304" y="295.755" text-anchor="middle" font-size="11.5" class="fg-q">Автоматическая проверка условий</text><rect x="144" y="334" width="320" height="80" rx="8" class="fg-box"/><text x="304" y="359.92" text-anchor="middle" font-weight="600" class="fg-t">Код</text><text x="304" y="379.82" text-anchor="middle" font-size="11.5" class="fg-q">Читают реже, но он должен оставаться</text><text x="304" y="395.69" text-anchor="middle" font-size="11.5" class="fg-q">понятным</text><path d="M660 400L660 66" class="fg-ln" marker-end="url(#bk-arrow)"/><text x="672" y="236" font-size="11.5" class="fg-q">внимание</text><text x="672" y="251" font-size="11.5" class="fg-q">человека</text></svg>