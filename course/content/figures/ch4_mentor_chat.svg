<svg viewBox="0 0 760 379" role="img" aria-label="Режим наставника: ИИ задаёт вопросы, а не решает" font-size="13"><text x="24" y="28" font-size="15" font-weight="600" class="fg-t">Режим наставника: ИИ задаёт вопросы, а не решает</text><rect x="236" y="52" width="500" height="73.72" rx="8" class="fg-hi"/><text x="247" y="74.76" font-size="12" font-weight="600" class="fg-t">Вы</text><text x="247" y="91.36" font-size="12" class="fg-q">Я учусь. Не пиши решение, задавай наводящие вопросы. Задача: сумма</text><text x="247" y="107.92" font-size="12" class="fg-q">чисел в списке</text><circle cx="34" cy="88.86" r="10" class="fg-tier"/><text x="34" y="92.86" text-anchor="middle" font-size="12" font-weight="600" class="fg-on">1</text><rect x="56" y="137.72" width="500" height="57.16" rx="8" class="fg-box"/><text x="67" y="160.48" font-size="12" font-weight="600" class="fg-t">ИИ</text><text x="67" y="177.08" font-size="12" class="fg-q">Что должна вернуть функция, если список пустой?</text><circle cx="34" cy="166.3" r="10" class="fg-tier"/><text x="34" y="170.3" text-anchor="middle" font-size="12" font-weight="600" class="fg-on">2</text><rect x="236" y="206.88" width="500" height="57.16" rx="8" class="fg-hi"/><text x="247" y="229.64" font-size="12" font-weight="600" class="fg-t">Вы</text><text x="247" y="246.24" font-size="12" class="fg-q">Ноль?</text><circle cx="34" cy="235.46" r="10" class="fg-tier"/><text x="34" y="239.46" text-anchor="middle" font-size="12" font-weight="600" class="fg-on">3</text><rect x="56" y="276.04" width="500" height="57.16" rx="8" class="fg-box"/><text x="67" y="298.8" font-size="12" font-weight="600" class="fg-t">ИИ</text><text x="67" y="315.4" font-size="12" class="fg-q">Верно. А если в списке одно число? Что вернёт функция?</text><circle cx="34" cy="304.62" r="10" class="fg-tier"/><text x="34" y="308.62" text-anchor="middle" font-size="12" font-weight="600" class="fg-on">4</text><text x="24" y="357.2" font-size="11.5" class="fg-q">Готового кода в этом диалоге нет. Вы приходите к ответу сами, и понимание остаётся у вас.</text></svg>