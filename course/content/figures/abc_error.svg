<svg viewBox="0 0 760 417" role="img" aria-label="Как отправить ошибку ИИ: что приложить" font-size="13"><text x="24" y="28" font-size="15" font-weight="600" class="fg-t">Как отправить ошибку ИИ: что приложить</text><rect x="24" y="146.99" width="150" height="120" rx="8" class="fg-riskbox"/><text x="99" y="184.975" text-anchor="middle" font-weight="600" class="fg-t">Что вы увидели</text><text x="99" y="204.875" text-anchor="middle" font-size="11.5" class="fg-q">Белый экран и</text><text x="99" y="220.745" text-anchor="middle" font-size="11.5" class="fg-q">сообщение об</text><text x="99" y="236.615" text-anchor="middle" font-size="11.5" class="fg-q">ошибке</text><rect x="214" y="62" width="330" height="289.98" rx="10" class="fg-zone"/><text x="230" y="86" font-weight="600" class="fg-t">Сообщение для ИИ</text><rect x="248" y="102" width="296" height="53.8" rx="8" class="fg-box"/><text x="258" y="125.06" font-size="12" font-weight="600" class="fg-t">Весь текст ошибки, скопированный</text><text x="258" y="140.66" font-size="12" font-weight="600" class="fg-t">целиком, а не пересказанный</text><circle cx="232" cy="128.9" r="10" class="fg-tier"/><text x="232" y="132.9" text-anchor="middle" font-size="12" font-weight="600" class="fg-on">1</text><rect x="248" y="163.8" width="296" height="90.54" rx="8" class="fg-box"/><text x="258" y="187.55" font-size="12" font-weight="600" class="fg-t">Что вы делали, что ожидали и что</text><text x="258" y="203.15" font-size="12" font-weight="600" class="fg-t">получили</text><text x="258" y="221.75" font-size="11" class="fg-q">«Нажал „Сохранить“, ждал сообщение, получил</text><text x="258" y="236.93" font-size="11" class="fg-q">белый экран»</text><circle cx="232" cy="209.07" r="10" class="fg-tier"/><text x="232" y="213.07" text-anchor="middle" font-size="12" font-weight="600" class="fg-on">2</text><rect x="248" y="262.34" width="296" height="73.64" rx="8" class="fg-box"/><text x="258" y="285.44" font-size="12" font-weight="600" class="fg-t">Не правьте вслепую</text><text x="258" y="304.04" font-size="11" class="fg-q">Если не помогло, попросите объяснить,</text><text x="258" y="319.22" font-size="11" class="fg-q">почему это должно было сработать</text><circle cx="232" cy="299.16" r="10" class="fg-tier"/><text x="232" y="303.16" text-anchor="middle" font-size="12" font-weight="600" class="fg-on">3</text><rect x="584" y="136.99" width="152" height="140" rx="8" class="fg-hi"/><text x="660" y="177.04" text-anchor="middle" font-weight="600" class="fg-t">ИИ отвечает</text><text x="660" y="196.94" text-anchor="middle" font-size="11.5" class="fg-q">Причина ошибки и</text><text x="660" y="212.81" text-anchor="middle" font-size="11.5" class="fg-q">способ проверить,</text><text x="660" y="228.68" text-anchor="middle" font-size="11.5" class="fg-q">что исправление</text><text x="660" y="244.55" text-anchor="middle" font-size="11.5" class="fg-q">сработало</text><path d="M174 206.99L214 206.99" class="fg-ln" marker-end="url(#bk-arrow)"/><path d="M544 206.99L584 206.99" class="fg-ln" marker-end="url(#bk-arrow)"/><path d="M660 276.99L660 375.98L379 375.98L379 351.98" class="fg-ln fg-dash" marker-end="url(#bk-arrow)"/><text x="393" y="395.98" font-size="11.5" class="fg-q">не помогло — уточните и отправьте снова</text></svg>