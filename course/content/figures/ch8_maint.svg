<svg viewBox="0 0 760 340" role="img" aria-label="Как держать кодовую базу здоровой" font-size="13"><text x="24" y="28" font-size="15" font-weight="600" class="fg-t">Как держать кодовую базу здоровой</text><rect x="240" y="52" width="280" height="66" rx="8" class="fg-hi"/><text x="380" y="78.855" text-anchor="middle" font-weight="600" class="fg-t">Здоровый проект</text><text x="380" y="98.755" text-anchor="middle" font-size="11.5" class="fg-q">Растёт, но остаётся понятным</text><rect x="24" y="152" width="226.667" height="77.64" rx="8" class="fg-box"/><text x="137.333" y="184.675" text-anchor="middle" font-weight="600" class="fg-t">Записи решений (ADR)</text><text x="137.333" y="204.575" text-anchor="middle" font-size="11.5" class="fg-q">Что решили и почему</text><rect x="266.667" y="152" width="226.667" height="77.64" rx="8" class="fg-box"/><text x="380" y="176.74" text-anchor="middle" font-weight="600" class="fg-t">Единые правила проекта</text><text x="380" y="196.64" text-anchor="middle" font-size="11.5" class="fg-q">Как называть, где класть, что</text><text x="380" y="212.51" text-anchor="middle" font-size="11.5" class="fg-q">запрещено</text><rect x="509.333" y="152" width="226.667" height="77.64" rx="8" class="fg-box"/><text x="622.667" y="176.74" text-anchor="middle" font-weight="600" class="fg-t">Регулярный рефакторинг</text><text x="622.667" y="196.64" text-anchor="middle" font-size="11.5" class="fg-q">Время на уборку, как на новые</text><text x="622.667" y="212.51" text-anchor="middle" font-size="11.5" class="fg-q">функции</text><rect x="24" y="245.64" width="226.667" height="77.64" rx="8" class="fg-box"/><text x="137.333" y="270.38" text-anchor="middle" font-weight="600" class="fg-t">Владельцы модулей</text><text x="137.333" y="290.28" text-anchor="middle" font-size="11.5" class="fg-q">У каждой части есть человек,</text><text x="137.333" y="306.15" text-anchor="middle" font-size="11.5" class="fg-q">который её понимает</text><rect x="266.667" y="245.64" width="226.667" height="77.64" rx="8" class="fg-box"/><text x="380" y="270.38" text-anchor="middle" font-weight="600" class="fg-t">Удаление лишнего</text><text x="380" y="290.28" text-anchor="middle" font-size="11.5" class="fg-q">Неиспользуемый код — тоже</text><text x="380" y="306.15" text-anchor="middle" font-size="11.5" class="fg-q">долг</text><path d="M380 118L380 134L137.333 134L137.333 152" class="fg-ln" marker-end="url(#bk-arrow)"/><path d="M380 118L380 134L380 134L380 152" class="fg-ln" marker-end="url(#bk-arrow)"/><path d="M380 118L380 134L622.667 134L622.667 152" class="fg-ln" marker-end="url(#bk-arrow)"/></svg>