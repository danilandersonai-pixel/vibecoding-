<svg viewBox="0 0 760 313" role="img" aria-label="Дизайн-система как контекст для ИИ" font-size="13"><text x="24" y="28" font-size="15" font-weight="600" class="fg-t">Дизайн-система как контекст для ИИ</text><rect x="24" y="66" width="200" height="70" rx="8" class="fg-box"/><text x="124" y="94.855" text-anchor="middle" font-weight="600" class="fg-t">Описание или эскиз</text><text x="124" y="114.755" text-anchor="middle" font-size="11.5" class="fg-q">Что нужно показать</text><rect x="24" y="150" width="200" height="96" rx="8" class="fg-hi"/><text x="124" y="176.855" text-anchor="middle" font-size="12.5" font-weight="600" class="fg-t">Дизайн-система</text><text x="124" y="196.105" text-anchor="middle" font-size="11" class="fg-q">Цвета, шрифты, готовые</text><text x="124" y="211.285" text-anchor="middle" font-size="11" class="fg-q">блоки, описанные так, чтобы</text><text x="124" y="226.465" text-anchor="middle" font-size="11" class="fg-q">их читал компьютер</text><rect x="290" y="96" width="176" height="80" rx="8" class="fg-box"/><text x="378" y="129.855" text-anchor="middle" font-weight="600" class="fg-t">ИИ собирает экраны</text><text x="378" y="149.755" text-anchor="middle" font-size="11.5" class="fg-q">В едином стиле</text><rect x="532" y="66" width="204" height="70" rx="8" class="fg-box"/><text x="634" y="94.855" text-anchor="middle" font-weight="600" class="fg-t">Несколько вариантов</text><text x="634" y="114.755" text-anchor="middle" font-size="11.5" class="fg-q">Интерфейс за минуты</text><rect x="532" y="160" width="204" height="86" rx="8" class="fg-okbox"/><text x="634" y="188.92" text-anchor="middle" font-weight="600" class="fg-t">Выбираете вы</text><text x="634" y="208.82" text-anchor="middle" font-size="11.5" class="fg-q">Вкус и понимание удобства</text><text x="634" y="224.69" text-anchor="middle" font-size="11.5" class="fg-q">остаются за человеком</text><path d="M224 101L290 121" class="fg-ln" marker-end="url(#bk-arrow)"/><path d="M224 198L290 151" class="fg-ln" marker-end="url(#bk-arrow)"/><path d="M466 136L532 101" class="fg-ln" marker-end="url(#bk-arrow)"/><path d="M634 136L634 160" class="fg-ln" marker-end="url(#bk-arrow)"/><text x="24" y="276" font-size="11.5" class="fg-riskt">Риск: непредсказуемый интерфейс труднее тестировать, а персонализация требует данных о человеке и</text><text x="24" y="291.18" font-size="11.5" class="fg-riskt">бережного отношения к ним.</text></svg>