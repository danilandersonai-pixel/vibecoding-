<svg viewBox="0 0 760 258" role="img" aria-label="Секрет живёт в файле .env, а не в коде" font-size="13"><text x="24" y="28" font-size="15" font-weight="600" class="fg-t">Секрет живёт в файле .env, а не в коде</text><text x="34" y="67" font-size="11" font-weight="600" class="fg-q">src/ai.ts</text><rect x="24" y="76" width="470" height="19" rx="0" class="fg-del"/><text x="32" y="89.13" font-size="11" class="fg-riskt fg-mono" xml:space="preserve">-</text><text x="45.244" y="89.13" font-size="11" class="fg-t fg-mono" xml:space="preserve">const key = "sk-live-4f9a2c";</text><rect x="24" y="95" width="470" height="19" rx="0" class="fg-add"/><text x="32" y="108.13" font-size="11" class="fg-okt fg-mono" xml:space="preserve">+</text><text x="45.244" y="108.13" font-size="11" class="fg-t fg-mono" xml:space="preserve">const key = process.env.API_KEY;</text><rect x="24" y="76" width="470" height="38" rx="4" class="fg-ghost"/><circle cx="508" cy="85.5" r="10" class="fg-tier"/><text x="508" y="89.5" text-anchor="middle" font-size="12" font-weight="600" class="fg-on">1</text><circle cx="508" cy="104.5" r="10" class="fg-tier"/><text x="508" y="108.5" text-anchor="middle" font-size="12" font-weight="600" class="fg-on">2</text><rect x="24" y="142" width="470" height="100" rx="8" class="fg-win"/><path d="M24 168V150Q24 142 32 142H486Q494 142 494 150V168Z" class="fg-bar"/><circle cx="38" cy="155" r="3.5" class="fg-dot"/><circle cx="51" cy="155" r="3.5" class="fg-dot"/><circle cx="64" cy="155" r="3.5" class="fg-dot"/><text x="259" y="159" text-anchor="middle" font-size="11" class="fg-q">.env — файл только на вашем компьютере</text><text x="44" y="190" font-size="11.5" class="fg-t fg-mono" xml:space="preserve">API_KEY=sk-live-4f9a2c</text><rect x="44" y="206" width="200" height="22" rx="6" class="fg-okbox"/><text x="52" y="221" font-size="11" class="fg-okt fg-mono" xml:space="preserve">.gitignore → .env</text><circle cx="508" cy="216" r="10" class="fg-tier"/><text x="508" y="220" text-anchor="middle" font-size="12" font-weight="600" class="fg-on">3</text><circle cx="530" cy="71" r="10" class="fg-tier"/><text x="530" y="75" text-anchor="middle" font-size="12" font-weight="600" class="fg-on">1</text><text x="548" y="75" font-size="11.5" class="fg-q">Ключ был прямо в коде:</text><text x="548" y="90.18" font-size="11.5" class="fg-q">любой, кто увидит код, увидит</text><text x="548" y="105.36" font-size="11.5" class="fg-q">и ключ</text><circle cx="530" cy="134.54" r="10" class="fg-tier"/><text x="530" y="138.54" text-anchor="middle" font-size="12" font-weight="600" class="fg-on">2</text><text x="548" y="138.54" font-size="11.5" class="fg-q">В коде остаётся только имя</text><text x="548" y="153.72" font-size="11.5" class="fg-q">переменной, а не сам ключ</text><circle cx="530" cy="182.9" r="10" class="fg-tier"/><text x="530" y="186.9" text-anchor="middle" font-size="12" font-weight="600" class="fg-on">3</text><text x="548" y="186.9" font-size="11.5" class="fg-q">Файл .env внесён в .gitignore: в</text><text x="548" y="202.08" font-size="11.5" class="fg-q">историю проекта он не</text><text x="548" y="217.26" font-size="11.5" class="fg-q">попадёт</text></svg>