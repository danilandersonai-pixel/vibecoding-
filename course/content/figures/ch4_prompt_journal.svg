<svg viewBox="0 0 760 370" role="img" aria-label="Журнал запросов: чему вы учитесь на практике" font-size="13"><text x="24" y="28" font-size="15" font-weight="600" class="fg-t">Журнал запросов: чему вы учитесь на практике</text><rect x="24" y="52" width="712" height="224" rx="8" class="fg-win"/><path d="M24 78V60Q24 52 32 52H728Q736 52 736 60V78Z" class="fg-bar"/><circle cx="38" cy="65" r="3.5" class="fg-dot"/><circle cx="51" cy="65" r="3.5" class="fg-dot"/><circle cx="64" cy="65" r="3.5" class="fg-dot"/><text x="380" y="69" text-anchor="middle" font-size="11" class="fg-q">Журнал запросов</text><text x="40" y="98" font-size="11" font-weight="600" class="fg-q">Дата</text><text x="110" y="98" font-size="11" font-weight="600" class="fg-q">Запрос</text><text x="322" y="98" font-size="11" font-weight="600" class="fg-q">Что получилось</text><text x="544" y="98" font-size="11" font-weight="600" class="fg-q">Вывод</text><path d="M40 106L720 106" class="fg-ln"/><text x="40" y="128" font-size="11.5" class="fg-t">12.10</text><text x="110" y="128" font-size="11.5" class="fg-t">Добавь пагинацию в заказы</text><text x="322" y="128" font-size="11.5" class="fg-t">Сделал по номеру страницы, а</text><text x="322" y="143" font-size="11.5" class="fg-t">нужна курсорная</text><text x="544" y="128" font-size="11.5" class="fg-t">Указывать способ</text><path d="M40 158L720 158" class="fg-ln fg-dots"/><text x="40" y="176" font-size="11.5" class="fg-t">13.10</text><text x="110" y="176" font-size="11.5" class="fg-t">Исправь ошибку (приложил</text><text x="110" y="191" font-size="11.5" class="fg-t">лог)</text><text x="322" y="176" font-size="11.5" class="fg-t">Причина найдена с первого раза</text><text x="544" y="176" font-size="11.5" class="fg-t">Всегда прикладывать лог</text><path d="M40 206L720 206" class="fg-ln fg-dots"/><text x="40" y="224" font-size="11.5" class="fg-t">15.10</text><text x="110" y="224" font-size="11.5" class="fg-t">Сделай красиво</text><text x="322" y="224" font-size="11.5" class="fg-t">Результат случайный</text><text x="544" y="224" font-size="11.5" class="fg-t">Описывать критерии</text><rect x="24" y="292" width="712" height="62" rx="8" class="fg-hi"/><text x="380" y="316.855" text-anchor="middle" font-weight="600" class="fg-t">Раз в неделю перечитывайте журнал</text><text x="380" y="336.755" text-anchor="middle" font-size="11.5" class="fg-q">Лучшие запросы превращайте в шаблоны, а повторяющиеся ошибки — в правила проекта</text></svg>