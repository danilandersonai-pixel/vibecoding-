<svg viewBox="0 0 760 333" role="img" aria-label="Разбор инцидента: агент готовит, человек решает" font-size="13"><text x="24" y="28" font-size="15" font-weight="600" class="fg-t">Разбор инцидента: агент готовит, человек решает</text><rect x="24" y="64" width="161.5" height="84" rx="8" class="fg-riskbox"/><text x="104.75" y="91.92" text-anchor="middle" font-weight="600" class="fg-t">Сбой</text><text x="104.75" y="111.82" text-anchor="middle" font-size="11.5" class="fg-q">Приложение работает</text><text x="104.75" y="127.69" text-anchor="middle" font-size="11.5" class="fg-q">неправильно</text><rect x="207.5" y="64" width="161.5" height="84" rx="8" class="fg-box"/><text x="288.25" y="91.92" text-anchor="middle" font-weight="600" class="fg-t">Агент собирает</text><text x="288.25" y="111.82" text-anchor="middle" font-size="11.5" class="fg-q">Журналы, показатели,</text><text x="288.25" y="127.69" text-anchor="middle" font-size="11.5" class="fg-q">недавние изменения</text><rect x="391" y="64" width="161.5" height="84" rx="8" class="fg-box"/><text x="471.75" y="91.92" text-anchor="middle" font-weight="600" class="fg-t">Гипотезы</text><text x="471.75" y="111.82" text-anchor="middle" font-size="11.5" class="fg-q">Что могло сломаться</text><text x="471.75" y="127.69" text-anchor="middle" font-size="11.5" class="fg-q">и почему</text><rect x="574.5" y="64" width="161.5" height="84" rx="8" class="fg-box"/><text x="655.25" y="91.92" text-anchor="middle" font-weight="600" class="fg-t">Предложение</text><text x="655.25" y="111.82" text-anchor="middle" font-size="11.5" class="fg-q">Исправление в виде</text><text x="655.25" y="127.69" text-anchor="middle" font-size="11.5" class="fg-q">пул-реквеста</text><path d="M185.5 106L207.5 106" class="fg-ln" marker-end="url(#bk-arrow)"/><path d="M369 106L391 106" class="fg-ln" marker-end="url(#bk-arrow)"/><path d="M552.5 106L574.5 106" class="fg-ln" marker-end="url(#bk-arrow)"/><rect x="420" y="196" width="316" height="64" rx="8" class="fg-hi"/><text x="578" y="221.855" text-anchor="middle" font-weight="600" class="fg-t">Человек решает</text><text x="578" y="241.755" text-anchor="middle" font-size="11.5" class="fg-q">Принимает, правит или отклоняет</text><path d="M655.25 148L655.25 196" class="fg-ln" marker-end="url(#bk-arrow)"/><rect x="24" y="196" width="316" height="64" rx="8" class="fg-okbox"/><text x="182" y="221.855" text-anchor="middle" font-weight="600" class="fg-t">Тест на этот сбой</text><text x="182" y="241.755" text-anchor="middle" font-size="11.5" class="fg-q">Навсегда, чтобы ошибка не вернулась</text><path d="M420 228L340 228" class="fg-ln" marker-end="url(#bk-arrow)"/><text x="24" y="296" font-size="11.5" class="fg-q">Автоматическое исправление боевого сервера без человека остаётся риском: надёжность агентов на длинных</text><text x="24" y="311.18" font-size="11.5" class="fg-q">задачах далека от 100%.</text></svg>