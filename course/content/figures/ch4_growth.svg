<svg viewBox="0 0 760 370" role="img" aria-label="Осознанная практика растёт быстрее, чем просто ежедневное использование" font-size="13"><text x="24" y="28" font-size="15" font-weight="600" class="fg-t">Осознанная практика растёт быстрее, чем просто ежедневное использование</text><path d="M70 300L70 60" class="fg-ln" marker-end="url(#bk-arrow)"/><path d="M70 300L556 300" class="fg-ln" marker-end="url(#bk-arrow)"/><text x="78" y="60" font-size="11.5" class="fg-q">умение работать с ИИ</text><text x="556" y="320" text-anchor="end" font-size="11.5" class="fg-q">время</text><path d="M70 292C190 282 360 262 540 232" class="fg-ln fg-dash"/><path d="M70 292C190 246 340 160 540 96" class="fg-curve"/><text x="572" y="100" font-weight="600" class="fg-t">С разбором неудач</text><text x="572" y="118" font-size="11.5" class="fg-q">попытка, разбор, вывод —</text><text x="572" y="133.18" font-size="11.5" class="fg-q">рост быстрый</text><text x="572" y="236" font-weight="600" class="fg-t">Просто пользоваться</text><text x="572" y="254" font-size="11.5" class="fg-q">без разбора ошибок —</text><text x="572" y="269.18" font-size="11.5" class="fg-q">рост медленный</text><text x="24" y="346" font-size="11.5" class="fg-q">Что даёт разбор:</text><rect x="130" y="330" width="124.652" height="24" rx="12" class="fg-zone"/><text x="192.326" y="346.025" text-anchor="middle" font-size="11.5" class="fg-t">журнал запросов</text><rect x="262.652" y="330" width="155.705" height="24" rx="12" class="fg-zone"/><text x="340.504" y="346.025" text-anchor="middle" font-size="11.5" class="fg-t">еженедельный разбор</text><rect x="426.357" y="330" width="107.682" height="24" rx="12" class="fg-zone"/><text x="480.198" y="346.025" text-anchor="middle" font-size="11.5" class="fg-t">эксперименты</text><rect x="542.039" y="330" width="170.51" height="24" rx="12" class="fg-zone"/><text x="627.294" y="346.025" text-anchor="middle" font-size="11.5" class="fg-t">несколько инструментов</text></svg>