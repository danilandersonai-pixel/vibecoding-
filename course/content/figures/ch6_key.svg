<svg viewBox="0 0 760 356" role="img" aria-label="Где хранить ключ API: на сервере, а не в браузере" font-size="13"><text x="24" y="28" font-size="15" font-weight="600" class="fg-t">Где хранить ключ API: на сервере, а не в браузере</text><rect x="24" y="48" width="336" height="44" rx="8" class="fg-riskbox"/><text x="192" y="74.29" text-anchor="middle" font-weight="600" class="fg-t">Опасно: ключ в интерфейсе</text><rect x="400" y="48" width="336" height="44" rx="8" class="fg-okbox"/><text x="568" y="74.29" text-anchor="middle" font-weight="600" class="fg-t">Правильно: ключ на сервере</text><rect x="24" y="116" width="140" height="104" rx="8" class="fg-box"/><text x="94" y="161.855" text-anchor="middle" font-weight="600" class="fg-t">Браузер</text><text x="94" y="181.755" text-anchor="middle" font-size="11.5" class="fg-q">на странице есть</text><rect x="57.6077" y="186" width="72.7847" height="22" rx="11" class="fg-riskbox"/><text x="94" y="200.85" text-anchor="middle" font-size="11" font-weight="600" class="fg-riskt">ключ API</text><rect x="220" y="116" width="140" height="104" rx="8" class="fg-box"/><text x="290" y="161.855" text-anchor="middle" font-weight="600" class="fg-t">Сервис</text><text x="290" y="181.755" text-anchor="middle" font-size="11.5" class="fg-q">ИИ, оплата, карты</text><path d="M164 168L220 168" class="fg-ln" marker-end="url(#bk-arrow)"/><rect x="24" y="256" width="336" height="84" rx="8" class="fg-riskzone"/><text x="192" y="283.405" text-anchor="middle" font-weight="600" class="fg-t">Посторонний открывает панель</text><text x="192" y="300.305" text-anchor="middle" font-weight="600" class="fg-t">разработчика</text><text x="192" y="320.205" text-anchor="middle" font-size="11.5" class="fg-q">Она есть в любом браузере, и ключ виден всем</text><path d="M94 256L94 220" class="fg-ln" marker-end="url(#bk-arrow)"/><rect x="400" y="116" width="92" height="104" rx="8" class="fg-box"/><text x="446" y="161.855" text-anchor="middle" font-weight="600" class="f