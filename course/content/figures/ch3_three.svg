<svg viewBox="0 0 760 290" role="img" aria-label="Прежде чем сказать «вроде работает»: три проверки" font-size="13"><text x="24" y="28" font-size="15" font-weight="600" class="fg-t">Прежде чем сказать «вроде работает»: три проверки</text><rect x="24" y="48" width="712" height="40" rx="8" class="fg-riskbox"/><text x="380" y="72.29" text-anchor="middle" font-weight="600" class="fg-t">«Вроде работает» значит, что проверен один счастливый сценарий из десятков возможных</text><rect x="24" y="112" width="221.333" height="77.64" rx="8" class="fg-box"/><text x="134.667" y="136.74" text-anchor="middle" font-weight="600" class="fg-t">Обычный случай</text><text x="134.667" y="156.64" text-anchor="middle" font-size="11.5" class="fg-q">Всё как задумано: нажали,</text><text x="134.667" y="172.51" text-anchor="middle" font-size="11.5" class="fg-q">получили результат</text><rect x="269.333" y="112" width="221.333" height="77.64" rx="8" class="fg-box"/><text x="380" y="136.74" text-anchor="middle" font-weight="600" class="fg-t">Пустой ввод</text><text x="380" y="156.64" text-anchor="middle" font-size="11.5" class="fg-q">Ничего не ввели, пустой список,</text><text x="380" y="172.51" text-anchor="middle" font-size="11.5" class="fg-q">пустой файл</text><rect x="514.667" y="112" width="221.333" height="77.64" rx="8" class="fg-box"/><text x="625.333" y="136.74" text-anchor="middle" font-weight="600" class="fg-t">Странный ввод</text><text x="625.333" y="156.64" text-anchor="middle" font-size="11.5" class="fg-q">Очень длинный текст, символы</text><text x="625.333" y="172.51" text-anchor="middle" font-size="11.5" class="fg-q">&lt; и &amp;, отключённый интернет</text><rect x="24" y="233.64" width="712" height="40" rx="8" class="fg-okbox"/><text x="380" y="257.93" text-anchor="middle" font-weight="600" class="fg-t">Теперь можно сказать: «работает, я проверил три сценария»</text><path d="M134.667 189.64L134.667 233.64" class="fg-ln" marker-end="url(#bk-arrow)"/><circle cx="227.333" cy="130" r=