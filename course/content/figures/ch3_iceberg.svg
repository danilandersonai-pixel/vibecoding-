<svg viewBox="0 0 760 371" role="img" aria-label="Айсберг готовности: видно только верхушку" font-size="13"><text x="24" y="28" font-size="15" font-weight="600" class="fg-t">Айсберг готовности: видно только верхушку</text><path d="M24 118L736 118" class="fg-grid"/><path d="M190 52L238 118L142 118Z" class="fg-tier" style="fill-opacity:.3"/><path d="M142 118L238 118L322 172L338 252L254 322L142 334L62 272L44 188Z" class="fg-tier" style="fill-opacity:.12"/><text x="268" y="66" font-weight="600" class="fg-t">Видно в демонстрации</text><text x="268" y="84" font-size="11.5" class="fg-q">типовые экраны, вход по паролю, четыре стандартных действия с данными,</text><text x="268" y="99.18" font-size="11.5" class="fg-q">вёрстка по описанию — то, чего в обучающих данных ИИ очень много</text><text x="736" y="134" text-anchor="end" font-size="11" class="fg-q">уровень «почти готово»</text><text x="372" y="152" font-weight="600" class="fg-t">Скрыто: то, что уникально для вашего проекта</text><circle cx="378" cy="178" r="3.5" class="fg-dot"/><text x="392" y="182" font-size="12.5" class="fg-t">Обработка ошибок</text><circle cx="378" cy="206" r="3.5" class="fg-dot"/><text x="392" y="210" font-size="12.5" class="fg-t">Необычные случаи</text><circle cx="378" cy="234" r="3.5" class="fg-dot"/><text x="392" y="238" font-size="12.5" class="fg-t">Безопасность</text><circle cx="378" cy="262" r="3.5" class="fg-dot"/><text x="392" y="266" font-size="12.5" class="fg-t">Скорость при настоящей нагрузке</text><circle cx="378" cy="290" r="3.5" class="fg-dot"/><text x="392" y="294" font-size="12.5" class="fg-t">Связь с чужими сервисами</text><circle cx="378" cy="318" r="3.5" class="fg-dot"/><text x="392" y="322" font-size="12.5" class="fg-t">Эксплуатация: журналы, оповещения, откат</text><circle cx="378" cy="346" r="3.5" class="fg-dot"/><text x="392" y="350" font-size="12.5" class="fg-t">Поддерживаемость</text></svg>