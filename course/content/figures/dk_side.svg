<svg viewBox="0 0 760 435" role="img" aria-label="Side chat: побочный вопрос не попадает в основной диалог" font-size="13"><text x="24" y="28" font-size="15" font-weight="600" class="fg-t">Побочный вопрос: спросить и не сбить основную работу</text><rect x="24" y="46" width="712" height="252" rx="10" class="fg-win"/><path d="M194 46H34Q24 46 24 56V288Q24 298 34 298H194Z" class="fg-bar"/><rect x="36" y="58" width="146" height="26" rx="6" class="fg-hi"/><text x="109" y="75.03" text-anchor="middle" font-size="11.5" font-weight="600" class="fg-acc">+ New session</text><rect x="30" y="94" width="158" height="38" rx="6" class="fg-sel"/><circle cx="42" cy="109" r="4" class="fg-ok"/><text x="54" y="108" font-size="11.5" font-weight="600" class="fg-t">Форма входа</text><text x="54" y="123" font-size="9.5" class="fg-q">habit-tracker · Local</text><circle cx="42" cy="151" r="4" class="fg-acc"/><text x="54" y="150" font-size="11.5" class="fg-t">Починить тесты</text><text x="54" y="165" font-size="9.5" class="fg-q">shop-site · Cloud</text><circle cx="42" cy="193" r="4" class="fg-dot"/><text x="54" y="192" font-size="11.5" class="fg-t">Страница меню</text><text x="54" y="207" font-size="9.5" class="fg-q">cafe-page · Local</text><rect x="194" y="82" width="542" height="1" rx="0" class="fg-line"/><text x="210" y="69" font-size="12" font-weight="600" class="fg-t">Форма входа ▾</text><rect x="700" y="54" width="24" height="22" rx="11" class="fg-bar"/><text x="712" y="68.85" text-anchor="middle" font-size="11" class="fg-t">⋮</text><rect x="628.15" y="54" width="65.85" height="22" rx="11" class="fg-bar"/><text x="661.07" y="68.85" text-anchor="middle" font-size="11" class="fg-t">Changes</text><rect x="204" y="94" width="190" height="24" rx="8" class="fg-sel"/><text x="214" y="110" font-size="11.5" class="fg-t">Добавь валидацию формы</text><text x="210" y="142" font-size="11" class="fg-q">Читаю форму…</text><text x="210" y="160" font-size="11" class="fg-q">Пишу валидацию и тесты…</text><rect x="210" y="174" width="83.21" height="20" rx="10" class="fg-hi"/><text x="251.6" y="187.68" text-anchor="middle" font-size="10.5" font-weight="600" class="fg-acc">Работаю…</text><rect x="204" y="244" width="200" height="40" rx="8" class="fg-box"/><text x="216" y="268" font-size="11" class="fg-q">Что сделать дальше?</text><rect x="426" y="90" width="298" height="200" rx="10" class="fg-win"/><rect x="426" y="90" width="298" height="200" rx="10" class="fg-hi"/><text x="440" y="112" font-size="11.5" font-weight="600" class="fg-acc">Side chat</text><text x="710" y="112" text-anchor="end" font-size="10.5" class="fg-q fg-mono" xml:space="preserve">Ctrl + ;</text><rect x="440" y="124" width="238" height="24" rx="8" class="fg-sel"/><text x="450" y="140" font-size="11" class="fg-t">Что такое «валидация»?</text><text x="440" y="171" font-size="11" class="fg-t">Валидация — это проверка того, что</text><text x="440" y="185.52" font-size="11" class="fg-t">пользователь ввёл правильные данные:</text><text x="440" y="200.04" font-size="11" class="fg-t">например, что в поле почты есть знак @.</text><text x="440" y="218.54" font-size="10.5" class="fg-q">Этот вопрос и ответ остаются только здесь.</text><circle cx="314" cy="182" r="10" class="fg-tier"/><text x="314" y="186" text-anchor="middle" font-size="12" font-weight="600" class="fg-on">1</text><circle cx="432" cy="90" r="10" class="fg-tier"/><text x="432" y="94" text-anchor="middle" font-size="12" font-weight="600" class="fg-on">2</text><circle cx="704" cy="136" r="10" class="fg-tier"/><text x="704" y="140" text-anchor="middle" font-size="12" font-weight="600" class="fg-on">3</text><circle cx="694" cy="232" r="10" class="fg-tier"/><text x="694" y="236" text-anchor="middle" font-size="12" font-weight="600" class="fg-on">4</text><circle cx="34" cy="324" r="10" class="fg-tier"/><text x="34" y="328" text-anchor="middle" font-size="12" font-weight="600" class="fg-on">1</text><text x="52" y="328" font-size="12" class="fg-q">Основная сессия продолжает работать: вам не</text><text x="52" y="343.84" font-size="12" class="fg-q">нужно ждать.</text><circle cx="34" cy="371.68" r="10" class="fg-tier"/><text x="34" y="375.68" text-anchor="middle" font-size="12" font-weight="600" class="fg-on">2</text><text x="52" y="375.68" font-size="12" class="fg-q">Побочный чат открывается клавишами Ctrl + ;</text><text x="52" y="391.52" font-size="12" class="fg-q">(на Mac ⌘ + ;) или командой /btw.</text><circle cx="404" cy="324" r="10" class="fg-tier"/><text x="404" y="328" text-anchor="middle" font-size="12" font-weight="600" class="fg-on">3</text><text x="422" y="328" font-size="12" class="fg-q">Claude знает контекст сессии, поэтому на</text><text x="422" y="343.84" font-size="12" class="fg-q">вопрос «а что это за файл?» ответит по вашему</text><text x="422" y="359.68" font-size="12" class="fg-q">проекту.</text><circle cx="404" cy="387.52" r="10" class="fg-tier"/><text x="404" y="391.52" text-anchor="middle" font-size="12" font-weight="600" class="fg-on">4</text><text x="422" y="391.52" font-size="12" class="fg-q">Вопрос и ответ не попадают в основной диалог</text><text x="422" y="407.36" font-size="12" class="fg-q">и не засоряют его. Очень удобно, когда учитесь.</text></svg>