<svg viewBox="0 0 760 310" role="img" aria-label="Какие тесты нужны ИИ-коду" font-size="13"><text x="24" y="28" font-size="15" font-weight="600" class="fg-t">Какие тесты нужны ИИ-коду</text><rect x="24" y="56" width="348" height="77.64" rx="8" class="fg-box"/><text x="198" y="80.74" text-anchor="middle" font-weight="600" class="fg-t">Негативные тесты безопасности</text><text x="198" y="100.64" text-anchor="middle" font-size="11.5" class="fg-q">Не только «работает для владельца», но и «не</text><text x="198" y="116.51" text-anchor="middle" font-size="11.5" class="fg-q">работает для чужого»</text><rect x="388" y="56" width="348" height="77.64" rx="8" class="fg-box"/><text x="562" y="88.675" text-anchor="middle" font-weight="600" class="fg-t">Контрактные тесты</text><text x="562" y="108.575" text-anchor="middle" font-size="11.5" class="fg-q">Ответы сервера соответствуют договорённой схеме</text><rect x="24" y="149.64" width="348" height="61.77" rx="8" class="fg-box"/><text x="198" y="174.38" text-anchor="middle" font-weight="600" class="fg-t">Случайные и «вредные» данные</text><text x="198" y="194.28" text-anchor="middle" font-size="11.5" class="fg-q">Находят то, о чём никто не подумал</text><rect x="388" y="149.64" width="348" height="61.77" rx="8" class="fg-box"/><text x="562" y="174.38" text-anchor="middle" font-weight="600" class="fg-t">Регрессионный тест на каждый баг</text><text x="562" y="194.28" text-anchor="middle" font-size="11.5" class="fg-q">Найденная ошибка навсегда становится тестом</text><rect x="24" y="229.41" width="712" height="64" rx="8" class="fg-hi"/><text x="380" y="255.265" text-anchor="middle" font-weight="600" class="fg-t">Для функций на основе языковых моделей нужны ещё evals</text><text x="380" y="275.165" text-anchor="middle" font-size="11.5" class="fg-q">Наборы примеров, по которым проверяют качество ответов</text></svg>