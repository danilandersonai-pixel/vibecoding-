<svg viewBox="0 0 760 354" role="img" aria-label="Условные обозначения: как выглядят блоки книги" font-size="13"><text x="24" y="28" font-size="15" font-weight="600" class="fg-t">Условные обозначения: как выглядят блоки книги</text><rect x="24" y="58" width="348" height="84" rx="8" class="fg-zone"/><text x="40" y="85.92" font-weight="600" class="fg-t">Запрос</text><text x="40" y="105.82" font-size="11.5" class="fg-q">Готовый текст для ИИ: скопируйте и подставьте</text><text x="40" y="121.69" font-size="11.5" class="fg-q">своё</text><rect x="388" y="58" width="348" height="84" rx="8" class="fg-hi"/><text x="404" y="85.92" font-weight="600" class="fg-t">Простыми словами</text><text x="404" y="105.82" font-size="11.5" class="fg-q">Короткое объяснение сложной мысли через пример</text><text x="404" y="121.69" font-size="11.5" class="fg-q">из жизни</text><rect x="24" y="156" width="348" height="84" rx="8" class="fg-okbox"/><text x="40" y="191.855" font-weight="600" class="fg-t">Совет</text><text x="40" y="211.755" font-size="11.5" class="fg-q">Приём, который экономит время</text><rect x="388" y="156" width="348" height="84" rx="8" class="fg-riskbox"/><text x="404" y="191.855" font-weight="600" class="fg-t">Внимание</text><text x="404" y="211.755" font-size="11.5" class="fg-q">Место, где легко ошибиться или создать риск</text><rect x="24" y="254" width="348" height="84" rx="8" class="fg-box"/><text x="40" y="281.92" font-weight="600" class="fg-t">Схема</text><text x="40" y="301.82" font-size="11.5" class="fg-q">Показывает то, что трудно удержать в голове по</text><text x="40" y="317.69" font-size="11.5" class="fg-q">тексту</text><rect x="388" y="254" width="348" height="84" rx="8" class="fg-box"/><text x="404" y="281.92" font-weight="600" class="fg-t">Код</text><text x="404" y="301.82" font-size="11.5" class="fg-q">Как выглядит программа; построчно читать не</text><text x="404" y="317.69" font-size="11.5" class="fg-q">нужно</text></svg>