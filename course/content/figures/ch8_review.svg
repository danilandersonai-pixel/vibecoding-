<svg viewBox="0 0 760 267" role="img" aria-label="Шесть вопросов к любому изменению кода" font-size="13"><text x="24" y="28" font-size="15" font-weight="600" class="fg-t">Шесть вопросов к любому изменению кода</text><rect x="24" y="60" width="226.667" height="94.54" rx="8" class="fg-box"/><text x="137.333" y="101.125" text-anchor="middle" font-weight="600" class="fg-t">Откуда приходят данные?</text><text x="137.333" y="121.025" text-anchor="middle" font-size="11.5" class="fg-q">Всё внешнее недоверенное</text><rect x="266.667" y="60" width="226.667" height="94.54" rx="8" class="fg-box"/><text x="380" y="93.19" text-anchor="middle" font-weight="600" class="fg-t">Кто может это вызвать?</text><text x="380" y="113.09" text-anchor="middle" font-size="11.5" class="fg-q">Вошёл ли человек и есть ли</text><text x="380" y="128.96" text-anchor="middle" font-size="11.5" class="fg-q">права на этот объект</text><rect x="509.333" y="60" width="226.667" height="94.54" rx="8" class="fg-box"/><text x="622.667" y="84.74" text-anchor="middle" font-weight="600" class="fg-t">Что сделает</text><text x="622.667" y="101.64" text-anchor="middle" font-weight="600" class="fg-t">злоумышленник?</text><text x="622.667" y="121.54" text-anchor="middle" font-size="11.5" class="fg-q">Чужой номер, огромный файл,</text><text x="622.667" y="137.41" text-anchor="middle" font-size="11.5" class="fg-q">тысяча запросов</text><rect x="24" y="172.54" width="226.667" height="77.64" rx="8" class="fg-box"/><text x="137.333" y="197.28" text-anchor="middle" font-weight="600" class="fg-t">Что попадает в журналы?</text><text x="137.333" y="217.18" text-anchor="middle" font-size="11.5" class="fg-q">Пароли, токены и личные данные</text><text x="137.333" y="233.05" text-anchor="middle" font-size="11.5" class="fg-q">там — утечка</text><rect x="266.667" y="172.54" width="226.667" height="77.64" rx="8" class="fg-box"/><text x="380" y="197.28" text-anchor="middle" font-weight="600" class="fg-t">Какие права у процесса?</text><text x="380" y="217.18" text-anchor="middle" font-size="11.5" class="fg-q">Ровно столько, сколько нужно</text><text x="380" y="233.05" text-anchor="middle" font-size="11.5" class="fg-q">для работы</text><rect x="509.333" y="172.54" width="226.667" height="77.64" rx="8" class="fg-box"/><text x="622.667" y="197.28" text-anchor="middle" font-weight="600" class="fg-t">Что изменилось вне задачи?</text><text x="622.667" y="217.18" text-anchor="middle" font-size="11.5" class="fg-q">Отключённая проверка, новая</text><text x="622.667" y="233.05" text-anchor="middle" font-size="11.5" class="fg-q">библиотека, ослабленный CORS</text><circle cx="40" cy="58" r="10" class="fg-tier"/><text x="40" y="62" text-anchor="middle" font-size="12" font-weight="600" class="fg-on">1</text><circle cx="282.667" cy="58" r="10" class="fg-tier"/><text x="282.667" y="62" text-anchor="middle" font-size="12" font-weight="600" class="fg-on">2</text><circle cx="525.333" cy="58" r="10" class="fg-tier"/><text x="525.333" y="62" text-anchor="middle" font-size="12" font-weight="600" class="fg-on">3</text><circle cx="40" cy="170.54" r="10" class="fg-tier"/><text x="40" y="174.54" text-anchor="middle" font-size="12" font-weight="600" class="fg-on">4</text><circle cx="282.667" cy="170.54" r="10" class="fg-tier"/><text x="282.667" y="174.54" text-anchor="middle" font-size="12" font-weight="600" class="fg-on">5</text><circle cx="525.333" cy="170.54" r="10" class="fg-tier"/><text x="525.333" y="174.54" text-anchor="middle" font-size="12" font-weight="600" class="fg-on">6</text></svg>