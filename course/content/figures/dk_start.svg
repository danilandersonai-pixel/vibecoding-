<svg viewBox="0 0 760 497" role="img" aria-label="Выбор окружения, папки и Worktree перед первым сообщением" font-size="13"><text x="24" y="28" font-size="15" font-weight="600" class="fg-t">Новая сессия: где работать, с какой папкой и в какой копии</text><rect x="24" y="46" width="712" height="266" rx="10" class="fg-win"/><text x="380" y="86" text-anchor="middle" font-size="15" font-weight="600" class="fg-t">С чего начнём?</text><rect x="64" y="108" width="86" height="26" rx="6" class="fg-hi"/><text x="107" y="125.03" text-anchor="middle" font-size="11.5" font-weight="600" class="fg-acc">Local ▾</text><rect x="162" y="108" width="107.57" height="26" rx="6" class="fg-bar"/><text x="215.79" y="125.03" text-anchor="middle" font-size="11.5" class="fg-t">habit-tracker ▾</text><rect x="277.57" y="108" width="62.16" height="26" rx="6" class="fg-bar"/><text x="308.66" y="125.03" text-anchor="middle" font-size="11.5" class="fg-t">main ▾</text><rect x="351.74" y="114" width="14" height="14" rx="3" class="fg-box"/><text x="373.74" y="126" font-size="11.5" class="fg-t">Worktree</text><rect x="64" y="242" width="632" height="56" rx="10" class="fg-box"/><text x="80" y="266" font-size="12" class="fg-q">Опишите первую задачу своими словами…</text><circle cx="84" cy="286" r="8" class="fg-bar"/><text x="84" y="290" text-anchor="middle" font-size="12" font-weight="600" class="fg-t">+</text><rect x="64" y="138" width="170" height="100" rx="8" class="fg-win"/><rect x="64" y="138" width="170" height="100" rx="8" class="fg-box"/><rect x="68" y="144" width="162" height="20" rx="4" class="fg-sel"/><text x="78" y="158" font-size="11" font-weight="600" class="fg-t">Local</text><text x="78" y="180" font-size="11" class="fg-t">Cloud</text><text x="78" y="202" font-size="11" class="fg-t">SSH</text><text x="78" y="224" font-size="11" class="fg-t">WSL (Windows)</text><circle cx="148" cy="106" r="10" class="fg-tier"/><text x="148" y="110" text-anchor="middle" font-size="12" font-weight="600" class="fg-on">1</text><circle cx="267.57" cy="106" r="10" class="fg-tier"/><text x="267.57" y="110" text-anchor="middle" font-size="12" font-weight="600" class="fg-on">2</text><circle cx="337.74" cy="106" r="10" class="fg-tier"/><text x="337.74" y="110" text-anchor="middle" font-size="12" font-weight="600" class="fg-on">3</text><circle cx="453.74" cy="121" r="10" class="fg-tier"/><text x="453.74" y="125" text-anchor="middle" font-size="12" font-weight="600" class="fg-on">4</text><circle cx="686" cy="242" r="10" class="fg-tier"/><text x="686" y="246" text-anchor="middle" font-size="12" font-weight="600" class="fg-on">5</text><circle cx="34" cy="338" r="10" class="fg-tier"/><text x="34" y="342" text-anchor="middle" font-size="12" font-weight="600" class="fg-on">1</text><text x="52" y="342" font-size="12" class="fg-q">Окружение: Local — на вашем компьютере,</text><text x="52" y="357.84" font-size="12" class="fg-q">Cloud — в облаке Anthropic, SSH — на вашем</text><text x="52" y="373.68" font-size="12" class="fg-q">удалённом сервере. Новичку подойдёт Local.</text><circle cx="34" cy="401.52" r="10" class="fg-tier"/><text x="34" y="405.52" text-anchor="middle" font-size="12" font-weight="600" class="fg-on">2</text><text x="52" y="405.52" font-size="12" class="fg-q">Папка проекта. Claude работает внутри неё и не</text><text x="52" y="421.36" font-size="12" class="fg-q">трогает остальной компьютер.</text><circle cx="34" cy="449.2" r="10" class="fg-tier"/><text x="34" y="453.2" text-anchor="middle" font-size="12" font-weight="600" class="fg-on">3</text><text x="52" y="453.2" font-size="12" class="fg-q">Ветка Git: версия проекта, в которой идёт</text><text x="52" y="469.04" font-size="12" class="fg-q">работа.</text><circle cx="404" cy="338" r="10" class="fg-tier"/><text x="404" y="342" text-anchor="middle" font-size="12" font-weight="600" class="fg-on">4</text><text x="422" y="342" font-size="12" class="fg-q">Worktree: отдельная копия проекта для этой</text><text x="422" y="357.84" font-size="12" class="fg-q">сессии. Правки не смешаются с вашей основной</text><text x="422" y="373.68" font-size="12" class="fg-q">версией. Нужен установленный Git.</text><circle cx="404" cy="401.52" r="10" class="fg-tier"/><text x="404" y="405.52" text-anchor="middle" font-size="12" font-weight="600" class="fg-on">5</text><text x="422" y="405.52" font-size="12" class="fg-q">Поле ввода: опишите задачу. Файл можно</text><text x="422" y="421.36" font-size="12" class="fg-q">упомянуть через @ (в Local и SSH).</text></svg>