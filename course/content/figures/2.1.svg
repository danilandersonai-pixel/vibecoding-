<svg viewBox="0 0 760 390" role="img" aria-label="Каждый виток добавляет информацию, а не повторяет просьбу" font-size="13"><text x="24" y="28" font-size="15" font-weight="600" class="fg-t">Каждый виток добавляет информацию, а не повторяет просьбу</text><path d="M205 100H235" class="fg-ln" marker-end="url(#bk-arrow)"/><path d="M425 100H455" class="fg-ln" marker-end="url(#bk-arrow)"/><path d="M550 128V184" class="fg-ln" marker-end="url(#bk-arrow)"/><path d="M470 220H205" class="fg-ln" marker-end="url(#bk-arrow)"/><path d="M110 192V128" class="fg-ln" marker-end="url(#bk-arrow)"/><path d="M550 256V302" class="fg-ln" marker-end="url(#bk-arrow)"/><path d="M110 248V330H200" class="fg-ln fg-dash" marker-end="url(#bk-arrow)"/><rect x="15" y="72" width="190" height="56" rx="8" class="fg-box"/><text x="110" y="96" text-anchor="middle" font-weight="600" class="fg-t">Запрос</text><text x="110" y="114" text-anchor="middle" font-size="11.5" class="fg-q">цель, контекст, критерии</text><rect x="235" y="72" width="190" height="56" rx="8" class="fg-box"/><text x="330" y="96" text-anchor="middle" font-weight="600" class="fg-t">Результат ИИ</text><text x="330" y="114" text-anchor="middle" font-size="11.5" class="fg-q">код или план от модели</text><rect x="455" y="72" width="190" height="56" rx="8" class="fg-box"/><text x="550" y="96" text-anchor="middle" font-weight="600" class="fg-t">Проверка</text><text x="550" y="114" text-anchor="middle" font-size="11.5" class="fg-q">тесты и чтение изменений</text><polygon points="470,220 550,184 630,220 550,256" class="fg-box"/><text x="550" y="224" text-anchor="middle" font-weight="600" class="fg-t">Готово?</text><rect x="15" y="192" width="190" height="56" rx="8" class="fg-box"/><text x="110" y="216" text-anchor="middle" font-weight="600" class="fg-t">Уточнить запрос</text><text x="110" y="234" text-anchor="middle" font-size="11.5" class="fg-q">лог ошибки, пример</text><rect x="200" y="294" width="200" height="72" rx="8" class="fg-box fg-dash"/><text x="300" y="318" text-anchor="middle" font-weight="600" class="fg-t">Сменить подход</text><text x="300" y="336" text-anchor="middle" font-size="11.5" class="fg-q">разбить задачу, пример</text><text x="300" y="352" text-anchor="middle" font-size="11.5" class="fg-q">или новая сессия</text><rect x="455" y="302" width="190" height="56" rx="8" class="fg-hi"/><text x="550" y="326" text-anchor="middle" font-weight="600" class="fg-t">Принять</text><text x="550" y="344" text-anchor="middle" font-size="11.5" class="fg-t">коммит и вывод в правила</text><text x="338" y="212" text-anchor="middle" font-size="11.5" class="fg-q">нет</text><text x="560" y="284" font-size="11.5" class="fg-q">да</text><text x="120" y="280" font-size="11.5" class="fg-q">две попытки без прогресса</text></svg>