<svg viewBox="0 0 760 292" role="img" aria-label="Четыре навыка вместо набора кода" font-size="13"><text x="24" y="28" font-size="15" font-weight="600" class="fg-t">Четыре навыка вместо набора кода</text><rect x="24" y="62" width="157" height="126.28" rx="8" class="fg-box"/><text x="102.5" y="86.74" text-anchor="middle" font-weight="600" class="fg-t">Постановка</text><text x="102.5" y="103.64" text-anchor="middle" font-weight="600" class="fg-t">задачи</text><text x="102.5" y="123.54" text-anchor="middle" font-size="11.5" class="fg-q">Превратить «хочу как</text><text x="102.5" y="139.41" text-anchor="middle" font-size="11.5" class="fg-q">у них» в понятное и</text><text x="102.5" y="155.28" text-anchor="middle" font-size="11.5" class="fg-q">проверяемое</text><text x="102.5" y="171.15" text-anchor="middle" font-size="11.5" class="fg-q">описание</text><rect x="209" y="62" width="157" height="126.28" rx="8" class="fg-box"/><text x="287.5" y="95.19" text-anchor="middle" font-weight="600" class="fg-t">Декомпозиция</text><text x="287.5" y="115.09" text-anchor="middle" font-size="11.5" class="fg-q">Разбить большую</text><text x="287.5" y="130.96" text-anchor="middle" font-size="11.5" class="fg-q">задачу на части, с</text><text x="287.5" y="146.83" text-anchor="middle" font-size="11.5" class="fg-q">которыми ИИ</text><text x="287.5" y="162.7" text-anchor="middle" font-size="11.5" class="fg-q">справится надёжно</text><rect x="394" y="62" width="157" height="126.28" rx="8" class="fg-hi"/><text x="472.5" y="95.19" text-anchor="middle" font-weight="600" class="fg-t">Проверка</text><text x="472.5" y="115.09" text-anchor="middle" font-size="11.5" class="fg-q">Читать, запускать,</text><text x="472.5" y="130.96" text-anchor="middle" font-size="11.5" class="fg-q">тестировать и</text><text x="472.5" y="146.83" text-anchor="middle" font-size="11.5" class="fg-q">пытаться сломать то,</text><text x="472.5" y="162.7" text-anchor="middle" font-size="11.5" class="fg-q">что сделал ИИ</text><rect x="579" y="62" width="157" height="126.28" rx="8" class="fg-box"/><text x="657.5" y="95.19" text-anchor="middle" font-weight="600" class="fg-t">Интеграция</text><text x="657.5" y="115.09" text-anchor="middle" font-size="11.5" class="fg-q">Собрать части в</text><text x="657.5" y="130.96" text-anchor="middle" font-size="11.5" class="fg-q">систему, которую</text><text x="657.5" y="146.83" text-anchor="middle" font-size="11.5" class="fg-q">можно развивать</text><text x="657.5" y="162.7" text-anchor="middle" font-size="11.5" class="fg-q">годами</text><circle cx="40" cy="60" r="10" class="fg-tier"/><text x="40" y="64" text-anchor="middle" font-size="12" font-weight="600" class="fg-on">1</text><circle cx="225" cy="60" r="10" class="fg-tier"/><text x="225" y="64" text-anchor="middle" font-size="12" font-weight="600" class="fg-on">2</text><circle cx="410" cy="60" r="10" class="fg-tier"/><text x="410" y="64" text-anchor="middle" font-size="12" font-weight="600" class="fg-on">3</text><circle cx="595" cy="60" r="10" class="fg-tier"/><text x="595" y="64" text-anchor="middle" font-size="12" font-weight="600" class="fg-on">4</text><path d="M181 125.14L209 125.14" class="fg-ln" marker-end="url(#bk-arrow)"/><path d="M366 125.14L394 125.14" class="fg-ln" marker-end="url(#bk-arrow)"/><path d="M551 125.14L579 125.14" class="fg-ln" marker-end="url(#bk-arrow)"/><path d="M657.5 188.28L657.5 214.28L102.5 214.28L102.5 188.28" class="fg-ln fg-dash" marker-end="url(#bk-arrow)"/><text x="380" y="234.28" text-anchor="middle" font-size="11.5" class="fg-q">проект растёт — и всё повторяется</text><text x="24" y="270.28" font-size="12.5" class="fg-t">Ни один из этих навыков не требует печатать код. Они требуют ясно думать, и это можно тренировать.</text></svg>