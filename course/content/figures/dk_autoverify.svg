<svg viewBox="0 0 760 328" role="img" aria-label="Цикл Auto-verify: правка, запуск, проверка в панели Browser" font-size="13"><text x="24" y="28" font-size="15" font-weight="600" class="fg-t">Claude сам проверяет страницу после каждой правки</text><rect x="24" y="56" width="124" height="138" rx="8" class="fg-box"/><circle cx="42" cy="74" r="10" class="fg-tier"/><text x="42" y="78" text-anchor="middle" font-size="12" font-weight="600" class="fg-on">1</text><text x="36" y="100" font-size="12" font-weight="600" class="fg-t">Правит код</text><text x="36" y="117" font-size="11" class="fg-q">Меняет файлы по</text><text x="36" y="131.52" font-size="11" class="fg-q">вашей задаче</text><path d="M150 125H169" class="fg-ln" marker-end="url(#bk-arrow)"/><rect x="171" y="56" width="124" height="138" rx="8" class="fg-box"/><circle cx="189" cy="74" r="10" class="fg-tier"/><text x="189" y="78" text-anchor="middle" font-size="12" font-weight="600" class="fg-on">2</text><text x="183" y="100" font-size="12" font-weight="600" class="fg-t">Запускает</text><text x="183" y="115.84" font-size="12" font-weight="600" class="fg-t">сайт</text><text x="183" y="132.84" font-size="11" class="fg-q">Через меню Dev</text><text x="183" y="147.36" font-size="11" class="fg-q">servers, на вашем</text><text x="183" y="161.88" font-size="11" class="fg-q">компьютере</text><path d="M297 125H316" class="fg-ln" marker-end="url(#bk-arrow)"/><rect x="318" y="56" width="124" height="138" rx="8" class="fg-box"/><circle cx="336" cy="74" r="10" class="fg-tier"/><text x="336" y="78" text-anchor="middle" font-size="12" font-weight="600" class="fg-on">3</text><text x="330" y="100" font-size="12" font-weight="600" class="fg-t">Открывает</text><text x="330" y="115.84" font-size="12" font-weight="600" class="fg-t">страницу</text><text x="330" y="132.84" font-size="11" class="fg-q">В панели</text><text x="330" y="147.36" font-size="11" class="fg-q">Browser, как</text><text x="330" y="161.88" font-size="11" class="fg-q">обычный</text><text x="330" y="176.4" font-size="11" class="fg-q">посетитель</text><path d="M444 125H463" class="fg-ln" marker-end="url(#bk-arrow)"/><rect x="465" y="56" width="124" height="138" rx="8" class="fg-box"/><circle cx="483" cy="74" r="10" class="fg-tier"/><text x="483" y="78" text-anchor="middle" font-size="12" font-weight="600" class="fg-on">4</text><text x="477" y="100" font-size="12" font-weight="600" class="fg-t">Проверяет</text><text x="477" y="117" font-size="11" class="fg-q">Нажимает</text><text x="477" y="131.52" font-size="11" class="fg-q">кнопки,</text><text x="477" y="146.04" font-size="11" class="fg-q">заполняет</text><text x="477" y="160.56" font-size="11" class="fg-q">формы, делает</text><text x="477" y="175.08" font-size="11" class="fg-q">скриншоты</text><path d="M591 125H610" class="fg-ln" marker-end="url(#bk-arrow)"/><rect x="612" y="56" width="124" height="138" rx="8" class="fg-okbox"/><circle cx="630" cy="74" r="10" class="fg-tier"/><text x="630" y="78" text-anchor="middle" font-size="12" font-weight="600" class="fg-on">5</text><text x="624" y="100" font-size="12" font-weight="600" class="fg-t">Отвечает вам</text><text x="624" y="117" font-size="11" class="fg-q">Что получилось и</text><text x="624" y="131.52" font-size="11" class="fg-q">что не</text><text x="624" y="146.04" font-size="11" class="fg-q">получилось</text><path d="M527.0 196V222H86.0V198" class="fg-ln-risk" marker-end="url(#bk-arrow-risk)"/><text x="306.5" y="216" text-anchor="middle" font-size="11.5" font-weight="600" class="fg-riskt">нашёл ошибку: чинит и проверяет снова</text><rect x="24" y="250" width="712" height="56" rx="8" class="fg-hi"/><text x="40" y="269" font-size="12" class="fg-t">Что остаётся вам: посмотреть сайт своими глазами. Claude проверил то, что догадался проверить.</text><text x="40" y="284.84" font-size="12" class="fg-t">Выключить автопроверку можно в меню ⋮ панели Browser (пункт Auto-verify changes).</text></svg>