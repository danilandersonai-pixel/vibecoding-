<svg viewBox="0 0 760 379" role="img" aria-label="Вопросы перед стартом: сначала уточнение, потом код" font-size="13"><text x="24" y="28" font-size="15" font-weight="600" class="fg-t">Вопросы перед стартом: сначала уточнение, потом код</text><rect x="236" y="52" width="500" height="57.16" rx="8" class="fg-hi"/><text x="247" y="74.76" font-size="12" font-weight="600" class="fg-t">Вы</text><text x="247" y="91.36" font-size="12" class="fg-q">Мне нужен скрипт: раз в день отправлять отчёт из таблицы</text><circle cx="34" cy="80.58" r="10" class="fg-tier"/><text x="34" y="84.58" text-anchor="middle" font-size="12" font-weight="600" class="fg-on">1</text><rect x="56" y="121.16" width="500" height="73.72" rx="8" class="fg-box"/><text x="67" y="143.92" font-size="12" font-weight="600" class="fg-t">ИИ</text><text x="67" y="160.52" font-size="12" class="fg-q">Прежде чем писать: 1) куда отправлять отчёт? 2) в каком виде? 3) где</text><text x="67" y="177.08" font-size="12" class="fg-q">лежит таблица?</text><circle cx="34" cy="158.02" r="10" class="fg-tier"/><text x="34" y="162.02" text-anchor="middle" font-size="12" font-weight="600" class="fg-on">2</text><rect x="236" y="206.88" width="500" height="57.16" rx="8" class="fg-hi"/><text x="247" y="229.64" font-size="12" font-weight="600" class="fg-t">Вы</text><text x="247" y="246.24" font-size="12" class="fg-q">В почту, в PDF, таблица в Google Sheets</text><circle cx="34" cy="235.46" r="10" class="fg-tier"/><text x="34" y="239.46" text-anchor="middle" font-size="12" font-weight="600" class="fg-on">3</text><rect x="56" y="276.04" width="500" height="57.16" rx="8" class="fg-box"/><text x="67" y="298.8" font-size="12" font-weight="600" class="fg-t">ИИ</text><text x="67" y="315.4" font-size="12" class="fg-q">Понял. План из трёх шагов готов. Подтверждаете, чтобы я начал?</text><circle cx="34" cy="304.62" r="10" class="fg-tier"/><text x="34" y="308.62" text-anchor="middle" font-size="12" font-weight="600" class="fg-on">4</text><text x="24" y="357.2" font-size="11.5" class="fg-q">Вы ответили на вопросы до того, как ИИ написал первую строку: меньше переделок.</text></svg>