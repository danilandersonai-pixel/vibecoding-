<svg viewBox="0 0 760 379" role="img" aria-label="Git хранит историю проекта, как сохранения в игре" font-size="13"><text x="24" y="28" font-size="15" font-weight="600" class="fg-t">Git хранит историю проекта, как сохранения в игре</text><path d="M36 178L724 178" class="fg-ln" marker-end="url(#bk-arrow)"/><circle cx="70" cy="178" r="8" class="fg-tier"/><text x="70" y="204" text-anchor="middle" font-size="11.5" class="fg-t">Начало</text><circle cx="190" cy="178" r="8" class="fg-tier"/><text x="190" y="204" text-anchor="middle" font-size="11.5" class="fg-t">Форма входа</text><circle cx="310" cy="178" r="8" class="fg-tier"/><text x="310" y="204" text-anchor="middle" font-size="11.5" class="fg-t">Расчёт цены</text><circle cx="470" cy="178" r="8" class="fg-tier"/><text x="470" y="204" text-anchor="middle" font-size="11.5" class="fg-t">Корзина влита</text><circle cx="620" cy="178" r="8" class="fg-tier"/><text x="620" y="204" text-anchor="middle" font-size="11.5" class="fg-t">Ошибка</text><text x="620" y="219.18" text-anchor="middle" font-size="11.5" class="fg-t">исправлена</text><path d="M190 170C190 130 205 100 246 100" class="fg-ln fg-dash"/><path d="M246 100L420 100" class="fg-ln fg-dash"/><path d="M420 100C455 100 470 132 470 168" class="fg-ln fg-dash" marker-end="url(#bk-arrow)"/><circle cx="290" cy="100" r="7" class="fg-dot"/><text x="290" y="84" text-anchor="middle" font-size="11.5" class="fg-t">Новая корзина</text><circle cx="385" cy="100" r="7" class="fg-dot"/><text x="385" y="84" text-anchor="middle" font-size="11.5" class="fg-t">Правки</text><text x="488" y="122" font-size="11.5" class="fg-q">пул-реквест: изменения</text><text x="488" y="137.18" font-size="11.5" class="fg-q">проверили и присоединили</text><text x="36" y="104" font-size="11.5" class="fg-q">ветка</text><path d="M620 240C600 290 330 290 312 222" class="fg-ln fg-dash" marker-end="url(#bk-arrow)"/><text x="465" y="308" text-anchor="middle" font-size="11.5" class="fg-q">откат: вернуться к нужному сохранению</text><text x="24" y="342" font-size="11.5" class="fg-q">Каждая точка — коммит, то есть сохранение с подписью. Нижняя линия — основная версия проекта, верхняя</text><text x="24" y="357.18" font-size="11.5" class="fg-q">пунктирная — ветка, копия, где безопасно экспериментировать.</text></svg>