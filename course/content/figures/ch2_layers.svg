<svg viewBox="0 0 760 492" role="img" aria-label="Что модель видит в момент ответа: пять слоёв" font-size="13"><text x="24" y="28" font-size="15" font-weight="600" class="fg-t">Что модель видит в момент ответа: пять слоёв</text><rect x="24" y="48" width="408" height="328" rx="12" class="fg-box"/><text x="42" y="72" font-weight="600" class="fg-t">Контекстное окно</text><text x="170" y="72" font-size="11.5" class="fg-q">всё, что модель видит сейчас</text><rect x="40" y="92" width="376" height="46" rx="8" class="fg-box"/><text x="80" y="119.125" font-size="12.5" font-weight="600" class="fg-t">Системные инструкции инструмента</text><circle cx="60" cy="115" r="10" class="fg-tier"/><text x="60" y="119" text-anchor="middle" font-size="12" font-weight="600" class="fg-on">1</text><text x="452" y="113" font-size="11.5" class="fg-q">задаёт разработчик агента; вы их обычно не</text><text x="452" y="128.18" font-size="11.5" class="fg-q">видите</text><rect x="40" y="148" width="376" height="46" rx="8" class="fg-box"/><text x="80" y="175.125" font-size="12.5" font-weight="600" class="fg-t">Правила проекта: CLAUDE.md или AGENTS.md</text><circle cx="60" cy="171" r="10" class="fg-tier"/><text x="60" y="175" text-anchor="middle" font-size="12" font-weight="600" class="fg-on">2</text><text x="452" y="169" font-size="11.5" class="fg-q">вы пишете один раз, агент читает в начале</text><text x="452" y="184.18" font-size="11.5" class="fg-q">каждой сессии</text><rect x="40" y="204" width="376" height="46" rx="8" class="fg-box"/><text x="80" y="231.125" font-size="12.5" font-weight="600" class="fg-t">Файлы и результаты команд</text><circle cx="60" cy="227" r="10" class="fg-tier"/><text x="60" y="231" text-anchor="middle" font-size="12" font-weight="600" class="fg-on">3</text><text x="452" y="225" font-size="11.5" class="fg-q">агент прочитал сам или вы приложили</text><rect x="40" y="260" width="376" height="46" rx="8" class="fg-box"/><text x="80" y="287.125" font-size="12.5" font-weight="600" class="fg-t">История диалога</text><circle cx="60" cy="283" r="10" class="fg-tier"/><text x="60" y="287" text-anchor="middle" font-size="12" font-weight="600" class="fg-on">4</text><text x="452" y="281" font-size="11.5" class="fg-q">всё, что было сказано раньше; со временем</text><text x="452" y="296.18" font-size="11.5" class="fg-q">засоряется</text><rect x="40" y="316" width="376" height="46" rx="8" class="fg-hi"/><text x="80" y="343.125" font-size="12.5" font-weight="600" class="fg-t">Ваш текущий запрос</text><circle cx="60" cy="339" r="10" class="fg-tier"/><text x="60" y="343" text-anchor="middle" font-size="12" font-weight="600" class="fg-on">5</text><text x="452" y="337" font-size="11.5" class="fg-q">вы пишете его каждый раз</text><rect x="24" y="394" width="408" height="82" rx="8" class="fg-ghost"/><text x="228" y="420.92" text-anchor="middle" font-weight="600" class="fg-t">Всё остальное в проекте и в вашей голове</text><text x="228" y="440.82" text-anchor="middle" font-size="11.5" class="fg-q">Модель этого не знает, пока вы не скажете или не дадите</text><text x="228" y="456.69" text-anchor="middle" font-size="11.5" class="fg-q">прочитать</text></svg>