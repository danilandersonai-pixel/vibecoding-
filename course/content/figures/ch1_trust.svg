<svg viewBox="0 0 760 340" role="img" aria-label="Три уровня доверия к цифрам о модели" font-size="13"><text x="24" y="28" font-size="15" font-weight="600" class="fg-t">Насколько доверять цифрам о модели</text><path d="M40 280V66" class="fg-ln-acc" marker-end="url(#bk-arrow-acc)"/><text x="48" y="74" font-size="11" font-weight="600" class="fg-acc">больше</text><text x="48" y="88" font-size="11" font-weight="600" class="fg-acc">доверия</text><rect x="150" y="60" width="200" height="62" rx="8" class="fg-hi"/><text x="250.0" y="86" text-anchor="middle" font-weight="600" class="fg-t">Ваш мини-набор</text><text x="250.0" y="105" text-anchor="middle" font-size="11.5" class="fg-q">5–10 ваших задач</text><text x="466" y="86" font-size="12" class="fg-q">Отвечает на ваш вопрос: справится ли</text><text x="466" y="102" font-size="12" class="fg-q">модель именно с вашим проектом</text><rect x="110" y="140" width="280" height="62" rx="8" class="fg-box"/><text x="250.0" y="166" text-anchor="middle" font-weight="600" class="fg-t">Независимые замеры</text><text x="250.0" y="185" text-anchor="middle" font-size="11.5" class="fg-q">Artificial Analysis, Arena, Epoch AI</text><text x="466" y="166" font-size="12" class="fg-q">Одинаковые условия для всех моделей,</text><text x="466" y="182" font-size="12" class="fg-q">но насыщение и загрязнение возможны</text><rect x="70" y="220" width="360" height="62" rx="8" class="fg-zone"/><text x="250.0" y="246" text-anchor="middle" font-weight="600" class="fg-t">Анонс производителя</text><text x="250.0" y="265" text-anchor="middle" font-size="11.5" class="fg-q">карточка модели, блог, презентация</text><text x="466" y="246" font-size="12" class="fg-q">Полезная карта возможностей, но тесты</text><text x="466" y="262" font-size="12" class="fg-q">и условия замера выбирает сама компания</text><text x="380" y="318" text-anchor="middle" font-size="11.5" class="fg-q">Чем выше уровень, тем ближе проверка к вашей реальной работе. Хороший выбор опирается на все три.</text></svg>