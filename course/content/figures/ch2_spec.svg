<svg viewBox="0 0 760 253" role="img" aria-label="Разработка от спецификации: четыре шага" font-size="13"><text x="24" y="28" font-size="15" font-weight="600" class="fg-t">Разработка от спецификации: четыре шага</text><rect x="24" y="76" width="157" height="109.38" rx="8" class="fg-hi"/><text x="102.5" y="100.74" text-anchor="middle" font-weight="600" class="fg-t">Спецификация</text><text x="102.5" y="120.64" text-anchor="middle" font-size="11.5" class="fg-q">Что должна делать</text><text x="102.5" y="136.51" text-anchor="middle" font-size="11.5" class="fg-q">программа, но не</text><text x="102.5" y="152.38" text-anchor="middle" font-size="11.5" class="fg-q">как. Редактируете вы</text><text x="102.5" y="168.25" text-anchor="middle" font-size="11.5" class="fg-q">сами</text><rect x="209" y="76" width="157" height="109.38" rx="8" class="fg-box"/><text x="287.5" y="100.74" text-anchor="middle" font-weight="600" class="fg-t">План</text><text x="287.5" y="120.64" text-anchor="middle" font-size="11.5" class="fg-q">Из каких частей</text><text x="287.5" y="136.51" text-anchor="middle" font-size="11.5" class="fg-q">состоит программа,</text><text x="287.5" y="152.38" text-anchor="middle" font-size="11.5" class="fg-q">где данные, в каком</text><text x="287.5" y="168.25" text-anchor="middle" font-size="11.5" class="fg-q">порядке делать</text><rect x="394" y="76" width="157" height="109.38" rx="8" class="fg-box"/><text x="472.5" y="100.74" text-anchor="middle" font-weight="600" class="fg-t">Задачи</text><text x="472.5" y="120.64" text-anchor="middle" font-size="11.5" class="fg-q">Размером в один</text><text x="472.5" y="136.51" text-anchor="middle" font-size="11.5" class="fg-q">коммит; у каждой</text><text x="472.5" y="152.38" text-anchor="middle" font-size="11.5" class="fg-q">записано, как понять,</text><text x="472.5" y="168.25" text-anchor="middle" font-size="11.5" class="fg-q">что она готова</text><rect x="579" y="76" width="157" height="109.38" rx="8" class="fg-box"/><text x="657.5" y="100.74" text-anchor="middle" font-weight="600" class="fg-t">Исполнение</text><text x="657.5" y="120.64" text-anchor="middle" font-size="11.5" class="fg-q">Задачи отдаёте по</text><text x="657.5" y="136.51" text-anchor="middle" font-size="11.5" class="fg-q">одной и проверяете</text><text x="657.5" y="152.38" text-anchor="middle" font-size="11.5" class="fg-q">каждую до</text><text x="657.5" y="168.25" text-anchor="middle" font-size="11.5" class="fg-q">следующей</text><circle cx="40" cy="74" r="10" class="fg-tier"/><text x="40" y="78" text-anchor="middle" font-size="12" font-weight="600" class="fg-on">1</text><circle cx="225" cy="74" r="10" class="fg-tier"/><text x="225" y="78" text-anchor="middle" font-size="12" font-weight="600" class="fg-on">2</text><circle cx="410" cy="74" r="10" class="fg-tier"/><text x="410" y="78" text-anchor="middle" font-size="12" font-weight="600" class="fg-on">3</text><circle cx="595" cy="74" r="10" class="fg-tier"/><text x="595" y="78" text-anchor="middle" font-size="12" font-weight="600" class="fg-on">4</text><path d="M181 130.69L209 130.69" class="fg-ln" marker-end="url(#bk-arrow)"/><path d="M366 130.69L394 130.69" class="fg-ln" marker-end="url(#bk-arrow)"/><path d="M551 130.69L579 130.69" class="fg-ln" marker-end="url(#bk-arrow)"/><path d="M657.5 185.38L657.5 211.38L472.5 211.38L472.5 185.38" class="fg-ln fg-dash" marker-end="url(#bk-arrow)"/><text x="565" y="231.38" text-anchor="middle" font-size="11.5" class="fg-q">проверили — следующая задача</text><path d="M24 201.38L366 201.38" class="fg-ln"/><text x="24" y="221.38" font-size="11.5" class="fg-q">Здесь вы разбираетесь в задаче лучше ИИ.</text></svg>