<svg viewBox="0 0 760 340" role="img" aria-label="Инъекция: чем отличается склеенный запрос от запроса с параметром" font-size="13"><text x="24" y="28" font-size="15" font-weight="600" class="fg-t">Инъекция: чем отличается склеенный запрос от запроса с параметром</text><text x="24" y="62" font-weight="600" class="fg-riskt">Опасно: запрос склеен из текста</text><rect x="24" y="76" width="213.333" height="102" rx="8" class="fg-box"/><text x="130.667" y="104.47" text-anchor="middle" font-weight="600" class="fg-t">Пользователь пишет в</text><text x="130.667" y="121.37" text-anchor="middle" font-weight="600" class="fg-t">поле «Email»</text><text x="130.667" y="141.27" text-anchor="middle" font-size="11.5" class="fg-q">не адрес, а команду: x' OR</text><text x="130.667" y="157.14" text-anchor="middle" font-size="11.5" class="fg-q">'1'='1</text><rect x="273.333" y="76" width="213.333" height="102" rx="8" class="fg-riskbox"/><text x="380" y="112.92" text-anchor="middle" font-weight="600" class="fg-t">Программа склеивает</text><text x="380" y="132.82" text-anchor="middle" font-size="11.5" class="fg-q">Команда становится частью</text><text x="380" y="148.69" text-anchor="middle" font-size="11.5" class="fg-q">запроса к базе</text><rect x="522.667" y="76" width="213.333" height="102" rx="8" class="fg-riskbox"/><text x="629.333" y="112.405" text-anchor="middle" font-weight="600" class="fg-t">База выполняет всё</text><text x="629.333" y="129.305" text-anchor="middle" font-weight="600" class="fg-t">подряд</text><text x="629.333" y="149.205" text-anchor="middle" font-size="11.5" class="fg-q">В ответ утекают все записи</text><path d="M237.333 127L273.333 127" class="fg-ln" marker-end="url(#bk-arrow)"/><path d="M486.667 127L522.667 127" class="fg-ln" marker-end="url(#bk-arrow)"/><text x="24" y="208" font-weight="600" class="fg-okt">Безопасно: значение передаётся параметром</text><rect x="24" y="222" width="213.333" height="102" rx="8" class="fg-box"/><text x="130.667" y="258.405" text-anchor="middle" font-weight="600" class="fg-t">Пользователь пишет то же</text><text x="130.667" y="275.305" text-anchor="middle" font-weight="600" class="fg-t">самое</text><text x="130.667" y="295.205" text-anchor="middle" font-size="11.5" class="fg-q">x' OR '1'='1</text><rect x="273.333" y="222" width="213.333" height="102" rx="8" class="fg-okbox"/><text x="380" y="250.47" text-anchor="middle" font-weight="600" class="fg-t">Запрос и значение</text><text x="380" y="267.37" text-anchor="middle" font-weight="600" class="fg-t">отдельно</text><text x="380" y="287.27" text-anchor="middle" font-size="11.5" class="fg-q">Программа передаёт значение</text><text x="380" y="303.14" text-anchor="middle" font-size="11.5" class="fg-q">как «пакет с наклейкой»</text><rect x="522.667" y="222" width="213.333" height="102" rx="8" class="fg-okbox"/><text x="629.333" y="250.47" text-anchor="middle" font-weight="600" class="fg-t">База считает это просто</text><text x="629.333" y="267.37" text-anchor="middle" font-weight="600" class="fg-t">текстом</text><text x="629.333" y="287.27" text-anchor="middle" font-size="11.5" class="fg-q">Такой почты нет, ничего не</text><text x="629.333" y="303.14" text-anchor="middle" font-size="11.5" class="fg-q">найдено</text><path d="M237.333 273L273.333 273" class="fg-ln" marker-end="url(#bk-arrow)"/><path d="M486.667 273L522.667 273" class="fg-ln" marker-end="url(#bk-arrow)"/></svg>