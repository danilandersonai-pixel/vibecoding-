<svg viewBox="0 0 760 434" role="img" aria-label="Режимы разрешений десктопного приложения Claude Code" font-size="13"><text x="24" y="28" font-size="15" font-weight="600" class="fg-t">Пять режимов разрешений: от осторожного к свободному</text><text x="60" y="60" font-size="10" font-weight="600" class="fg-q">РЕЖИМ</text><text x="214" y="60" font-size="10" font-weight="600" class="fg-q">ЧТО ДЕЛАЕТ</text><text x="560" y="60" font-size="10" font-weight="600" class="fg-q">КОГДА БРАТЬ</text><rect x="60" y="74" width="140" height="50" rx="8" class="fg-hi"/><text x="130" y="103" text-anchor="middle" font-size="11.5" font-weight="600" class="fg-acc">Plan</text><text x="214" y="94" font-size="11.5" class="fg-t">Только изучает проект и предлагает план. Код не</text><text x="214" y="110" font-size="11.5" class="fg-t">трогает.</text><text x="560" y="94" font-size="11.5" class="fg-q">Задача большая или</text><text x="560" y="110" font-size="11.5" class="fg-q">непонятная</text><rect x="60" y="132" width="140" height="50" rx="8" class="fg-okbox"/><text x="130" y="161" text-anchor="middle" font-size="11.5" font-weight="600" class="fg-ok">Manual</text><text x="214" y="152" font-size="11.5" class="fg-t">Спрашивает перед каждой правкой и каждой</text><text x="214" y="168" font-size="11.5" class="fg-t">командой.</text><text x="560" y="152" font-size="11.5" class="fg-q">Первые недели и важные</text><text x="560" y="168" font-size="11.5" class="fg-q">места проекта</text><rect x="60" y="190" width="140" height="66" rx="8" class="fg-box"/><text x="130" y="227" text-anchor="middle" font-size="11.5" font-weight="600" class="fg-t">Accept edits</text><text x="214" y="210" font-size="11.5" class="fg-t">Правки принимает сам. Простые команды тоже.</text><text x="214" y="226" font-size="11.5" class="fg-t">Остальные спрашивает.</text><text x="560" y="210" font-size="11.5" class="fg-q">План согласован,</text><text x="560" y="226" font-size="11.5" class="fg-q">изменения вы посмотрите</text><text x="560" y="242" font-size="11.5" class="fg-q">потом</text><rect x="60" y="264" width="140" height="66" rx="8" class="fg-box"/><text x="130" y="301" text-anchor="middle" font-size="11.5" font-weight="600" class="fg-t">Auto</text><text x="214" y="284" font-size="11.5" class="fg-t">Работает без обычных вопросов, а отдельная</text><text x="214" y="300" font-size="11.5" class="fg-t">проверка следит за командами и сетью. Есть не</text><text x="214" y="316" font-size="11.5" class="fg-t">всегда.</text><text x="560" y="284" font-size="11.5" class="fg-q">Длинные понятные задачи,</text><text x="560" y="300" font-size="11.5" class="fg-q">когда есть сохранённая</text><text x="560" y="316" font-size="11.5" class="fg-q">копия</text><rect x="60" y="338" width="140" height="50" rx="8" class="fg-riskbox"/><text x="130" y="367" text-anchor="middle" font-size="11.5" font-weight="600" class="fg-riskt">Bypass permissions</text><text x="214" y="358" font-size="11.5" class="fg-t">Никаких вопросов вообще. По умолчанию</text><text x="214" y="374" font-size="11.5" class="fg-t">выключен, включается в настройках.</text><text x="560" y="358" font-size="11.5" class="fg-q">Только в одноразовой</text><text x="560" y="374" font-size="11.5" class="fg-q">песочнице</text><path d="M34 140V382" class="fg-ln-acc" marker-end="url(#bk-arrow-acc)"/><text x="60" y="408" font-size="11.5" class="fg-q">Стрелка слева: чем ниже режим, тем меньше вопросов к вам и тем выше риск.</text></svg>