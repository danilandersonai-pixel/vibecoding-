<svg viewBox="0 0 760 362" role="img" aria-label="Скриншот с пометкой понятнее абзаца текста" font-size="13"><text x="24" y="28" font-size="15" font-weight="600" class="fg-t">Скриншот с пометкой понятнее абзаца текста</text><rect x="24" y="52" width="340" height="220" rx="8" class="fg-win"/><path d="M24 78V60Q24 52 32 52H356Q364 52 364 60V78Z" class="fg-bar"/><circle cx="38" cy="65" r="3.5" class="fg-dot"/><circle cx="51" cy="65" r="3.5" class="fg-dot"/><circle cx="64" cy="65" r="3.5" class="fg-dot"/><text x="194" y="69" text-anchor="middle" font-size="11" class="fg-q">Приложение</text><text x="44" y="100" font-size="14" font-weight="600" class="fg-t">Мои привычки</text><rect x="44" y="114" width="250" height="28" rx="6" class="fg-box"/><text x="56" y="133" font-size="12" class="fg-t">Зарядка</text><rect x="236" y="119" width="50" height="18" rx="9" class="fg-line"/><text x="261" y="132" text-anchor="middle" font-size="10" class="fg-q">ок</text><rect x="44" y="150" width="250" height="28" rx="6" class="fg-box"/><text x="56" y="169" font-size="12" class="fg-t">Вода</text><rect x="236" y="155" width="50" height="18" rx="9" class="fg-line"/><text x="261" y="168" text-anchor="middle" font-size="10" class="fg-q">ок</text><rect x="224" y="142" width="76" height="44" rx="10" class="fg-riskbox"/><path d="M262 214 L262 190" class="fg-riskln" marker-end="url(#bk-arrow)"/><text x="44" y="226" font-size="11.5" class="fg-riskt">← кнопка слишком бледная</text><text x="44" y="244" font-size="11" class="fg-q">(пометка на скриншоте)</text><path d="M364 160L408 160" class="fg-ln" marker-end="url(#bk-arrow)"/><rect x="408" y="86" width="328" height="136" rx="8" class="fg-hi"/><text x="420" y="130.12" font-size="12" font-weight="600" class="fg-t">Сообщение ИИ</text><text x="420" y="149.72" font-size="12" class="fg-q">[Вложен скриншот]</text><text x="420" y="166.28" font-size="12" class="fg-q">Сделай кнопку «ок» крупнее и ярче. Остальное</text><text x="420" y="182.84" font-size="12" class="fg-q">не трогай.</text><circle cx="34" cy="305" r="10" class="fg-tier"/><text x="34" y="309" text-anchor="middle" font-size="12" font-weight="600" class="fg-on">1</text><text x="52" y="309" font-size="12" class="fg-q">Сделайте снимок экрана</text><circle cx="280" cy="305" r="10" class="fg-tier"/><text x="280" y="309" text-anchor="middle" font-size="12" font-weight="600" class="fg-on">2</text><text x="298" y="309" font-size="12" class="fg-q">Обведите нужное и</text><text x="298" y="324.84" font-size="12" class="fg-q">подпишите, что не так</text><circle cx="526" cy="305" r="10" class="fg-tier"/><text x="526" y="309" text-anchor="middle" font-size="12" font-weight="600" class="fg-on">3</text><text x="544" y="309" font-size="12" class="fg-q">Приложите к запросу и</text><text x="544" y="324.84" font-size="12" class="fg-q">коротко напишите, что</text><text x="544" y="340.68" font-size="12" class="fg-q">изменить</text></svg>