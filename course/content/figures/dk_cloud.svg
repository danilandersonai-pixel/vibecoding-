<svg viewBox="0 0 760 384" role="img" aria-label="Три окружения: Local, Cloud и SSH" font-size="13"><text x="24" y="28" font-size="15" font-weight="600" class="fg-t">Где работает Claude: Local, Cloud или SSH</text><rect x="24" y="52" width="228" height="258" rx="10" class="fg-win"/><rect x="36" y="64" width="204" height="26" rx="6" class="fg-hi"/><text x="138" y="81.38" text-anchor="middle" font-size="12.5" font-weight="600" class="fg-acc">Local</text><text x="38" y="116" font-size="9.5" font-weight="600" class="fg-q">ГДЕ</text><text x="38" y="129.5" font-size="11.5" class="fg-t">На вашем компьютере</text><text x="38" y="153.5" font-size="9.5" font-weight="600" class="fg-q">ФАЙЛЫ</text><text x="38" y="167" font-size="11.5" class="fg-t">Ваши папки и проекты</text><text x="38" y="191" font-size="9.5" font-weight="600" class="fg-q">ПОДХОДИТ</text><text x="38" y="204.5" font-size="11.5" class="fg-t">Обычная работа, когда вы</text><text x="38" y="219.68" font-size="11.5" class="fg-t">рядом с экраном</text><text x="38" y="243.68" font-size="9.5" font-weight="600" class="fg-q">ОСОБЕННОСТЬ</text><text x="38" y="257.18" font-size="11.5" class="fg-t">Компьютер должен быть</text><text x="38" y="272.36" font-size="11.5" class="fg-t">включён</text><rect x="266" y="52" width="228" height="258" rx="10" class="fg-win"/><rect x="278" y="64" width="204" height="26" rx="6" class="fg-bar"/><text x="380" y="81.38" text-anchor="middle" font-size="12.5" font-weight="600" class="fg-t">Cloud</text><text x="280" y="116" font-size="9.5" font-weight="600" class="fg-q">ГДЕ</text><text x="280" y="129.5" font-size="11.5" class="fg-t">В облаке Anthropic</text><text x="280" y="153.5" font-size="9.5" font-weight="600" class="fg-q">ФАЙЛЫ</text><text x="280" y="167" font-size="11.5" class="fg-t">Репозиторий на GitHub, можно</text><text x="280" y="182.18" font-size="11.5" class="fg-t">несколько</text><text x="280" y="206.18" font-size="9.5" font-weight="600" class="fg-q">ПОДХОДИТ</text><text x="280" y="219.68" font-size="11.5" class="fg-t">Долгие задачи, пока вы заняты</text><text x="280" y="234.86" font-size="11.5" class="fg-t">другим</text><text x="280" y="258.86" font-size="9.5" font-weight="600" class="fg-q">ОСОБЕННОСТЬ</text><text x="280" y="272.36" font-size="11.5" class="fg-t">Продолжается, даже если</text><text x="280" y="287.54" font-size="11.5" class="fg-t">закрыть приложение</text><rect x="508" y="52" width="228" height="258" rx="10" class="fg-win"/><rect x="520" y="64" width="204" height="26" rx="6" class="fg-bar"/><text x="622" y="81.38" text-anchor="middle" font-size="12.5" font-weight="600" class="fg-t">SSH</text><text x="522" y="116" font-size="9.5" font-weight="600" class="fg-q">ГДЕ</text><text x="522" y="129.5" font-size="11.5" class="fg-t">На вашем удалённом сервере</text><text x="522" y="153.5" font-size="9.5" font-weight="600" class="fg-q">ФАЙЛЫ</text><text x="522" y="167" font-size="11.5" class="fg-t">Папки на этом сервере</text><text x="522" y="191" font-size="9.5" font-weight="600" class="fg-q">ПОДХОДИТ</text><text x="522" y="204.5" font-size="11.5" class="fg-t">Проект уже лежит на другой</text><text x="522" y="219.68" font-size="11.5" class="fg-t">машине</text><text x="522" y="243.68" font-size="9.5" font-weight="600" class="fg-q">ОСОБЕННОСТЬ</text><text x="522" y="257.18" font-size="11.5" class="fg-t">Нужны адрес сервера, порт и</text><text x="522" y="272.36" font-size="11.5" class="fg-t">ключ</text><rect x="24" y="322" width="712" height="40" rx="8" class="fg-hi"/><text x="40" y="347" font-size="12" class="fg-t">В Cloud нет режимов Manual и Bypass. На Windows есть четвёртый вариант — WSL.</text></svg>