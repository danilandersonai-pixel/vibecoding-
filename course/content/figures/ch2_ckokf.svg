<svg viewBox="0 0 760 454" role="img" aria-label="Хороший запрос: пять вопросов к себе" font-size="13"><text x="24" y="28" font-size="15" font-weight="600" class="fg-t">Хороший запрос: пять вопросов к себе</text><text x="24" y="56" font-size="11.5" class="fg-q">Что вы себе отвечаете</text><text x="330" y="56" font-size="11.5" class="fg-q">Так это выглядит в запросе</text><rect x="322" y="60" width="414" height="378" rx="10" class="fg-zone"/><rect x="24" y="68" width="266" height="66" rx="8" class="fg-hi"/><text x="68" y="94.855" font-weight="600" class="fg-t">Цель</text><text x="68" y="114.755" font-size="11.5" class="fg-q">Что и зачем нужно?</text><circle cx="46" cy="101" r="12" class="fg-tier"/><text x="46" y="105.5" text-anchor="middle" font-weight="600" class="fg-on">Ц</text><path d="M290 101L322 101" class="fg-ln fg-dots"/><text x="340" y="98" font-size="12" class="fg-t">Добавить выгрузку отчёта в таблицу, чтобы бухгалтерия</text><text x="340" y="113.84" font-size="12" class="fg-t">открыла её в Excel</text><rect x="24" y="142" width="266" height="66" rx="8" class="fg-box"/><text x="68" y="168.855" font-weight="600" class="fg-t">Контекст</text><text x="68" y="188.755" font-size="11.5" class="fg-q">Где это живёт и что уже есть?</text><circle cx="46" cy="175" r="12" class="fg-tier"/><text x="46" y="179.5" text-anchor="middle" font-weight="600" class="fg-on">К</text><path d="M290 175L322 175" class="fg-ln fg-dots"/><text x="340" y="172" font-size="12" class="fg-t">Отчёты лежат в src/reports/, данные приходят из</text><text x="340" y="187.84" font-size="12" class="fg-t">ReportService</text><rect x="24" y="216" width="266" height="66" rx="8" class="fg-box"/><text x="68" y="242.855" font-weight="600" class="fg-t">Ограничения</text><text x="68" y="262.755" font-size="11.5" class="fg-q">Чего нельзя или что обязательно?</text><circle cx="46" cy="249" r="12" class="fg-tier"/><text x="46" y="253.5" text-anchor="middle" font-weight="600" class="fg-on">О</text><path d="M290 249L322 249" class="fg-ln fg-dots"/><text x="340" y="246" font-size="12" class="fg-t">Без новых библиотек; русский текст должен открываться</text><text x="340" y="261.84" font-size="12" class="fg-t">без «кракозябр»</text><rect x="24" y="290" width="266" height="66" rx="8" class="fg-box"/><text x="68" y="316.855" font-weight="600" class="fg-t">Критерий готовности</text><text x="68" y="336.755" font-size="11.5" class="fg-q">Как понять, что всё сделано?</text><circle cx="46" cy="323" r="12" class="fg-tier"/><text x="46" y="327.5" text-anchor="middle" font-weight="600" class="fg-on">К</text><path d="M290 323L322 323" class="fg-ln fg-dots"/><text x="340" y="320" font-size="12" class="fg-t">Автоматическая проверка проходит, файл открывается</text><text x="340" y="335.84" font-size="12" class="fg-t">нормально</text><rect x="24" y="364" width="266" height="66" rx="8" class="fg-box"/><text x="68" y="390.855" font-weight="600" class="fg-t">Формат ответа</text><text x="68" y="410.755" font-size="11.5" class="fg-q">В каком виде вернуть результат?</text><circle cx="46" cy="397" r="12" class="fg-tier"/><text x="46" y="401.5" text-anchor="middle" font-weight="600" class="fg-on">Ф</text><path d="M290 397L322 397" class="fg-ln fg-dots"/><text x="340" y="394" font-size="12" class="fg-t">Показать список изменений и объяснить простыми</text><text x="340" y="409.84" font-size="12" class="fg-t">словами</text></svg>