<svg viewBox="0 0 760 350" role="img" aria-label="Режим Plan: Claude сначала предлагает план, код не меняет" font-size="13"><text x="24" y="28" font-size="15" font-weight="600" class="fg-t">Режим Plan: сначала план, потом код</text><circle cx="34" cy="66" r="10" class="fg-tier"/><text x="34" y="70" text-anchor="middle" font-size="12" font-weight="600" class="fg-on">1</text><text x="52" y="70" font-size="12" font-weight="600" class="fg-t">Выберите режим Plan</text><rect x="24" y="86" width="224" height="190" rx="8" class="fg-win"/><path d="M251 181H265" class="fg-ln" marker-end="url(#bk-arrow)"/><circle cx="278" cy="66" r="10" class="fg-tier"/><text x="278" y="70" text-anchor="middle" font-size="12" font-weight="600" class="fg-on">2</text><text x="296" y="70" font-size="12" font-weight="600" class="fg-t">Claude пишет план</text><rect x="268" y="86" width="224" height="190" rx="8" class="fg-win"/><path d="M495 181H509" class="fg-ln" marker-end="url(#bk-arrow)"/><circle cx="522" cy="66" r="10" class="fg-tier"/><text x="522" y="70" text-anchor="middle" font-size="12" font-weight="600" class="fg-on">3</text><text x="540" y="70" font-size="12" font-weight="600" class="fg-t">Уточните и дайте добро</text><rect x="512" y="86" width="224" height="190" rx="8" class="fg-win"/><rect x="36" y="98" width="84" height="22" rx="11" class="fg-hi"/><text x="78" y="112.85" text-anchor="middle" font-size="11" font-weight="600" class="fg-acc">Plan ▾</text><rect x="36" y="132" width="200" height="26" rx="6" class="fg-bar"/><text x="48" y="149" font-size="11.5" class="fg-t">Manual</text><rect x="36" y="164" width="200" height="26" rx="6" class="fg-bar"/><text x="48" y="181" font-size="11.5" class="fg-t">Accept edits</text><rect x="36" y="196" width="200" height="26" rx="6" class="fg-sel"/><text x="48" y="213" font-size="11.5" font-weight="600" class="fg-t">Plan</text><text x="224" y="213" text-anchor="end" font-size="12" font-weight="600" class="fg-acc">✓</text><rect x="36" y="228" width="200" height="26" rx="6" class="fg-bar"/><text x="48" y="245" font-size="11.5" class="fg-t">Auto</text><text x="280" y="112" font-size="11" font-weight="600" class="fg-t">Задача: форма входа</text><rect x="280" y="126" width="200" height="22" rx="5" class="fg-bar"/><text x="290" y="142" font-size="11" class="fg-t">1. Страница src/form.ts</text><rect x="280" y="154" width="200" height="22" rx="5" class="fg-bar"/><text x="290" y="170" font-size="11" class="fg-t">2. Проверка пароля</text><rect x="280" y="182" width="200" height="22" rx="5" class="fg-bar"/><text x="290" y="198" font-size="11" class="fg-t">3. Тест на пустой пароль</text><rect x="280" y="210" width="200" height="22" rx="5" class="fg-bar"/><text x="290" y="226" font-size="11" class="fg-t">4. Сообщение об ошибке</text><rect x="280" y="244" width="200" height="24" rx="6" class="fg-okbox"/><text x="380" y="260" text-anchor="middle" font-size="11" font-weight="600" class="fg-ok">Файлов изменено: 0</text><rect x="540" y="100" width="184" height="40" rx="8" class="fg-sel"/><text x="550" y="115" font-size="11" class="fg-t">Пункт 4 не нужен,</text><text x="550" y="129.52" font-size="11" class="fg-t">остальное делай</text><text x="524" y="168" font-size="11" class="fg-q">Переключите режим:</text><rect x="524" y="178" width="76" height="22" rx="11" class="fg-bar"/><text x="562" y="192.85" text-anchor="middle" font-size="11" class="fg-t">Plan ▾</text><text x="612" y="194" text-anchor="middle" font-size="14" font-weight="600" class="fg-t">→</text><rect x="626" y="178" width="104.23" height="22" rx="11" class="fg-hi"/><text x="678.12" y="192.85" text-anchor="middle" font-size="11" font-weight="600" class="fg-acc">Accept edits ▾</text><text x="524" y="228" font-size="11.5" class="fg-t">Теперь Claude правит файлы</text><text x="524" y="246" font-size="11.5" class="fg-t">по согласованному плану.</text><rect x="24" y="292" width="712" height="36" rx="8" class="fg-hi"/><text x="40" y="315" font-size="12" class="fg-t">Режим Plan действует только в текущей сессии. В новой сессии режим выбирают заново.</text></svg>