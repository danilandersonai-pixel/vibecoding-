<svg viewBox="0 0 760 364" role="img" aria-label="Т-образный профиль: ширина — от ИИ, глубина — от вас" font-size="13"><text x="24" y="28" font-size="15" font-weight="600" class="fg-t">Т-образный профиль: ширина — от ИИ, глубина — от вас</text><rect x="40" y="62" width="400" height="86" rx="10" class="fg-tier" style="fill-opacity:.14"/><rect x="190" y="148" width="100" height="200" rx="10" class="fg-tier" style="fill-opacity:.28"/><text x="240" y="96" text-anchor="middle" font-weight="600" class="fg-t">Широкая база по многим темам</text><text x="240" y="118" text-anchor="middle" font-size="11.5" class="fg-q">безопасность, данные, интерфейс, тесты, выкладывание</text><text x="240" y="186" text-anchor="middle" font-size="12.5" font-weight="600" class="fg-t">Одна-две</text><text x="240" y="202.5" text-anchor="middle" font-size="12.5" font-weight="600" class="fg-t">области</text><text x="240" y="219" text-anchor="middle" font-size="12.5" font-weight="600" class="fg-t">глубоко</text><text x="240" y="258" text-anchor="middle" font-size="11.5" class="fg-q">ваша</text><text x="240" y="273.18" text-anchor="middle" font-size="11.5" class="fg-q">предметная</text><text x="240" y="288.36" text-anchor="middle" font-size="11.5" class="fg-q">область</text><path d="M440 105L488 105" class="fg-ln fg-dots"/><text x="496" y="100" font-weight="600" class="fg-t">Ширину закрывает ИИ</text><text x="496" y="118" font-size="11.5" class="fg-q">Он быстро подскажет основы любой</text><text x="496" y="133.18" font-size="11.5" class="fg-q">темы и сделает рутину.</text><path d="M290 246L488 246" class="fg-ln fg-dots"/><text x="496" y="236" font-weight="600" class="fg-t">Глубина — за человеком</text><text x="496" y="254" font-size="11.5" class="fg-q">Сфера, которую вы знаете лучше всех:</text><text x="496" y="269.18" font-size="11.5" class="fg-q">бухгалтерия, медицина, доставка.</text><text x="496" y="284.36" font-size="11.5" class="fg-q">Именно вы скажете, что приложение</text><text x="496" y="299.54" font-size="11.5" class="fg-q">делает не то.</text></svg>