<svg viewBox="0 0 760 349" role="img" aria-label="Режим Manual: правку можно принять или отклонить" font-size="13"><text x="24" y="28" font-size="15" font-weight="600" class="fg-t">Режим Manual: Claude просит, вы решаете</text><rect x="24" y="48" width="440" height="262" rx="10" class="fg-win"/><text x="40" y="74" font-size="12" font-weight="600" class="fg-t">Хочу изменить src/form.ts</text><rect x="40" y="88" width="408" height="112" rx="8" class="fg-box"/><text x="52" y="108" font-size="11" class="fg-t fg-mono" xml:space="preserve">src/form.ts</text><text x="436" y="108" text-anchor="end" font-size="11" font-weight="600" class="fg-ok">+1 −1</text><rect x="52" y="118" width="384" height="20" rx="3" class="fg-del"/><text x="60" y="132" font-size="11" class="fg-t fg-mono" xml:space="preserve">−  if (password.length &gt; 0) {</text><rect x="52" y="138" width="384" height="20" rx="3" class="fg-add"/><text x="60" y="152" font-size="11" class="fg-t fg-mono" xml:space="preserve">+  if (password.length &gt;= 8) {</text><rect x="52" y="166" width="86" height="24" rx="12" class="fg-okbox"/><text x="95" y="181.85" text-anchor="middle" font-size="11" font-weight="600" class="fg-ok">Принять</text><rect x="148" y="166" width="96" height="24" rx="12" class="fg-riskbox"/><text x="196" y="181.85" text-anchor="middle" font-size="11" font-weight="600" class="fg-riskt">Отклонить</text><text x="40" y="226" font-size="12" font-weight="600" class="fg-t">Хочу проверить, что всё работает</text><rect x="40" y="238" width="408" height="56" rx="8" class="fg-box"/><text x="52" y="260" font-size="11.5" class="fg-t fg-mono" xml:space="preserve">npm test</text><rect x="52" y="266" width="76" height="22" rx="11" class="fg-okbox"/><text x="90" y="280.68" text-anchor="middle" font-size="10.5" font-weight="600" class="fg-ok">Принять</text><rect x="136" y="266" width="88" height="22" rx="11" class="fg-riskbox"/><text x="180" y="280.68" text-anchor="middle" font-size="10.5" font-weight="600" class="fg-riskt">Отклонить</text><circle cx="456" cy="100" r="10" class="fg-tier"/><text x="456" y="104" text-anchor="middle" font-size="12" font-weight="600" class="fg-on">1</text><circle cx="34" cy="144" r="10" class="fg-tier"/><text x="34" y="148" text-anchor="middle" font-size="12" font-weight="600" class="fg-on">2</text><circle cx="268" cy="178" r="10" class="fg-tier"/><text x="268" y="182" text-anchor="middle" font-size="12" font-weight="600" class="fg-on">3</text><circle cx="456" cy="264" r="10" class="fg-tier"/><text x="456" y="268" text-anchor="middle" font-size="12" font-weight="600" class="fg-on">4</text><circle cx="500" cy="58" r="10" class="fg-tier"/><text x="500" y="62" text-anchor="middle" font-size="12" font-weight="600" class="fg-on">1</text><text x="518" y="62" font-size="12" class="fg-q">Карточка правки: какой файл</text><text x="518" y="77.84" font-size="12" class="fg-q">Claude хочет изменить и сколько</text><text x="518" y="93.68" font-size="12" class="fg-q">строк добавится и удалится.</text><circle cx="500" cy="123.52" r="10" class="fg-tier"/><text x="500" y="127.52" text-anchor="middle" font-size="12" font-weight="600" class="fg-on">2</text><text x="518" y="127.52" font-size="12" class="fg-q">Красная строка будет удалена,</text><text x="518" y="143.36" font-size="12" class="fg-q">зелёная добавится. Прочитайте,</text><text x="518" y="159.2" font-size="12" class="fg-q">что именно меняется.</text><circle cx="500" cy="189.04" r="10" class="fg-tier"/><text x="500" y="193.04" text-anchor="middle" font-size="12" font-weight="600" class="fg-on">3</text><text x="518" y="193.04" font-size="12" class="fg-q">Принять — правка попадёт в</text><text x="518" y="208.88" font-size="12" class="fg-q">файл. Отклонить — файл</text><text x="518" y="224.72" font-size="12" class="fg-q">останется как был, и вы</text><text x="518" y="240.56" font-size="12" class="fg-q">объясните Claude, что не так.</text><circle cx="500" cy="270.4" r="10" class="fg-tier"/><text x="500" y="274.4" 