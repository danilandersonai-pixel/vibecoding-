<svg viewBox="0 0 760 250" role="img" aria-label="Что вы унесёте из книги" font-size="13"><text x="24" y="28" font-size="15" font-weight="600" class="fg-t">Что вы унесёте из книги</text><rect x="24" y="60" width="226.667" height="77.64" rx="8" class="fg-box"/><text x="137.333" y="84.74" text-anchor="middle" font-weight="600" class="fg-t">Как думает ИИ</text><text x="137.333" y="104.64" text-anchor="middle" font-size="11.5" class="fg-q">Что делает хорошо и где</text><text x="137.333" y="120.51" text-anchor="middle" font-size="11.5" class="fg-q">систематически ошибается</text><rect x="266.667" y="60" width="226.667" height="77.64" rx="8" class="fg-box"/><text x="380" y="84.74" text-anchor="middle" font-weight="600" class="fg-t">Умение ставить задачи</text><text x="380" y="104.64" text-anchor="middle" font-size="11.5" class="fg-q">Приёмы, которые работают с</text><text x="380" y="120.51" text-anchor="middle" font-size="11.5" class="fg-q">любым ИИ</text><rect x="509.333" y="60" width="226.667" height="77.64" rx="8" class="fg-box"/><text x="622.667" y="84.74" text-anchor="middle" font-weight="600" class="fg-t">Рабочий цикл</text><text x="622.667" y="104.64" text-anchor="middle" font-size="11.5" class="fg-q">Запрос, проверка, доработка:</text><text x="622.667" y="120.51" text-anchor="middle" font-size="11.5" class="fg-q">путь от идеи до приложения</text><rect x="24" y="155.64" width="226.667" height="77.64" rx="8" class="fg-box"/><text x="137.333" y="180.38" text-anchor="middle" font-weight="600" class="fg-t">Чек-листы самопроверки</text><text x="137.333" y="200.28" text-anchor="middle" font-size="11.5" class="fg-q">Безопасность и надёжность без</text><text x="137.333" y="216.15" text-anchor="middle" font-size="11.5" class="fg-q">чтения кода</text><rect x="266.667" y="155.64" width="226.667" height="77.64" rx="8" class="fg-box"/><text x="380" y="180.38" text-anchor="middle" font-weight="600" class="fg-t">Автономные агенты</text><text x="380" y="200.28" text-anchor="middle" font-size="11.5" class="fg-q">Когда доверять задачу, а когда</text><text x="380" y="216.15" text-anchor="middle" font-size="11.5" class="fg-q">держать руку на руле</text><rect x="509.333" y="155.64" width="226.667" height="77.64" rx="8" class="fg-box"/><text x="622.667" y="180.38" text-anchor="middle" font-weight="600" class="fg-t">Словарь</text><text x="622.667" y="200.28" text-anchor="middle" font-size="11.5" class="fg-q">Все термины с объяснениями,</text><text x="622.667" y="216.15" text-anchor="middle" font-size="11.5" class="fg-q">чтобы говорить на одном языке</text><circle cx="40" cy="58" r="10" class="fg-tier"/><text x="40" y="62" text-anchor="middle" font-size="12" font-weight="600" class="fg-on">1</text><circle cx="282.667" cy="58" r="10" class="fg-tier"/><text x="282.667" y="62" text-anchor="middle" font-size="12" font-weight="600" class="fg-on">2</text><circle cx="525.333" cy="58" r="10" class="fg-tier"/><text x="525.333" y="62" text-anchor="middle" font-size="12" font-weight="600" class="fg-on">3</text><circle cx="40" cy="153.64" r="10" class="fg-tier"/><text x="40" y="157.64" text-anchor="middle" font-size="12" font-weight="600" class="fg-on">4</text><circle cx="282.667" cy="153.64" r="10" class="fg-tier"/><text x="282.667" y="157.64" text-anchor="middle" font-size="12" font-weight="600" class="fg-on">5</text><circle cx="525.333" cy="153.64" r="10" class="fg-tier"/><text x="525.333" y="157.64" text-anchor="middle" font-size="12" font-weight="600" class="fg-on">6</text></svg>