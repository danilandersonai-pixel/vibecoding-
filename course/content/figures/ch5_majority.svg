<svg viewBox="0 0 760 382" role="img" aria-label="«Решение большинства»: частое не значит подходящее" font-size="13"><text x="24" y="28" font-size="15" font-weight="600" class="fg-t">«Решение большинства»: частое не значит подходящее</text><rect x="24" y="52" width="712" height="64" rx="8" class="fg-hi"/><text x="380" y="77.855" text-anchor="middle" font-weight="600" class="fg-t">Модель выбирает то, что чаще встречалось в обучающих данных</text><text x="380" y="97.755" text-anchor="middle" font-size="11.5" class="fg-q">Предсказуемо, но не обязательно лучше всего для вашего случая</text><text x="24" y="146" font-weight="600" class="fg-riskt">Как это проявляется</text><text x="396" y="146" font-weight="600" class="fg-okt">Как с этим работать</text><rect x="24" y="160" width="340" height="62" rx="8" class="fg-riskbox"/><text x="194" y="195.125" text-anchor="middle" font-size="12.5" font-weight="600" class="fg-t">Устаревшие версии библиотек</text><rect x="24" y="232" width="340" height="62" rx="8" class="fg-riskbox"/><text x="194" y="259" text-anchor="middle" font-size="12.5" font-weight="600" class="fg-t">Слишком тяжёлая библиотека там, где</text><text x="194" y="275.25" text-anchor="middle" font-size="12.5" font-weight="600" class="fg-t">хватило бы языка</text><rect x="24" y="304" width="340" height="62" rx="8" class="fg-riskbox"/><text x="194" y="331" text-anchor="middle" font-size="12.5" font-weight="600" class="fg-t">Способ, который тормозит на миллионах</text><text x="194" y="347.25" text-anchor="middle" font-size="12.5" font-weight="600" class="fg-t">записей</text><rect x="396" y="160" width="340" height="62" rx="8" class="fg-okbox"/><text x="566" y="195.125" text-anchor="middle" font-size="12.5" font-weight="600" class="fg-t">Фиксируйте выбор в правилах проекта</text><rect x="396" y="232" width="340" height="62" rx="8" class="fg-okbox"/><text x="566" y="267.125" text-anchor="middle" font-size="12.5" font-weight="600" class="fg-t">Просите альтернативы с компромиссами</text><rect x="396" y="304" width="340" height="62" rx="8" class="fg-okbox"/><text x="566" y="339.125" text-anchor="middle" font-size="12.5" font-weight="600" class="fg-t">Указывайте версии</text></svg>