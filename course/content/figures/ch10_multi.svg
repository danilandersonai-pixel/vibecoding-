<svg viewBox="0 0 760 366" role="img" aria-label="Как объединяют несколько моделей и агентов" font-size="13"><text x="24" y="28" font-size="15" font-weight="600" class="fg-t">Как объединяют несколько моделей и агентов</text><rect x="24" y="50" width="340" height="300" rx="10" class="fg-zone"/><text x="38" y="74" font-weight="600" class="fg-t">Оркестратор и подагенты</text><rect x="396" y="50" width="340" height="300" rx="10" class="fg-zone"/><text x="410" y="74" font-weight="600" class="fg-t">Планировщик, исполнитель, проверяющий</text><rect x="110" y="90" width="168" height="80" rx="8" class="fg-hi"/><text x="194" y="115.92" text-anchor="middle" font-weight="600" class="fg-t">Оркестратор</text><text x="194" y="135.82" text-anchor="middle" font-size="11.5" class="fg-q">Делит задачу, собирает</text><text x="194" y="151.69" text-anchor="middle" font-size="11.5" class="fg-q">результат</text><rect x="36" y="214" width="100" height="44" rx="8" class="fg-box"/><text x="86" y="239.96" text-anchor="middle" font-size="12" font-weight="600" class="fg-t">Подагент 1</text><rect x="144" y="214" width="100" height="44" rx="8" class="fg-box"/><text x="194" y="239.96" text-anchor="middle" font-size="12" font-weight="600" class="fg-t">Подагент 2</text><rect x="252" y="214" width="100" height="44" rx="8" class="fg-box"/><text x="302" y="239.96" text-anchor="middle" font-size="12" font-weight="600" class="fg-t">Подагент 3</text><path d="M194 170L194 192L86 192L86 214" class="fg-ln" marker-end="url(#bk-arrow)"/><path d="M194 170L194 192L194 192L194 214" class="fg-ln" marker-end="url(#bk-arrow)"/><path d="M194 170L194 192L302 192L302 214" class="fg-ln" marker-end="url(#bk-arrow)"/><rect x="60" y="282" width="264" height="64" rx="8" class="fg-okbox"/><text x="192" y="307.855" text-anchor="middle" font-weight="600" class="fg-t">Собранный результат</text><text x="192" y="327.755" text-anchor="middle" font-size="11.5" class="fg-q">Вы проверяете итог, а не каждого</text><path d="M194 258L194 282" class="fg-ln fg-dots"/><rect x="412" y="92" width="308" height="64" rx="8" class="fg-hi"/><text x="566" y="117.855" text-anchor="middle" font-weight="600" class="fg-t">Сильная модель: план</text><text x="566" y="137.755" text-anchor="middle" font-size="11.5" class="fg-q">Рассуждает, составляет шаги</text><rect x="412" y="176" width="308" height="64" rx="8" class="fg-box"/><text x="566" y="201.855" text-anchor="middle" font-weight="600" class="fg-t">Быстрая модель: исполнение</text><text x="566" y="221.755" text-anchor="middle" font-size="11.5" class="fg-q">Пишет код по плану</text><rect x="412" y="260" width="308" height="80" rx="8" class="fg-okbox"/><text x="566" y="285.92" text-anchor="middle" font-weight="600" class="fg-t">Модель другого семейства: ревью</text><text x="566" y="305.82" text-anchor="middle" font-size="11.5" class="fg-q">Ошибается иначе, поэтому видит чужие</text><text x="566" y="321.69" text-anchor="middle" font-size="11.5" class="fg-q">промахи</text><path d="M566 156L566 176" class="fg-ln" marker-end="url(#bk-arrow)"/><path d="M566 240L566 260" class="fg-ln" marker-end="url(#bk-arrow)"/></svg>