<svg viewBox="0 0 760 402" role="img" aria-label="Из чего состоит проект и что подключается снаружи" font-size="13"><text x="24" y="28" font-size="15" font-weight="600" class="fg-t">Из чего состоит проект и что подключается снаружи</text><rect x="24" y="52" width="400" height="250" rx="10" class="fg-zone"/><text x="40" y="76" font-weight="600" class="fg-t">Ваш проект: папка с файлами</text><rect x="40" y="92" width="368" height="64" rx="8" class="fg-box"/><text x="56" y="117.855" font-weight="600" class="fg-t">Страница</text><text x="56" y="137.755" font-size="11.5" class="fg-q">язык HTML: что где стоит</text><rect x="40" y="160" width="368" height="64" rx="8" class="fg-box"/><text x="56" y="185.855" font-weight="600" class="fg-t">Оформление</text><text x="56" y="205.755" font-size="11.5" class="fg-q">язык CSS: цвета и шрифты</text><rect x="40" y="228" width="368" height="64" rx="8" class="fg-box"/><text x="56" y="253.855" font-weight="600" class="fg-t">Поведение</text><text x="56" y="273.755" font-size="11.5" class="fg-q">JavaScript или TypeScript: что происходит по нажатию</text><rect x="520" y="70" width="216" height="100" rx="8" class="fg-hi"/><text x="628" y="105.92" text-anchor="middle" font-weight="600" class="fg-t">Библиотеки</text><text x="628" y="125.82" text-anchor="middle" font-size="11.5" class="fg-q">Чужие готовые детали: не</text><text x="628" y="141.69" text-anchor="middle" font-size="11.5" class="fg-q">пишете заново, а подключаете</text><path d="M520 120L424 120" class="fg-ln" marker-end="url(#bk-arrow)"/><text x="436" y="112" font-size="11" class="fg-q">подключаете</text><rect x="24" y="322" width="712" height="64" rx="8" class="fg-riskbox"/><text x="380" y="347.855" text-anchor="middle" font-weight="600" class="fg-t">Секреты: ключи и пароли</text><text x="380" y="367.755" text-anchor="middle" font-size="11.5" class="fg-q">Лежат не в файлах проекта, а отдельно, как пин-код, который не пишут на карточке</text></svg>