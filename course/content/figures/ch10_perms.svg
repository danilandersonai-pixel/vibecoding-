<svg viewBox="0 0 760 328" role="img" aria-label="Права агента: ровно то, что нужно для задачи" font-size="13"><text x="24" y="28" font-size="15" font-weight="600" class="fg-t">Права агента: ровно то, что нужно для задачи</text><rect x="24" y="52" width="470" height="260" rx="8" class="fg-win"/><path d="M24 78V60Q24 52 32 52H486Q494 52 494 60V78Z" class="fg-bar"/><circle cx="38" cy="65" r="3.5" class="fg-dot"/><circle cx="51" cy="65" r="3.5" class="fg-dot"/><circle cx="64" cy="65" r="3.5" class="fg-dot"/><text x="259" y="69" text-anchor="middle" font-size="11" class="fg-q">Разрешения агента</text><rect x="40" y="86" width="438" height="36" rx="6" class="fg-okbox"/><circle cx="62" cy="104" r="9" class="fg-ok"/><path d="M57 104L60.5 107.5L67 100" class="fg-onln"/><text x="84" y="109" font-size="12" class="fg-t">Читать и править файлы проекта</text><text x="466" y="109" text-anchor="end" font-size="11.5" font-weight="600" class="fg-okt">можно</text><rect x="40" y="130" width="438" height="36" rx="6" class="fg-okbox"/><circle cx="62" cy="148" r="9" class="fg-ok"/><path d="M57 148L60.5 151.5L67 144" class="fg-onln"/><text x="84" y="153" font-size="12" class="fg-t">Запускать тесты и сборку</text><text x="466" y="153" text-anchor="end" font-size="11.5" font-weight="600" class="fg-okt">можно</text><rect x="40" y="174" width="438" height="36" rx="6" class="fg-riskbox"/><circle cx="62" cy="192" r="9" class="fg-risk"/><path d="M58 188L66 196M66 188L58 196" class="fg-onln"/><text x="84" y="197" font-size="12" class="fg-t">Менять тесты без вашего разрешения</text><text x="466" y="197" text-anchor="end" font-size="11.5" font-weight="600" class="fg-riskt">нельзя</text><rect x="40" y="218" width="438" height="36" rx="6" class="fg-riskbox"/><circle cx="62" cy="236" r="9" class="fg-risk"/><path d="M58 232L66 240M66 232L58 240" class="fg-onln"/><text x="84" y="241" font-size="12" class="fg-t">Боевая база данных и настоящие данные</text><text x="466" y="241" text-anchor="end" font-size="11.5" font-weight="600" class="fg-riskt">нельзя</text><rect x="40" y="262" width="438" height="36" rx="6" class="fg-riskbox"/><circle cx="62" cy="280" r="9" class="fg-risk"/><path d="M58 276L66 284M66 276L58 284" class="fg-onln"/><text x="84" y="285" font-size="12" class="fg-t">Ключи развёртывания и секреты</text><text x="466" y="285" text-anchor="end" font-size="11.5" font-weight="600" class="fg-riskt">нельзя</text><circle cx="530" cy="71" r="10" class="fg-tier"/><text x="530" y="75" text-anchor="middle" font-size="12" font-weight="600" class="fg-on">1</text><text x="548" y="75" font-size="12" class="fg-q">Дайте агенту только то, что</text><text x="548" y="90.84" font-size="12" class="fg-q">нужно для этой задачи</text><circle cx="530" cy="120.68" r="10" class="fg-tier"/><text x="530" y="124.68" text-anchor="middle" font-size="12" font-weight="600" class="fg-on">2</text><text x="548" y="124.68" font-size="12" class="fg-q">Тесты — договор: без явного</text><text x="548" y="140.52" font-size="12" class="fg-q">разрешения агент их не</text><text x="548" y="156.36" font-size="12" class="fg-q">меняет</text><circle cx="530" cy="186.2" r="10" class="fg-tier"/><text x="530" y="190.2" text-anchor="middle" font-size="12" font-weight="600" class="fg-on">3</text><text x="548" y="190.2" font-size="12" class="fg-q">Боевые данные и ключи</text><text x="548" y="206.04" font-size="12" class="fg-q">агенту не нужны: они</text><text x="548" y="221.88" font-size="12" class="fg-q">остаются у вас</text></svg>