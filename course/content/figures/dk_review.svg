<svg viewBox="0 0 760 401" role="img" aria-label="Результат команды /code-review в приложении" font-size="13"><text x="24" y="28" font-size="15" font-weight="600" class="fg-t">Карточка Code review: замечания и три кнопки</text><rect x="24" y="46" width="150" height="26" rx="8" class="fg-sel"/><text x="36" y="64" font-size="11.5" class="fg-t fg-mono" xml:space="preserve">/code-review</text><rect x="24" y="84" width="460" height="240" rx="10" class="fg-win"/><text x="40" y="110" font-size="12.5" font-weight="600" class="fg-t">Code review</text><text x="468" y="110" text-anchor="end" font-size="11" class="fg-q">3 замечания</text><rect x="36" y="124" width="436" height="44" rx="8" class="fg-box"/><text x="48" y="142" font-size="11" class="fg-t fg-mono" xml:space="preserve">form.ts:14</text><text x="48" y="159" font-size="11" class="fg-q">Длину пароля проверяет только страница, сервер — нет</text><rect x="385.06" y="130" width="74.94" height="20" rx="10" class="fg-bar"/><text x="422.53" y="143.5" text-anchor="middle" font-size="10" class="fg-t">Fix this one</text><rect x="36" y="176" width="436" height="44" rx="8" class="fg-box"/><text x="48" y="194" font-size="11" class="fg-t fg-mono" xml:space="preserve">auth.ts:7</text><text x="48" y="211" font-size="11" class="fg-q">Неудачный вход нигде не записывается в журнал</text><rect x="385.06" y="182" width="74.94" height="20" rx="10" class="fg-bar"/><text x="422.53" y="195.5" text-anchor="middle" font-size="10" class="fg-t">Fix this one</text><rect x="36" y="228" width="436" height="44" rx="8" class="fg-box"/><text x="48" y="246" font-size="11" class="fg-t fg-mono" xml:space="preserve">form.test.ts</text><text x="48" y="263" font-size="11" class="fg-q">Нет теста на пустой пароль</text><rect x="385.06" y="234" width="74.94" height="20" rx="10" class="fg-bar"/><text x="422.53" y="247.5" text-anchor="middle" font-size="10" class="fg-t">Fix this one</text><rect x="36" y="286" width="131.7" height="26" rx="6" class="fg-bar"/><text x="101.85" y="302.85" text-anchor="middle" font-size="11" class="fg-t">Walk through in diff</text><rect x="375.71" y="286" width="96.29" height="26" rx="6" class="fg-hi"/><text x="423.86" y="302.85" text-anchor="middle" font-size="11" font-weight="600" class="fg-acc">Apply fixes</text><circle cx="190" cy="59" r="10" class="fg-tier"/><text x="190" y="63" text-anchor="middle" font-size="12" font-weight="600" class="fg-on">1</text><circle cx="484" cy="146" r="10" class="fg-tier"/><text x="484" y="150" text-anchor="middle" font-size="12" font-weight="600" class="fg-on">2</text><circle cx="184" cy="299" r="10" class="fg-tier"/><text x="184" y="303" text-anchor="middle" font-size="12" font-weight="600" class="fg-on">3</text><circle cx="366" cy="299" r="10" class="fg-tier"/><text x="366" y="303" text-anchor="middle" font-size="12" font-weight="600" class="fg-on">4</text><circle cx="514" cy="94" r="10" class="fg-tier"/><text x="514" y="98" text-anchor="middle" font-size="12" font-weight="600" class="fg-on">1</text><text x="532" y="98" font-size="12" class="fg-q">Команду /code-review</text><text x="532" y="113.84" font-size="12" class="fg-q">вызывают через кнопку «+» →</text><text x="532" y="129.68" font-size="12" class="fg-q">Slash commands. Claude</text><text x="532" y="145.52" font-size="12" class="fg-q">перечитывает свои изменения</text><text x="532" y="161.36" font-size="12" class="fg-q">как строгий проверяющий.</text><circle cx="514" cy="191.2" r="10" class="fg-tier"/><text x="514" y="195.2" text-anchor="middle" font-size="12" font-weight="600" class="fg-on">2</text><text x="532" y="195.2" font-size="12" class="fg-q">Каждое замечание: где оно и</text><text x="532" y="211.04" font-size="12" class="fg-q">что не так. Читайте и решайте,</text><text x="532" y="226.88" font-size="12" class="fg-q">согласны ли вы.</text><circle cx="514" cy="256.72" r="10" class="fg-tier"/><text x="514" y="260.72" text-anchor="middle" font-size="12" font-weight="600" class="fg-on">3</text><text x="532" y="260.72" font-size="12" class="fg-q">Walk through in diff — пройти по</text><text x="532" y="276.56" font-size="12" class="fg-q">замечаниям в окне изменений,</text><text x="532" y="292.4" font-size="12" class="fg-q">глядя на сам код.</text><circle cx="514" cy="322.24" r="10" class="fg-tier"/><text x="514" y="326.24" text-anchor="middle" font-size="12" font-weight="600" class="fg-on">4</text><text x="532" y="326.24" font-size="12" class="fg-q">Fix this one исправляет одно</text><text x="532" y="342.08" font-size="12" class="fg-q">замечание, Apply fixes — все</text><text x="532" y="357.92" font-size="12" class="fg-q">сразу. После этого снова</text><text x="532" y="373.76" font-size="12" class="fg-q">посмотрите изменения.</text></svg>