<svg viewBox="0 0 760 401" role="img" aria-label="Меню плюс: Slash commands, Connectors, Plugins" font-size="13"><text x="24" y="28" font-size="15" font-weight="600" class="fg-t">Кнопка «+»: файлы, команды, подключения и плагины</text><rect x="48" y="52" width="200" height="134" rx="8" class="fg-win"/><rect x="48" y="52" width="200" height="134" rx="8" class="fg-box"/><text x="66" y="77" font-size="11.5" class="fg-t">Attach file</text><text x="66" y="107" font-size="11.5" class="fg-t">Slash commands</text><rect x="54" y="120" width="188" height="26" rx="5" class="fg-sel"/><text x="66" y="137" font-size="11.5" font-weight="600" class="fg-t">Connectors  ›</text><text x="66" y="167" font-size="11.5" class="fg-t">Plugins  ›</text><rect x="262" y="54" width="214" height="168" rx="8" class="fg-win"/><rect x="262" y="54" width="214" height="168" rx="8" class="fg-box"/><text x="278" y="78" font-size="11.5" class="fg-t">Google Calendar</text><text x="278" y="102" font-size="11.5" class="fg-t">Slack</text><text x="278" y="126" font-size="11.5" class="fg-t">GitHub</text><text x="278" y="150" font-size="11.5" class="fg-t">Linear</text><text x="278" y="174" font-size="11.5" class="fg-t">Notion</text><rect x="270" y="184" width="198" height="26" rx="5" class="fg-bar"/><text x="280" y="201" font-size="11" class="fg-t">Manage connectors</text><rect x="490" y="142" width="240" height="62" rx="8" class="fg-win"/><rect x="490" y="142" width="240" height="62" rx="8" class="fg-box"/><text x="506" y="166" font-size="11.5" class="fg-t">Add plugin</text><text x="506" y="192" font-size="11.5" class="fg-t">Manage plugins</text><path d="M242 150H262" class="fg-ln-acc" marker-end="url(#bk-arrow-acc)"/><path d="M148 188V236H610V206" class="fg-ln-acc" marker-end="url(#bk-arrow-acc)"/><circle cx="48" cy="75" r="10" class="fg-tier"/><text x="48" y="79" text-anchor="middle" font-size="12" font-weight="600" class="fg-on">1</text><circle cx="48" cy="105" r="10" class="fg-tier"/><text x="48" y="109" text-anchor="middle" font-size="12" font-weight="600" class="fg-on">2</text><circle cx="476" cy="92" r="10" class="fg-tier"/><text x="476" y="96" text-anchor="middle" font-size="12" font-weight="600" class="fg-on">3</text><circle cx="730" cy="164" r="10" class="fg-tier"/><text x="730" y="168" text-anchor="middle" font-size="12" font-weight="600" class="fg-on">4</text><circle cx="34" cy="274" r="10" class="fg-tier"/><text x="34" y="278" text-anchor="middle" font-size="12" font-weight="600" class="fg-on">1</text><text x="52" y="278" font-size="12" class="fg-q">Attach file: прикрепить к сообщению файл или</text><text x="52" y="293.84" font-size="12" class="fg-q">картинку. Можно и просто перетащить файл в</text><text x="52" y="309.68" font-size="12" class="fg-q">поле ввода.</text><circle cx="34" cy="337.52" r="10" class="fg-tier"/><text x="34" y="341.52" text-anchor="middle" font-size="12" font-weight="600" class="fg-on">2</text><text x="52" y="341.52" font-size="12" class="fg-q">Slash commands: готовые команды и навыки</text><text x="52" y="357.36" font-size="12" class="fg-q">(skills). Можно набрать «/» в поле ввода.</text><circle cx="404" cy="274" r="10" class="fg-tier"/><text x="404" y="278" text-anchor="middle" font-size="12" font-weight="600" class="fg-on">3</text><text x="422" y="278" font-size="12" class="fg-q">Connectors: подключение внешних сервисов,</text><text x="422" y="293.84" font-size="12" class="fg-q">например Google Calendar, Slack, GitHub, Linear,</text><text x="422" y="309.68" font-size="12" class="fg-q">Notion. В WSL не работают.</text><circle cx="404" cy="337.52" r="10" class="fg-tier"/><text x="404" y="341.52" text-anchor="middle" font-size="12" font-weight="600" class="fg-on">4</text><text x="422" y="341.52" font-size="12" class="fg-q">Plugins: наборы расширений. Add plugin —</text><text x="422" y="357.36" font-size="12" class="fg-q">каталог, Manage plugins — включить, выключить</text><text x="422" y="373.2" font-size="12" class="fg-q">или удалить.</text></svg>