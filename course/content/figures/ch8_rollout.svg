<svg viewBox="0 0 760 306" role="img" aria-label="Канареечный релиз: новая версия идёт к людям по ступеням" font-size="13"><text x="24" y="28" font-size="15" font-weight="600" class="fg-t">Канареечный релиз: новая версия идёт к людям по ступеням</text><rect x="24" y="60" width="158.5" height="102" rx="8" class="fg-box"/><text x="103.25" y="96.92" text-anchor="middle" font-weight="600" class="fg-t">Новая версия</text><text x="103.25" y="116.82" text-anchor="middle" font-size="11.5" class="fg-q">Выложена, но видят</text><text x="103.25" y="132.69" text-anchor="middle" font-size="11.5" class="fg-q">её не все</text><rect x="208.5" y="60" width="158.5" height="102" rx="8" class="fg-hi"/><text x="287.75" y="96.92" text-anchor="middle" font-weight="600" class="fg-t">5% пользователей</text><text x="287.75" y="116.82" text-anchor="middle" font-size="11.5" class="fg-q">Остальные пока на</text><text x="287.75" y="132.69" text-anchor="middle" font-size="11.5" class="fg-q">старой версии</text><rect x="393" y="60" width="158.5" height="102" rx="8" class="fg-box"/><text x="472.25" y="88.47" text-anchor="middle" font-weight="600" class="fg-t">Смотрим</text><text x="472.25" y="105.37" text-anchor="middle" font-weight="600" class="fg-t">мониторинг</text><text x="472.25" y="125.27" text-anchor="middle" font-size="11.5" class="fg-q">Ошибки, скорость,</text><text x="472.25" y="141.14" text-anchor="middle" font-size="11.5" class="fg-q">жалобы</text><rect x="577.5" y="60" width="158.5" height="102" rx="8" class="fg-okbox"/><text x="656.75" y="104.855" text-anchor="middle" font-weight="600" class="fg-t">Всё в норме</text><text x="656.75" y="124.755" text-anchor="middle" font-size="11.5" class="fg-q">25%, затем 100%</text><path d="M182.5 111L208.5 111" class="fg-ln" marker-end="url(#bk-arrow)"/><path d="M367 111L393 111" class="fg-ln" marker-end="url(#bk-arrow)"/><path d="M551.5 111L577.5 111" class="fg-ln" marker-end="url(#bk-arrow)"/><text x="24" y="196" font-size="12" font-weight="600" class="fg-t">Двадцать условных пользователей:</text><circle cx="44" cy="224" r="7" class="fg-tier"/><circle cx="64" cy="224" r="7" class="fg-solid"/><circle cx="84" cy="224" r="7" class="fg-solid"/><circle cx="104" cy="224" r="7" class="fg-solid"/><circle cx="124" cy="224" r="7" class="fg-solid"/><circle cx="144" cy="224" r="7" class="fg-solid"/><circle cx="164" cy="224" r="7" class="fg-solid"/><circle cx="184" cy="224" r="7" class="fg-solid"/><circle cx="204" cy="224" r="7" class="fg-solid"/><circle cx="224" cy="224" r="7" class="fg-solid"/><circle cx="244" cy="224" r="7" class="fg-solid"/><circle cx="264" cy="224" r="7" class="fg-solid"/><circle cx="284" cy="224" r="7" class="fg-solid"/><circle cx="304" cy="224" r="7" class="fg-solid"/><circle cx="324" cy="224" r="7" class="fg-solid"/><circle cx="344" cy="224" r="7" class="fg-solid"/><circle cx="364" cy="224" r="7" class="fg-solid"/><circle cx="384" cy="224" r="7" class="fg-solid"/><circle cx="404" cy="224" r="7" class="fg-solid"/><circle cx="424" cy="224" r="7" class="fg-solid"/><text x="24" y="252" font-size="11.5" class="fg-q">один видит новую версию, остальные — старую</text><rect x="520" y="184" width="216" height="106" rx="8" class="fg-riskbox"/><text x="628" y="214.47" text-anchor="middle" font-weight="600" class="fg-t">Что-то не так: откат за</text><text x="628" y="231.37" text-anchor="middle" font-weight="600" class="fg-t">минуты</text><text x="628" y="251.27" text-anchor="middle" font-size="11.5" class="fg-q">Возвращаем прошлую версию,</text><text x="628" y="267.14" text-anchor="middle" font-size="11.5" class="fg-q">пострадал один из двадцати</text><path d="M472.25 162L472.25 237L520 237" class="fg-ln fg-dash" marker-end="url(#bk-arrow)"/><text x="480.25" y="227" font-size="11" class="fg-riskt">сбой</text></svg>