<svg viewBox="0 0 760 354" role="img" aria-label="Основание — модульные тесты, вершина — немногие сквозные" font-size="13"><text x="24" y="28" font-size="15" font-weight="600" class="fg-t">Основание — модульные тесты, вершина — немногие сквозные</text><path d="M250 110H392" class="fg-grid fg-dots"/><path d="M296 195H392" class="fg-grid fg-dots"/><path d="M344 285H392" class="fg-grid fg-dots"/><polygon points="180,70 220,70 263,150 137,150" class="fg-tier" style="fill-opacity:.12"/><text x="200" y="124" text-anchor="middle" font-weight="600" class="fg-t">Сквозные</text><polygon points="137,150 263,150 311,240 89,240" class="fg-tier" style="fill-opacity:.22"/><text x="200" y="200" text-anchor="middle" font-weight="600" class="fg-t">Интеграционные</text><polygon points="89,240 311,240 360,330 40,330" class="fg-tier" style="fill-opacity:.34"/><text x="200" y="290" text-anchor="middle" font-weight="600" class="fg-t">Модульные</text><text x="400" y="106" font-weight="600" class="fg-t">Главные сценарии в браузере</text><text x="400" y="124" font-size="11.5" class="fg-q">немного и медленные; агент может пройти их сам</text><text x="400" y="191" font-weight="600" class="fg-t">API с настоящей тестовой базой</text><text x="400" y="209" font-size="11.5" class="fg-q">права доступа, ограничения, ответы на ошибки</text><text x="400" y="281" font-weight="600" class="fg-t">Чистая логика: много и быстро</text><text x="400" y="299" font-size="11.5" class="fg-q">ИИ пишет их быстро — но от требований, а не от кода</text></svg>