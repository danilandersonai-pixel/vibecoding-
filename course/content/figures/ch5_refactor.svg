<svg viewBox="0 0 760 378" role="img" aria-label="Безопасный рефакторинг: маленькие шаги под защитой тестов" font-size="13"><text x="24" y="28" font-size="15" font-weight="600" class="fg-t">Безопасный рефакторинг: маленькие шаги под защитой тестов</text><rect x="24" y="110" width="155.5" height="94.54" rx="8" class="fg-box"/><text x="101.75" y="143.19" text-anchor="middle" font-weight="600" class="fg-t">Тесты проходят</text><text x="101.75" y="163.09" text-anchor="middle" font-size="11.5" class="fg-q">Они фиксируют</text><text x="101.75" y="178.96" text-anchor="middle" font-size="11.5" class="fg-q">текущее поведение</text><rect x="209.5" y="110" width="155.5" height="94.54" rx="8" class="fg-hi"/><text x="287.25" y="134.74" text-anchor="middle" font-weight="600" class="fg-t">Один маленький</text><text x="287.25" y="151.64" text-anchor="middle" font-weight="600" class="fg-t">шаг</text><text x="287.25" y="171.54" text-anchor="middle" font-size="11.5" class="fg-q">Только устройство,</text><text x="287.25" y="187.41" text-anchor="middle" font-size="11.5" class="fg-q">без новых функций</text><rect x="395" y="110" width="155.5" height="94.54" rx="8" class="fg-box"/><text x="472.75" y="134.74" text-anchor="middle" font-weight="600" class="fg-t">Тесты снова</text><text x="472.75" y="151.64" text-anchor="middle" font-weight="600" class="fg-t">проходят?</text><text x="472.75" y="171.54" text-anchor="middle" font-size="11.5" class="fg-q">Проверка после</text><text x="472.75" y="187.41" text-anchor="middle" font-size="11.5" class="fg-q">каждого шага</text><rect x="580.5" y="110" width="155.5" height="94.54" rx="8" class="fg-okbox"/><text x="658.25" y="135.255" text-anchor="middle" font-weight="600" class="fg-t">Коммит</text><text x="658.25" y="155.155" text-anchor="middle" font-size="11.5" class="fg-q">Сохранение, к</text><text x="658.25" y="171.025" text-anchor="middle" font-size="11.5" class="fg-q">которому можно</text><text x="658.25" y="186.895" text-anchor="middle" font-size="11.5" class="fg-q">вернуться</text><path d="M179.5 157.27L209.5 157.27" class="fg-ln" marker-end="url(#bk-arrow)"/><path d="M365 157.27L395 157.27" class="fg-ln" marker-end="url(#bk-arrow)"/><path d="M550.5 157.27L580.5 157.27" class="fg-ln" marker-end="url(#bk-arrow)"/><text x="565.5" y="149.27" text-anchor="middle" font-size="11.5" class="fg-okt">да</text><path d="M658.25 110L658.25 80L287.25 80L287.25 110" class="fg-ln fg-dash" marker-end="url(#bk-arrow)"/><text x="472.75" y="70" text-anchor="middle" font-size="11.5" class="fg-q">следующий шаг</text><rect x="24" y="248.54" width="300" height="77.64" rx="8" class="fg-zone"/><text x="174" y="273.28" text-anchor="middle" font-weight="600" class="fg-t">Тестов нет</text><text x="174" y="293.18" text-anchor="middle" font-size="11.5" class="fg-q">Сначала попросите написать тесты на</text><text x="174" y="309.05" text-anchor="middle" font-size="11.5" class="fg-q">текущее поведение</text><rect x="362.75" y="248.54" width="220" height="77.64" rx="8" class="fg-riskbox"/><text x="472.75" y="273.28" text-anchor="middle" font-weight="600" class="fg-t">Красные тесты</text><text x="472.75" y="293.18" text-anchor="middle" font-size="11.5" class="fg-q">Откатите шаг и сделайте его</text><text x="472.75" y="309.05" text-anchor="middle" font-size="11.5" class="fg-q">меньше</text><path d="M101.75 204.54L101.75 248.54" class="fg-ln fg-dash fg-dots" marker-end="url(#bk-arrow)"/><path d="M472.75 204.54L472.75 248.54" class="fg-ln" marker-end="url(#bk-arrow)"/><text x="480.75" y="230.54" font-size="11.5" class="fg-riskt">нет</text><text x="109.75" y="230.54" font-size="11.5" class="fg-riskt">нет</text><text x="24" y="356.18" font-size="11.5" class="fg-q">Рефакторинг и новые функции — в разных коммитах: смешанные изменения невозможно нормально проверить.</text></svg>