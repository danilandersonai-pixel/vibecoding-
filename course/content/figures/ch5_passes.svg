<svg viewBox="0 0 760 305" role="img" aria-label="Четыре прохода по незнакомому изменению" font-size="13"><text x="24" y="28" font-size="15" font-weight="600" class="fg-t">Четыре прохода по незнакомому изменению</text><rect x="24" y="64" width="160" height="109.38" rx="8" class="fg-box"/><text x="104" y="88.74" text-anchor="middle" font-weight="600" class="fg-t">1 · Обзор</text><text x="104" y="108.64" text-anchor="middle" font-size="11.5" class="fg-q">Какие файлы</text><text x="104" y="124.51" text-anchor="middle" font-size="11.5" class="fg-q">затронуты? Есть ли</text><text x="104" y="140.38" text-anchor="middle" font-size="11.5" class="fg-q">изменения вне</text><text x="104" y="156.25" text-anchor="middle" font-size="11.5" class="fg-q">задачи?</text><rect x="208" y="64" width="160" height="109.38" rx="8" class="fg-box"/><text x="288" y="88.74" text-anchor="middle" font-weight="600" class="fg-t">2 · Интерфейс</text><text x="288" y="108.64" text-anchor="middle" font-size="11.5" class="fg-q">Что получает и отдаёт</text><text x="288" y="124.51" text-anchor="middle" font-size="11.5" class="fg-q">каждая функция? Есть</text><text x="288" y="140.38" text-anchor="middle" font-size="11.5" class="fg-q">ли побочные</text><text x="288" y="156.25" text-anchor="middle" font-size="11.5" class="fg-q">эффекты?</text><rect x="392" y="64" width="160" height="109.38" rx="8" class="fg-box"/><text x="472" y="88.74" text-anchor="middle" font-weight="600" class="fg-t">3 · Трассировка</text><text x="472" y="108.64" text-anchor="middle" font-size="11.5" class="fg-q">Пройти один</text><text x="472" y="124.51" text-anchor="middle" font-size="11.5" class="fg-q">настоящий сценарий</text><text x="472" y="140.38" text-anchor="middle" font-size="11.5" class="fg-q">с конкретными</text><text x="472" y="156.25" text-anchor="middle" font-size="11.5" class="fg-q">данными</text><rect x="576" y="64" width="160" height="109.38" rx="8" class="fg-box"/><text x="656" y="88.74" text-anchor="middle" font-weight="600" class="fg-t">4 · Края</text><text x="656" y="108.64" text-anchor="middle" font-size="11.5" class="fg-q">Пустой и огромный</text><text x="656" y="124.51" text-anchor="middle" font-size="11.5" class="fg-q">ввод, значение</text><text x="656" y="140.38" text-anchor="middle" font-size="11.5" class="fg-q">«ничего», двойной</text><text x="656" y="156.25" text-anchor="middle" font-size="11.5" class="fg-q">клик</text><path d="M184 118.69L208 118.69" class="fg-ln" marker-end="url(#bk-arrow)"/><path d="M368 118.69L392 118.69" class="fg-ln" marker-end="url(#bk-arrow)"/><path d="M552 118.69L576 118.69" class="fg-ln" marker-end="url(#bk-arrow)"/><text x="24" y="203.38" font-size="11.5" class="fg-q">Так же вы принимаете ремонт у бригады:</text><rect x="24" y="217.38" width="160" height="71.61" rx="8" class="fg-ghost"/><text x="104" y="248.815" text-anchor="middle" font-size="11.5" class="fg-q">Осмотреть общую</text><text x="104" y="264.685" text-anchor="middle" font-size="11.5" class="fg-q">картину</text><rect x="208" y="217.38" width="160" height="71.61" rx="8" class="fg-ghost"/><text x="288" y="248.815" text-anchor="middle" font-size="11.5" class="fg-q">Спросить, что и как</text><text x="288" y="264.685" text-anchor="middle" font-size="11.5" class="fg-q">сделали</text><rect x="392" y="217.38" width="160" height="71.61" rx="8" class="fg-ghost"/><text x="472" y="240.88" text-anchor="middle" font-size="11.5" class="fg-q">Проверить, что кран</text><text x="472" y="256.75" text-anchor="middle" font-size="11.5" class="fg-q">включается и вода</text><text x="472" y="272.62" text-anchor="middle" font-size="11.5" class="fg-q">идёт куда нужно</text><rect x="576" y="217.38" width="160" height="71.61" rx="8" class="fg-ghost"/><text x="656" y="248.815" text-anchor="middle" font-size="11.5" class="fg-q">Включить оба крана</text><text x="656" y="264.685" text-anchor="middle" font-size="11.5" class="fg-q">сразу</text></svg>