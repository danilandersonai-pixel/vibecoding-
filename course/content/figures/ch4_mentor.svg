<svg viewBox="0 0 760 333" role="img" aria-label="Режим наставника: учиться, а не получать готовое" font-size="13"><text x="24" y="28" font-size="15" font-weight="600" class="fg-t">Режим наставника: учиться, а не получать готовое</text><rect x="24" y="100" width="158.5" height="110.41" rx="8" class="fg-box"/><text x="103.25" y="141.125" text-anchor="middle" font-weight="600" class="fg-t">Попробуйте сами</text><text x="103.25" y="161.025" text-anchor="middle" font-size="11.5" class="fg-q">Пятнадцать минут</text><text x="103.25" y="176.895" text-anchor="middle" font-size="11.5" class="fg-q">собственной попытки</text><rect x="208.5" y="100" width="158.5" height="110.41" rx="8" class="fg-box"/><text x="287.75" y="124.74" text-anchor="middle" font-weight="600" class="fg-t">Попросите</text><text x="287.75" y="141.64" text-anchor="middle" font-weight="600" class="fg-t">наставника</text><text x="287.75" y="161.54" text-anchor="middle" font-size="11.5" class="fg-q">«Не пиши решение,</text><text x="287.75" y="177.41" text-anchor="middle" font-size="11.5" class="fg-q">задавай наводящие</text><text x="287.75" y="193.28" text-anchor="middle" font-size="11.5" class="fg-q">вопросы»</text><rect x="393" y="100" width="158.5" height="110.41" rx="8" class="fg-hi"/><text x="472.25" y="141.125" text-anchor="middle" font-weight="600" class="fg-t">ИИ задаёт вопрос</text><text x="472.25" y="161.025" text-anchor="middle" font-size="11.5" class="fg-q">Один наводящий</text><text x="472.25" y="176.895" text-anchor="middle" font-size="11.5" class="fg-q">вопрос за раз</text><rect x="577.5" y="100" width="158.5" height="110.41" rx="8" class="fg-box"/><text x="656.75" y="133.19" text-anchor="middle" font-weight="600" class="fg-t">Вы отвечаете</text><text x="656.75" y="153.09" text-anchor="middle" font-size="11.5" class="fg-q">Пересказываете</text><text x="656.75" y="168.96" text-anchor="middle" font-size="11.5" class="fg-q">своими словами, что</text><text x="656.75" y="184.83" text-anchor="middle" font-size="11.5" class="fg-q">делает код</text><circle cx="40" cy="98" r="10" class="fg-tier"/><text x="40" y="102" text-anchor="middle" font-size="12" font-weight="600" class="fg-on">1</text><circle cx="224.5" cy="98" r="10" class="fg-tier"/><text x="224.5" y="102" text-anchor="middle" font-size="12" font-weight="600" class="fg-on">2</text><circle cx="409" cy="98" r="10" class="fg-tier"/><text x="409" y="102" text-anchor="middle" font-size="12" font-weight="600" class="fg-on">3</text><circle cx="593.5" cy="98" r="10" class="fg-tier"/><text x="593.5" y="102" text-anchor="middle" font-size="12" font-weight="600" class="fg-on">4</text><path d="M182.5 155.205L208.5 155.205" class="fg-ln" marker-end="url(#bk-arrow)"/><path d="M367 155.205L393 155.205" class="fg-ln" marker-end="url(#bk-arrow)"/><path d="M551.5 155.205L577.5 155.205" class="fg-ln" marker-end="url(#bk-arrow)"/><path d="M656.75 100L656.75 74L472.25 74L472.25 100" class="fg-ln fg-dash" marker-end="url(#bk-arrow)"/><text x="564.5" y="64" text-anchor="middle" font-size="11.5" class="fg-q">и так по кругу</text><rect x="200" y="254.41" width="260" height="61.77" rx="8" class="fg-zone"/><text x="330" y="279.15" text-anchor="middle" font-weight="600" class="fg-t">Застряли три раза подряд</text><text x="330" y="299.05" text-anchor="middle" font-size="11.5" class="fg-q">ИИ даёт подсказку, но не готовый код</text><rect x="496" y="254.41" width="240" height="61.77" rx="8" class="fg-okbox"/><text x="616" y="279.15" text-anchor="middle" font-weight="600" class="fg-t">Причина найдена вами</text><text x="616" y="299.05" text-anchor="middle" font-size="11.5" class="fg-q">Вы поняли, а не получили заплатку</text><path d="M472.25 210.41L472.25 240.41L330 240.41L330 254.41" class="fg-ln" marker-end="url(#bk-arrow)"/><path d="M656.75 210.41L656.75 240.41L616 240.41L616 254.41" class="fg-ln" marker-end="url(#bk-arrow)"/></svg>