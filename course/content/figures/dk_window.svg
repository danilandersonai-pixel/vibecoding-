<svg viewBox="0 0 760 576" role="img" aria-label="Окно Claude Code в десктопном приложении: боковая панель, чат, поле ввода" font-size="13"><text x="24" y="28" font-size="15" font-weight="600" class="fg-t">Окно Claude Code в десктопном приложении</text><rect x="24" y="48" width="712" height="262" rx="10" class="fg-win"/><path d="M194 48H34Q24 48 24 58V300Q24 310 34 310H194Z" class="fg-bar"/><rect x="36" y="60" width="146" height="26" rx="6" class="fg-hi"/><text x="109" y="77.03" text-anchor="middle" font-size="11.5" font-weight="600" class="fg-acc">+ New session</text><text x="38" y="108" font-size="10" class="fg-q">Status ▾   Project ▾</text><rect x="30" y="116" width="158" height="38" rx="6" class="fg-sel"/><circle cx="42" cy="131" r="4" class="fg-ok"/><text x="54" y="130" font-size="11.5" font-weight="600" class="fg-t">Форма входа</text><text x="54" y="145" font-size="9.5" class="fg-q">habit-tracker · Local</text><circle cx="42" cy="173" r="4" class="fg-acc"/><text x="54" y="172" font-size="11.5" class="fg-t">Починить тесты</text><text x="54" y="187" font-size="9.5" class="fg-q">shop-site · Cloud</text><circle cx="42" cy="215" r="4" class="fg-dot"/><text x="54" y="214" font-size="11.5" class="fg-t">Страница меню</text><text x="54" y="229" font-size="9.5" class="fg-q">cafe-page · Local</text><rect x="194" y="84" width="542" height="1" rx="0" class="fg-line"/><text x="210" y="71" font-size="12" font-weight="600" class="fg-t">Форма входа ▾</text><rect x="700" y="56" width="24" height="22" rx="11" class="fg-bar"/><text x="712" y="70.85" text-anchor="middle" font-size="11" class="fg-t">⋮</text><rect x="631.42" y="56" width="62.58" height="22" rx="11" class="fg-bar"/><text x="662.71" y="70.85" text-anchor="middle" font-size="11" class="fg-t">Browser</text><rect x="559.57" y="56" width="65.85" height="22" rx="11" class="fg-bar"/><text x="592.5" y="70.85" text-anchor="middle" font-size="11" class="fg-t">Changes</text><rect x="489.08" y="56" width="64.49" height="22" rx="11" class="fg-bar"/><text x="521.32" y="70.85" text-anchor="middle" font-size="11" class="fg-t">Terminal</text><rect x="444" y="98" width="270" height="24" rx="8" class="fg-sel"/><text x="456" y="114" font-size="11.5" class="fg-t">Добавь форму входа для сотрудников</text><text x="210" y="146" font-size="11.5" class="fg-q">Читаю src/app.ts и lib/auth.ts…</text><text x="210" y="164" font-size="11.5" class="fg-t">Добавил форму, проверку пароля и тест.</text><rect x="210" y="178" width="250" height="26" rx="6" class="fg-box"/><text x="222" y="195" font-size="11" class="fg-t fg-mono" xml:space="preserve">src/form.ts</text><text x="448" y="195" text-anchor="end" font-size="11" font-weight="600" class="fg-ok">+24 −2</text><rect x="210" y="216" width="59.16" height="20" rx="10" class="fg-okbox"/><text x="239.58" y="229.68" text-anchor="middle" font-size="10.5" font-weight="600" class="fg-ok">+24 −2</text><rect x="206" y="248" width="518" height="50" rx="10" class="fg-box"/><text x="220" y="268" font-size="11.5" class="fg-q">Что сделать дальше?</text><circle cx="226" cy="285" r="8" class="fg-bar"/><text x="226" y="289" text-anchor="middle" font-size="12" font-weight="600" class="fg-t">+</text><circle cx="705" cy="285" r="7" class="fg-box"/><rect x="640.44" y="276" width="49.56" height="18" rx="9" class="fg-bar"/><text x="665.22" y="288.5" text-anchor="middle" font-size="10" class="fg-t">Effort ▾</text><rect x="576.89" y="276" width="58.54" height="18" rx="9" class="fg-hi"/><text x="606.17" y="288.5" text-anchor="middle" font-size="10" class="fg-acc">Manual ▾</text><rect x="519.67" y="276" width="52.22" height="18" rx="9" class="fg-bar"/><text x="545.78" y="288.5" text-anchor="middle" font-size="10" class="fg-t">Model ▾</text><circle cx="190" cy="126" r="10" class="fg-tier"/><text x="190" y="130" text-anchor="middle" font-size="12" font-weight="600" class="fg-on">1</text><circle cx="628" cy="84" r="10" class="fg-tier"/><text x="628" y="88" text-anchor="middle" font-size="12" font-weight="600" class="fg-on">2</text><circle cx="494" cy="148" r="10" class="fg-tier"/><text x="494" y="152" text-anchor="middle" font-size="12" font-weight="600" class="fg-on">3</text><circle cx="292" cy="226" r="10" class="fg-tier"/><text x="292" y="230" text-anchor="middle" font-size="12" font-weight="600" class="fg-on">4</text><circle cx="226" cy="244" r="10" class="fg-tier"/><text x="226" y="248" text-anchor="middle" font-size="12" font-weight="600" class="fg-on">5</text><circle cx="606.17" cy="244" r="10" class="fg-tier"/><text x="606.17" y="248" text-anchor="middle" font-size="12" font-weight="600" class="fg-on">6</text><circle cx="545.78" cy="244" r="10" class="fg-tier"/><text x="545.78" y="248" text-anchor="middle" font-size="12" font-weight="600" class="fg-on">7</text><circle cx="34" cy="338" r="10" class="fg-tier"/><text x="34" y="342" text-anchor="middle" font-size="12" font-weight="600" class="fg-on">1</text><text x="52" y="342" font-size="12" class="fg-q">Боковая панель. Каждая сессия — отдельная</text><text x="52" y="357.84" font-size="12" class="fg-q">задача со своей историей. «+ New session»</text><text x="52" y="373.68" font-size="12" class="fg-q">начинает новую.</text><circle cx="34" cy="401.52" r="10" class="fg-tier"/><text x="34" y="405.52" text-anchor="middle" font-size="12" font-weight="600" class="fg-on">2</text><text x="52" y="405.52" font-size="12" class="fg-q">Кнопки Terminal, Changes, Browser открывают</text><text x="52" y="421.36" font-size="12" class="fg-q">панели рядом с чатом: терминал, список</text><text x="52" y="437.2" font-size="12" class="fg-q">изменений и предпросмотр сайта.</text><circle cx="34" cy="465.04" r="10" class="fg-tier"/><text x="34" y="469.04" text-anchor="middle" font-size="12" font-weight="600" class="fg-on">3</text><text x="52" y="469.04" font-size="12" class="fg-q">Чат. Вы пишете задачу обычными словами,</text><text x="52" y="484.88" font-size="12" class="fg-q">Claude отвечает и показывает, что делает.</text><circle cx="34" cy="512.72" r="10" class="fg-tier"/><text x="34" y="516.72" text-anchor="middle" font-size="12" font-weight="600" class="fg-on">4</text><text x="52" y="516.72" font-size="12" class="fg-q">Значок вроде «+24 −2»: сколько строк</text><text x="52" y="532.56" font-size="12" class="fg-q">добавлено и удалено. Нажмите на него, чтобы</text><text x="52" y="548.4" font-size="12" class="fg-q">посмотреть изменения.</text><circle cx="404" cy="338" r="10" class="fg-tier"/><text x="404" y="342" text-anchor="middle" font-size="12" font-weight="600" class="fg-on">5</text><text x="422" y="342" font-size="12" class="fg-q">Кнопка «+»: прикрепить файл, вызвать</text><text x="422" y="357.84" font-size="12" class="fg-q">команду, подключить внешний сервис.</text><circle cx="404" cy="385.68" r="10" class="fg-tier"/><text x="404" y="389.68" text-anchor="middle" font-size="12" font-weight="600" class="fg-on">6</text><text x="422" y="389.68" font-size="12" class="fg-q">Режим разрешений. Здесь Manual: Claude</text><text x="422" y="405.52" font-size="12" class="fg-q">спрашивает перед каждой правкой и командой.</text><circle cx="404" cy="433.36" r="10" class="fg-tier"/><text x="404" y="437.36" text-anchor="middle" font-size="12" font-weight="600" class="fg-on">7</text><text x="422" y="437.36" font-size="12" class="fg-q">Выбор модели и глубины рассуждений (Effort),</text><text x="422" y="453.2" font-size="12" class="fg-q">кольцо — сколько памяти и лимита уже</text><text x="422" y="469.04" font-size="12" class="fg-q">израсходовано.</text></svg>