<svg viewBox="0 0 760 416" role="img" aria-label="Чек-лист перед первым релизом" font-size="13"><text x="24" y="28" font-size="15" font-weight="600" class="fg-t">Чек-лист перед первым релизом</text><rect x="24" y="56" width="348" height="62" rx="8" class="fg-box"/><text x="68" y="91.125" font-size="12.5" font-weight="600" class="fg-t">Входные данные проверяются на сервере</text><rect x="388" y="56" width="348" height="62" rx="8" class="fg-box"/><text x="432" y="83" font-size="12.5" font-weight="600" class="fg-t">Каждый запрос к данным проверяет</text><text x="432" y="99.25" font-size="12.5" font-weight="600" class="fg-t">владельца</text><rect x="24" y="130" width="348" height="62" rx="8" class="fg-box"/><text x="68" y="165.125" font-size="12.5" font-weight="600" class="fg-t">Секреты только в переменных окружения</text><rect x="388" y="130" width="348" height="62" rx="8" class="fg-box"/><text x="432" y="157" font-size="12.5" font-weight="600" class="fg-t">Ошибки понятны пользователю и записаны</text><text x="432" y="173.25" font-size="12.5" font-weight="600" class="fg-t">в журнал</text><rect x="24" y="204" width="348" height="62" rx="8" class="fg-box"/><text x="68" y="231" font-size="12.5" font-weight="600" class="fg-t">Главные сценарии покрыты сквозными</text><text x="68" y="247.25" font-size="12.5" font-weight="600" class="fg-t">тестами</text><rect x="388" y="204" width="348" height="62" rx="8" class="fg-box"/><text x="432" y="231" font-size="12.5" font-weight="600" class="fg-t">Есть резервная копия и способ откатить</text><text x="432" y="247.25" font-size="12.5" font-weight="600" class="fg-t">релиз</text><circle cx="46" cy="87" r="9" class="fg-ok"/><path d="M41 87L44.5 90.5L51 83" class="fg-onln"/><circle cx="410" cy="87" r="9" class="fg-ok"/><path d="M405 87L408.5 90.5L415 83" class="fg-onln"/><circle cx="46" cy="161" r="9" class="fg-ok"/><path d="M41 161L44.5 164.5L51 157" class="fg-onln"/><circle cx="410" cy="161" r="9" class="fg-ok"/><path d="M405 161L408.5 164.5L415 157" class="fg-onln"/><circle cx="46" cy="235" r="9" class="fg-ok"/><path d="M41 235L44.5 238.5L51 231" class="fg-onln"/><circle cx="410" cy="235" r="9" class="fg-ok"/><path d="M405 235L408.5 238.5L415 231" class="fg-onln"/><rect x="24" y="288" width="712" height="112" rx="10" class="fg-zone"/><text x="380" y="316" text-anchor="middle" font-size="12.5" font-weight="600" class="fg-t">Превратите список в запрос к ИИ</text><text x="380" y="338" text-anchor="middle" font-size="11.5" class="fg-q">По каждому пункту: сделано, не сделано или не знаю. Для «не сделано» объясни простыми словами,</text><text x="380" y="353.18" text-anchor="middle" font-size="11.5" class="fg-q">чем это грозит.</text><text x="380" y="382" text-anchor="middle" font-size="12" font-weight="600" class="fg-t">Затем проверьте часть ответов вручную</text></svg>