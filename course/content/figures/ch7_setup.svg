<svg viewBox="0 0 760 295" role="img" aria-label="Старт проекта: четыре шага до первой функции" font-size="13"><text x="24" y="28" font-size="15" font-weight="600" class="fg-t">Старт проекта: четыре шага до первой функции</text><rect x="24" y="62" width="158.5" height="110.41" rx="8" class="fg-box"/><text x="103.25" y="86.74" text-anchor="middle" font-weight="600" class="fg-t">Официальный</text><text x="103.25" y="103.64" text-anchor="middle" font-weight="600" class="fg-t">генератор</text><text x="103.25" y="123.54" text-anchor="middle" font-size="11.5" class="fg-q">Проект создаёт сам</text><text x="103.25" y="139.41" text-anchor="middle" font-size="11.5" class="fg-q">фреймворк, а не ИИ с</text><text x="103.25" y="155.28" text-anchor="middle" font-size="11.5" class="fg-q">нуля</text><rect x="208.5" y="62" width="158.5" height="110.41" rx="8" class="fg-box"/><text x="287.75" y="95.19" text-anchor="middle" font-weight="600" class="fg-t">Строгость сразу</text><text x="287.75" y="115.09" text-anchor="middle" font-size="11.5" class="fg-q">Строгий TypeScript,</text><text x="287.75" y="130.96" text-anchor="middle" font-size="11.5" class="fg-q">линтер, проверка</text><text x="287.75" y="146.83" text-anchor="middle" font-size="11.5" class="fg-q">типов</text><rect x="393" y="62" width="158.5" height="110.41" rx="8" class="fg-box"/><text x="472.25" y="95.19" text-anchor="middle" font-weight="600" class="fg-t">Файл правил</text><text x="472.25" y="115.09" text-anchor="middle" font-size="11.5" class="fg-q">Стек, команды и</text><text x="472.25" y="130.96" text-anchor="middle" font-size="11.5" class="fg-q">запреты до первого</text><text x="472.25" y="146.83" text-anchor="middle" font-size="11.5" class="fg-q">запроса агенту</text><rect x="577.5" y="62" width="158.5" height="110.41" rx="8" class="fg-hi"/><text x="656.75" y="95.19" text-anchor="middle" font-weight="600" class="fg-t">Первый коммит</text><text x="656.75" y="115.09" text-anchor="middle" font-size="11.5" class="fg-q">Чистый каркас: точка,</text><text x="656.75" y="130.96" text-anchor="middle" font-size="11.5" class="fg-q">к которой всегда</text><text x="656.75" y="146.83" text-anchor="middle" font-size="11.5" class="fg-q">можно вернуться</text><circle cx="40" cy="60" r="10" class="fg-tier"/><text x="40" y="64" text-anchor="middle" font-size="12" font-weight="600" class="fg-on">1</text><circle cx="224.5" cy="60" r="10" class="fg-tier"/><text x="224.5" y="64" text-anchor="middle" font-size="12" font-weight="600" class="fg-on">2</text><circle cx="409" cy="60" r="10" class="fg-tier"/><text x="409" y="64" text-anchor="middle" font-size="12" font-weight="600" class="fg-on">3</text><circle cx="593.5" cy="60" r="10" class="fg-tier"/><text x="593.5" y="64" text-anchor="middle" font-size="12" font-weight="600" class="fg-on">4</text><path d="M182.5 117.205L208.5 117.205" class="fg-ln" marker-end="url(#bk-arrow)"/><path d="M367 117.205L393 117.205" class="fg-ln" marker-end="url(#bk-arrow)"/><path d="M551.5 117.205L577.5 117.205" class="fg-ln" marker-end="url(#bk-arrow)"/><rect x="24" y="214.41" width="712" height="64" rx="8" class="fg-okbox"/><text x="380" y="240.265" text-anchor="middle" font-weight="600" class="fg-t">И только теперь — первая функция</text><text x="380" y="260.165" text-anchor="middle" font-size="11.5" class="fg-q">Каркас самая дешёвая часть проекта и самая дорогая для исправления позже, поэтому его делают первым</text><path d="M656.75 172.41L656.75 214.41" class="fg-ln" marker-end="url(#bk-arrow)"/></svg>