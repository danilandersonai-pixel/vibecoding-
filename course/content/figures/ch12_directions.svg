<svg viewBox="0 0 760 352" role="img" aria-label="Прямая и обратная разработка" font-size="13"><text x="24" y="28" font-size="15" font-weight="600" class="fg-t">Прямая и обратная разработка</text><text x="24" y="62" font-size="12" class="fg-q">Прямая разработка: от идеи к продукту →</text><rect x="24" y="72" width="160" height="58" rx="8" class="fg-box"/><text x="104.0" y="96" text-anchor="middle" font-weight="600" class="fg-t">Идея</text><text x="104.0" y="116" text-anchor="middle" font-size="11.5" class="fg-q">что хочу сделать</text><rect x="208" y="72" width="160" height="58" rx="8" class="fg-box"/><text x="288.0" y="96" text-anchor="middle" font-weight="600" class="fg-t">Описание</text><text x="288.0" y="116" text-anchor="middle" font-size="11.5" class="fg-q">спецификация</text><rect x="392" y="72" width="160" height="58" rx="8" class="fg-box"/><text x="472.0" y="96" text-anchor="middle" font-weight="600" class="fg-t">Код</text><text x="472.0" y="116" text-anchor="middle" font-size="11.5" class="fg-q">пишет агент</text><rect x="576" y="72" width="160" height="58" rx="8" class="fg-box"/><text x="656.0" y="96" text-anchor="middle" font-weight="600" class="fg-t">Продукт</text><text x="656.0" y="116" text-anchor="middle" font-size="11.5" class="fg-q">работает у людей</text><path d="M184 101L208 101" class="fg-ln" marker-end="url(#bk-arrow)"/><path d="M368 101L392 101" class="fg-ln" marker-end="url(#bk-arrow)"/><path d="M552 101L576 101" class="fg-ln" marker-end="url(#bk-arrow)"/><rect x="24" y="186" width="160" height="58" rx="8" class="fg-ghost"/><text x="104" y="210" text-anchor="middle" font-weight="600" class="fg-q">Код эталона</text><text x="104" y="230" text-anchor="middle" font-size="11.5" class="fg-q">не нужен и не берётся</text><rect x="208" y="186" width="160" height="58" rx="8" class="fg-hi"/><text x="288.0" y="210" text-anchor="middle" font-weight="600" class="fg-t">Своё описание</text><text x="288.0" y="230" text-anchor="middle" font-size="11.5" class="fg-q">своими словами</text><rect x="392" y="186" width="160" height="58" rx="8" class="fg-box"/><text x="472.0" y="210" text-anchor="middle" font-weight="600" class="fg-t">Разбор</text><text x="472.0" y="230" text-anchor="middle" font-size="11.5" class="fg-q">экраны, данные, правила</text><rect x="576" y="186" width="160" height="58" rx="8" class="fg-zone"/><text x="656.0" y="210" text-anchor="middle" font-weight="600" class="fg-t">Эталон</text><text x="656.0" y="230" text-anchor="middle" font-size="11.5" class="fg-q">чужой готовый продукт</text><path d="M576 215L552 215" class="fg-ln" marker-end="url(#bk-arrow)"/><path d="M392 215L368 215" class="fg-ln" marker-end="url(#bk-arrow)"/><path d="M288 186L288 132" class="fg-ln-acc" marker-end="url(#bk-arrow-acc)"/><text x="296" y="164" font-size="11" font-weight="600" class="fg-acc">вход в прямую цепочку</text><text x="736" y="266" text-anchor="end" font-size="12" class="fg-q">← Обратная разработка: от готового продукта к описанию</text><rect x="24" y="284" width="712" height="54" rx="8" class="fg-zone"/><text x="380" y="306" text-anchor="middle" font-weight="600" class="fg-t">Своё описание становится началом вашей обычной разработки</text><text x="380" y="325" text-anchor="middle" font-size="11.5" class="fg-q">Дальше всё как всегда: свой код, свои тесты, своё оформление</text></svg>