<svg viewBox="0 0 760 326" role="img" aria-label="Проект с агентами: спецификация в центре процесса" font-size="13"><text x="24" y="28" font-size="15" font-weight="600" class="fg-t">Проект с агентами: спецификация в центре процесса</text><rect x="24" y="60" width="160" height="96" rx="8" class="fg-box"/><text x="104" y="85.47" text-anchor="middle" font-weight="600" class="fg-t">Обсуждения и</text><text x="104" y="102.37" text-anchor="middle" font-weight="600" class="fg-t">переписка</text><text x="104" y="122.27" text-anchor="middle" font-size="11.5" class="fg-q">ИИ делает черновики</text><text x="104" y="138.14" text-anchor="middle" font-size="11.5" class="fg-q">задач</text><rect x="208" y="60" width="160" height="96" rx="8" class="fg-hi"/><text x="288" y="85.985" text-anchor="middle" font-weight="600" class="fg-t">Спецификация</text><text x="288" y="105.885" text-anchor="middle" font-size="11.5" class="fg-q">Требования, критерии</text><text x="288" y="121.755" text-anchor="middle" font-size="11.5" class="fg-q">готовности,</text><text x="288" y="137.625" text-anchor="middle" font-size="11.5" class="fg-q">ограничения</text><rect x="392" y="60" width="160" height="96" rx="8" class="fg-box"/><text x="472" y="93.92" text-anchor="middle" font-weight="600" class="fg-t">Агенты пишут код</text><text x="472" y="113.82" text-anchor="middle" font-size="11.5" class="fg-q">Быстро и</text><text x="472" y="129.69" text-anchor="middle" font-size="11.5" class="fg-q">параллельно</text><rect x="576" y="60" width="160" height="96" rx="8" class="fg-okbox"/><text x="656" y="101.855" text-anchor="middle" font-weight="600" class="fg-t">Проверка</text><text x="656" y="121.755" text-anchor="middle" font-size="11.5" class="fg-q">Тесты и человек</text><path d="M184 108L208 108" class="fg-ln" marker-end="url(#bk-arrow)"/><path d="M368 108L392 108" class="fg-ln" marker-end="url(#bk-arrow)"/><path d="M552 108L576 108" class="fg-ln" marker-end="url(#bk-arrow)"/><path d="M656 156L656 184L288 184L288 156" class="fg-ln fg-dash" marker-end="url(#bk-arrow)"/><text x="472" y="176" text-anchor="middle" font-size="11" class="fg-q">неясно — вернуться и уточнить</text><rect x="24" y="222" width="344" height="88" rx="8" class="fg-zone"/><text x="196" y="251.92" text-anchor="middle" font-weight="600" class="fg-t">Другие метрики</text><text x="196" y="271.82" text-anchor="middle" font-size="11.5" class="fg-q">Не число строк и задач, а время от идеи до</text><text x="196" y="287.69" text-anchor="middle" font-size="11.5" class="fg-q">проверенной гипотезы</text><rect x="392" y="222" width="344" height="88" rx="8" class="fg-zone"/><text x="564" y="251.92" text-anchor="middle" font-weight="600" class="fg-t">Прототип вместо документа</text><text x="564" y="271.82" text-anchor="middle" font-size="11.5" class="fg-q">Менеджер показывает работающее, а не страницы</text><text x="564" y="287.69" text-anchor="middle" font-size="11.5" class="fg-q">требований</text></svg>