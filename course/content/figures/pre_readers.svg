<svg viewBox="0 0 760 303" role="img" aria-label="Для кого эта книга" font-size="13"><text x="24" y="28" font-size="15" font-weight="600" class="fg-t">Для кого эта книга</text><rect x="130" y="52" width="500" height="64" rx="8" class="fg-hi"/><text x="380" y="77.855" text-anchor="middle" font-weight="600" class="fg-t">Главный читатель: человек без опыта программирования</text><text x="380" y="97.755" text-anchor="middle" font-size="11.5" class="fg-q">Вы не обязаны уметь писать код</text><rect x="24" y="176" width="224" height="110.41" rx="8" class="fg-box"/><text x="136" y="209.19" text-anchor="middle" font-weight="600" class="fg-t">Начинающие разработчики</text><text x="136" y="229.09" text-anchor="middle" font-size="11.5" class="fg-q">Немного пишут код и хотят</text><text x="136" y="244.96" text-anchor="middle" font-size="11.5" class="fg-q">встроить ИИ, не потеряв</text><text x="136" y="260.83" text-anchor="middle" font-size="11.5" class="fg-q">качество</text><rect x="268" y="176" width="224" height="110.41" rx="8" class="fg-box"/><text x="380" y="200.74" text-anchor="middle" font-weight="600" class="fg-t">Опытные разработчики и</text><text x="380" y="217.64" text-anchor="middle" font-weight="600" class="fg-t">техлиды</text><text x="380" y="237.54" text-anchor="middle" font-size="11.5" class="fg-q">Могут пропустить «Азбуку» и</text><text x="380" y="253.41" text-anchor="middle" font-size="11.5" class="fg-q">сразу читать про проверку,</text><text x="380" y="269.28" text-anchor="middle" font-size="11.5" class="fg-q">безопасность и команду</text><rect x="512" y="176" width="224" height="110.41" rx="8" class="fg-box"/><text x="624" y="217.125" text-anchor="middle" font-weight="600" class="fg-t">Руководители и менеджеры</text><text x="624" y="237.025" text-anchor="middle" font-size="11.5" class="fg-q">Выстраивают правила,</text><text x="624" y="252.895" text-anchor="middle" font-size="11.5" class="fg-q">оценивают риски и бюджет</text><path d="M380 116L380 150L136 150L136 176" class="fg-ln" marker-end="url(#bk-arrow)"/><path d="M380 116L380 150L380 150L380 176" class="fg-ln" marker-end="url(#bk-arrow)"/><path d="M380 116L380 150L624 150L624 176" class="fg-ln" marker-end="url(#bk-arrow)"/></svg>