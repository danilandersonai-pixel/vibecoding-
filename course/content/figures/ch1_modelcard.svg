<svg viewBox="0 0 760 476" role="img" aria-label="Карточка модели: какие характеристики смотреть" font-size="13"><text x="24" y="28" font-size="15" font-weight="600" class="fg-t">Карточка модели: что смотреть, кроме названия</text><rect x="24" y="52" width="470" height="338" rx="8" class="fg-win"/><path d="M24 78V60Q24 52 32 52H486Q494 52 494 60V78Z" class="fg-bar"/><circle cx="38" cy="65" r="3.5" class="fg-dot"/><circle cx="51" cy="65" r="3.5" class="fg-dot"/><circle cx="64" cy="65" r="3.5" class="fg-dot"/><text x="259" y="69" text-anchor="middle" font-size="11" class="fg-q">Страница модели (пример)</text><text x="44" y="104" font-size="15" font-weight="600" class="fg-t">Модель X</text><text x="478" y="104" text-anchor="end" font-size="11" class="fg-q">название — это бренд</text><rect x="40" y="124" width="430" height="28" rx="6" class="fg-box"/><text x="54" y="143" font-size="12" class="fg-q">Контекстное окно</text><text x="250" y="143" font-size="12" font-weight="600" class="fg-t">1 млн токенов</text><circle cx="488" cy="138" r="10" class="fg-tier"/><text x="488" y="142" text-anchor="middle" font-size="12" font-weight="600" class="fg-on">1</text><circle cx="530" cy="138" r="10" class="fg-tier"/><text x="530" y="142" text-anchor="middle" font-size="12" font-weight="600" class="fg-on">1</text><text x="548" y="135" font-size="11.5" class="fg-q">Сколько помещается</text><text x="548" y="150" font-size="11.5" class="fg-q">на «рабочий стол»</text><rect x="40" y="160" width="430" height="28" rx="6" class="fg-box"/><text x="54" y="179" font-size="12" class="fg-q">Максимальный ответ</text><text x="250" y="179" font-size="12" font-weight="600" class="fg-t">128 тыс. токенов</text><circle cx="488" cy="174" r="10" class="fg-tier"/><text x="488" y="178" text-anchor="middle" font-size="12" font-weight="600" class="fg-on">2</text><circle cx="530" cy="174" r="10" class="fg-tier"/><text x="530" y="178" text-anchor="middle" font-size="12" font-weight="600" class="fg-on">2</text><text x="548" y="171" font-size="11.5" class="fg-q">Сколько напишет</text><text x="548" y="186" font-size="11.5" class="fg-q">за один раз</text><rect x="40" y="196" width="430" height="28" rx="6" class="fg-box"/><text x="54" y="215" font-size="12" class="fg-q">Дата среза знаний</text><text x="250" y="215" font-size="12" font-weight="600" class="fg-t">июнь 2026</text><circle cx="488" cy="210" r="10" class="fg-tier"/><text x="488" y="214" text-anchor="middle" font-size="12" font-weight="600" class="fg-on">3</text><circle cx="530" cy="210" r="10" class="fg-tier"/><text x="530" y="214" text-anchor="middle" font-size="12" font-weight="600" class="fg-on">3</text><text x="548" y="207" font-size="11.5" class="fg-q">Что вышло позже,</text><text x="548" y="222" font-size="11.5" class="fg-q">модель не знает</text><rect x="40" y="232" width="430" height="28" rx="6" class="fg-box"/><text x="54" y="251" font-size="12" class="fg-q">Цена: вход / выход</text><text x="250" y="251" font-size="12" font-weight="600" class="fg-t">$2 / $10 за 1 млн</text><circle cx="488" cy="246" r="10" class="fg-tier"/><text x="488" y="250" text-anchor="middle" font-size="12" font-weight="600" class="fg-on">4</text><circle cx="530" cy="246" r="10" class="fg-tier"/><text x="530" y="250" text-anchor="middle" font-size="12" font-weight="600" class="fg-on">4</text><text x="548" y="243" font-size="11.5" class="fg-q">Ответ обычно в 4–5 раз</text><text x="548" y="258" font-size="11.5" class="fg-q">дороже вопроса</text><rect x="40" y="268" width="430" height="28" rx="6" class="fg-box"/><text x="54" y="287" font-size="12" class="fg-q">Уровни усилия</text><text x="250" y="287" font-size="12" font-weight="600" class="fg-t">low … max</text><circle cx="488" cy="282" r="10" class="fg-tier"/><text x="488" y="286" text-anchor="middle" font-size="12" font-weight="600" class="fg-on">5</text><circle cx="530" cy="282" r="10" class="fg-tier"/><text x="530" y="286" text-anchor="middle" font-size="12" font-weight="600" class="fg-on">5</text><text x="548" y="279" font-size="11.5" class="fg-q">Глубина рассуждения:</text><text x="548" y="294" font-size="11.5" class="fg-q">качество против цены</text><rect x="40" y="304" width="430" height="28" rx="6" class="fg-box"/><text x="54" y="323" font-size="12" class="fg-q">Понимает</text><text x="250" y="323" font-size="12" font-weight="600" class="fg-t">текст и картинки</text><circle cx="488" cy="318" r="10" class="fg-tier"/><text x="488" y="322" text-anchor="middle" font-size="12" font-weight="600" class="fg-on">6</text><circle cx="530" cy="318" r="10" class="fg-tier"/><text x="530" y="322" text-anchor="middle" font-size="12" font-weight="600" class="fg-on">6</text><text x="548" y="315" font-size="11.5" class="fg-q">Можно ли показать</text><text x="548" y="330" font-size="11.5" class="fg-q">скриншот или макет</text><rect x="40" y="340" width="430" height="28" rx="6" class="fg-box"/><text x="54" y="359" font-size="12" class="fg-q">Ограничения</text><text x="250" y="359" font-size="12" font-weight="600" class="fg-t">раздел в system card</text><circle cx="488" cy="354" r="10" class="fg-tier"/><text x="488" y="358" text-anchor="middle" font-size="12" font-weight="600" class="fg-on">7</text><circle cx="530" cy="354" r="10" class="fg-tier"/><text x="530" y="358" text-anchor="middle" font-size="12" font-weight="600" class="fg-on">7</text><text x="548" y="351" font-size="11.5" class="fg-q">Где модель ошибается,</text><text x="548" y="366" font-size="11.5" class="fg-q">по словам автора</text><rect x="24" y="404" width="712" height="58" rx="8" class="fg-hi"/><text x="380" y="428" text-anchor="middle" font-weight="600" class="fg-t">Характеристики берут из карточки, а «ум» проверяют бенчмарками и своими задачами</text><text x="380" y="447" text-anchor="middle" font-size="11.5" class="fg-q">Карточки Claude: anthropic.com/system-cards · цены и характеристики: страница модели в документации</text></svg>