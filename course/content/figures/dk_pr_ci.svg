<svg viewBox="0 0 760 367" role="img" aria-label="Меню пул-реквеста в сессии: автоисправление и автослияние" font-size="13"><text x="24" y="28" font-size="15" font-weight="600" class="fg-t">Пул-реквест и проверки прямо в сессии</text><rect x="24" y="46" width="712" height="150" rx="10" class="fg-win"/><text x="40" y="70" font-size="12" font-weight="600" class="fg-t">Форма входа ▾</text><rect x="24" y="82" width="712" height="1" rx="0" class="fg-line"/><rect x="36" y="92" width="688" height="34" rx="8" class="fg-box"/><text x="48" y="114" font-size="11.5" font-weight="600" class="fg-t">PR #14</text><text x="106" y="114" font-size="11" class="fg-q fg-mono" xml:space="preserve">feat/login-form</text><text x="354" y="114" font-size="11.5" class="fg-t">Проверки:  3 ✓   1 ✗</text><rect x="666.48" y="98" width="45.52" height="22" rx="11" class="fg-hi"/><text x="689.24" y="112.85" text-anchor="middle" font-size="11" font-weight="600" class="fg-acc">⋮</text><rect x="436" y="128" width="276" height="56" rx="8" class="fg-win"/><rect x="436" y="128" width="276" height="56" rx="8" class="fg-box"/><rect x="448" y="139" width="13" height="13" rx="3" class="fg-hi"/><text x="454.5" y="150" text-anchor="middle" font-size="10" font-weight="600" class="fg-acc">✓</text><text x="470" y="150" font-size="11" class="fg-t">Auto-fix</text><rect x="448" y="162" width="13" height="13" rx="3" class="fg-box"/><text x="470" y="173" font-size="11" class="fg-t">Merge when ready</text><circle cx="46" cy="92" r="10" class="fg-tier"/><text x="46" y="96" text-anchor="middle" font-size="12" font-weight="600" class="fg-on">1</text><circle cx="340" cy="109" r="10" class="fg-tier"/><text x="340" y="113" text-anchor="middle" font-size="12" font-weight="600" class="fg-on">2</text><circle cx="654.48" cy="98" r="10" class="fg-tier"/><text x="654.48" y="102" text-anchor="middle" font-size="12" font-weight="600" class="fg-on">3</text><circle cx="424" cy="156" r="10" class="fg-tier"/><text x="424" y="160" text-anchor="middle" font-size="12" font-weight="600" class="fg-on">4</text><circle cx="34" cy="224" r="10" class="fg-tier"/><text x="34" y="228" text-anchor="middle" font-size="12" font-weight="600" class="fg-on">1</text><text x="52" y="228" font-size="12" class="fg-q">После создания пул-реквеста в сессии</text><text x="52" y="243.84" font-size="12" class="fg-q">появляется строка со ссылкой на него и</text><text x="52" y="259.68" font-size="12" class="fg-q">названием ветки.</text><circle cx="34" cy="287.52" r="10" class="fg-tier"/><text x="34" y="291.52" text-anchor="middle" font-size="12" font-weight="600" class="fg-on">2</text><text x="52" y="291.52" font-size="12" class="fg-q">Результаты проверок (CI): сколько прошло, а</text><text x="52" y="307.36" font-size="12" class="fg-q">сколько нет. Claude узнаёт их через GitHub.</text><circle cx="404" cy="224" r="10" class="fg-tier"/><text x="404" y="228" text-anchor="middle" font-size="12" font-weight="600" class="fg-on">3</text><text x="422" y="228" font-size="12" class="fg-q">Меню ⋮ у пул-реквеста: два пункта.</text><text x="422" y="243.84" font-size="12" class="fg-q">Auto-fix: Claude сам чинит красные проверки и</text><text x="422" y="259.68" font-size="12" class="fg-q">отвечает на замечания.</text><circle cx="404" cy="287.52" r="10" class="fg-tier"/><text x="404" y="291.52" text-anchor="middle" font-size="12" font-weight="600" class="fg-on">4</text><text x="422" y="291.52" font-size="12" class="fg-q">Merge when ready: пул-реквест вольётся сам,</text><text x="422" y="307.36" font-size="12" class="fg-q">когда все проверки зелёные. Нужен установленный</text><text x="422" y="323.2" font-size="12" class="fg-q">и авторизованный GitHub CLI (gh), а в репозитории</text><text x="422" y="339.04" font-size="12" class="fg-q">должно быть включено автослияние.</text></svg>