<svg viewBox="0 0 760 546" role="img" aria-label="Запрос A и запрос B: кто принимает решения" font-size="13"><text x="24" y="28" font-size="15" font-weight="600" class="fg-t">Запрос A и запрос B: кто принимает решения</text><rect x="24" y="48" width="346" height="80" rx="8" class="fg-box"/><text x="197" y="81.855" text-anchor="middle" font-weight="600" class="fg-t">Запрос A</text><text x="197" y="101.755" text-anchor="middle" font-size="11.5" class="fg-q">«Добавь пагинацию в список заказов»</text><rect x="24" y="142" width="346" height="78" rx="8" class="fg-riskzone"/><text x="64" y="175.035" font-size="12.5" font-weight="600" class="fg-t">Какая пагинация?</text><text x="64" y="194.285" font-size="11" class="fg-q">модель выберет самую частую</text><circle cx="44" cy="181" r="10" class="fg-risk"/><text x="44" y="185.5" text-anchor="middle" font-weight="600" class="fg-on">?</text><rect x="24" y="228" width="346" height="78" rx="8" class="fg-riskzone"/><text x="64" y="261.035" font-size="12.5" font-weight="600" class="fg-t">Какой формат ответа?</text><text x="64" y="280.285" font-size="11" class="fg-q">модель придумает свой</text><circle cx="44" cy="267" r="10" class="fg-risk"/><text x="44" y="271.5" text-anchor="middle" font-weight="600" class="fg-on">?</text><rect x="24" y="314" width="346" height="78" rx="8" class="fg-riskzone"/><text x="64" y="347.035" font-size="12.5" font-weight="600" class="fg-t">Не сломается ли мобильное приложение?</text><text x="64" y="366.285" font-size="11" class="fg-q">модель не знает о нём</text><circle cx="44" cy="353" r="10" class="fg-risk"/><text x="44" y="357.5" text-anchor="middle" font-weight="600" class="fg-on">?</text><rect x="24" y="400" width="346" height="78" rx="8" class="fg-riskzone"/><text x="64" y="433.035" font-size="12.5" font-weight="600" class="fg-t">Как проверить?</text><text x="64" y="452.285" font-size="11" class="fg-q">модель сама решит, нужны ли тесты</text><circle cx="44" cy="439" r="10" class="fg-risk"/><text x="