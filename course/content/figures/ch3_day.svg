<svg viewBox="0 0 760 478" role="img" aria-label="Типичный день опытного разработчика с ИИ" font-size="13"><text x="24" y="28" font-size="15" font-weight="600" class="fg-t">Типичный день опытного разработчика с ИИ</text><rect x="24" y="56" width="712" height="62" rx="8" class="fg-box"/><text x="76" y="81.69" font-size="12.5" font-weight="600" class="fg-t">Утро</text><text x="76" y="98.94" font-size="11.5" class="fg-q">Агент пересказывает изменения коллег и находит касающиеся вашей задачи</text><circle cx="46" cy="87" r="10" class="fg-tier"/><text x="46" y="91" text-anchor="middle" font-size="12" font-weight="600" class="fg-on">1</text><rect x="24" y="126" width="712" height="62" rx="8" class="fg-box"/><text x="76" y="151.69" font-size="12.5" font-weight="600" class="fg-t">Перед задачей</text><text x="76" y="168.94" font-size="11.5" class="fg-q">Обсуждаете с ИИ план и риски, но подход выбираете сами</text><circle cx="46" cy="157" r="10" class="fg-tier"/><text x="46" y="161" text-anchor="middle" font-size="12" font-weight="600" class="fg-on">2</text><rect x="24" y="196" width="712" height="62" rx="8" class="fg-box"/><text x="76" y="221.69" font-size="12.5" font-weight="600" class="fg-t">Во время работы</text><text x="76" y="238.94" font-size="11.5" class="fg-q">ИИ берёт рутину: тесты, описание данных, обработку ошибок по образцу</text><circle cx="46" cy="227" r="10" class="fg-tier"/><text x="46" y="231" text-anchor="middle" font-size="12" font-weight="600" class="fg-on">3</text><rect x="24" y="266" width="712" height="62" rx="8" class="fg-box"/><text x="76" y="291.69" font-size="12.5" font-weight="600" class="fg-t">Перед ревью</text><text x="76" y="308.94" font-size="11.5" class="fg-q">ИИ ищет в ваших изменениях необычные случаи и уязвимости</text><circle cx="46" cy="297" r="10" class="fg-tier"/><text x="46" y="301" text-anchor="middle" font-size="12" font-weight="600" class="fg-on">4</text><rect x="24" y="336" width="712" height="62" rx="8" class="fg-box"/><text x="76" y="361.69" font-size="12.5" font-weight="600" class="fg-t">В фоне</text><text x="76" y="378.94" font-size="11.5" class="fg-q">Агент делает механическое: обновляет библиотеки, переносит модуль</text><circle cx="46" cy="367" r="10" class="fg-tier"/><text x="46" y="371" text-anchor="middle" font-size="12" font-weight="600" class="fg-on">5</text><rect x="24" y="418" width="712" height="44" rx="8" class="fg-okbox"/><text x="380" y="444.125" text-anchor="middle" font-size="12.5" font-weight="600" class="fg-t">ИИ делает рутину и подсказывает, а решения и проверка остаются у человека</text></svg>