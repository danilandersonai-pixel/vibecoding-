<svg viewBox="0 0 760 413" role="img" aria-label="Техники запросов: когда какую брать" font-size="13"><text x="24" y="28" font-size="15" font-weight="600" class="fg-t">Техники запросов: когда какую брать</text><rect x="24" y="52" width="224" height="40" rx="8" class="fg-hi"/><text x="136" y="76.29" text-anchor="middle" font-weight="600" class="fg-t">До начала</text><rect x="24" y="104" width="224" height="80" rx="8" class="fg-box"/><text x="136" y="137.855" text-anchor="middle" font-weight="600" class="fg-t">Вопросы перед стартом</text><text x="136" y="157.755" text-anchor="middle" font-size="11.5" class="fg-q">Требования расплывчаты</text><rect x="24" y="196" width="224" height="80" rx="8" class="fg-box"/><text x="136" y="229.855" text-anchor="middle" font-weight="600" class="fg-t">Сначала план</text><text x="136" y="249.755" text-anchor="middle" font-size="11.5" class="fg-q">Задача больше одного файла</text><rect x="24" y="288" width="224" height="80" rx="8" class="fg-box"/><text x="136" y="321.855" text-anchor="middle" font-weight="600" class="fg-t">Примеры</text><text x="136" y="341.755" text-anchor="middle" font-size="11.5" class="fg-q">Нужен стиль или формат</text><rect x="268" y="52" width="224" height="40" rx="8" class="fg-hi"/><text x="380" y="76.29" text-anchor="middle" font-weight="600" class="fg-t">Во время работы</text><rect x="268" y="104" width="224" height="80" rx="8" class="fg-box"/><text x="380" y="137.855" text-anchor="middle" font-weight="600" class="fg-t">Тесты сначала</text><text x="380" y="157.755" text-anchor="middle" font-size="11.5" class="fg-q">Понятно, что на входе и выходе</text><rect x="268" y="196" width="224" height="80" rx="8" class="fg-box"/><text x="380" y="221.92" text-anchor="middle" font-weight="600" class="fg-t">Декомпозиция</text><text x="380" y="241.82" text-anchor="middle" font-size="11.5" class="fg-q">Большие функции, переносы</text><text x="380" y="257.69" text-anchor="middle" font-size="11.5" class="fg-q">данных</text><rect x="268" y="288" width="224" height="80" rx="8" class="fg-box"/><text x="380" y="321.855" text-anchor="middle" font-weight="600" class="fg-t">Формат ответа</text><text x="380" y="341.755" text-anchor="middle" font-size="11.5" class="fg-q">Нужен список, таблица, резюме</text><rect x="512" y="52" width="224" height="40" rx="8" class="fg-hi"/><text x="624" y="76.29" text-anchor="middle" font-weight="600" class="fg-t">Проверка</text><rect x="512" y="104" width="224" height="80" rx="8" class="fg-box"/><text x="624" y="137.855" text-anchor="middle" font-weight="600" class="fg-t">Самопроверка</text><text x="624" y="157.755" text-anchor="middle" font-size="11.5" class="fg-q">Перед финальной версией</text><rect x="512" y="196" width="224" height="80" rx="8" class="fg-box"/><text x="624" y="221.92" text-anchor="middle" font-weight="600" class="fg-t">Другая перспектива</text><text x="624" y="241.82" text-anchor="middle" font-size="11.5" class="fg-q">Взгляд специалиста по</text><text x="624" y="257.69" text-anchor="middle" font-size="11.5" class="fg-q">безопасности</text><rect x="512" y="288" width="224" height="80" rx="8" class="fg-box"/><text x="624" y="321.855" text-anchor="middle" font-weight="600" class="fg-t">Объяснение перед правкой</text><text x="624" y="341.755" text-anchor="middle" font-size="11.5" class="fg-q">Поиск ошибок</text><text x="24" y="392" font-size="11.5" class="fg-q">Группировка по моменту применения — для удобства; набор техник тот же, что в таблице.</text></svg>