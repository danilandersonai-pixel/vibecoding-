e" font-size="12" font-weight="600" class="fg-on">3</text><circle cx="510" cy="71" r="10" class="fg-tier"/><text x="510" y="75" text-anchor="middle" font-size="12" font-weight="600" class="fg-on">1</text><text x="528" y="75" font-size="12" class="fg-q">Красная строка со знаком −</text><text x="528" y="90.84" font-size="12" class="fg-q">удалена</text><circle cx="510" cy="120.68" r="10" class="fg-tier"/><text x="510" y="124.68" text-anchor="middle" font-size="12" font-weight="600" class="fg-on">2</text><text x="528" y="124.68" font-size="12" class="fg-q">Зелёная строка со знаком +</text><text x="528" y="140.52" font-size="12" class="fg-q">добавлена</text><circle cx="510" cy="170.36" r="10" class="fg-tier"/><text x="510" y="174.36" text-anchor="middle" font-size="12" font-weight="600" class="fg-on">3</text><text x="528" y="174.36" font-size="12" class="fg-q">Серые строки не менялись, они</text><text x="528" y="190.2" font-size="12" class="fg-q">нужны для ориентира</text><rect x="24" y="214" width="712" height="70" rx="8" class="fg-hi"/><text x="380" y="242.855" text-anchor="middle" font-weight="600" class="fg-t">Спросите ИИ по каждой красной строке</text><text x="380" y="262.755" text-anchor="middle" font-size="11.5" class="fg-q">«Зачем удалена эта строка и что изменится без неё?» Если ответ неясен, не принимайте изменение.</text></svg>