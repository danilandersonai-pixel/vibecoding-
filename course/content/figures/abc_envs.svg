<svg viewBox="0 0 760 296" role="img" aria-label="Три окружения: от репетиции к премьере" font-size="13"><text x="24" y="28" font-size="15" font-weight="600" class="fg-t">Три окружения: от репетиции к премьере</text><rect x="24" y="64" width="181.333" height="142.15" rx="8" class="fg-box"/><text x="114.667" y="105.125" text-anchor="middle" font-weight="600" class="fg-t">Разработка</text><text x="114.667" y="125.025" text-anchor="middle" font-size="11.5" class="fg-q">Ваш компьютер. Можно</text><text x="114.667" y="140.895" text-anchor="middle" font-size="11.5" class="fg-q">ломать что угодно.</text><text x="114.667" y="156.765" text-anchor="middle" font-size="11.5" class="fg-q">Как репетиция в пустом</text><text x="114.667" y="172.635" text-anchor="middle" font-size="11.5" class="fg-q">зале.</text><rect x="289.333" y="64" width="181.333" height="142.15" rx="8" class="fg-hi"/><text x="380" y="88.74" text-anchor="middle" font-weight="600" class="fg-t">Тестовое окружение</text><text x="380" y="105.64" text-anchor="middle" font-weight="600" class="fg-t">(staging)</text><text x="380" y="125.54" text-anchor="middle" font-size="11.5" class="fg-q">Копия боевой версии.</text><text x="380" y="141.41" text-anchor="middle" font-size="11.5" class="fg-q">Здесь всё проверяют</text><text x="380" y="157.28" text-anchor="middle" font-size="11.5" class="fg-q">перед выпуском.</text><text x="380" y="173.15" text-anchor="middle" font-size="11.5" class="fg-q">Как генеральная</text><text x="380" y="189.02" text-anchor="middle" font-size="11.5" class="fg-q">репетиция в костюмах.</text><rect x="554.667" y="64" width="181.333" height="142.15" rx="8" class="fg-riskbox"/><text x="645.333" y="97.19" text-anchor="middle" font-weight="600" class="fg-t">Продакшен</text><text x="645.333" y="117.09" text-anchor="middle" font-size="11.5" class="fg-q">Настоящее приложение,</text><text x="645.333" y="132.96" text-anchor="middle" font-size="11.5" class="fg-q">которым пользуются</text><text x="645.333" y="148.83" text-anchor="middle" font-size="11.5" class="fg-q">живые люди.</text><text x="645.333" y="164.7" text-anchor="middle" font-size="11.5" class="fg-q">Как премьера перед</text><text x="645.333" y="180.57" text-anchor="middle" font-size="11.5" class="fg-q">зрителями.</text><path d="M205.333 135.075L289.333 135.075" class="fg-ln" marker-end="url(#bk-arrow)"/><path d="M470.667 135.075L554.667 135.075" class="fg-ln" marker-end="url(#bk-arrow)"/><text x="247.333" y="127.075" text-anchor="middle" font-size="11" class="fg-q">проверили</text><text x="512.667" y="127.075" text-anchor="middle" font-size="11" class="fg-q">выпустили</text><rect x="24" y="240.15" width="181.333" height="14" rx="4" class="fg-risk" style="fill-opacity:0.12"/><rect x="289.333" y="240.15" width="181.333" height="14" rx="4" class="fg-risk" style="fill-opacity:0.3"/><rect x="554.667" y="240.15" width="181.333" height="14" rx="4" class="fg-risk" style="fill-opacity:0.6"/><text x="24" y="274.15" font-size="11.5" class="fg-q">цена ошибки: низкая</text><text x="736" y="274.15" text-anchor="end" font-size="11.5" class="fg-q">высокая</text><text x="380" y="274.15" text-anchor="middle" font-size="11.5" class="fg-q">чем ближе к премьере, тем осторожнее</text></svg>