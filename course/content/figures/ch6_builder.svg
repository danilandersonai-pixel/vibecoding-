<svg viewBox="0 0 760 388" role="img" aria-label="Конструктор приложений: чат слева, результат справа" font-size="13"><text x="24" y="28" font-size="15" font-weight="600" class="fg-t">Конструктор приложений: чат слева, результат справа</text><rect x="24" y="52" width="712" height="250" rx="8" class="fg-win"/><path d="M24 78V60Q24 52 32 52H728Q736 52 736 60V78Z" class="fg-bar"/><circle cx="38" cy="65" r="3.5" class="fg-dot"/><circle cx="51" cy="65" r="3.5" class="fg-dot"/><circle cx="64" cy="65" r="3.5" class="fg-dot"/><text x="380" y="69" text-anchor="middle" font-size="11" class="fg-q">Конструктор приложений</text><path d="M330 78L330 302" class="fg-ln"/><rect x="40" y="92" width="260" height="52" rx="8" class="fg-hi"/><text x="52" y="112" font-size="11.5" class="fg-t">Сделай трекер привычек: список и</text><text x="52" y="128" font-size="11.5" class="fg-t">кнопка «Отметить» у каждой</text><rect x="54" y="154" width="246" height="32" rx="8" class="fg-box"/><text x="66" y="174" font-size="11.5" class="fg-q">Готово. Что поправить?</text><rect x="40" y="262" width="260" height="28" rx="14" class="fg-box"/><text x="54" y="280" font-size="11" class="fg-q">Опишите, что изменить…</text><text x="350" y="102" font-size="14" font-weight="600" class="fg-t">Мои привычки</text><rect x="350" y="118" width="260" height="26" rx="6" class="fg-box"/><rect x="360" y="124" width="14" height="14" rx="3" class="fg-box"/><text x="384" y="136" font-size="12" class="fg-t">Зарядка</text><path d="M362 131 L366 135 L372 127" class="fg-okln"/><rect x="350" y="152" width="260" height="26" rx="6" class="fg-box"/><rect x="360" y="158" width="14" height="14" rx="3" class="fg-box"/><text x="384" y="170" font-size="12" class="fg-t">Читать 20 минут</text><rect x="350" y="186" width="260" height="26" rx="6" class="fg-box"/><rect x="360" y="192" width="14" height="14" rx="3" class="fg-box"/><text x="384" y="204" font-size="12" class="fg-t">Вода</text><rect x="350" y="226" width="110" height="28" rx="8" class="fg-hi"/><text x="405" y="245" text-anchor="middle" font-size="12" font-weight="600" class="fg-t">Добавить</text><rect x="620" y="86" width="100" height="24" rx="12" class="fg-okbox"/><text x="670" y="102" text-anchor="middle" font-size="11" font-weight="600" class="fg-okt">Опубликовать</text><circle cx="306" cy="118" r="10" class="fg-tier"/><text x="306" y="122" text-anchor="middle" font-size="12" font-weight="600" class="fg-on">1</text><circle cx="630" cy="170" r="10" class="fg-tier"/><text x="630" y="174" text-anchor="middle" font-size="12" font-weight="600" class="fg-on">2</text><circle cx="724" cy="98" r="10" class="fg-tier"/><text x="724" y="102" text-anchor="middle" font-size="12" font-weight="600" class="fg-on">3</text><circle cx="34" cy="331" r="10" class="fg-tier"/><text x="34" y="335" text-anchor="middle" font-size="12" font-weight="600" class="fg-on">1</text><text x="52" y="335" font-size="12" class="fg-q">Пишете по-человечески, что</text><text x="52" y="350.84" font-size="12" class="fg-q">нужно, в чате слева</text><circle cx="280" cy="331" r="10" class="fg-tier"/><text x="280" y="335" text-anchor="middle" font-size="12" font-weight="600" class="fg-on">2</text><text x="298" y="335" font-size="12" class="fg-q">Справа сразу видно результат:</text><text x="298" y="350.84" font-size="12" class="fg-q">нажимайте и проверяйте</text><circle cx="526" cy="331" r="10" class="fg-tier"/><text x="526" y="335" text-anchor="middle" font-size="12" font-weight="600" class="fg-on">3</text><text x="544" y="335" font-size="12" class="fg-q">Когда понравится, нажмите</text><text x="544" y="350.84" font-size="12" class="fg-q">«Опубликовать»: появится</text><text x="544" y="366.68" font-size="12" class="fg-q">ссылка на сайт</text></svg>