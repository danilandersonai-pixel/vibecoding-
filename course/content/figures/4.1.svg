<svg viewBox="0 0 760 378" role="img" aria-label="Чем проще проверка и дешевле ошибка, тем смелее делегирование" font-size="13"><text x="24" y="28" font-size="15" font-weight="600" class="fg-t">Чем проще проверка и дешевле ошибка, тем смелее делегирование</text><path d="M88 332V54" class="fg-ln" marker-end="url(#bk-arrow)"/><path d="M88 342H706" class="fg-ln" marker-end="url(#bk-arrow)"/><text x="80" y="74" text-anchor="end" font-size="11.5" class="fg-q">высокая</text><text x="80" y="328" text-anchor="end" font-size="11.5" class="fg-q">низкая</text><text x="80" y="172" text-anchor="end" font-size="11.5" class="fg-q">Цена</text><text x="80" y="188" text-anchor="end" font-size="11.5" class="fg-q">ошибки</text><text x="100" y="362" font-size="11.5" class="fg-q">трудно</text><text x="700" y="362" text-anchor="end" font-size="11.5" class="fg-q">легко</text><text x="400" y="362" text-anchor="middle" font-size="11.5" class="fg-q">Лёгкость проверки результата</text><rect x="100" y="60" width="295" height="110" rx="8" class="fg-box"/><text x="116" y="90" font-weight="600" class="fg-t">Решает человек, ИИ — советник</text><text x="116" y="114" font-size="11.5" class="fg-q">архитектура, модель данных</text><text x="116" y="132" font-size="11.5" class="fg-q">безопасность и права доступа</text><rect x="405" y="60" width="295" height="110" rx="8" class="fg-box"/><text x="421" y="90" font-weight="600" class="fg-t">ИИ пишет, человек ревьюит</text><text x="421" y="114" font-size="11.5" class="fg-q">платежи и миграции под тестами</text><text x="421" y="132" font-size="11.5" class="fg-q">критичные эндпоинты</text><rect x="100" y="180" width="295" height="110" rx="8" class="fg-box"/><text x="116" y="210" font-weight="600" class="fg-t">ИИ как черновик и разведка</text><text x="116" y="234" font-size="11.5" class="fg-q">прототипы, сравнение подходов</text><text x="116" y="252" font-size="11.5" class="fg-q">разбор незнакомого кода</text><rect x="405" y="180" width="295" height="110" rx="8" class="fg-hi"/><text x="421" y="210" font-weight="600" class="fg-t">Отдать агенту в фон</text><text x="421" y="234" font-size="11.5" class="fg-t">обновление зависимостей, тесты</text><text x="421" y="252" font-size="11.5" class="fg-t">документация, мелкие баги</text></svg>