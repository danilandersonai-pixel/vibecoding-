<svg viewBox="0 0 760 305" role="img" aria-label="Из спецификации в тесты: агент переводит слова в проверки" font-size="13"><text x="24" y="28" font-size="15" font-weight="600" class="fg-t">Из спецификации в тесты: агент переводит слова в проверки</text><rect x="24" y="52" width="330" height="190" rx="8" class="fg-win"/><path d="M24 78V60Q24 52 32 52H346Q354 52 354 60V78Z" class="fg-bar"/><circle cx="38" cy="65" r="3.5" class="fg-dot"/><circle cx="51" cy="65" r="3.5" class="fg-dot"/><circle cx="64" cy="65" r="3.5" class="fg-dot"/><text x="189" y="69" text-anchor="middle" font-size="11" class="fg-q">Спецификация</text><text x="40" y="104" font-size="12.5" class="fg-t">Заказ можно отменить, пока он не</text><text x="40" y="120.5" font-size="12.5" class="fg-t">отправлен.</text><text x="40" y="148" font-size="12.5" class="fg-t">После отправки заказ отменить нельзя.</text><text x="40" y="192" font-size="12.5" class="fg-t">При отмене деньги возвращаются.</text><rect x="374" y="134" width="66" height="40" rx="8" class="fg-hi"/><text x="407" y="158.29" text-anchor="middle" font-weight="600" class="fg-t">ИИ</text><path d="M354 154L374 154" class="fg-ln" marker-end="url(#bk-arrow)"/><path d="M440 154L460 154" class="fg-ln" marker-end="url(#bk-arrow)"/><rect x="460" y="52" width="276" height="190" rx="8" class="fg-term"/><path d="M460 78V60Q460 52 468 52H728Q736 52 736 60V78Z" class="fg-tbar"/><circle cx="474" cy="65" r="3.5" class="fg-tdim"/><circle cx="487" cy="65" r="3.5" class="fg-tdim"/><circle cx="500" cy="65" r="3.5" class="fg-tdim"/><text x="598" y="69" text-anchor="middle" font-size="11" class="fg-tdim">Тесты</text><text x="474" y="102.5" font-size="10.5" class="fg-tok fg-mono" xml:space="preserve">PASS  cancel before shipping</text><text x="474" y="124.5" font-size="10.5" class="fg-tok fg-mono" xml:space="preserve">PASS  no cancel after shipping</text><text x="474" y="146.5" font-size="10.5" class="fg-tok fg-mono" xml:space="preserve">PASS  refund on cancel</text><text x="24" y="268" font-size="11.5" class="fg-q">Если требование изменилось, меняется спецификация, и агент обновляет тесты. Проверка всегда ссылается на то,</text><text x="24" y="283.18" font-size="11.5" class="fg-q">что вы хотели.</text></svg>